 .modal-save{width:100%;padding:14px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:var(--fs-14);font-weight:var(--fw-b);cursor:pointer}
 .modal-save:disabled{opacity:.6}

 .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
 .modal-overlay.on{display:flex}
 .modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:20px 18px 28px;max-height:90vh;overflow-y:auto}
 @media(min-width:641px){.modal-overlay{align-items:center}.modal{border-radius:18px}}
 .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
 .modal-title{font-size:var(--fs-16);font-weight:var(--fw-eb)}
 .modal-x{font-size:var(--fs-22);color:var(--muted);cursor:pointer;line-height:1;background:none;border:none}
 .mgr-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border-radius:12px;margin-bottom:14px}
 .mgr-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);font-weight:var(--fw-eb);flex-shrink:0}
 .mgr-topic{padding:11px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-13);display:flex;justify-content:space-between;gap:8px}
 .mgr-topic:last-child{border-bottom:none}

 #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1100;color:var(--muted)}
 #overlay.hidden{display:none}

/* TZ-A22 §3.6/§3.8 — единые кнопки и бейджи (готовы для этапа 5) */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-dark);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-primary:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-secondary:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--bad);background:transparent;color:var(--bad);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-danger:hover:not(:disabled){background:var(--bad-bg)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;cursor:pointer;font-size:var(--fs-14);background:transparent;transition:var(--transition);font-family:inherit}
.btn-icon.ok{color:var(--ok);border-color:var(--ok)} .btn-icon.ok:hover{background:var(--ok-bg)}
.btn-icon.muted{color:var(--muted)} .btn-icon.muted:hover{color:var(--bad)}

.badge{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);line-height:1.2}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-bad{background:var(--bad-bg);color:var(--bad)}
.badge-nd{background:var(--nd-bg);color:var(--nd)}
.badge-info{background:var(--brand-soft);color:var(--brand)}

/* ── TZ-A28: таб «Команда» — таблица СП с подтабами ──────────────── */
.team-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow);margin-bottom:var(--sp-4)}
.team-head{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
.team-h-title{font-size:var(--fs-16);font-weight:var(--fw-eb)}
.team-h-sub{font-size:var(--fs-12);color:var(--muted)}
.team-h-sort{margin-left:auto;font-size:var(--fs-12);color:var(--muted)}
.team-tabs{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-4);padding:var(--sp-1);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);flex-wrap:wrap}
.team-tab{flex:1;min-width:90px;padding:var(--sp-2) var(--sp-3);background:transparent;border:none;border-radius:var(--r-sm);font-size:var(--fs-13);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);white-space:nowrap;font-family:inherit}
.team-tab:hover{color:var(--ink-soft,var(--ink))}
.team-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
.team-panel{display:none} .team-panel.active{display:block}
.scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.team-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-13)}
.team-table th{text-align:right;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-11);font-weight:var(--fw-sb);color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap}
.team-table th:first-child{text-align:left} .team-table th.center{text-align:center}
.team-table td{padding:var(--sp-3);border-bottom:1px solid var(--surface-3,var(--line));vertical-align:middle;text-align:right;white-space:nowrap}
.team-table td:first-child{text-align:left} .team-table td.center{text-align:center}
.team-table tr:last-child td{border-bottom:none}
.team-table tr.t-row{cursor:pointer;transition:.12s}
.team-table tr.t-row:hover td{background:var(--surface-2)}
.t-group-cell{display:flex;align-items:center;gap:var(--sp-3)}
.t-group-avatar{width:36px;height:36px;border-radius:50%;background:#0e7490;color:var(--on-dark,#fff);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:12px;flex-shrink:0}
.t-group-info{min-width:0}
.t-group-name{font-weight:var(--fw-sb);color:var(--ink)}
.t-group-meta{font-size:var(--fs-11);color:var(--muted);margin-top:2px}
.t-status-bar{display:inline-block;width:4px;height:36px;border-radius:var(--r-pill);background:var(--line-strong);margin-right:var(--sp-2);vertical-align:middle}
.t-status-bar.ok{background:var(--ok)} .t-status-bar.warn{background:var(--warn)} .t-status-bar.bad{background:var(--bad)}
.t-ir{font-size:var(--fs-16);font-weight:var(--fw-eb)}
.t-ir.ok{color:var(--ok)} .t-ir.warn{color:var(--warn)} .t-ir.bad{color:var(--bad)}
.t-pair{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.t-pair-main{font-weight:var(--fw-b);color:var(--ink);font-size:var(--fs-13)}
.t-pair-sub{font-size:var(--fs-11);color:var(--muted)}
.t-pct{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:var(--fw-b)}
.t-pct.ok{background:var(--ok-bg);color:var(--ok)} .t-pct.warn{background:var(--warn-bg);color:var(--warn)} .t-pct.bad{background:var(--bad-bg);color:var(--bad)}
.t-arrow{color:var(--muted-2,var(--muted));font-size:var(--fs-16)}
.status-badge-team{display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:var(--fw-b);white-space:nowrap}
.status-badge-team.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);gap:3px}
.status-badge-team.ok::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status-badge-team.w1{background:#fef9c3;color:#854d0e;border:1px solid #facc15}
.status-badge-team.w2{background:#fff7ed;color:#9a3412;border:1px solid #fb923c}
.status-badge-team.w3{background:#fef2f2;color:#ef4444;border:1px solid #ef4444}
.status-badge-team.w4{background:#fee2e2;color:#991b1b;border:1px solid #991b1b}
.month-cell{font-weight:var(--fw-b);text-align:center;border-radius:var(--r-sm)}
.month-cell.ok{background:var(--ok-bg);color:var(--ok)}
.month-cell.warn{background:#fef9c3;color:#854d0e}
.month-cell.bad{background:var(--bad-bg);color:var(--bad)}
.month-cell.current{outline:2px solid var(--brand);outline-offset:-2px}
.month-cell.no_data{color:var(--muted-2,var(--muted));font-weight:var(--fw-r)}
.month-spark{height:30px;display:block;margin:0 auto}
.month-trend{font-size:var(--fs-11);color:var(--muted);margin-top:2px;text-align:center}
.month-trend.ok{color:var(--ok)} .month-trend.warn{color:var(--warn)} .month-trend.bad{color:var(--bad)} .month-trend.flat{color:var(--muted)}

/* ── TZ-A26: трёхчастная полоса факт/прогноз/план ─────────────────── */
.funnel-stage{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--sp-3);margin-bottom:var(--sp-2)}
/* Парная сетка: каждая строка покупателя выровнена со строкой продавца */
.funnel-grid-paired{display:grid;grid-template-columns:1fr;gap:8px 14px;align-items:stretch;margin-top:8px}
@media(min-width:860px){.funnel-grid-paired{grid-template-columns:1fr 1fr}}
.funnel-grid-paired .row-stage{display:flex;flex-direction:column}
.funnel-grid-paired .row-stage>.funnel-stage{flex:1;margin-bottom:0}
.funnel-stage.s-done{border-left-color:var(--ok)}
.funnel-stage.s-forecast{border-left-color:var(--gold)}
.funnel-stage.s-pending{border-left-color:var(--line-strong)}
.funnel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:nowrap}
.funnel-label{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);display:flex;align-items:baseline;gap:var(--sp-2);flex:0 1 auto;min-width:0}
.funnel-hint{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--muted)}
.fp-numbers{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-12);flex-wrap:nowrap;white-space:nowrap;flex-shrink:0}
.fp-num-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-num-forecast{color:var(--gold);font-weight:var(--fw-sb)}
.fp-num-plan{color:var(--muted);font-weight:var(--fw-sb)}
.fp-num-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:lowercase;margin-right:2px}
.fp-num-sep{color:var(--muted-2);margin:0 2px}
.fp-num-sep{color:var(--muted-2)}
.fp-bar{position:relative;height:20px;background:var(--surface-3);border-radius:var(--r-xs);overflow:visible;display:flex}
.fp-bar.sm{height:16px;background:var(--line);border:1px solid var(--line-strong)}
.fp-bar-fact{height:100%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-forecast{height:100%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-fact:not(:only-child){border-radius:var(--r-xs) 0 0 var(--r-xs)}
.fp-bar-forecast:not(:only-child){border-radius:0 var(--r-xs) var(--r-xs) 0}
.seg-numbers{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.seg-num{display:inline-flex;gap:var(--sp-1);align-items:baseline;font-size:var(--fs-12)}
.seg-num b{font-weight:var(--fw-b);font-size:var(--fs-13)}
.seg-fact{color:var(--ok)}
.seg-forecast{color:var(--gold)}
.seg-sep{color:var(--muted-2)}
.fp-bar-fact:hover, .fp-bar-forecast:hover{filter:brightness(.92)}
.fp-bar-fact.narrow, .fp-bar-forecast.narrow{color:transparent}
.fp-bar.zero-fact::after{content:'0% от плана';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--muted);letter-spacing:.2px;pointer-events:none;white-space:nowrap}
.fp-bar-fact[data-tooltip]:hover::after, .fp-bar-forecast[data-tooltip]:hover::after, .fp-bar[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1f2e;color:#fff;font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:50;pointer-events:none;letter-spacing:.2px}
.fp-bar-wrap{display:grid;grid-template-columns:1fr auto;gap:var(--sp-3);align-items:center}
.fp-bar-outside{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-12);white-space:nowrap}
.fp-bar-outside .o-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-bar-outside .o-forecast{color:var(--gold);font-weight:var(--fw-b)}
.fp-bar-outside .o-lbl{color:var(--muted);font-weight:var(--fw-r);margin-left:2px}
.fp-bar-outside .o-sep{color:var(--muted-2)}
.fp-bar-outside .o-nd{color:var(--muted);font-weight:var(--fw-sb)}
.hero-stat-fpf-fact-wrap{display:flex;align-items:baseline;gap:var(--sp-1)}
.hero-stat-fpf-fact-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb)}
.hero-stat-fpf-fact{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--ok);line-height:1.2;display:block}
.hero-stat-fpf-fact.large{font-size:var(--fs-28)}
.hero-stat-fpf-meta{font-size:var(--fs-11);color:var(--muted);margin-top:2px;display:flex;gap:var(--sp-1);flex-wrap:wrap}
.hero-stat-fpf-meta b{font-weight:var(--fw-sb)}
.hero-stat-fpf-meta .forecast{color:var(--gold)}
.hero-stat-fpf-meta .plan{color:var(--ink-soft)}
.hero-stat-fpf-bar{margin-top:var(--sp-2)}

</style>
</head>
<body>
<div id="overlay">Загрузка кабинета…</div>

<div class="app-header">
 <div class="logo">Прогноз<span> · отдел</span></div>
 <div class="app-header-right">
 <a id="backBtn" class="btn" href="#" style="display:none" onclick="history.back();return false">← Назад</a>
 <span class="date-badge" id="dateBadge"></span>
 <button class="btn" id="logoutBtn">Выход</button>
 </div>
</div>

<div class="container">
 <div id="hero"></div>
 <div class="rtab-bar" id="tabbar">
 <div class="rtab on" data-tab="main" onclick="showTab('main',this)">🏠 Главная</div>
 <div class="rtab" data-tab="prognoz" onclick="showTab('prognoz',this)">📈 Прогноз</div>
 <div class="rtab" data-tab="groups" onclick="showTab('groups',this)">👥 Старшие партнёры</div>
 <div class="rtab" data-tab="tasks" onclick="showTab('tasks',this)">📋 Задачи<span id="taskDot"></span></div>
 </div>
 <div class="screen on" id="screen-main"></div>
 <div class="screen" id="screen-prognoz"></div>
 <div class="screen" id="screen-groups"></div>
 <div class="screen" id="screen-tasks"></div>
</div>

<div class="modal-overlay" id="modalMgr"><div class="modal" id="modalMgrBody"></div></div>
<div class="modal-overlay" id="modalTask"><div class="modal" id="modalTaskBody"></div></div>

<script type="module">
import { requireAuth, logout } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const STC={green:'#16a34a',yellow:'#d97706',red:'#dc2626',no_data:'#cbd0db'};
const SIDE_COLOR={buyer:'#3b82f6',seller:'#10b981'};
const CTX={data:null,target:null};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }
function heroRevenueBar(a){
 if(!a||!a.buyer||!a.seller) return '';
 const bs=(a.buyer.stages||[]).find(s=>s.key==='revenue')||{};
 const ss=(a.seller.stages||[]).find(s=>s.key==='revenue')||{};
 const fact=(bs.fact||0)+(ss.fact||0);
 const plan=(bs.plan||0)+(ss.plan||0);
 const fcB=bs.forecast!=null?bs.forecast:bs.fact||0;
 const fcS=ss.forecast!=null?ss.forecast:ss.fact||0;
 const forecast=(bs.forecast!=null||ss.forecast!=null)?(fcB+fcS):null;
 if(!plan) return '';
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 const stage={label:'Валовая выручка',hint:'за месяц',fact,plan,forecast,fact_label:fmt(fact)+' ₽',plan_label:fmt(plan)+' ₽',forecast_label:forecast!=null?fmt(forecast)+' ₽':null};
 // renderStage уже отрисует: заголовок слева, факт/прогноз/план справа сверху, полосу ниже.
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}
// Прогноз вала на следующий месяц — в стиле плашки этапа воронки.
function fcHero(fc){
 if(!fc || !fc.next_month) return '';
 const nm=fc.next_month;
 const now=new Date(); const next=new Date(now.getFullYear(), now.getMonth()+1, 1);
 const monthNames=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
 const lbl=monthNames[next.getMonth()]+' '+next.getFullYear();
 const target=Number(nm.target_revenue)||0;
 const fcst=Number(nm.revenue_total)||0;
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 // В прогнозе след.мес факта ещё нет (новый месяц не наступил). fact=0, forecast=полный прогноз, plan=target.
 const stage={label:'Прогноз вала',hint:lbl,fact:0,plan:target,forecast:fcst,fact_label:'0 ₽',plan_label:target>0?fmt(target)+' ₽':'—',forecast_label:fcst>0?fmt(fcst)+' ₽':'—'};
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}

window.showTab=(id,btn)=>{
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
 document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('on'));
 document.getElementById('screen-'+id).classList.add('on'); btn.classList.add('on');
 window.scrollTo(0,0);
 if(window.__markT){clearTimeout(window.__markT);window.__markT=null;}
 if(id==='tasks'){ window.__markT=setTimeout(()=>{ const u=CTX.data&&CTX.data.notifications&&CTX.data.notifications.unread_count; if(u>0) window.markAllRead(true); },2000); }
};
window.goTab=(id)=>{ const b=document.querySelector(`.rtab[data-tab="${id}"]`); if(b) window.showTab(id,b); };
window.openGroup=(code)=>{ location.href='mop.html?mop='+encodeURIComponent(code); };
window.closeModal=(id)=>document.getElementById(id).classList.remove('on');
window.completeTask=async(id,ev)=>{ if(ev)ev.stopPropagation(); const b=ev&&ev.target; if(b){b.disabled=true;b.textContent='…';}
 try{ await window.__call('updateTaskStatus',{task_id:id,status:'done'}); location.reload(); }catch(e){ alert('Не удалось: '+(e.message||e)); if(b){b.disabled=false;b.textContent='✓';} } };

 if(dueSel==='today'){ D.setHours(23,59,0,0); due_at=D.getTime(); }

/* ─── воронка отдела ─── */
function aggStageCard(side,st){
 const stage={...st, hint: st.hint_label};
 let html=renderStage(stage);
 if(st.segments && st.segments.length){
  const segs=st.segments.map(sg=>{
   if(st.is_revenue){
    const f=sg.has_fact?`<span class="seg-num seg-fact">${esc(sg.deals_fact_label||'')} <b>${esc(sg.revenue_fact_label||'')}</b></span>`:'';
    const fc=sg.has_forecast?`<span class="seg-num seg-forecast">${esc(sg.deals_forecast_label||'')} <b>${esc(sg.revenue_forecast_label||'')}</b></span>`:'';
    const sep=(sg.has_fact&&sg.has_forecast)?'<span class="seg-sep">/</span>':'';
    return `<div class="seg-row"><span class="sv">${esc(sg.label)}</span><span class="seg-numbers">${f}${sep}${fc}</span></div>`;
   }
   const subStage={fact:sg.fact,plan:sg.plan,fact_label:sg.fact_label,plan_label:sg.plan_label,forecast:null};
   return `<div style="margin-bottom:8px"><div class="seg-row" style="margin-bottom:4px"><span class="sv">${esc(sg.label)}</span><span style="color:var(--muted);font-size:var(--fs-11)">${esc(sg.fact_label)} / ${esc(sg.plan_label)}</span></div>${renderFpBar(subStage,{compact:true})}</div>`;
  }).join('');
  html=html.replace(/<\/div>\s*$/, `<div class="stage-seg hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${segs}</div></div>`);
  html=html.replace('class="funnel-head"',`class="funnel-head" style="cursor:pointer" onclick="toggleStage(this)"`);
  html=html.replace('<div class="funnel-label">','<div class="funnel-label"><span class="chev" style="display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-weight:var(--fw-b)">›</span> ');
 }
 return html;
}
window.toggleStage=(head)=>{ const c=head.closest('.stage-card, .funnel-stage'); if(!c)return; const s=c.querySelector('.stage-seg'),ch=c.querySelector('.chev'); if(!s)return; s.classList.toggle('hidden'); if(ch) ch.classList.toggle('open'); };

/* Парная сетка для агрегатов: i-й этап покуп ↔ i-й этап прод выровнены по высоте */
function renderAggFunnelsPaired(buyer,seller,factLbl){
 const head=(fs,icon,side)=>`<div><div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span><div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div><span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}" title="${esc(IR_TIP_SIDE_AGG)}">ИР ${fs.ir}% · ${esc(fs.ir_status_label||'')}</span></div><div class="fs-legend"><span><b>факт</b> ${factLbl}</span><span>/ <b>план</b> ${factLbl}</span><span>· % выполнения</span></div></div>`;
 const bs=(buyer.stages||[]).map(st=>aggStageCard('buyer',st));
 const ss=(seller.stages||[]).map(st=>aggStageCard('seller',st));
 const rows=Math.max(bs.length,ss.length);
 const cells=[head(buyer,'🛒','buyer'),head(seller,'🏘','seller')];
 for(let i=0;i<rows;i++){
  cells.push(`<div class="row-stage">${bs[i]||''}</div>`);
  cells.push(`<div class="row-stage">${ss[i]||''}</div>`);
 }
 return `<div class="funnel-grid-paired">${cells.join('')}</div>`;
}

/* TZ-A26: утилиты трёхчастной воронки */
// Нормализация: для не-revenue этапов (целочисленные fact/plan) округляем до целых,
// чтобы % считался по тем же числам, что в подписи (не 1/1.886=53%, а 1/2=50%).
function _normNum(v,isInt){ if(v==null) return v; return isInt?Math.round(v):v; }
function calcStatus(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ return fact>0?'s-done':'s-pending'; }
  const f=(fact/plan)*100; if(f>=100) return 's-done';
  if(forecast!=null){ const fc=(forecast/plan)*100; if(fc>=100) return 's-forecast'; }
  return 's-pending';
}
function calcBarPercents(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ if(fact>0) return {factPct:100,factPctVisual:100,forecastPctTotal:100,forecastDeltaPct:0,forecastDeltaPctVisual:0,noPlan:true}; return {factPct:0,factPctVisual:0,forecastPctTotal:0,forecastDeltaPct:0,forecastDeltaPctVisual:0}; }
  const factPct=Math.round((fact/plan)*100);
  let forecastPctTotal=factPct, forecastDeltaPct=0;
  if(forecast!=null && forecast>fact){ forecastPctTotal=Math.round((forecast/plan)*100); forecastDeltaPct=forecastPctTotal-factPct; }
  // Полоса визуально cap'ится на 100%.
  // Особый случай для revenue: если факт+прогноз > 100% плана (перевыполнение с прогнозом),
  // то полосу делим пропорционально fact:forecastDelta — чтобы оранжевая зона была видна
  // соизмеримо своему размеру (а не зажата в остатке от 100).
  let factPctVisual,forecastDeltaPctVisual;
  const totalPct=factPct+forecastDeltaPct;
  if(isRev && totalPct>100 && forecastDeltaPct>0){
    factPctVisual=Math.round(factPct/totalPct*100);
    forecastDeltaPctVisual=100-factPctVisual;
  } else {
    factPctVisual=Math.min(factPct,100);
    forecastDeltaPctVisual=Math.max(0, Math.min(forecastDeltaPct, 100-factPctVisual));
  }
  return {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual};
}
function tooltipFact(factLabel,factPct,planLabel,isRev){
  if(!isRev && factPct>=100){ return `факт ${factLabel} — план ${planLabel} выполнен на 100%`; }
  return `факт ${factLabel} — ${factPct}% от плана ${planLabel}`;
}
function tooltipForecast(forecastLabel,forecastPctTotal,planLabel,forecastDeltaPct){ return `прогноз ${forecastLabel} — +${forecastDeltaPct}% к плану ${planLabel} (итого ${forecastPctTotal}%)`; }
function renderFpBar(stage,opts){
  opts=opts||{};
  const {fact,fact_label,forecast,forecast_label,plan,plan_label,is_revenue}=stage;
  if(fact==null && plan==null){
    return `<div class="fp-bar-wrap"><div class="fp-bar" data-tooltip="нет данных по этому этапу"></div><div class="fp-bar-outside"><span class="o-nd">— нет данных</span></div></div>`;
  }
  const _p=calcBarPercents(fact,forecast,plan,is_revenue); const {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual}=_p;
  if(_p.noPlan){ const tt=`факт ${fact_label} — плана нет`; return `<div class="fp-bar${opts.compact?' sm':''}" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:100%">факт ${fact_label}</div></div>`; }
  const smClass=opts.compact?' sm':'';
  if(factPct===0 && forecastDeltaPct===0){
    const tt=tooltipFact(fact_label,0,plan_label);
    return `<div class="fp-bar${smClass} zero-fact" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:0%"></div></div>`;
  }
  // Узкая зона = по визуальной ширине, иначе число «153%» в маленьком блоке не вылезает за границу.
  const factNarrow=factPctVisual>0 && factPctVisual<12;
  const forecastNarrow=forecastDeltaPctVisual>0 && forecastDeltaPctVisual<12;
  const factTt=factPct>0?tooltipFact(fact_label,factPct,plan_label,is_revenue):null;
  const forecastTt=forecastDeltaPct>0?tooltipForecast(forecast_label,forecastPctTotal,plan_label,forecastDeltaPct):null;
  // Подпись внутри блока: для revenue — реальный % (даже 259%), для остальных — cap 100%.
  const factLbl=is_revenue?factPct:factPctVisual;
  const fcDeltaLbl=is_revenue?forecastDeltaPct:forecastDeltaPctVisual;
  const factDiv=factPctVisual>0?`<div data-tooltip="${esc(factTt)}" class="fp-bar-fact${factNarrow?' narrow':''}" style="width:${factPctVisual}%">${factLbl}%</div>`:'';
  const forecastDiv=forecastDeltaPctVisual>0?`<div data-tooltip="${esc(forecastTt)}" class="fp-bar-forecast${forecastNarrow?' narrow':''}" style="width:${forecastDeltaPctVisual}%">+${fcDeltaLbl}%</div>`:'';
  const containerTt=factTt||forecastTt||'нет данных';
  const bar=`<div class="fp-bar${smClass}" data-tooltip="${esc(containerTt)}">${factDiv}${forecastDiv}</div>`;
  if(factNarrow||forecastNarrow){
    const parts=[];
    if(factNarrow) parts.push(`<span class="o-fact">${factPct}%</span><span class="o-lbl">от плана</span>`);
    if(forecastNarrow){ if(parts.length) parts.push('<span class="o-sep">·</span>'); parts.push(`<span class="o-forecast">+${forecastDeltaPct}%</span><span class="o-lbl">прогноз</span>`); }
    return `<div class="fp-bar-wrap">${bar}<div class="fp-bar-outside">${parts.join('')}</div></div>`;
  }
  return bar;
}
function renderStage(stage){
  const {label,hint,fact_label,forecast,forecast_label,plan_label,fact,plan,is_revenue}=stage;
  const status=calcStatus(fact,forecast,plan,is_revenue);

    const deltaLabel='+'+fmtDelta(forecast - fact);

  } else {
    numbers=`<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  }
  return `<div class="funnel-stage ${status}"><div class="funnel-head"><div class="funnel-label">${esc(label)} ${hintHtml}</div><div class="fp-numbers">${numbers}</div></div>${renderFpBar(stage)}</div>`;
}

/* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
function _irDelta(d){ d=Math.round(d); if(d>=1)return {text:'▲+'+d,cls:'up'}; if(d<=-1)return {text:'▼'+d,cls:'down'}; return {text:'≈',cls:'flat'}; }
function _irSpark(values,color){
  const arr=(values||[]).filter(v=>v!=null);
  if(arr.length<2) return null;
  const N=arr.length;
  // X-координаты: равномерно по 4 или 6
  const baseX={4:[3,22,41,67], 6:[3,16,29,42,55,67]};
  const xs = baseX[N] || Array.from({length:N},(_,i)=>3+i*(64/(N-1)));
  const points = arr.map((v,i)=>{ const y=18-(v/100)*16; return `${xs[i]},${y.toFixed(1)}`; }).join(' ');
  const dots = arr.slice(0,-1).map((v,i)=>[xs[i], 18-(v/100)*16]);
  const last = [xs[xs.length-1], 18-(arr[arr.length-1]/100)*16];
  return { points, color, dots, last };
}
function _renderSparkSvg(spark){
  if(!spark) return '';
  const dots = spark.dots.map(([x,y])=>`<circle cx="${x}" cy="${y.toFixed(1)}" r="1.3" fill="${spark.color}" opacity=".4"/>`).join('');
  return `<polyline points="${spark.points}" fill="none" stroke="${spark.color}" stroke-width="1.5"/>${dots}<circle cx="${spark.last[0]}" cy="${spark.last[1].toFixed(1)}" r="2" fill="${spark.color}"/>`;
}
function _monthLabel(){ const d=new Date(); const m=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']; return m[d.getMonth()]+' '+d.getFullYear(); }
function _monthsAgoLabel(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr); if(isNaN(d)) return null;
  const today=new Date(); const ms=today-d;
  const months = Math.max(1, Math.round(ms/(30*24*3600*1000)));
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}, ${months} мес назад`;
}
const IR_TIP_MAIN_AGG = 'Среднее ИР v2 недельный по всем партнёрам отдела (ТЗ-A29). У каждого ИР = 4 составляющих × 25%: C1 поток · C2 горячие в работе · C3 задатки в работе · C4 вал. Покупатель/Продавец 50/50 внутри C1·C2; C3 и C4 общие. Для C1 и C4 учитывается прошедшая часть месяца (pace). Цвет: ≥70% зелёный · 50–69% жёлтый · <50% красный. Табы: Сейчас — недельный темп, Неделя — динамика 4 недель, Месяц — суммарно с cap по каждой составляющей.';
const IR_TIP_SIDE_AGG = 'Среднее ИР покупательской / продавческой стороны по партнёрам отдела. Сторона = (C1 этой стороны + C2 этой стороны + C3 + C4) / 4. C3 (задатки) и C4 (вал) — общие, считаются в каждой стороне целиком.';
const IR_TIP_TABLE = 'Колонка ИР = средний недельный ИР v2 каждой группы (ТЗ-A29). Внутри группы — среднее ИР v2 партнёров. Цвет числа: ≥70% зелёный · 50–69% жёлтый · <50% красный.';
function renderIrCard(opts){
  // opts: { ir_history, isPartner, periodLabel }
  const h=opts.ir_history;
  if(!h || !h.now) return ''; // нет данных
  const periodLabel=opts.periodLabel||_monthLabel();
  const dataAttr = encodeURIComponent(JSON.stringify({h, isPartner:!!opts.isPartner, periodLabel}));
  return `<div class="card ir-card" data-ir="${dataAttr}">
    <div class="ir-card-head">
      <div class="ir-card-title">Индекс развития · ${esc(periodLabel)}<span class="ir-info" title="${esc(IR_TIP_MAIN_AGG)}">i</span></div>
      <div class="ir-tabs">
        <button class="ir-tab active" data-mode="now">Сейчас</button>
        <button class="ir-tab" data-mode="week">Неделя</button>
        <button class="ir-tab" data-mode="month">Месяц</button>
      </div>
    </div>
    <div class="ir-body">
      <div>
        <div class="ir-total" style="color:${barColor(h.now.total)}">${h.now.total}%</div>
        <span class="ir-total-delta hidden">·</span>
      </div>
      <div class="ir-channels">
        <div class="ir-channel-row">
          <div class="ir-channel-name">🛒 Покупатель<span class="ir-info" title="${esc(IR_TIP_SIDE_AGG)}">i</span></div>
          <div class="ir-channel-bar"><div class="ir-channel-fill buyer" style="width:${Math.min(h.now.buyer,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.buyer}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="buyer"></svg>
        </div>
        <div class="ir-channel-row">
          <div class="ir-channel-name">🏘 Продавец<span class="ir-info" title="${esc(IR_TIP_SIDE_AGG)}">i</span></div>
          <div class="ir-channel-bar"><div class="ir-channel-fill seller" style="width:${Math.min(h.now.seller,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.seller}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="seller"></svg>
        </div>
      </div>
    </div>
    <div class="ir-card-foot">Индекс развития · ${esc(periodLabel)} · насколько ты на пути к цели</div>
  </div>`;
}
window.applyIrMode=function(card, mode){
  const raw=card.getAttribute('data-ir'); if(!raw) return;
  const {h, isPartner, periodLabel} = JSON.parse(decodeURIComponent(raw));
  const elTotal = card.querySelector('.ir-total');
  const elTotalDelta = card.querySelector('.ir-total-delta');
  const rows = card.querySelectorAll('.ir-channel-row');
  const setChan = (row, sideKey, color) => {
    const pct = h.now[sideKey];
    row.querySelector('.ir-channel-fill').style.width = Math.min(pct,100)+'%';
    row.querySelector('.ir-channel-pct').textContent = pct+'%';
    const dEl = row.querySelector('.ir-channel-delta');
    const sEl = row.querySelector('.ir-channel-spark');
    if (mode==='now'){
      dEl.classList.add('hidden'); sEl.classList.add('hidden');
    } else {
      const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
      const d = pct - (prev[sideKey]||0);
      const dObj = _irDelta(d);
      dEl.className = 'ir-channel-delta '+dObj.cls;
      dEl.textContent = dObj.text;
      const hist = (mode==='week' ? h.week_history : h.month_history)[sideKey] || [];
      const spark = _irSpark(hist, color);
      if (spark){ sEl.classList.remove('hidden'); sEl.innerHTML = _renderSparkSvg(spark); }
      else { sEl.classList.add('hidden'); }
    }
  };
  setChan(rows[0], 'buyer', '#3b82f6');
  setChan(rows[1], 'seller', '#10b981');
  // Общий ИР + дельта
  elTotal.textContent = h.now.total+'%';
  if (mode==='now'){
    elTotalDelta.classList.add('hidden');
  } else {
    const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
    const d = h.now.total - (prev.total||0);
    const dObj = _irDelta(d);
    elTotalDelta.className = 'ir-total-delta '+dObj.cls;
    elTotalDelta.textContent = dObj.text;
    elTotalDelta.classList.remove('hidden');
  }
  // Подпись
  const foot = card.querySelector('.ir-card-foot');
  if (mode==='now') foot.textContent = `Индекс развития · ${periodLabel} · насколько ты на пути к цели`;
  else if (mode==='week') foot.textContent = `Динамика по неделям · последние 4 точки (сегодня — справа)`;
  else {
    if (isPartner && h.salary_review_at){
      const lbl = _monthsAgoLabel(h.salary_review_at);
      foot.textContent = lbl ? `Динамика помесячно · с момента утверждения целей (${lbl})` : `Динамика помесячно · последние 6 месяцев`;
    } else {
      foot.textContent = `Динамика помесячно · последние 6 месяцев`;
    }
  }
};
window.initIrCards=function(root){
  (root||document).querySelectorAll('.ir-card').forEach(card=>{
    if(card._irInited) return; card._irInited=true;
    const tabs=card.querySelectorAll('.ir-tab');
    tabs.forEach(t=>{
      t.addEventListener('click',()=>{ tabs.forEach(x=>x.classList.toggle('active', x===t)); window.applyIrMode(card, t.dataset.mode); });
    });
    window.applyIrMode(card, 'now');
  });
};

</script>
</body>
</html>
