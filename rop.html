<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз — Кабинет руководителя</title>
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }
</script>
<style>
  :root{
    --bg:#f7f6f3; --surface:#fff; --surface2:#f0efe9; --border:rgba(0,0,0,.1);
    --text:#1a1a18; --text2:#5f5e5a; --text3:#9a9890;
    --blue:#185FA5; --blue-bg:#E6F1FB; --green:#3B6D11; --green-bg:#EAF3DE; --gold:#BA7517;
    --radius:10px; --st-green:#639922; --st-yellow:#EF9F27; --st-red:#A32D2D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
  .logo{font-size:16px;font-weight:600;color:var(--blue)} .logo span{color:var(--text);font-weight:400}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .date-badge{font-size:12px;color:var(--text2);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
  .btn{font-size:12px;color:var(--text2);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .container{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .muted{color:var(--text2);font-size:12px}
  .section-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
  .banner{background:#FFF8E6;border:1px solid #F0D98A;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;font-size:13px}

  .profile{display:flex;align-items:center;gap:14px}
  .avatar{width:48px;height:48px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--blue);flex-shrink:0}
  .pname{font-size:16px;font-weight:600}

  .ir-top{display:flex;align-items:center;gap:18px}
  .ir-big{font-size:40px;font-weight:700;line-height:1}
  .ir-sides{flex:1;display:flex;flex-direction:column;gap:8px}
  .ir-side{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;font-size:12px}
  .bar-bg{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s}
  .perf{display:flex;gap:16px;margin-top:10px;font-size:12px;flex-wrap:wrap}
  .perf b{font-size:18px;display:block}
  .groups-line{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .gchip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border)}

  .status-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
  .sb-green{background:var(--green-bg);color:#173404} .sb-yellow{background:#FAEEDA;color:#412402}
  .sb-red{background:#FCEBEB;color:#501313} .sb-no_data{background:#F1EFE8;color:#2C2C2A}

  .fs-head{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
  .fs-title{display:flex;align-items:center;gap:8px}
  .fs-dot{width:10px;height:10px;border-radius:3px}
  .stage-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--sc,#185FA5);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .stage-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:6px}
  .stage-label{font-size:13px;font-weight:500}
  .stage-numbers b{font-weight:600}
  .stage-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .stage-bar-fill{height:100%;border-radius:2px;transition:width .4s}

  .member-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
  .member-card:hover{border-color:var(--blue)}
  .member-card.at-risk{border-left:3px solid var(--st-red)}
  .member-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .member-info{flex:1;min-width:0}
  .member-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px}
  .member-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member-sub{font-size:11px;color:var(--text3)}
  .member-ir{font-size:13px;font-weight:600;flex-shrink:0}
  .mini-funnel{display:flex;gap:2px;height:4px;margin-top:4px}
  .mini-stage{flex:1;border-radius:1px}
  .member-arrow{color:var(--text3);flex-shrink:0}

  #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;color:var(--text2)}
  #overlay.hidden{display:none}
</style>
</head>
<body>
<div id="overlay">Загрузка кабинета…</div>

<div class="header">
  <div class="logo">Прогноз<span> · отдел</span></div>
  <div class="header-right">
    <a id="backBtn" class="btn" href="#" style="display:none" onclick="history.back();return false">← Назад</a>
    <span class="date-badge" id="dateBadge"></span>
    <button class="btn" id="logoutBtn">Выход</button>
  </div>
</div>
<div class="container" id="root"></div>

<script type="module">
import { requireAuth, logout } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const STC={green:'#639922',yellow:'#EF9F27',red:'#A32D2D',no_data:'#cfcdc6'};
const SIDE_COLOR={buyer:'#185FA5',seller:'#3B6D11'};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--st-green)'; if(pct>=40) return 'var(--st-yellow)'; return 'var(--st-red)'; }
window.openGroup=(code)=>{ location.href='mop.html?mop='+encodeURIComponent(code); };

function aggStageCard(side, st){
  return `<div class="stage-card" style="--sc:${st.is_revenue?'var(--gold)':SIDE_COLOR[side]}">
    <div class="stage-head"><span class="stage-label">${esc(st.label)}</span>
      <span class="stage-numbers"><b style="color:${barColor(st.progress_pct,st.is_revenue)}">${st.progress_pct}%</b></span></div>
    <div class="stage-bar"><div class="stage-bar-fill" style="width:${Math.min(st.progress_pct,100)}%;background:${barColor(st.progress_pct,st.is_revenue)}"></div></div>
  </div>`;
}
function aggSide(side, fs, periodLabel){
  if(!fs) return '';
  return `<div style="margin-bottom:8px">
    <div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span>
      <div><div style="font-weight:600">${esc(fs.label)}</div><div class="muted">ИР: ${fs.ir}% · ${esc(periodLabel)}</div></div></div>
      <span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}">${esc(fs.ir_status_label||'')}</span></div>
    ${(fs.stages||[]).map(st=>aggStageCard(side,st)).join('')}
  </div>`;
}
function groupCard(m){
  const mini=(m.mini_funnel||[]).map(s=>`<div class="mini-stage" style="background:${STC[s.status]||STC.no_data}"></div>`).join('');
  return `<div class="member-card ${m.is_at_risk?'at-risk':''}" onclick="openGroup('${esc(m.code)}')">
    <div class="member-avatar" style="background:${m.avatar_color_bg};color:${m.avatar_color_text}">${esc(m.avatar_initials||'?')}</div>
    <div class="member-info">
      <div class="member-row-top"><span class="member-name">Группа ${esc(m.short_name||m.name)}</span>
        <span class="member-ir" style="color:${STC[m.ir_status]||STC.no_data}">${m.ir_status==='no_data'?'—':m.ir_total+'%'}</span></div>
      <div class="member-sub">${m.group_size!=null?m.group_size+' партнёров':''}</div>
      <div class="mini-funnel">${mini}</div>
    </div>
    <span class="member-arrow">›</span>
  </div>`;
}

function render(d){
  const u=d.user, a=d.aggregates, t=d.team;
  const parts=[];
  parts.push(`<div class="card profile">
    <div class="avatar">${esc((u.short_name||u.name||'?').slice(0,2))}</div>
    <div style="flex:1"><div class="pname">${esc(u.name)}</div>
      <div class="muted">${esc(u.role_label)}${a?' · '+esc(a.scope.label):''}</div></div>
  </div>`);

  if(a){
    const gs=a.groups_summary;
    parts.push(`<div class="card">
      <div class="ir-top">
        <div class="ir-big" style="color:${barColor(a.ir_total)}">${a.ir_total}<span style="font-size:18px">%</span></div>
        <div class="ir-sides">
          <div class="ir-side"><span>Покупатель</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(a.ir_buyer,100)}%;background:${SIDE_COLOR.buyer}"></div></div><b>${a.ir_buyer}%</b></div>
          <div class="ir-side"><span>Продавец</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(a.ir_seller,100)}%;background:${SIDE_COLOR.seller}"></div></div><b>${a.ir_seller}%</b></div>
        </div>
      </div>
      <div class="perf">
        <div><b style="color:var(--st-green)">${a.scope.performers_count}</b>выполняют ≥70%</div>
        <div><b style="color:var(--st-red)">${a.scope.underperformers_count}</b>отстают</div>
        <div><b>${a.scope.members_count}</b>партнёров</div>
      </div>
      ${gs?`<div class="groups-line">
        <span class="gchip">Групп: <b>${gs.total}</b></span>
        <span class="gchip" style="color:#173404">🟢 в зелёной: ${gs.in_green}</span>
        <span class="gchip" style="color:#501313">🔴 ниже: ${gs.in_red}</span></div>`:''}
      <div class="muted" style="margin-top:8px">Средний ИР отдела · ${esc(a.period_label)} · выполнение ${a.scope.performance_pct}%</div>
    </div>`);
    parts.push(`<div class="card"><div class="section-title">Сводная воронка отдела</div>
      ${aggSide('buyer',a.buyer,a.period_label)}${aggSide('seller',a.seller,a.period_label)}</div>`);
  } else {
    parts.push(`<div class="banner">Нет агрегатов отдела — возможно, ночной пересчёт ещё не прошёл.</div>`);
  }

  if(t && t.members && t.members.length){
    parts.push(`<div class="card"><div class="section-title">Группы отдела · ${t.total_count}</div>
      ${t.members.map(groupCard).join('')}</div>`);
  } else {
    parts.push(`<div class="banner">В отделе нет активных групп.</div>`);
  }
  document.getElementById('root').innerHTML = parts.join('');
}

(async ()=>{
  const me = await requireAuth();
  document.getElementById('logoutBtn').onclick = logout;
  const params = new URLSearchParams(location.search);
  const targetCode = params.get('rop') || me.code;
  if(params.get('rop')) document.getElementById('backBtn').style.display='inline-flex';
  const fns = getFunctions(getApp(), 'europe-west1');
  try{
    const res = await httpsCallable(fns,'getDashboard')({ user_code: targetCode, view:'department' });
    const d = res.data;
    document.getElementById('dateBadge').textContent = new Date(d.meta?.generated_at||Date.now()).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    render(d);
  }catch(e){
    document.getElementById('root').innerHTML = `<div class="banner">Не удалось загрузить кабинет: ${esc(e.message||e)}</div>`;
    console.error(e);
  }
  document.getElementById('overlay').classList.add('hidden');
})();
</script>
</body>
</html>
