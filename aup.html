<style>
 :root{
 /* Поверхности */
 --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef0f4;
 /* Линии и тени */
 --line:#e6e8ee; --line-strong:#d1d5db;

 --shadow-hover:0 2px 6px rgba(20,30,55,.08),0 10px 32px rgba(20,30,55,.08);
 /* Текст */
 --ink:#1a1f2e; --ink-soft:#3b4358; --muted:#7a8194; --muted-2:#a8aebd; --on-dark:#ffffff;
 /* Бренд */
 --brand:#2b6cb0; --brand-hover:#1f5288; --brand-soft:#eaf2fb;
 /* Семантика воронки */
 --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
 /* Статусы */
 --ok:#16a34a; --ok-bg:#e9f6ec;
 --warn:#d97706; --warn-bg:#fdf3e3;
 --bad:#dc2626; --bad-bg:#fdeaea;
 --nd:#7a8194; --nd-bg:#eef0f4;
 /* ИИ-фиолетовый */
 --ai-purple-bg-1:#f5f3ff; --ai-purple-bg-2:#ede9fe; --ai-purple-line:#ddd6fe;
 --ai-purple-ink:#5b21b6; --ai-purple-ink-strong:#4c1d95;
 /* Скругления */
 --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;
 /* Отступы */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
 /* Типографика */
 --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
 --fs-20:20px; --fs-22:22px; --fs-28:28px;
 --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700; --fw-eb:800;
 /* Прочее */
 --transition:0.15s ease; --max-width:1180px; --app-header-h:56px;
 /* Совместимость со старым кодом (этапы 2-8 уберут) */
 
 }

  /* TZ-A22 §3.3 — единый каркас .hero (алиасы существующих .card + .stat-grid + .stat) */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}
  .hero-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:var(--fs-16);flex-shrink:0}
  .hero-info{flex:1;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
  @media(min-width:620px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
  .hero-stat{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
  .hero-stat-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px}
  .hero-stat-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.2;display:block;margin-top:var(--sp-1)}
  .hero-stat-sub{font-size:var(--fs-11);color:var(--muted);margin-top:2px}

 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:1.5;padding-bottom:24px}
 .app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
 .logo{font-size:var(--fs-16);font-weight:var(--fw-eb);color:var(--brand)} .logo span{color:var(--muted);font-weight:var(--fw-m)}
 .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
 .date-badge{font-size:var(--fs-12);color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:20px}
 .btn{font-size:var(--fs-12);color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
 .btn:hover{border-color:var(--brand);color:var(--brand)}
 .container{max-width:1080px;margin:0 auto;padding:16px}
 @media(min-width:860px){.container{padding:24px 28px}}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
 .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
 @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
 .muted{color:var(--muted);font-size:var(--fs-12)}
 .section-title{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
 .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--r-xl);padding:14px 16px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .soon{background:var(--surface-2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:var(--fs-13)}
 .soon .soon-ic{font-size:var(--fs-28);display:block;margin-bottom:8px}

 .profile{display:flex;align-items:flex-start;gap:14px}
 .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);font-weight:var(--fw-eb);color:#fff;flex-shrink:0}
 .role-tag{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-b);padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
 .hero-name{font-size:var(--fs-20);font-weight:var(--fw-eb);line-height:1.15}
 .hero-sub{font-size:var(--fs-12);color:var(--muted);margin-top:3px}
 .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
 @media(min-width:620px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
 .stat{background:var(--surface-2);border-radius:10px;padding:12px 14px}
 .stat .s-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb)}
 .stat b{font-size:var(--fs-22);font-weight:var(--fw-eb);display:block;line-height:1.2;margin-top:2px}
 /* TZ-A30 §1: шапка-плитки в кабинетах руководителей */
 .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
 @media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
 .tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;min-height:122px}
 .tile:hover{border-color:var(--brand);box-shadow:0 4px 12px rgba(20,30,55,.08);transform:translateY(-1px)}
 .tile-cap{font-size:var(--fs-11);color:var(--muted);font-weight:600}
 .tile-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.1;margin-top:6px}
 .tile-val .tile-sub-num{font-size:var(--fs-13);color:var(--muted);font-weight:600}
 .tile-sub{font-size:var(--fs-11);color:var(--muted);margin-top:auto;padding-top:8px}
 .tile .chev{position:absolute;top:11px;right:11px;color:var(--muted-2);font-size:12px}
 .tile-spark{margin-top:8px;height:26px;width:100%}
 .tile-bars{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:8px}
 .tile-bars span{flex:1;border-radius:3px 3px 0 0;min-height:3px}
 .tile-seg{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:9px;background:#eef0f4}
 .tile-seg i{display:block;height:100%}
 /* модалка детали */
 .tile-modal{position:fixed;inset:0;background:rgba(20,30,55,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
 .tile-modal.on{display:flex}
 .tile-modal-card{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(20,30,55,.2)}
 .tile-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
 .tile-modal-ttl{font-size:var(--fs-16);font-weight:var(--fw-eb)}
 .tile-modal-close{background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
 .tile-modal-close:hover{color:var(--ink)}
 /* TZ-A30 §1 ред.2 (18.06): плитка ИР разделена на 2 части — недели сверху, месяц снизу */
 .ir-tile-split{display:flex;flex-direction:column;flex:1;margin-top:8px;gap:6px}
 .ir-tile-weeks{padding-bottom:6px;border-bottom:1px dashed var(--line)}
 .ir-tile-weeks-cap{font-size:10px;color:var(--muted-2,#a8aebd);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
 .ir-tile-weeks-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
 .ir-wk-cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 0;text-align:center;font-size:12px;font-weight:var(--fw-eb);min-height:24px}
 .ir-wk-cell.empty{color:var(--muted-2,#a8aebd);font-weight:var(--fw-r)}
 .ir-tile-month{display:flex;flex-direction:column;align-items:center;margin-top:auto;padding-top:4px}
 .ir-tile-month-cap{font-size:10px;color:var(--muted-2,#a8aebd);text-transform:uppercase;letter-spacing:.04em}
 .ir-tile-month-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.1}
 /* TZ-A30 правка 18.06: подписи под каждым столбиком в плитке «Состав по стажу» */
 .bar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;flex:1}
 .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
 .bar-num{font-size:13px;font-weight:var(--fw-eb);color:var(--ink);margin-bottom:2px}
 .bar-track{width:100%;height:30px;display:flex;align-items:flex-end}
 .bar-track span{width:100%;border-radius:3px 3px 0 0;min-height:4px}
 .bar-lbl{font-size:10px;color:var(--muted);margin-top:3px}

 /* TZ-A30: Группа 0 — отдельный блок внизу таба «Команда» */
 .ir-info{display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:10px;cursor:help;margin-left:4px;font-weight:var(--fw-r);vertical-align:middle;background:#fff}
 .ir-info:hover{background:var(--line);color:var(--ink)}
 [data-tip]{position:relative}
 [data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:var(--fw-r);line-height:1.45;white-space:normal;width:340px;max-width:90vw;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;text-align:left}
 [data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1f2937;z-index:9999;pointer-events:none}

 .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
 .rtab{font-size:var(--fs-14);padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:var(--fw-sb);white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
 .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
 .rtab.on{background:#fff;color:var(--brand);font-weight:var(--fw-b);box-shadow:0 2px 6px rgba(0,0,0,.08)}
 .screen{display:none} .screen.on{display:block}

 .ir-top{display:flex;align-items:center;gap:18px}
 .ir-big{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1}
 .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
 .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:var(--fs-12);font-weight:var(--fw-sb)}
 /* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
 .ir-card-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
 .ir-card-title{font-size:var(--fs-13);color:var(--muted);font-weight:var(--fw-r)}
 .ir-tabs{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden}
 .ir-tab{padding:4px var(--sp-3);background:transparent;border:none;border-right:1px solid var(--line);font-size:var(--fs-12);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s ease}
 .ir-tab:last-child{border-right:none}
 .ir-tab:hover{color:var(--ink-soft,var(--ink))}
 .ir-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
 .ir-body{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:center}
 .ir-total{font-size:var(--fs-28);font-weight:var(--fw-eb);color:var(--ok);line-height:1;min-width:80px}
 .ir-total-delta{display:block;font-size:var(--fs-12);font-weight:var(--fw-sb);margin-top:2px;height:14px}
 .ir-total-delta.up{color:var(--ok)} .ir-total-delta.down{color:var(--bad)} .ir-total-delta.flat{color:var(--muted)}
 .ir-total-delta.hidden{visibility:hidden}
 .ir-channels{display:flex;flex-direction:column;gap:var(--sp-2)}
 .ir-channel-row{display:grid;grid-template-columns:90px 1fr 50px 30px 70px;gap:var(--sp-2);align-items:center;font-size:var(--fs-12)}
 .ir-channel-name{font-weight:var(--fw-sb);color:var(--ink)}
 .ir-channel-bar{position:relative;height:10px;background:var(--surface-3,var(--line));border-radius:var(--r-pill);overflow:hidden}
 .ir-channel-fill{height:100%;border-radius:var(--r-pill);transition:width .4s ease}
 .ir-channel-fill.buyer{background:var(--buyer,#3b82f6)} .ir-channel-fill.seller{background:var(--seller,#10b981)}
 .ir-channel-pct{text-align:right;font-weight:var(--fw-b);color:var(--ink)}
 .ir-channel-delta{text-align:center;font-size:var(--fs-11);font-weight:var(--fw-sb);white-space:nowrap}
 .ir-channel-delta.up{color:var(--ok)} .ir-channel-delta.down{color:var(--bad)} .ir-channel-delta.flat{color:var(--muted-2)}
 .ir-channel-delta.hidden{visibility:hidden}
 .ir-channel-spark{height:18px;display:block;width:70px}
 .ir-channel-spark.hidden{visibility:hidden}
 .ir-card-foot{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--surface-3,var(--line));font-size:var(--fs-12);color:var(--muted)}
 .bar-bg{height:8px;background:var(--nd-bg);border-radius:5px;overflow:hidden}
 .bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
 .status-badge{font-size:var(--fs-11);padding:3px 10px;border-radius:20px;font-weight:var(--fw-b)}
 .sb-green{background:var(--ok-bg);color:var(--ok)} .sb-yellow{background:var(--warn-bg);color:var(--warn)}
 .sb-red{background:var(--bad-bg);color:var(--bad)} .sb-no_data{background:var(--nd-bg);color:var(--muted)}

 .fs-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}

 .fs-dot{width:10px;height:10px;border-radius:3px}
 .stage-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--buyer));border-radius:12px;padding:12px 14px;margin-bottom:8px}
 .stage-head{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;cursor:pointer}
 .chev{color:var(--muted);font-size:var(--fs-12);transition:transform .2s} .chev.open{transform:rotate(90deg)}

 .stage-seg.hidden{display:none}
 .seg-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);font-size:var(--fs-11);color:var(--muted)} .seg-row .sv{color:var(--ink);font-weight:var(--fw-sb)}
 .stage-label{font-size:var(--fs-14);font-weight:var(--fw-b)}
 .stage-numbers b{font-weight:var(--fw-eb)}
 .stage-bar{height:10px;background:var(--nd-bg);border-radius:6px;overflow:hidden}
 .stage-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
 .fs-legend{font-size:var(--fs-11);color:var(--muted);margin:-2px 2px 10px;display:flex;gap:14px}
 .fs-legend b{color:var(--ink);font-weight:var(--fw-b)}

 /* карточки команды (TZ-A20 / TZ-A22) — единый компонент member-row */

 .rr-info{min-width:0}.rr-name{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink)}
 .rr-arr{color:var(--muted);font-weight:var(--fw-r);font-size:var(--fs-16)}.rr-meta{font-size:var(--fs-12);color:var(--muted);margin-top:2px}
 .rr-task-btn{background:var(--brand);color:#fff;border:none;font-size:var(--fs-12);font-weight:var(--fw-b);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}

 .rr-metrics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:13px;padding:11px 12px;background:#fafbfc;border-radius:var(--r-sm);border:1px solid var(--line)}
 .rr-m{text-align:center}.rr-m-lbl{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:var(--fw-sb);line-height:1.2}
 .rr-m-val{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);margin-top:4px;white-space:nowrap}.rr-m-val small{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-m)}.rr-m-val.v-brand{color:var(--brand)}
 .t-up{color:var(--ok);font-size:var(--fs-12)}.t-down{color:var(--bad);font-size:var(--fs-12)}.t-flat{color:var(--muted);font-size:var(--fs-11)}
 .rr-activity{margin-top:10px;padding:8px 12px;background:linear-gradient(90deg,#fefce8,#fef9c3);border:1px solid #fef08a;border-radius:var(--r-sm);display:flex;align-items:center;gap:8px;font-size:var(--fs-12);color:#78350f;flex-wrap:wrap}
 .rr-act-i{font-size:var(--fs-14)}.rr-act-item b{color:#451a03;font-weight:var(--fw-b);font-size:var(--fs-13)}.rr-act-sep{color:#a16207}
 .rr-act-clickable{cursor:pointer;padding:3px 8px;border-radius:var(--r-xs);background:rgba(255,255,255,.4)}.rr-act-clickable:hover{background:#fff}.rr-act-arr{font-size:var(--fs-11);color:#a16207;margin-left:3px}
 .risk-badge{font-size:var(--fs-11);font-weight:var(--fw-b);padding:3px 9px;border-radius:var(--r-pill)}

.fp-bar-fact:not(:only-child){border-radius:var(--r-xs) 0 0 var(--r-xs)}

</div>

 <div class="rtab on" data-tab="main" onclick="showTab('main',this)">🏠 Главная</div>

<script type="module">
import { requireAuth, logout } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';
import { mountCalendar, openTaskDetail } from './calendar.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const STC={green:'#16a34a',yellow:'#d97706',red:'#dc2626',no_data:'#cbd0db'};
const SIDE_COLOR={buyer:'#3b82f6',seller:'#10b981'};
const CTX={data:null};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }
function heroRevenueBar(a){
 if(!a||!a.buyer||!a.seller) return '';
 const bs=(a.buyer.stages||[]).find(s=>s.key==='revenue')||{};
 const ss=(a.seller.stages||[]).find(s=>s.key==='revenue')||{};
 const fact=(bs.fact||0)+(ss.fact||0);
 const plan=(bs.plan||0)+(ss.plan||0);
 const fcB=bs.forecast!=null?bs.forecast:bs.fact||0;
 const fcS=ss.forecast!=null?ss.forecast:ss.fact||0;
 const forecast=(bs.forecast!=null||ss.forecast!=null)?(fcB+fcS):null;
 if(!plan) return '';
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 const stage={label:'Валовая выручка',hint:'за месяц',fact,plan,forecast,fact_label:fmt(fact)+' ₽',plan_label:fmt(plan)+' ₽',forecast_label:forecast!=null?fmt(forecast)+' ₽':null};
 // renderStage уже отрисует: заголовок слева, факт/прогноз/план справа сверху, полосу ниже.
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}
function fmtNumber(n){ if(!Number.isFinite(n))return '—';
  const a=Math.abs(n);
  if(a>=1000000) return (n/1000000).toFixed(1).replace('.',',')+' млн';
  if(a>=10000)   return Math.round(n/1000)+'к';
  if(a>=1000)    return (n/1000).toFixed(1).replace('.',',')+' тыс';
  return String(Math.round(n));
}
// Прогноз вала на следующий месяц — в стиле плашки этапа воронки.
function fcHero(fc){
 if(!fc || !fc.next_month) return '';
 const nm=fc.next_month;
 const now=new Date(); const next=new Date(now.getFullYear(), now.getMonth()+1, 1);
 const monthNames=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
 const lbl=monthNames[next.getMonth()]+' '+next.getFullYear();
 const target=Number(nm.target_revenue)||0;
 const fcst=Number(nm.revenue_total)||0;
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 // В прогнозе след.мес факта ещё нет (новый месяц не наступил). fact=0, forecast=полный прогноз, plan=target.
 const stage={label:'Прогноз вала',hint:lbl,fact:0,plan:target,forecast:fcst,fact_label:'0 ₽',plan_label:target>0?fmt(target)+' ₽':'—',forecast_label:fcst>0?fmt(fcst)+' ₽':'—'};
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}

/* ─── TZ-A30 §1: шапка-плитки ─── */
function _spark(values,color){
 const arr=(values||[]).filter(v=>typeof v==='number');
 if(arr.length<2) return '';
 const N=arr.length, max=Math.max(...arr,1);
 const W=120,H=26;
 const pts=arr.map((v,i)=>[((W/(N-1))*i).toFixed(1),(H-2-(v/max)*(H-4)).toFixed(1)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
 const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="${color}"/>`).join('');
 return `<svg class="tile-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
}
function _stazhBars(members, scope, dist){
 let s72=0,s48=0,s0=0;
 if (dist && typeof dist === 'object' && (dist.total||0) > 0) {
   s72 = dist.s6plus || 0;
   s48 = dist.s4_6 || 0;
   s0  = dist.s0_3 || 0;
 } else if (scope === 'группы') {
   (members||[]).forEach(m=>{
     if (m.is_self) return;
     const v=typeof m.stazh_months==='number'?m.stazh_months:0;
     if(v>=6) s72++; else if(v>=4) s48++; else s0++;
   });
 } else {
   const col=(c,label)=>`<div class="bar-col"><div class="bar-num" style="color:var(--muted-2,#a8aebd)">—</div><div class="bar-track"><span style="height:6px;background:${c};opacity:.3"></span></div><div class="bar-lbl">${label}</div></div>`;
   return {html:`<div class="bar-grid">${col('var(--brand)','6+')}${col('var(--muted-2,#a8aebd)','4–6')}${col('var(--ok)','0–3')}</div>`, s72:0, s48:0, s0:0};
 }
 const mx=Math.max(s72,s48,s0,1);
 const col=(v,c,label)=>`<div class="bar-col"><div class="bar-num">${v}</div><div class="bar-track"><span style="height:${Math.max(6,Math.round(v/mx*100))}%;background:${c}"></span></div><div class="bar-lbl">${label}</div></div>`;
 return {html:`<div class="bar-grid">${col(s72,'var(--brand)','6+')}${col(s48,'var(--muted-2,#a8aebd)','4–6')}${col(s0,'var(--ok)','0–3')}</div>`, s72, s48, s0};
}
function _tasksStat(tasks){
 const g = (tasks && tasks.groups) || {};
 const today=g.today||[], week=g.week||[], later=g.later||[], expired=g.expired||[], done=g.done_recent||[];
 const total = today.length+week.length+later.length+expired.length+done.length;
 return { total, done: done.length, overdue: expired.length };
}
function renderTiles(o){
 // ── ПЛИТКА 1: ИР разделена на 2 части (TZ-A30, правка Егора 18.06):
 //   сверху — 4 ячейки по неделям месяца (только завершённые), снизу — месячный ИР.
 const today=new Date();
 const dayN=today.getDate();
 // граничные дни: 7, 14, 21, последний день месяца → сколько завершённых недель
 const lastDay=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
 const completedWeeks=dayN>lastDay?4:dayN>21?3:dayN>14?2:dayN>7?1:0;
 const currentWeekIdx = completedWeeks < 4 ? completedWeeks : -1;
 const wk=(o.irWeekly||[]).slice(-completedWeeks||0);
 const irCurWeek = (typeof o.irCurrentWeek === 'number') ? o.irCurrentWeek : null;
 const cellW=(v,state)=>{
  if(state==='empty' || v==null) return `<div class="ir-wk-cell empty">—</div>`;
  const c=v>=70?'var(--ok)':v>=50?'var(--warn)':'var(--bad)';
  const tip = state==='current' ? ' title="Текущая неделя — динамический ИР, закроется в конце недели"' : '';
  const badge = state==='current' ? `<div style="font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.05em">СЕЙЧАС</div>` : '';
  return `<div class="ir-wk-cell"${tip} style="color:${c}">${v}%${badge}</div>`;
 };
 let weekRow='';
 for(let i=0;i<4;i++){
  if(i<completedWeeks)      weekRow+=cellW(wk[i], 'closed');
  else if(i===currentWeekIdx) weekRow+=cellW(irCurWeek, irCurWeek==null?'empty':'current');
  else                      weekRow+=cellW(null, 'empty');
 }
 const irMonth=typeof o.irMonth==='number'?o.irMonth:o.irValue;
 const irMonthClr=irMonth>=70?'var(--ok)':irMonth>=50?'var(--warn)':'var(--bad)';

 // ── ПЛИТКА 2: вверху — ИР ≥70%, снизу — план по валу с учётом прогноза
 const perfTotal=o.perfTotal||1;
 const perfPct=Math.round((o.perf/perfTotal)*100);
 const perfClr=perfPct>=50?'var(--ok)':perfPct>=25?'var(--warn)':'var(--bad)';
 const _mems = (o.teamMembers||[]).filter(m=>!m.is_self);
 let revOk=0, revTotal=0;
 _mems.forEach(m=>{
  const plan=Number(m.plan_month)||0;
  if(plan<=0) return;
  revTotal++;
  const fc=Number(m.forecast_month)||0;
  if(fc>=plan) revOk++;
 });
 const revPct = revTotal? Math.round((revOk/revTotal)*100):0;
 const revClr = revPct>=50?'var(--ok)':revPct>=25?'var(--warn)':'var(--bad)';

 // ── ПЛИТКА 3: подписи теперь под каждым столбиком
 const stazh=_stazhBars(o.teamMembers, o.scope, o.stazhDist);

 const tasksS=_tasksStat(o.tasks);
 const taskDonePct=tasksS.total?Math.round((tasksS.done/tasksS.total)*100):0;
 return `<div class="tiles">
  <div class="tile" onclick="openTileModal('ir')"><span class="chev">›</span>
   <div class="tile-cap">ИР ${esc(o.scope)} · ${esc(_monthShort())}</div>
   <div class="ir-tile-split">
    <div class="ir-tile-weeks">
     <div class="ir-tile-weeks-cap">по неделям</div>
     <div class="ir-tile-weeks-row">${weekRow}</div>
    </div>
    <div class="ir-tile-month">
     <div class="ir-tile-month-cap">месяц</div>
     <div class="ir-tile-month-val" style="color:${irMonthClr}">${irMonth}%</div>
    </div>
   </div></div>
  <div class="tile" onclick="openTileModal('perf')"><span class="chev">›</span>
   <div class="tile-cap">Выполняют ИР ≥ 70%</div>
   <div class="tile-val">${o.perf} <span class="tile-sub-num">из ${perfTotal}</span></div>
   <div class="tile-seg"><i style="width:${perfPct}%;background:${perfClr}"></i></div>
   <div class="tile-cap" style="margin-top:8px">Выполняют план по валу <span class="muted" style="font-weight:var(--fw-r)">(с прогнозом)</span></div>
   <div class="tile-val">${revOk} <span class="tile-sub-num">из ${revTotal}</span></div>
   <div class="tile-seg"><i style="width:${revPct}%;background:${revClr}"></i></div></div>
  <div class="tile" onclick="openTileModal('stazh')"><span class="chev">›</span>
   <div class="tile-cap">Состав по стажу <span class="muted" style="font-weight:var(--fw-r)">· мес</span></div>
   ${stazh.html}
   <div class="tile-sub"></div></div>
  <div class="tile" onclick="openTileModal('tasks')"><span class="chev">›</span>
   <div class="tile-cap">Задачи за месяц</div>
   <div class="tile-val">${tasksS.done} <span class="tile-sub-num">из ${tasksS.total}</span></div>
   <div class="tile-seg"><i style="width:${taskDonePct}%;background:var(--ok)"></i></div>
   <div class="tile-sub">${taskDonePct}% выполнено${tasksS.overdue?` · ${tasksS.overdue} просрочено`:''}</div></div>
 </div>`;
}
function _monthShort(){ const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; return m[new Date().getMonth()]; }

 } else if(kind==='tasks'){

/* ─── воронка компании ─── */
function aggStageCard(side,st){
 const stage={...st, hint: st.hint_label};
 let html=renderStage(stage);
 if(st.segments && st.segments.length){
  const segs=st.segments.map(sg=>{
   if(st.is_revenue){
    const f=sg.has_fact?`<span class="seg-num seg-fact">${esc(sg.deals_fact_label||'')} <b>${esc(sg.revenue_fact_label||'')}</b></span>`:'';
    const fc=sg.has_forecast?`<span class="seg-num seg-forecast">${esc(sg.deals_forecast_label||'')} <b>${esc(sg.revenue_forecast_label||'')}</b></span>`:'';
    const sep=(sg.has_fact&&sg.has_forecast)?'<span class="seg-sep">/</span>':'';
    return `<div class="seg-row"><span class="sv">${esc(sg.label)}</span><span class="seg-numbers">${f}${sep}${fc}</span></div>`;
   }
   const subStage={fact:sg.fact,plan:sg.plan,fact_label:sg.fact_label,plan_label:sg.plan_label,forecast:null};
   return `<div style="margin-bottom:8px"><div class="seg-row" style="margin-bottom:4px"><span class="sv">${esc(sg.label)}</span><span style="color:var(--muted);font-size:var(--fs-11)">${esc(sg.fact_label)} / ${esc(sg.plan_label)}</span></div>${renderFpBar(subStage,{compact:true})}</div>`;
  }).join('');
  html=html.replace(/<\/div>\s*$/, `<div class="stage-seg hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${segs}</div></div>`);
  html=html.replace('class="funnel-head"',`class="funnel-head" style="cursor:pointer" onclick="toggleStage(this)"`);
  html=html.replace('<div class="funnel-label">','<div class="funnel-label"><span class="chev" style="display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-weight:var(--fw-b)">›</span> ');
 }
 return html;
}
window.toggleStage=(head)=>{ const c=head.closest('.stage-card, .funnel-stage'); if(!c)return; const s=c.querySelector('.stage-seg'),ch=c.querySelector('.chev'); if(!s)return; s.classList.toggle('hidden'); if(ch) ch.classList.toggle('open'); };
function aggSide(side,fs,icon){ if(!fs)return'';
 return `<div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span>
 <div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div>
 <span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}">ИР ${fs.ir}% · ${esc(fs.ir_status_label||'')}</span></div>
 <div class="fs-legend"><span><b>факт</b> компании</span><span>/ <b>план</b> компании</span><span>· % выполнения</span></div>
 ${(fs.stages||[]).map(st=>aggStageCard(side,st)).join('')}`;
}
/* Парная сетка для агрегатов: i-й этап покуп ↔ i-й этап прод выровнены по высоте */
function renderAggFunnelsPaired(buyer,seller,factLbl){
 const head=(fs,icon,side)=>`<div><div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span><div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div><span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}">ИР ${fs.ir}% · ${esc(fs.ir_status_label||'')}</span></div><div class="fs-legend"><span><b>факт</b> ${factLbl}</span><span>/ <b>план</b> ${factLbl}</span><span>· % выполнения</span></div></div>`;
 const bs=(buyer.stages||[]).map(st=>aggStageCard('buyer',st));
 const ss=(seller.stages||[]).map(st=>aggStageCard('seller',st));
 const rows=Math.max(bs.length,ss.length);
 const cells=[head(buyer,'🛒','buyer'),head(seller,'🏠','seller')];
 for(let i=0;i<rows;i++){
  cells.push(`<div class="row-stage">${bs[i]||''}</div>`);
  cells.push(`<div class="row-stage">${ss[i]||''}</div>`);
 }
 return `<div class="funnel-grid-paired">${cells.join('')}</div>`;
}

/* ─── TZ-A34: Вкладка «Прогноз» (АУП — единица «компания») ─── */
const PRG_MODE_KEY = 'prognoz_mode_aup';
function _prgFmtK(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' млн'; if(n>=1e4) return Math.round(n/1e3)+'к'; if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+'к'; return String(Math.round(n)); }
function _prgFmtFull(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function _monthShortRu(ym){ const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; return m[parseInt(ym.slice(5,7),10)-1]||ym; }

function renderPrognoz(d){
  const pt = d.prognoz_tab;

  }
  const scopeLbl = 'компании';

  if (!['dohod','val'].includes(mode)) mode='val';
  const cur = pt.monthly.find(m=>m.is_current) || pt.monthly[pt.monthly.length-1];

  const out=[];
  out.push(`<div class="card">
    <div class="section-title">💰 ${esc(_monthShortRu(cur.ym))} · вал ${scopeLbl}</div>

      <div style="background:#eff6ff;border:1px solid #cfe3fb;border-radius:8px;padding:14px 16px">

        <div style="font-size:24px;font-weight:800;color:#1e63d9;margin:5px 0 2px">${_prgFmtFull(valFact)} ₽</div>
        <div style="font-size:12px;color:var(--muted)">план ${_prgFmtFull(valPlan)} ₽</div>
      </div>
      <div style="background:#f3effe;border:1px solid #d8c9fa;border-radius:8px;padding:14px 16px">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Прогноз итого</div>
        <div style="font-size:24px;font-weight:800;color:#7c3aed;margin:5px 0 2px">${_prgFmtFull(valFc)} ₽</div>
        ${valPlan>0?`<div style="display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:4px;background:${valPct>=100?'#d1f0df':'#dbeafe'};color:${valPct>=100?'#0b5236':'#1e40af'}">${valPct}% плана</div>`:''}
      </div>
    </div>
    ${pt.note?`<div style="font-size:11px;color:var(--muted);margin-top:10px">ℹ️ ${esc(pt.note)}</div>`:''}
  </div>`);
  out.push(`<div class="card">
    <div class="section-title">📊 Цикл по месяцам</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Помесячный вал компании vs план (сумма отделов). Зелёное — факт, синее — прогноз, штриховка — план.</div>
    <div style="display:inline-flex;background:var(--surface-2,#f1f3f7);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px">
      <button onclick="prgSetMode('val')" style="border:none;background:${mode==='val'?'var(--surface,#fff)':'transparent'};font-family:inherit;font-size:12px;font-weight:700;color:${mode==='val'?'var(--brand)':'var(--muted)'};padding:6px 15px;border-radius:999px;cursor:pointer">Вал (оборот)</button>
      <button onclick="prgSetMode('dohod')" style="border:none;background:${mode==='dohod'?'var(--surface,#fff)':'transparent'};font-family:inherit;font-size:12px;font-weight:700;color:${mode==='dohod'?'var(--brand)':'var(--muted)'};padding:6px 15px;border-radius:999px;cursor:pointer">Доход (≈48%)</button>
    </div>
    <div id="prg-bars-wrap"></div>
  </div>`);
  if (pt.segments && pt.segments.length) {
    const rows = pt.segments.map(s=>{
      const headParts=[];

        const hasFact = dF > 0 || rF > 0;
        const hasFcst = dFcst > 0 || rFcst > 0;
        if (!hasFact && !hasFcst) return '';
        const factPart = hasFact ? `<span style="color:#0e7a4f"><b>${dF||0}</b> сделок · ${_prgFmtFull(rF)} ₽</span>` : '';
        const fcstPart = hasFcst ? `<span style="color:#c2410c">+<b>${dFcst||0}</b> сделок · +${_prgFmtFull(rFcst)} ₽</span>` : '';
        const sep = hasFact && hasFcst ? '<span style="color:var(--muted)"> / прогноз </span>' : '';
        return `<span style="color:var(--muted)">${icon} ${lbl}: ${factPart}${sep}${fcstPart}</span>`;
      };
      headParts.push(sideLine('🛒', 'покуп', s.b_deals_fact||s.b_deals||0, s.b_revenue_fact||s.b_revenue||0, s.b_deals_forecast||0, s.b_revenue_forecast||0));
      headParts.push(sideLine('🏠', 'прод', s.s_deals_fact||s.s_deals||0, s.s_revenue_fact||s.s_revenue||0, s.s_deals_forecast||0, s.s_revenue_forecast||0));

        <div style="text-align:right;white-space:nowrap">${totRight}</div>

      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Что закрыто и в работе по компании за этот месяц.</div>

      </div>
    </div>`);
  }
  root.innerHTML = out.join('');
  prgRenderBars(pt, mode);
}

window.prgSetMode = function(m){ localStorage.setItem(PRG_MODE_KEY, m); if(CTX&&CTX.data) renderPrognoz(CTX.data); };

function prgRenderBars(pt, mode){
  const wrap=document.getElementById('prg-bars-wrap'); if(!wrap) return;
  const months=pt.monthly||[];
  const isDohod=mode==='dohod';
  const vals=months.map(m=>({ym:m.ym, fact:isDohod?(m.fact_income||0):(m.fact_revenue||0), fcst:isDohod?(m.forecast_income||0):(m.forecast_revenue||0), plan:isDohod?(m.plan_income||0):(m.plan_revenue||0), is_current:m.is_current, is_future:m.is_future, is_past:m.is_past}));
  const max=Math.max(...vals.map(v=>Math.max(v.fact,v.fcst,v.plan)),1);
  const cols=vals.map(v=>{
    const planH=Math.round((v.plan||0)/max*100);
    const factH=Math.round((v.fact||0)/max*100);
    const fcstH=v.fcst>0?Math.round(v.fcst/max*100):0;
    const isForecast=v.is_future||(v.is_current&&v.fcst>v.fact);
    const barH=isForecast?fcstH:factH;
    const barColor=v.is_past?'linear-gradient(180deg,#22c55e,#16a34a)':v.is_current?'linear-gradient(180deg,#10b981,#0e7a4f)':'linear-gradient(180deg,#3b82f6,#1e63d9)';
    const showVal=v.fact>0?v.fact:(v.fcst>0?v.fcst:0);
    const cap=v.is_current?'сейчас':(v.is_future?'прогноз':'факт');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px;height:100%">
      <div style="font-size:9px;color:${v.is_current?'var(--brand)':'transparent'};text-transform:uppercase;letter-spacing:.4px;font-weight:700">${cap}</div>
      <div style="position:relative;flex:1;width:100%;background:#f1f5f9;border-radius:6px;overflow:hidden;min-height:120px">
        <div style="position:absolute;bottom:0;left:0;right:0;height:${planH}%;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 4px,#e2e8f0 4px,#e2e8f0 8px);border-radius:6px;opacity:.7"></div>
        ${barH>0?`<div style="position:absolute;bottom:0;left:0;right:0;height:${barH}%;border-radius:6px;background:${barColor};display:flex;align-items:flex-start;justify-content:center;padding-top:6px"><span style="color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.15)">${_prgFmtK(showVal)}</span></div>`:''}
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--ink);line-height:1.3">${_prgFmtK(showVal)} / ${_prgFmtK(v.plan)}</div>
      <div style="font-size:11px;color:${v.is_current?'var(--brand)':'var(--muted)'};font-weight:600;text-transform:uppercase">${_monthShortRu(v.ym)}</div>
    </div>`;
  }).join('');
  const planTot=vals.reduce((s,v)=>s+(v.plan||0),0);
  const factTot=vals.filter(v=>!v.is_future).reduce((s,v)=>s+(v.fact||0),0);
  const fcstNext=(vals.find(v=>v.is_future)||{}).fcst||0;
  wrap.innerHTML=`<div style="background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:14px">
    <div style="display:grid;grid-template-columns:repeat(${vals.length},1fr);gap:8px;align-items:end;height:200px">${cols}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding-top:10px;border-top:1px dashed var(--line);margin-top:10px;flex-wrap:wrap;gap:8px">
      <span style="color:var(--muted)">За цикл: <b style="color:var(--ink)">${_prgFmtK(factTot)}</b> из ${_prgFmtK(planTot)} · прогноз след: <b style="color:var(--ink)">${_prgFmtK(fcstNext)}</b></span>
      <span style="font-weight:700;color:${factTot>=planTot*0.9?'var(--ok)':'var(--warn)'}">${factTot>=planTot?'▲ опережаем план':factTot>=planTot*0.7?'≈ в плане':'▼ отстаём'}</span>
    </div>
  </div>`;
}

/* TZ-A26: утилиты трёхчастной воронки */
// Нормализация: для не-revenue этапов (целочисленные fact/plan) округляем до целых,
// чтобы % считался по тем же числам, что в подписи (не 1/1.886=53%, а 1/2=50%).
function _normNum(v,isInt){ if(v==null) return v; return isInt?Math.round(v):v; }
function calcStatus(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ return fact>0?'s-done':'s-pending'; }
  const f=(fact/plan)*100; if(f>=100) return 's-done';
  if(forecast!=null){ const fc=(forecast/plan)*100; if(fc>=100) return 's-forecast'; }
  return 's-pending';
}
function calcBarPercents(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ if(fact>0) return {factPct:100,factPctVisual:100,forecastPctTotal:100,forecastDeltaPct:0,forecastDeltaPctVisual:0,noPlan:true}; return {factPct:0,factPctVisual:0,forecastPctTotal:0,forecastDeltaPct:0,forecastDeltaPctVisual:0}; }
  const factPct=Math.round((fact/plan)*100);
  let forecastPctTotal=factPct, forecastDeltaPct=0;
  if(forecast!=null && forecast>fact){ forecastPctTotal=Math.round((forecast/plan)*100); forecastDeltaPct=forecastPctTotal-factPct; }
  // Полоса визуально cap'ится на 100%.
  // Особый случай для revenue: если факт+прогноз > 100% плана (перевыполнение с прогнозом),
  // то полосу делим пропорционально fact:forecastDelta — чтобы оранжевая зона была видна
  // соизмеримо своему размеру (а не зажата в остатке от 100).
  let factPctVisual,forecastDeltaPctVisual;
  const totalPct=factPct+forecastDeltaPct;
  if(isRev && totalPct>100 && forecastDeltaPct>0){
    factPctVisual=Math.round(factPct/totalPct*100);
    forecastDeltaPctVisual=100-factPctVisual;
  } else {
    factPctVisual=Math.min(factPct,100);
    forecastDeltaPctVisual=Math.max(0, Math.min(forecastDeltaPct, 100-factPctVisual));
  }
  return {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual};
}
function tooltipFact(factLabel,factPct,planLabel,isRev){
  if(!isRev && factPct>=100){ return `факт ${factLabel} — план ${planLabel} выполнен на 100%`; }
  return `факт ${factLabel} — ${factPct}% от плана ${planLabel}`;
}
function tooltipForecast(forecastLabel,forecastPctTotal,planLabel,forecastDeltaPct){ return `прогноз ${forecastLabel} — +${forecastDeltaPct}% к плану ${planLabel} (итого ${forecastPctTotal}%)`; }
function renderFpBar(stage,opts){
  opts=opts||{};

  if(fact==null && plan==null){

  }
  const _p=calcBarPercents(fact,forecast,plan,is_revenue); const {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual}=_p;
  if(_p.noPlan){ const tt=`факт ${fact_label} — плана нет`; return `<div class="fp-bar${opts.compact?' sm':''}" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:100%">факт ${fact_label}</div></div>`; }

  }
  // Узкая зона = по визуальной ширине, иначе число «153%» в маленьком блоке не вылезает за границу.
  const factNarrow=factPctVisual>0 && factPctVisual<12;
  const forecastNarrow=forecastDeltaPctVisual>0 && forecastDeltaPctVisual<12;
  const factTt=factPct>0?tooltipFact(fact_label,factPct,plan_label,is_revenue):null;
  const forecastTt=forecastDeltaPct>0?tooltipForecast(forecast_label,forecastPctTotal,plan_label,forecastDeltaPct):null;
  // Подпись внутри блока: для revenue — реальный % (даже 259%), для остальных — cap 100%.
  const factLbl=is_revenue?factPct:factPctVisual;
  const fcDeltaLbl=is_revenue?forecastDeltaPct:forecastDeltaPctVisual;
  const factDiv=factPctVisual>0?`<div data-tooltip="${esc(factTt)}" class="fp-bar-fact${factNarrow?' narrow':''}" style="width:${factPctVisual}%">${factLbl}%</div>`:'';
  const forecastDiv=forecastDeltaPctVisual>0?`<div data-tooltip="${esc(forecastTt)}" class="fp-bar-forecast${forecastNarrow?' narrow':''}" style="width:${forecastDeltaPctVisual}%">+${fcDeltaLbl}%</div>`:'';
  const containerTt=factTt||forecastTt||'нет данных';
  const bar=`<div class="fp-bar${smClass}" data-tooltip="${esc(containerTt)}">${factDiv}${forecastDiv}</div>`;
  if(factNarrow||forecastNarrow){
    const parts=[];
    if(factNarrow) parts.push(`<span class="o-fact">${factPct}%</span><span class="o-lbl">от плана</span>`);
    if(forecastNarrow){ if(parts.length) parts.push('<span class="o-sep">·</span>'); parts.push(`<span class="o-forecast">+${forecastDeltaPct}%</span><span class="o-lbl">прогноз</span>`); }
    return `<div class="fp-bar-wrap">${bar}<div class="fp-bar-outside">${parts.join('')}</div></div>`;
  }
  return bar;
}
function renderStage(stage){
  const {label,hint,fact_label,forecast,forecast_label,plan_label,fact,plan,is_revenue}=stage;
  const status=calcStatus(fact,forecast,plan,is_revenue);
  const hintHtml=hint?`<span class="funnel-hint">${esc(hint)}</span>`:'';
  let numbers;
  // TZ-A26 уточнение: прогноз = ПРИРАЩЕНИЕ (forecast - fact, «+X к»), не итог.
  // Если приращения нет (forecast == fact или null) — показываем только факт и план.
  const showForecast = forecast!=null && forecast > fact;
  if(showForecast){
    const fmtDelta=(d)=>{ const a=Math.abs(d); if(a>=1000000) return (d/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000) return Math.round(d/1000)+'к'; if(a>=1000) return (d/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(d)); };
    const deltaLabel='+'+fmtDelta(forecast - fact);
    const totalLabel=fmtDelta(forecast);
    const u = is_revenue ? ' ₽' : '';
    numbers=`<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">прогноз</span><span class="fp-num-forecast">${esc(deltaLabel)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">итого</span><span style="color:#374151;font-weight:var(--fw-b)">${esc(totalLabel + u)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  } else {
    numbers=`<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  }
  return `<div class="funnel-stage ${status}"><div class="funnel-head"><div class="funnel-label">${esc(label)} ${hintHtml}</div><div class="fp-numbers">${numbers}</div></div>${renderFpBar(stage)}</div>`;
}

/* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
function _irDelta(d){ d=Math.round(d); if(d>=1)return {text:'▲+'+d,cls:'up'}; if(d<=-1)return {text:'▼'+d,cls:'down'}; return {text:'≈',cls:'flat'}; }
function _irSpark(values,color){
  const arr=(values||[]).filter(v=>v!=null);
  if(arr.length<2) return null;
  const N=arr.length;
  // X-координаты: равномерно по 4 или 6
  const baseX={4:[3,22,41,67], 6:[3,16,29,42,55,67]};
  const xs = baseX[N] || Array.from({length:N},(_,i)=>3+i*(64/(N-1)));
  const points = arr.map((v,i)=>{ const y=18-(v/100)*16; return `${xs[i]},${y.toFixed(1)}`; }).join(' ');
  const dots = arr.slice(0,-1).map((v,i)=>[xs[i], 18-(v/100)*16]);
  const last = [xs[xs.length-1], 18-(arr[arr.length-1]/100)*16];
  return { points, color, dots, last };
}
function _renderSparkSvg(spark){
  if(!spark) return '';
  const dots = spark.dots.map(([x,y])=>`<circle cx="${x}" cy="${y.toFixed(1)}" r="1.3" fill="${spark.color}" opacity=".4"/>`).join('');
  return `<polyline points="${spark.points}" fill="none" stroke="${spark.color}" stroke-width="1.5"/>${dots}<circle cx="${spark.last[0]}" cy="${spark.last[1].toFixed(1)}" r="2" fill="${spark.color}"/>`;
}
function _monthLabel(){ const d=new Date(); const m=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']; return m[d.getMonth()]+' '+d.getFullYear(); }
function _monthsAgoLabel(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr); if(isNaN(d)) return null;
  const today=new Date(); const ms=today-d;
  const months = Math.max(1, Math.round(ms/(30*24*3600*1000)));
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}, ${months} мес назад`;
}
const IR_TIP_MAIN_AGG = 'Индекс развития компании — насколько команда выполняет план. 100% = все четыре направления работы (поток, горячие, задатки, валовая выручка) на плане. Среднее по партнёрам.';
const IR_TIP_SIDE_AGG = 'недельный ИР стороны: avg((C1.side + C2.side + C3 + C4)/4) по партнёрам компании.';
const IR_TIP_TABLE = 'недельный ИР v2 отдела: agg.ir_v2_week_total (avg по партнёрам отдела).';
function renderIrCard(opts){
  // opts: { ir_history, isPartner, periodLabel }
  const h=opts.ir_history;
  if(!h || !h.now) return ''; // нет данных
  const periodLabel=opts.periodLabel||_monthLabel();
  const dataAttr = encodeURIComponent(JSON.stringify({h, isPartner:!!opts.isPartner, periodLabel}));
  return `<div class="card ir-card" data-ir="${dataAttr}">
    <div class="ir-card-head">
      <div class="ir-card-title">Индекс развития · ${esc(periodLabel)}<span class="ir-info" data-tip="${esc(IR_TIP_MAIN_AGG)}">?</span></div>
      <div class="ir-tabs">
        <button class="ir-tab active" data-mode="week">Неделя</button>
        <button class="ir-tab" data-mode="month">Месяц</button>
      </div>
    </div>
    <div class="ir-body">
      <div>
        <div class="ir-total" style="color:${barColor(h.now.total)}">${h.now.total}%</div>
        <span class="ir-total-delta hidden">·</span>
      </div>
      <div class="ir-channels">
        <div class="ir-channel-row">
          <div class="ir-channel-name">🛒 Покупатель</div>
          <div class="ir-channel-bar"><div class="ir-channel-fill buyer" style="width:${Math.min(h.now.buyer,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.buyer}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="buyer"></svg>
        </div>
        <div class="ir-channel-row">
          <div class="ir-channel-name">🏠 Продавец</div>
          <div class="ir-channel-bar"><div class="ir-channel-fill seller" style="width:${Math.min(h.now.seller,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.seller}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="seller"></svg>
        </div>
      </div>
    </div>
    <div class="ir-card-foot">Индекс развития · ${esc(periodLabel)} · насколько ты на пути к цели</div>
  </div>`;
}
window.applyIrMode=function(card, mode){
  const raw=card.getAttribute('data-ir'); if(!raw) return;
  const {h, isPartner, periodLabel} = JSON.parse(decodeURIComponent(raw));
  const elTotal = card.querySelector('.ir-total');
  const elTotalDelta = card.querySelector('.ir-total-delta');
  const rows = card.querySelectorAll('.ir-channel-row');
  const src = mode==='month' && h.month ? h.month : (mode==='week' && h.week ? h.week : h.now);
  const setChan = (row, sideKey, color) => {
    const pct = src[sideKey];
    row.querySelector('.ir-channel-fill').style.width = Math.min(pct,100)+'%';
    row.querySelector('.ir-channel-pct').textContent = pct+'%';
    const dEl = row.querySelector('.ir-channel-delta');
    const sEl = row.querySelector('.ir-channel-spark');
    if (mode==='now'){
      dEl.classList.add('hidden'); sEl.classList.add('hidden');
    } else {
      const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
      const d = pct - (prev[sideKey]||0);
      const dObj = _irDelta(d);
      dEl.className = 'ir-channel-delta '+dObj.cls;
      dEl.textContent = dObj.text;
      const hist = (mode==='week' ? h.week_history : h.month_history)[sideKey] || [];
      const spark = _irSpark(hist, color);
      if (spark){ sEl.classList.remove('hidden'); sEl.innerHTML = _renderSparkSvg(spark); }
      else { sEl.classList.add('hidden'); }
    }
  };
  setChan(rows[0], 'buyer', '#3b82f6');
  setChan(rows[1], 'seller', '#10b981');
  // Общий ИР + дельта
  elTotal.textContent = src.total+'%';
  elTotal.style.color = barColor(src.total);
  if (mode==='now'){
    elTotalDelta.classList.add('hidden');
  } else {
    const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
    const d = src.total - (prev.total||0);
    const dObj = _irDelta(d);
    elTotalDelta.className = 'ir-total-delta '+dObj.cls;
    elTotalDelta.textContent = dObj.text;
    elTotalDelta.classList.remove('hidden');
  }
  // Подпись
  const foot = card.querySelector('.ir-card-foot');
  if (mode==='now') foot.textContent = `Индекс развития · ${periodLabel} · насколько ты на пути к цели`;
  else if (mode==='week') foot.textContent = `Динамика по неделям · последние 4 точки (сегодня — справа)`;
  else {
    if (isPartner && h.salary_review_at){
      const lbl = _monthsAgoLabel(h.salary_review_at);
      foot.textContent = lbl ? `Динамика помесячно · с момента утверждения целей (${lbl})` : `Динамика помесячно · последние 6 месяцев`;
    } else {
      foot.textContent = `Динамика помесячно · последние 6 месяцев`;
    }
  }
};
window.initIrCards=function(root){
  (root||document).querySelectorAll('.ir-card').forEach(card=>{
    if(card._irInited) return; card._irInited=true;
    const tabs=card.querySelectorAll('.ir-tab');
    tabs.forEach(t=>{
      t.addEventListener('click',()=>{ tabs.forEach(x=>x.classList.toggle('active', x===t)); window.applyIrMode(card, t.dataset.mode); });
    });
    window.applyIrMode(card, 'week');
  });
};
