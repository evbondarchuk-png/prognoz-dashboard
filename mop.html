{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }

<style>
 :root{
 /* Поверхности */
 --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef0f4;
 /* Линии и тени */
 --line:#e6e8ee; --line-strong:#d1d5db;
 --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
 --shadow-hover:0 2px 6px rgba(20,30,55,.08),0 10px 32px rgba(20,30,55,.08);
 /* Текст */
 --ink:#1a1f2e; --ink-soft:#3b4358; --muted:#7a8194; --muted-2:#a8aebd; --on-dark:#ffffff;
 /* Бренд */
 --brand:#2b6cb0; --brand-hover:#1f5288; --brand-soft:#eaf2fb;
 /* Семантика воронки */
 --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
 /* Статусы */
 --ok:#16a34a; --ok-bg:#e9f6ec;
 --warn:#d97706; --warn-bg:#fdf3e3;
 --bad:#dc2626; --bad-bg:#fdeaea;
 --nd:#7a8194; --nd-bg:#eef0f4;
 /* ИИ-фиолетовый */
 --ai-purple-bg-1:#f5f3ff; --ai-purple-bg-2:#ede9fe; --ai-purple-line:#ddd6fe;
 --ai-purple-ink:#5b21b6; --ai-purple-ink-strong:#4c1d95;
 /* Скругления */
 --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;
 /* Отступы */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
 /* Типографика */
 --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
 --fs-20:20px; --fs-22:22px; --fs-28:28px;
 --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700; --fw-eb:800;
 /* Прочее */
 --transition:0.15s ease; --max-width:1180px; --app-header-h:56px;
 /* Совместимость со старым кодом (этапы 2-8 уберут) */
 
 }

  /* TZ-A22 §3.3 — единый каркас .hero (алиасы существующих .card + .stat-grid + .stat) */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}
  .hero-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:var(--fs-16);flex-shrink:0}
  .hero-info{flex:1;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
  @media(min-width:620px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
  .hero-stat{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
  .hero-stat-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px}
  .hero-stat-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.2;display:block;margin-top:var(--sp-1)}
  .hero-stat-sub{font-size:var(--fs-11);color:var(--muted);margin-top:2px}

 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:1.5;padding-bottom:24px}
 .app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
 .logo{font-size:var(--fs-16);font-weight:var(--fw-eb);color:var(--brand)} .logo span{color:var(--muted);font-weight:var(--fw-m)}
 .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
 .date-badge{font-size:var(--fs-12);color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:20px}
 .btn{font-size:var(--fs-12);color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
 .btn:hover{border-color:var(--brand);color:var(--brand)}
 /* === Мобильная адаптация === */
 @media(max-width:560px){.container{padding:12px}.rtab{padding:8px 12px;font-size:var(--fs-13)}}
 @media(max-width:480px){.stat-grid,.tiles{grid-template-columns:1fr}}
 .container{max-width:1080px;margin:0 auto;padding:16px}
 @media(min-width:860px){.container{padding:24px 28px}}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
 .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
 @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
 .muted{color:var(--muted);font-size:var(--fs-12)}
 .section-title{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
 .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--r-xl);padding:14px 16px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .soon{background:var(--surface-2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:var(--fs-13)}
 .soon .soon-ic{font-size:var(--fs-28);display:block;margin-bottom:8px}

 /* hero */
 .profile{display:flex;align-items:flex-start;gap:14px}
 .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);font-weight:var(--fw-eb);color:#fff;flex-shrink:0}
 .role-tag{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-b);padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
 .hero-name{font-size:var(--fs-20);font-weight:var(--fw-eb);line-height:1.15}
 .hero-sub{font-size:var(--fs-12);color:var(--muted);margin-top:3px}
 .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
 @media(min-width:620px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
 .stat{background:var(--surface-2);border-radius:10px;padding:12px 14px}
 .stat .s-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb)}
 .stat b{font-size:var(--fs-22);font-weight:var(--fw-eb);display:block;line-height:1.2;margin-top:2px}

 /* TZ-A30 §1: шапка-плитки в кабинетах руководителей */
 .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
 @media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
 .tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;min-height:122px}
 .tile:hover{border-color:var(--brand);box-shadow:0 4px 12px rgba(20,30,55,.08);transform:translateY(-1px)}
 .tile-cap{font-size:var(--fs-11);color:var(--muted);font-weight:600}
 .tile-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.1;margin-top:6px}
 .tile-val .tile-sub-num{font-size:var(--fs-13);color:var(--muted);font-weight:600}
 .tile-sub{font-size:var(--fs-11);color:var(--muted);margin-top:auto;padding-top:8px}
 .tile .chev{position:absolute;top:11px;right:11px;color:var(--muted-2);font-size:12px}
 .tile-spark{margin-top:8px;height:26px;width:100%}
 .tile-bars{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:8px}
 .tile-bars span{flex:1;border-radius:3px 3px 0 0;min-height:3px}
 .tile-seg{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:9px;background:#eef0f4}
 .tile-seg i{display:block;height:100%}
 /* модалка детали */
 .tile-modal{position:fixed;inset:0;background:rgba(20,30,55,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
 .tile-modal.on{display:flex}
 .tile-modal-card{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(20,30,55,.2)}
 .tile-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
 .tile-modal-ttl{font-size:var(--fs-16);font-weight:var(--fw-eb)}
 .tile-modal-close{background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
 .tile-modal-close:hover{color:var(--ink)}
 /* TZ-A30 §1 ред.2 (18.06): плитка ИР разделена на 2 части — недели сверху, месяц снизу */
 .ir-tile-split{display:flex;flex-direction:column;flex:1;margin-top:8px;gap:6px}
 .ir-tile-weeks{padding-bottom:6px;border-bottom:1px dashed var(--line)}
 .ir-tile-weeks-cap{font-size:10px;color:var(--muted-2,#a8aebd);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
 .ir-tile-weeks-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
 .ir-wk-cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 0;text-align:center;font-size:12px;font-weight:var(--fw-eb);min-height:24px}
 .ir-wk-cell.empty{color:var(--muted-2,#a8aebd);font-weight:var(--fw-r)}
 .ir-tile-month{display:flex;flex-direction:column;align-items:center;margin-top:auto;padding-top:4px}
 .ir-tile-month-cap{font-size:10px;color:var(--muted-2,#a8aebd);text-transform:uppercase;letter-spacing:.04em}
 .ir-tile-month-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.1}
 /* TZ-A30 правка 18.06: подписи под каждым столбиком в плитке «Состав по стажу» */
 .bar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;flex:1}
 .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
 .bar-num{font-size:13px;font-weight:var(--fw-eb);color:var(--ink);margin-bottom:2px}
 .bar-track{width:100%;height:30px;display:flex;align-items:flex-end}
 .bar-track span{width:100%;border-radius:3px 3px 0 0;min-height:4px}
 .bar-lbl{font-size:10px;color:var(--muted);margin-top:3px}

 /* TZ-A30: Группа 0 — отдельный блок внизу таба «Команда» */
 .g0-block{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px dashed var(--line)}
 .g0-head{font-size:var(--fs-13);font-weight:var(--fw-eb);color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
 .g0-note{font-size:var(--fs-11);color:var(--muted);background:var(--surface-2);border-radius:var(--r-md);padding:8px 12px;border-left:3px solid #cbd5e1}
 .g0-pill{display:inline-block;font-size:10px;font-weight:var(--fw-eb);background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:8px;padding:1px 7px;margin-left:6px;cursor:help;vertical-align:middle}

 /* верхние табы */
 .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
 .rtab{font-size:var(--fs-14);padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:var(--fw-sb);white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
 .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
 .rtab.on{background:#fff;color:var(--brand);font-weight:var(--fw-b);box-shadow:0 2px 6px rgba(0,0,0,.08)}
 /* карточки команды (TZ-A20) */
 .member-row{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
 .member-row.drill .rr-name{cursor:pointer}.member-row.drill .rr-name:hover{color:var(--brand)}
 .member-row:last-child{margin-bottom:0}
 .member-row-top{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:start}
 .rr-ava{width:48px;height:48px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-14);font-weight:var(--fw-b)}
 .rr-info{min-width:0}.rr-name{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink)}
 .rr-arr{color:var(--muted);font-weight:var(--fw-r);font-size:var(--fs-16)}.rr-meta{font-size:var(--fs-12);color:var(--muted);margin-top:2px}
 .rr-task-btn{background:var(--brand);color:#fff;border:none;font-size:var(--fs-12);font-weight:var(--fw-b);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
 .rr-coach-inline{padding:9px 12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #ddd6fe;border-radius:8px;display:flex;gap:8px;align-items:flex-start;margin-top:10px}
 .rr-ai-i{font-size:var(--fs-13);flex-shrink:0}.rr-ai-t{font-size:var(--fs-12);color:#5b21b6;line-height:1.4;flex:1;min-width:0}.rr-ai-t b{color:#4c1d95}
 .rr-metrics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:13px;padding:11px 12px;background:#fafbfc;border-radius:9px;border:1px solid var(--line)}
 .rr-m{text-align:center}.rr-m-lbl{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:var(--fw-sb);line-height:1.2}
 .rr-m-val{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);margin-top:4px;white-space:nowrap}.rr-m-val small{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-m)}.rr-m-val.v-brand{color:var(--brand)}
 .t-up{color:#16a34a;font-size:var(--fs-12)}.t-down{color:#dc2626;font-size:var(--fs-12)}.t-flat{color:var(--muted);font-size:var(--fs-11)}
 .rr-activity{margin-top:10px;padding:8px 12px;background:linear-gradient(90deg,#fefce8,#fef9c3);border:1px solid #fef08a;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:var(--fs-12);color:#78350f;flex-wrap:wrap}
 .rr-act-i{font-size:var(--fs-14)}.rr-act-item b{color:#451a03;font-weight:var(--fw-b);font-size:var(--fs-13)}.rr-act-sep{color:#a16207}
 .rr-act-clickable{cursor:pointer;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.4)}.rr-act-clickable:hover{background:#fff}.rr-act-arr{font-size:var(--fs-11);color:#a16207;margin-left:3px}
 .risk-badge{font-size:var(--fs-11);font-weight:var(--fw-b);padding:3px 9px;border-radius:20px}
 .rb-ok{background:#dcfce7;color:#166534}.rb-noresult{background:#fee2e2;color:#991b1b}.rb-irdown{background:#fef3c7;color:#92400e}
 .rb-noenter{background:#fee2e2;color:#991b1b}.rb-notask{background:#fef3c7;color:#92400e}.rb-nofc{background:#fecaca;color:#7f1d1d}
 @media(max-width:1080px){.member-row-top{gap:12px}}
 @media(max-width:900px){.rr-metrics-grid{grid-template-columns:repeat(3,1fr)}}
 @media(max-width:560px){.rr-metrics-grid{grid-template-columns:repeat(2,1fr)}}
 .screen{display:none} .screen.on{display:block}

 /* ИР */
 .ir-top{display:flex;align-items:center;gap:18px}
 .ir-big{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1}
 .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
 .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:var(--fs-12);font-weight:var(--fw-sb)}
 /* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
 .ir-card-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
 .ir-card-title{font-size:var(--fs-13);color:var(--muted);font-weight:var(--fw-r)}
 .ir-tabs{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden}
 .ir-tab{padding:4px var(--sp-3);background:transparent;border:none;border-right:1px solid var(--line);font-size:var(--fs-12);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s ease}
 .ir-tab:last-child{border-right:none}
 .ir-tab:hover{color:var(--ink-soft,var(--ink))}
 .ir-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
 .ir-body{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:center}
 .ir-total{font-size:var(--fs-28);font-weight:var(--fw-eb);color:var(--ok);line-height:1;min-width:80px}
 .ir-total-delta{display:block;font-size:var(--fs-12);font-weight:var(--fw-sb);margin-top:2px;height:14px}
 .ir-total-delta.up{color:var(--ok)} .ir-total-delta.down{color:var(--bad)} .ir-total-delta.flat{color:var(--muted)}
 .ir-total-delta.hidden{visibility:hidden}
 .ir-channels{display:flex;flex-direction:column;gap:var(--sp-2)}
 .ir-channel-row{display:grid;grid-template-columns:90px 1fr 50px 30px 70px;gap:var(--sp-2);align-items:center;font-size:var(--fs-12)}
 .ir-channel-name{font-weight:var(--fw-sb);color:var(--ink)}
 .ir-channel-bar{position:relative;height:10px;background:var(--surface-3,var(--line));border-radius:var(--r-pill);overflow:hidden}
 .ir-channel-fill{height:100%;border-radius:var(--r-pill);transition:width .4s ease}
 .ir-channel-fill.buyer{background:var(--buyer,#3b82f6)} .ir-channel-fill.seller{background:var(--seller,#10b981)}
 .ir-channel-pct{text-align:right;font-weight:var(--fw-b);color:var(--ink)}
 .ir-channel-delta{text-align:center;font-size:var(--fs-11);font-weight:var(--fw-sb);white-space:nowrap}
 .ir-channel-delta.up{color:var(--ok)} .ir-channel-delta.down{color:var(--bad)} .ir-channel-delta.flat{color:var(--muted-2)}
 .ir-channel-delta.hidden{visibility:hidden}
 .ir-channel-spark{height:18px;display:block;width:70px}
 .ir-channel-spark.hidden{visibility:hidden}
 .ir-card-foot{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--surface-3,var(--line));font-size:var(--fs-12);color:var(--muted)}
 .bar-bg{height:8px;background:var(--nd-bg);border-radius:5px;overflow:hidden}
 .bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
 .status-badge{font-size:var(--fs-11);padding:3px 10px;border-radius:20px;font-weight:var(--fw-b)}
 .sb-green{background:var(--ok-bg);color:var(--ok)} .sb-yellow{background:var(--warn-bg);color:var(--warn)}
 .sb-red{background:var(--bad-bg);color:var(--bad)} .sb-no_data{background:var(--nd-bg);color:var(--muted)}
 /* TZ-mop-funnel: плашка «не хватает N» на этапе воронки (шкала 70/40) */
 .funnel-gap{display:flex;justify-content:flex-end;margin-top:4px}
 .gap-pill{font-size:var(--fs-11);font-weight:var(--fw-sb);padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap}
 .gap-ok{background:var(--ok-bg);color:var(--ok)} .gap-warn{background:var(--warn-bg);color:var(--warn)} .gap-bad{background:var(--bad-bg);color:var(--bad)}
 .funnel-subhead{font-size:var(--fs-11);color:var(--muted);margin:-2px 0 10px 2px}
 /* TZ-mop-funnel фаза 2: «кто проседает» в раскрытии этапа */
 .gap-list{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
 .gap-list-h{font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
 .gap-row{display:flex;align-items:center;gap:8px;padding:3px 0}
 .gap-name{flex:1;font-size:var(--fs-12);color:var(--brand);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .gap-fp{font-size:var(--fs-11);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
 .gap-more{font-size:var(--fs-11);color:var(--muted);margin-top:4px}

 /* воронка */
 .fs-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
 .fs-title{display:flex;align-items:center;gap:8px}
 .fs-dot{width:10px;height:10px;border-radius:3px}
 .stage-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--buyer));border-radius:12px;padding:12px 14px;margin-bottom:8px}
 .stage-head{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;cursor:pointer}
 .chev{color:var(--muted);font-size:var(--fs-12);transition:transform .2s} .chev.open{transform:rotate(90deg)}
 .stage-seg{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
 .stage-seg.hidden{display:none}
 .seg-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);font-size:var(--fs-11);color:var(--muted)} .seg-row .sv{color:var(--ink);font-weight:var(--fw-sb)}
 .stage-label{font-size:var(--fs-14);font-weight:var(--fw-b)}
 .stage-numbers b{font-weight:var(--fw-eb)}
 .stage-bar{height:10px;background:var(--nd-bg);border-radius:6px;overflow:hidden}
 .stage-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
 .fs-legend{font-size:var(--fs-11);color:var(--muted);margin:-2px 2px 10px;display:flex;gap:14px}
 .fs-legend b{color:var(--ink);font-weight:var(--fw-b)}

 /* список команды */
 .member-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer;min-height:48px;transition:box-shadow .15s}
 .member-card:hover{box-shadow:var(--shadow)}
 .member-card.at-risk{border-left:3px solid var(--bad)}
 .member-card.is-self{background:#f7faff}
 .member-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-12);font-weight:var(--fw-b);flex-shrink:0}
 .member-info{flex:1;min-width:0}
  .member-card .member-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
 .ir-info{display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:10px;cursor:help;margin-left:4px;font-weight:var(--fw-r);vertical-align:middle;background:#fff}
 .ir-info:hover{background:var(--line);color:var(--ink)}
 [data-tip]{position:relative}
 [data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:var(--fw-r);line-height:1.45;white-space:normal;width:340px;max-width:90vw;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;text-align:left}
 [data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1f2937;z-index:9999;pointer-events:none}
 .member-name{font-size:var(--fs-14);font-weight:var(--fw-sb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .member-ir{font-size:var(--fs-14);font-weight:var(--fw-eb);flex-shrink:0}
 .mini-funnel{display:flex;gap:3px;height:6px}
 .mini-stage{flex:1;border-radius:2px}
 .member-arrow{color:var(--muted);flex-shrink:0}
 .newbie-tag{font-size:var(--fs-11);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-left:6px}
 .self-tag{font-size:var(--fs-11);color:var(--brand);border:1px solid var(--brand);border-radius:10px;padding:1px 6px;margin-left:6px}

 /* ИИ */
 .ai-card{background:linear-gradient(135deg,#1e293b 0%,#2b3a52 100%);border-radius:var(--r-xl);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow)}
 .ai-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
 .ai-orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd66b,#f59e0b);box-shadow:0 0 24px rgba(245,158,11,.5);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-22)}
 .ai-h{font-size:var(--fs-14);font-weight:var(--fw-eb)} .ai-h span{color:#ffd66b}
 .ai-text{font-size:var(--fs-14);line-height:1.6;color:#cbd5e1} .ai-text b{color:#ffd66b;font-weight:var(--fw-b)}
 .ai-note{font-size:var(--fs-12);color:#7d8fa8;margin-top:10px}

 /* уведомления/задачи/помощь */
 .notif{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .notif:last-child{border-bottom:none} .notif.unread .ni-title{font-weight:var(--fw-b)}
 .ni-icon{font-size:var(--fs-16)} .ni-title{font-size:var(--fs-13)}
 .tg-title{font-size:var(--fs-12);font-weight:var(--fw-b);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .tg-red{color:var(--bad)} .tg-amber{color:var(--warn)} .tg-gray{color:var(--muted)} .tg-green{color:var(--ok)}
 .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .task:last-child{border-bottom:none} .task-main{flex:1;min-width:0} .task-title{font-size:var(--fs-13);font-weight:var(--fw-sb)}
 .task-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--ok);background:transparent;color:var(--ok);cursor:pointer;font-size:var(--fs-14);flex-shrink:0}
 .task-btn:hover{background:var(--ok-bg)} .task-done{color:var(--ok)}
 .help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:14px}
 .help-btn:hover{background:#fee2e2}
 .add-task-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px dashed #c9cedb;background:var(--surface-2);color:var(--brand);border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:12px}
 .add-task-btn:hover{border-color:var(--brand)}
 .task-skip{background:none;border:none;color:var(--muted);cursor:pointer;font-size:var(--fs-13);font-family:inherit;padding:2px 6px}
 .task-skip:hover{color:var(--bad)}
 .nt-markall{font-size:var(--fs-12);color:var(--brand);font-weight:var(--fw-b);cursor:pointer}
 .f-label{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .f-input,.f-area,.f-select{width:100%;font-size:var(--fs-14);padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:var(--surface)}
 .f-area{min-height:70px;resize:vertical}
 .modal-save{width:100%;padding:14px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:var(--fs-14);font-weight:var(--fw-b);cursor:pointer}
 .modal-save:disabled{opacity:.6}

 /* модалки */
 .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
 .modal-overlay.on{display:flex}
 .modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:20px 18px 28px;max-height:90vh;overflow-y:auto}
 @media(min-width:641px){.modal-overlay{align-items:center}.modal{border-radius:18px}}
 .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
 .modal-title{font-size:var(--fs-16);font-weight:var(--fw-eb)}
 .modal-x{font-size:var(--fs-22);color:var(--muted);cursor:pointer;line-height:1;background:none;border:none}
 .mgr-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border-radius:12px;margin-bottom:14px}
 .mgr-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);font-weight:var(--fw-eb);flex-shrink:0}
 .mgr-topic{padding:11px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-13);display:flex;justify-content:space-between;gap:8px}
 .mgr-topic:last-child{border-bottom:none}

 #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1100;color:var(--muted)}
 #overlay.hidden{display:none}

/* TZ-A22 §3.6/§3.8 — единые кнопки и бейджи (готовы для этапа 5) */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-dark);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-primary:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-secondary:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--bad);background:transparent;color:var(--bad);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-danger:hover:not(:disabled){background:var(--bad-bg)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;cursor:pointer;font-size:var(--fs-14);background:transparent;transition:var(--transition);font-family:inherit}
.btn-icon.ok{color:var(--ok);border-color:var(--ok)} .btn-icon.ok:hover{background:var(--ok-bg)}
.btn-icon.muted{color:var(--muted)} .btn-icon.muted:hover{color:var(--bad)}

.badge{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);line-height:1.2}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-bad{background:var(--bad-bg);color:var(--bad)}
.badge-nd{background:var(--nd-bg);color:var(--nd)}
.badge-info{background:var(--brand-soft);color:var(--brand)}

/* ── TZ-A28: таб «Команда» — таблица партнёров с подтабами ────────── */
.team-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow);margin-bottom:var(--sp-4)}
.team-head{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
.team-h-title{font-size:var(--fs-16);font-weight:var(--fw-eb)}
.team-h-sub{font-size:var(--fs-12);color:var(--muted)}
.team-h-sort{margin-left:auto;font-size:var(--fs-12);color:var(--muted)}
.team-tabs{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-4);padding:var(--sp-1);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);flex-wrap:wrap}
.team-tab{flex:1;min-width:90px;padding:var(--sp-2) var(--sp-3);background:transparent;border:none;border-radius:var(--r-sm);font-size:var(--fs-13);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);white-space:nowrap;font-family:inherit}
.team-tab:hover{color:var(--ink-soft,var(--ink))}
.team-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
.team-panel{display:none} .team-panel.active{display:block}
.scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.team-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-13)}
.team-table th{text-align:right;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-11);font-weight:var(--fw-sb);color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap}
.team-table th:first-child{text-align:left} .team-table th.center{text-align:center}
.team-table td{padding:var(--sp-3);border-bottom:1px solid var(--surface-3,var(--line));vertical-align:middle;text-align:right;white-space:nowrap}
.team-table td:first-child{text-align:left} .team-table td.center{text-align:center}
.team-table tr:last-child td{border-bottom:none}
.team-table tr.t-row{cursor:pointer;transition:.12s}
.team-table tr.t-row:hover td{background:var(--surface-2)}
.t-group-cell{display:flex;align-items:flex-start;gap:var(--sp-3)}
.t-group-avatar{width:36px;height:36px;border-radius:50%;background:#0e7490;color:var(--on-dark,#fff);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:12px;flex-shrink:0;margin-top:2px}
.t-group-info{min-width:0;flex:1}
.t-group-name{font-weight:var(--fw-sb);color:var(--ink);white-space:normal;line-height:1.25}
.t-group-meta{font-size:var(--fs-11);color:var(--muted);margin-top:2px}
.risk-summary{margin-top:6px;font-size:var(--fs-12);line-height:1.4;color:var(--ink);white-space:normal;max-width:420px}
.risk-summary b{color:var(--ink)}
/* Первая ячейка (партнёр + summary) — переносится, остальные — nowrap для аккуратной таблицы */
.team-table td.t-cell-wrap{white-space:normal}
@media (max-width:640px){
  .risk-summary{font-size:var(--fs-11);max-width:none}
  .team-table th,.team-table td{padding:var(--sp-2)}
  .team-table th{font-size:10px}
}
.t-status-bar{display:inline-block;width:4px;height:36px;border-radius:var(--r-pill);background:var(--line-strong);margin-right:var(--sp-2);vertical-align:middle}
.t-status-bar.ok{background:var(--ok)} .t-status-bar.warn{background:var(--warn)} .t-status-bar.bad{background:var(--bad)}
.t-ir{font-size:var(--fs-16);font-weight:var(--fw-eb)}
.t-ir.ok{color:var(--ok)} .t-ir.warn{color:var(--warn)} .t-ir.bad{color:var(--bad)}
.t-pair{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.t-pair-main{font-weight:var(--fw-b);color:var(--ink);font-size:var(--fs-13)}
.t-pair-sub{font-size:var(--fs-11);color:var(--muted)}
.t-pct{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:var(--fw-b)}
.t-pct.ok{background:var(--ok-bg);color:var(--ok)} .t-pct.warn{background:var(--warn-bg);color:var(--warn)} .t-pct.bad{background:var(--bad-bg);color:var(--bad)}
.t-arrow{color:var(--muted-2,var(--muted));font-size:var(--fs-16)}
.status-badge-team{display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:var(--fw-b);white-space:nowrap}
.status-badge-team.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);gap:3px}
.status-badge-team.ok::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status-badge-team.w1{background:#fef9c3;color:#854d0e;border:1px solid #facc15}
.status-badge-team.w2{background:#fff7ed;color:#9a3412;border:1px solid #fb923c}
.status-badge-team.w3{background:#fef2f2;color:#ef4444;border:1px solid #ef4444}
.status-badge-team.w4{background:#fee2e2;color:#991b1b;border:1px solid #991b1b}
.status-badge-team.newbie{background:#dcfce7;color:#166534;border:1px solid #86efac}
.status-badge-team.g0{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.wk-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.wk-pill{display:inline-block;font-size:11px;font-weight:var(--fw-sb);padding:2px 8px;border-radius:10px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.wk-pill.bad{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.t-status-bar.bad{background:var(--bad)}
.t-traffic{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:var(--r-pill);font-size:10px;font-weight:var(--fw-sb);margin-left:4px;white-space:nowrap;line-height:1.4;vertical-align:middle}
.t-traffic-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.zone-dark-green{background:#dcfce7;color:#166534} .zone-dark-green .t-traffic-dot{background:#16a34a}
.zone-green{background:#ecfdf5;color:#15803d} .zone-green .t-traffic-dot{background:#22c55e}
.zone-yellow{background:#fef9c3;color:#854d0e} .zone-yellow .t-traffic-dot{background:#eab308}
.zone-orange{background:#ffedd5;color:#9a3412} .zone-orange .t-traffic-dot{background:#f97316}
.zone-red{background:#fee2e2;color:#991b1b} .zone-red .t-traffic-dot{background:#dc2626}
.month-cell{font-weight:var(--fw-b);text-align:center;border-radius:var(--r-sm)}
.month-cell.ok{background:var(--ok-bg);color:var(--ok)}
.month-cell.warn{background:#fef9c3;color:#854d0e}
.month-cell.bad{background:var(--bad-bg);color:var(--bad)}
.month-cell.current{outline:2px solid var(--brand);outline-offset:-2px}
.month-cell.no_data{color:var(--muted-2,var(--muted));font-weight:var(--fw-r)}
.month-spark{height:30px;display:block;margin:0 auto}
.month-trend{font-size:var(--fs-11);color:var(--muted);margin-top:2px;text-align:center}
.month-trend.ok{color:var(--ok)} .month-trend.warn{color:var(--warn)} .month-trend.bad{color:var(--bad)} .month-trend.flat{color:var(--muted)}

/* ── TZ-A26: трёхчастная полоса факт/прогноз/план ─────────────────── */
.funnel-stage{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--sp-3);margin-bottom:var(--sp-2)}
/* Парная сетка: каждая строка покупателя выровнена со строкой продавца */
.funnel-grid-paired{display:grid;grid-template-columns:1fr;gap:8px 14px;align-items:stretch;margin-top:8px}
@media(min-width:860px){.funnel-grid-paired{grid-template-columns:1fr 1fr}}
.funnel-grid-paired .row-stage{display:flex;flex-direction:column}
.funnel-grid-paired .row-stage>.funnel-stage{flex:1;margin-bottom:0}
.funnel-stage.s-done{border-left-color:var(--ok)}
.funnel-stage.s-forecast{border-left-color:var(--gold)}
.funnel-stage.s-pending{border-left-color:var(--line-strong)}
.funnel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:wrap}
.funnel-label{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);display:flex;align-items:baseline;gap:var(--sp-2);flex:0 1 auto;min-width:0}
.funnel-hint{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--muted)}
.fp-numbers{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-12);flex-wrap:wrap;justify-content:flex-end;white-space:nowrap;flex-shrink:1;max-width:100%}
.fp-num-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-num-forecast{color:var(--gold);font-weight:var(--fw-sb)}
.fp-num-plan{color:var(--muted);font-weight:var(--fw-sb)}
.fp-num-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:lowercase;margin-right:2px}
.fp-num-sep{color:var(--muted-2);margin:0 2px}
.fp-num-sep{color:var(--muted-2)}
.fp-bar{position:relative;height:20px;background:var(--surface-3);border-radius:var(--r-xs);overflow:visible;display:flex}
.fp-bar.sm{height:16px;background:var(--line);border:1px solid var(--line-strong)}

<script type="module">
import { requireAuth, logout } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';
import { mountCalendar, openTaskDetail } from './calendar.js';
import { initAssistant } from './assistant.js?v=1';
import { initConnect, refreshConnect } from './connect.js?v=1';
import { initNav } from './nav.js?v=6';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const STC={green:'#16a34a',yellow:'#d97706',red:'#dc2626',no_data:'#cbd0db'};
const SIDE_COLOR={buyer:'#3b82f6',seller:'#10b981'};
const CTX={data:null,target:null,me:null,role:null};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }
function heroRevenueBar(a){
 if(!a||!a.buyer||!a.seller) return '';
 const bs=(a.buyer.stages||[]).find(s=>s.key==='revenue')||{};
 const ss=(a.seller.stages||[]).find(s=>s.key==='revenue')||{};
 const fact=(bs.fact||0)+(ss.fact||0);
 const plan=(bs.plan||0)+(ss.plan||0);
 const fcB=bs.forecast!=null?bs.forecast:bs.fact||0;
 const fcS=ss.forecast!=null?ss.forecast:ss.fact||0;
 const forecast=(bs.forecast!=null||ss.forecast!=null)?(fcB+fcS):null;
 if(!plan) return '';
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 const stage={label:'Валовая выручка',hint:'за месяц',fact,plan,forecast,fact_label:fmt(fact)+' ₽',plan_label:fmt(plan)+' ₽',forecast_label:forecast!=null?fmt(forecast)+' ₽':null};
 // renderStage уже отрисует: заголовок слева, факт/прогноз/план справа сверху, полосу ниже.
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}
// Прогноз вала на следующие месяцы (пул в работе, горизонт ~1,5–2 мес) — в стиле плашки этапа воронки.
function fcHero(fc){
 if(!fc || !fc.next_month) return '';
 const nm=fc.next_month;
 const now=new Date(); const next=new Date(now.getFullYear(), now.getMonth()+1, 1);
 const monthNames=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
 const lbl=monthNames[next.getMonth()]+' '+next.getFullYear();
 const target=Number(nm.target_revenue)||0;
 const fcst=Number(nm.revenue_total)||0;
 const fmt=n=>{ const a=Math.abs(n); if(a>=1000000)return (n/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000)return Math.round(n/1000)+'к'; if(a>=1000)return (n/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(n)); };
 // В прогнозе след.мес факта ещё нет (новый месяц не наступил). fact=0, forecast=полный прогноз, plan=target.
 const mLbl=lbl.split(' ')[0];
 const hint=target>0?('задатки и горячие в работе · план '+mLbl+' '+fmt(target)+' ₽'):'задатки и горячие в работе';
 const stage={label:'Прогноз вала на следующие месяцы',hideFact:true,hint:hint,fact:0,plan:target,forecast:fcst,fact_label:'0 ₽',plan_label:target>0?fmt(target)+' ₽':'—',forecast_label:fcst>0?fmt(fcst)+' ₽':'—'};
 return `<div style="margin-top:12px">${renderStage(stage)}</div>`;
}

window.showTab=(id,btn)=>{
 if(window.ymTab)ymTab(id);
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
 document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('on'));
 document.getElementById('screen-'+id).classList.add('on'); btn.classList.add('on');
 window.scrollTo(0,0);
 if(window.__markT){clearTimeout(window.__markT);window.__markT=null;}
 if(id==='tasks'){ window.__markT=setTimeout(()=>{ const u=CTX.data&&CTX.data.notifications&&CTX.data.notifications.unread_count; if(u>0) window.markAllRead(true); },2000); }
 if(id==='planning' && !window.__planningLoaded){ window.__planningLoaded=true; window.loadPlanning&&window.loadPlanning(); }
};
window.goTab=(id)=>{ const b=document.querySelector(`.rtab[data-tab="${id}"]`); if(b) window.showTab(id,b); };
// Отчёт по группе — тот же отчёт, что видит РОП по своим менеджерам (session-report.html?level=mop),
// открываем в новой вкладке своим текущим кодом группы (CTX.target — свой код, либо код
// менеджера, если РОП зашёл сюда через mop.html?mop=). Печать/PDF уже есть внутри отчёта.
window.openGroupReport=()=>{ window.open('session-report.html?level=mop&code='+encodeURIComponent(CTX.target),'_blank'); };
window.openMember=(code)=>{ if(window.__analytics) window.__analytics.track('drilldown',{target:'index?agent='+code}); location.href='index.html?agent='+encodeURIComponent(code); };
window.closeModal=(id)=>document.getElementById(id).classList.remove('on');
window.completeTask=async(id,ev)=>{
 if(ev)ev.stopPropagation();
 const btn = ev && ev.target && ev.target.closest && ev.target.closest('button');
 const row = ev && ev.target && ev.target.closest && ev.target.closest('.list-row, .task');
 if(btn){ btn.disabled=true; btn.textContent='…'; }
 try{
  await window.__call('updateTaskStatus',{task_id:id,status:'done'});
  if(row){ row.style.transition='opacity .2s'; row.style.opacity='0'; setTimeout(()=>row.remove(), 250); }
 }catch(e){ alert('Не удалось: '+(e.message||e)); if(btn){btn.disabled=false;btn.textContent='✓';} }
};
window.skipTask=async(id,ev)=>{

function _spark(values,color){
 const arr=(values||[]).filter(v=>typeof v==='number');
 if(arr.length<2) return '';
 const N=arr.length, max=Math.max(...arr,1);
 const W=120,H=26;
 const pts=arr.map((v,i)=>[((W/(N-1))*i).toFixed(1),(H-2-(v/max)*(H-4)).toFixed(1)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
 const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="${color}"/>`).join('');
 return `<svg class="tile-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
}
function _stazhBars(members, scope, dist){
 let s72=0,s48=0,s0=0;
 if (dist && typeof dist === 'object' && (dist.total||0) > 0) {
   s72 = dist.s6plus || 0;
   s48 = dist.s4_6 || 0;
   s0  = dist.s0_3 || 0;
 } else if (scope === 'группы') {
   (members||[]).forEach(m=>{
     if (m.is_self) return;
     const v=typeof m.stazh_months==='number'?m.stazh_months:0;
     if(v>=6) s72++; else if(v>=4) s48++; else s0++;
   });
 } else {
   const col=(c,label)=>`<div class="bar-col"><div class="bar-num" style="color:var(--muted-2,#a8aebd)">—</div><div class="bar-track"><span style="height:6px;background:${c};opacity:.3"></span></div><div class="bar-lbl">${label}</div></div>`;
   return {html:`<div class="bar-grid">${col('var(--brand)','6+')}${col('var(--muted-2,#a8aebd)','4–6')}${col('var(--ok)','0–3')}</div>`, s72:0, s48:0, s0:0};
 }
 const mx=Math.max(s72,s48,s0,1);
 const col=(v,c,label)=>`<div class="bar-col"><div class="bar-num">${v}</div><div class="bar-track"><span style="height:${Math.max(6,Math.round(v/mx*100))}%;background:${c}"></span></div><div class="bar-lbl">${label}</div></div>`;
 return {html:`<div class="bar-grid">${col(s72,'var(--brand)','6+')}${col(s48,'var(--muted-2,#a8aebd)','4–6')}${col(s0,'var(--ok)','0–3')}</div>`, s72, s48, s0};
}
function _tasksStat(tasks){
 // считаем задачи: всего / выполнено за месяц / просрочено.
 // d.tasks = { groups:{today,week,later,expired,done_recent}, counts:{} }.
 const g = (tasks && tasks.groups) || {};
 const today=g.today||[], week=g.week||[], later=g.later||[], expired=g.expired||[], done=g.done_recent||[];
 const total = today.length+week.length+later.length+expired.length+done.length;
 return { total, done: done.length, overdue: expired.length };
}
function renderTiles(o){
 // ── ПЛИТКА 1: ИР разделена на 2 части (TZ-A30, правка Егора 18.06):
 //   сверху — 4 ячейки по неделям месяца (только завершённые), снизу — месячный ИР.
 const today=new Date();
 const dayN=today.getDate();
 // граничные дни: 7, 14, 21, последний день месяца → сколько завершённых недель
 const lastDay=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
 const completedWeeks=dayN>lastDay?4:dayN>21?3:dayN>14?2:dayN>7?1:0;
 // Текущая (незакрытая) неделя = следующая после завершённых. 4 = месяц закрыт (нет текущей).
 const currentWeekIdx = completedWeeks < 4 ? completedWeeks : -1;
 // Завершённые: берём последние completedWeeks значений из истории (это точки -21,-14,-7,today).
 const wk=(o.irWeekly||[]).slice(-completedWeeks||0);
 // Текущий динамический недельный ИР — из ir_v2_week_total агрегата (для группы/отдела/компании).
 const irCurWeek = (typeof o.irCurrentWeek === 'number') ? o.irCurrentWeek : null;
 const cellW=(v,state)=>{
  // state: 'closed' | 'current' | 'empty'
  if(state==='empty' || v==null) return `<div class="ir-wk-cell empty">—</div>`;
  const c=v>=70?'var(--ok)':v>=50?'var(--warn)':'var(--bad)';
  const tip = state==='current' ? ' title="Текущая неделя — динамический ИР, закроется в конце недели"' : '';
  const badge = state==='current' ? `<div style="font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.05em">СЕЙЧАС</div>` : '';
  return `<div class="ir-wk-cell"${tip} style="color:${c}">${v}%${badge}</div>`;
 };
 let weekRow='';
 for(let i=0;i<4;i++){
  if(i<completedWeeks)      weekRow+=cellW(wk[i], 'closed');
  else if(i===currentWeekIdx) weekRow+=cellW(irCurWeek, irCurWeek==null?'empty':'current');
  else                      weekRow+=cellW(null, 'empty');
 }
 const irMonth=typeof o.irMonth==='number'?o.irMonth:o.irValue;
 const irMonthClr=_irMonthColor(irMonth);

 // ── ПЛИТКА 2: вверху — ИР ≥70%, снизу — план по валу с учётом прогноза
 const perfTotal=o.perfTotal||1;
 const perfPct=Math.round((o.perf/perfTotal)*100);
 const perfClr=perfPct>=50?'var(--ok)':perfPct>=25?'var(--warn)':'var(--bad)';
 // план по валу с учётом прогноза — членов где forecast_month >= plan_month
 const _mems = (o.teamMembers||[]).filter(m=>!m.is_self);
 let revOk=0, revTotal=0;
 _mems.forEach(m=>{
  const plan=Number(m.plan_month)||0;
  if(plan<=0) return;
  revTotal++;
  const fc=Number(m.forecast_month)||0;
  if(fc>=plan) revOk++;
 });
 const revPct = revTotal? Math.round((revOk/revTotal)*100):0;
 const revClr = revPct>=50?'var(--ok)':revPct>=25?'var(--warn)':'var(--bad)';

 // ── ПЛИТКА 3: подписи теперь под каждым столбиком
 const stazh=_stazhBars(o.teamMembers, o.scope, o.stazhDist);

 const tasksS=_tasksStat(o.tasks);
 const taskDonePct=tasksS.total?Math.round((tasksS.done/tasksS.total)*100):0;
 return `<div class="tiles">
  <div class="tile" onclick="openTileModal('ir')"><span class="chev">›</span>
   <div class="tile-cap">ИР ${esc(o.scope)} · ${esc(_monthShort())}</div>
   <div class="ir-tile-split">
    <div class="ir-tile-weeks">
     <div class="ir-tile-weeks-cap">по неделям</div>
     <div class="ir-tile-weeks-row">${weekRow}</div>
    </div>
    <div class="ir-tile-month">
     <div class="ir-tile-month-cap">месяц</div>
     <div class="ir-tile-month-val" style="color:${irMonthClr}">${irMonth}%</div>
    </div>
   </div></div>
  <div class="tile" onclick="openTileModal('perf')"><span class="chev">›</span>
   <div class="tile-cap">Выполняют ИР ≥ 70%</div>
   <div class="tile-val">${o.perf} <span class="tile-sub-num">из ${perfTotal}</span></div>
   <div class="tile-seg"><i style="width:${perfPct}%;background:${perfClr}"></i></div>
   <div class="tile-cap" style="margin-top:8px">Выполняют план по валу <span class="muted" style="font-weight:var(--fw-r)">(с прогнозом)</span></div>
   <div class="tile-val">${revOk} <span class="tile-sub-num">из ${revTotal}</span></div>
   <div class="tile-seg"><i style="width:${revPct}%;background:${revClr}"></i></div></div>
  <div class="tile" onclick="openTileModal('stazh')"><span class="chev">›</span>
   <div class="tile-cap">Состав по стажу <span class="muted" style="font-weight:var(--fw-r)">· мес</span></div>
   ${stazh.html}
   <div class="tile-sub"></div></div>
  <div class="tile" onclick="openTileModal('tasks')"><span class="chev">›</span>
   <div class="tile-cap">Задачи за месяц</div>
   <div class="tile-val">${tasksS.done} <span class="tile-sub-num">из ${tasksS.total}</span></div>
   <div class="tile-seg"><i style="width:${taskDonePct}%;background:var(--ok)"></i></div>
   <div class="tile-sub">${taskDonePct}% выполнено${tasksS.overdue?` · ${tasksS.overdue} просрочено`:''}</div></div>
 </div>`;
}

/* TZ-mop-funnel фаза 2: «кто проседает» — список членов команды по разрыву на этапе.
   Ключ этапа агрегата (st.key: flow/hot/deposits/objects) + сторона → ключ в card.stages. */
const MEMKEY={buyer:{flow:'flow',hot:'hot_buyer',deposits:'dep_buyer'},seller:{objects:'objects',hot:'hot_seller',deposits:'dep_seller'}};
function stageGapList(side,st,members){
 const mk=st.key&&MEMKEY[side]?MEMKEY[side][st.key]:null;
 if(!mk||!members||!members.length) return '';
 const rows=[];
 members.forEach(m=>{
  const s=m.stages&&m.stages[mk]; if(!s) return;              // без плана — не показываем

// Правило-based summary для панели «В риске (неделя)».
// Учитывает: длину стрика + сохраняет ли партнёр свой средний доход.
// «Держит уровень» = прогнозный доход тек.мес ≥ 80% исторического среднего.
// В этом случае формулировка мягче: «план завышен относительно обычного темпа».
function riskWeekSummary(m){
  const streak = m.weeks_in_risk_streak || 0;
  const forecastInc = m.income_forecast_current || 0;
  const avgInc = m.avg_monthly_income || 0;
  const kFmt = v => Math.round(v/1000) + 'к';
  const holds = avgInc > 0 && forecastInc >= avgInc * 0.8;
  const wLabel = streak >= 3 ? `${streak} нед подряд` : streak === 2 ? '2 нед подряд' : '1 неделя';
  if (avgInc === 0) {
    return `${wLabel} ниже плана. Исторических данных о доходе пока мало — понаблюдать.`;
  }
  if (holds) {
    if (streak >= 3) return `${wLabel} не выполняет план, <b>но держит средний доход ~${kFmt(avgInc)}₽</b>. План выше обычного темпа — обсудить приоритет: рост или стабильность.`;
    if (streak === 2) return `${wLabel} ниже плана, но <b>доход держит на уровне ~${kFmt(avgInc)}₽</b>. Понаблюдать ещё неделю.`;
    return `Одна плохая неделя, <b>доход на уровне ~${kFmt(avgInc)}₽</b>. Возможен разовый спад.`;
  }
  if (streak >= 3) return `${wLabel} ниже плана, <b>доход просел до ${kFmt(forecastInc)}₽</b> (обычно ${kFmt(avgInc)}₽). Разобрать причину лично.`;
  if (streak === 2) return `${wLabel} ниже плана, <b>доход снижается до ~${kFmt(forecastInc)}₽</b> (норма ${kFmt(avgInc)}₽). Уточнить, что мешает.`;
  return `Одна плохая неделя, <b>доход снизился до ~${kFmt(forecastInc)}₽</b> (норма ${kFmt(avgInc)}₽). Уточнить активность.`;
}

function _trendSpark(hist){

  if(vals.length<2) return `<div class="month-trend">—</div>`;
  const first=vals[0], last=vals[vals.length-1]; const delta=last-first;
  const color=delta>=-5?'#16a34a':delta>=-15?'#d97706':'#dc2626';
  const cls=delta>=-5?'flat':delta>=-15?'warn':'bad';
  const xs=[6,23,40,57,74,92];
  const pts=hist.map((p,i)=>p.ir_pct!=null?`${xs[i]},${30-(p.ir_pct/100)*25+5}`:null).filter(Boolean).join(' ');

  const lx=xs[lastIdx]; const ly=30-((hist[lastIdx]?.ir_pct||0)/100)*25+5;

  return `<svg class="month-spark" viewBox="0 0 100 30" preserveAspectRatio="none">
    <line x1="0" y1="6" x2="100" y2="6" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 3"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>

}

// нигде не видел и не мог ввести дробное «3.4 заявки».
function mpCellVal(monthRow,side,seg,metric){
 const dk=mpDirtyKey(monthRow.ym,side,seg,metric);
 if(MP.dirty.hasOwnProperty(dk)) return MP.dirty[dk];
 const src=monthRow[side]&&monthRow[side][seg];
 const v=src&&src[metric];
 return v!=null?Math.round(v):0;
}

 const v=el.value===''?0:Math.round(Number(el.value));
 MP.dirty[mpDirtyKey(ym,side,seg,metric)]=isFinite(v)?v:0;
};
// Правка «Итого по всем сегментам» (Поток/Остаток или Горячих) — раскидываем
// новую сумму по сегментам ПРОПОРЦИОНАЛЬНО их текущему весу (решение Егора
// 19.08.2026): вес берём из текущих (уже применённых правок, если есть)
// значений сегментов, не из формулы заново. Если сейчас везде 0 — делим
// поровну. Остаток от округления — по методу наибольшего остатка, чтобы
// сумма сегментов ровно сошлась с введённым числом.
window.mpRedistribute=function(ym,side,metric,rawValue){
 const newTotal=Math.max(0,Math.round(Number(rawValue)||0));
 const segs=mpSegsFor(side);
 const monthRow=(MP.plan&&MP.plan.months||[]).find(m=>m.ym===ym);
 if(!monthRow) return;
 const current=segs.map(s=>mpCellVal(monthRow,side,s.key,metric));
 const currentTotal=current.reduce((s,v)=>s+v,0);
 const weights=currentTotal>0?current.map(v=>v/currentTotal):segs.map(()=>1/segs.length);
 const raw=weights.map(w=>newTotal*w);
 const floors=raw.map(Math.floor);
 let remainder=newTotal-floors.reduce((s,v)=>s+v,0);
 const order=raw.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
 const result=floors.slice();
 for(let k=0;k<remainder && k<order.length;k++) result[order[k].i]++;
 segs.forEach((s,i)=>{ MP.dirty[mpDirtyKey(ym,side,s.key,metric)]=result[i]; });
 renderMpPanel();
};

/* TZ-A26: утилиты трёхчастной воронки */
// Нормализация: для не-revenue этапов (целочисленные fact/plan) округляем до целых,
// чтобы % считался по тем же числам, что в подписи (не 1/1.886=53%, а 1/2=50%).
function _normNum(v,isInt){ if(v==null) return v; return isInt?Math.round(v):v; }
function calcStatus(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ return fact>0?'s-done':'s-pending'; }
  const f=(fact/plan)*100; if(f>=100) return 's-done';
  if(forecast!=null){ const fc=(forecast/plan)*100; if(fc>=100) return 's-forecast'; }
  return 's-pending';
}
function calcBarPercents(fact,forecast,plan,isRev){
  const isInt=!isRev; fact=_normNum(fact,isInt); plan=_normNum(plan,isInt); forecast=_normNum(forecast,isInt);
  if(!plan||plan===0){ if(fact>0) return {factPct:100,factPctVisual:100,forecastPctTotal:100,forecastDeltaPct:0,forecastDeltaPctVisual:0,noPlan:true}; return {factPct:0,factPctVisual:0,forecastPctTotal:0,forecastDeltaPct:0,forecastDeltaPctVisual:0}; }
  const factPct=Math.round((fact/plan)*100);
  let forecastPctTotal=factPct, forecastDeltaPct=0;
  if(forecast!=null && forecast>fact){ forecastPctTotal=Math.round((forecast/plan)*100); forecastDeltaPct=forecastPctTotal-factPct; }
  // Полоса визуально cap'ится на 100%.
  // Особый случай для revenue: если факт+прогноз > 100% плана (перевыполнение с прогнозом),
  // то полосу делим пропорционально fact:forecastDelta — чтобы оранжевая зона была видна
  // соизмеримо своему размеру (а не зажата в остатке от 100).
  let factPctVisual,forecastDeltaPctVisual;
  const totalPct=factPct+forecastDeltaPct;
  if(isRev && totalPct>100 && forecastDeltaPct>0){
    factPctVisual=Math.round(factPct/totalPct*100);
    forecastDeltaPctVisual=100-factPctVisual;
  } else {
    factPctVisual=Math.min(factPct,100);
    forecastDeltaPctVisual=Math.max(0, Math.min(forecastDeltaPct, 100-factPctVisual));
  }
  return {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual};
}
function tooltipFact(factLabel,factPct,planLabel,isRev){
  if(!isRev && factPct>=100){ return `факт ${factLabel} — план ${planLabel} выполнен на 100%`; }
  return `факт ${factLabel} — ${factPct}% от плана ${planLabel}`;
}
function tooltipForecast(forecastLabel,forecastPctTotal,planLabel,forecastDeltaPct){ return `прогноз ${forecastLabel} — +${forecastDeltaPct}% к плану ${planLabel} (итого ${forecastPctTotal}%)`; }
function renderFpBar(stage,opts){
  opts=opts||{};
  const {fact,fact_label,forecast,forecast_label,plan,plan_label,is_revenue}=stage;
  if(fact==null && plan==null){
    return `<div class="fp-bar-wrap"><div class="fp-bar" data-tooltip="нет данных по этому этапу"></div><div class="fp-bar-outside"><span class="o-nd">— нет данных</span></div></div>`;
  }
  const _p=calcBarPercents(fact,forecast,plan,is_revenue); const {factPct,factPctVisual,forecastPctTotal,forecastDeltaPct,forecastDeltaPctVisual}=_p;
  if(_p.noPlan){ const tt=`факт ${fact_label} — плана нет`; return `<div class="fp-bar${opts.compact?' sm':''}" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:100%">факт ${fact_label}</div></div>`; }
  const smClass=opts.compact?' sm':'';
  if(factPct===0 && forecastDeltaPct===0){
    const tt=tooltipFact(fact_label,0,plan_label);
    return `<div class="fp-bar${smClass} zero-fact" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:0%"></div></div>`;
  }
  // Узкая зона = по визуальной ширине, иначе число «153%» в маленьком блоке не вылезает за границу.
  const factNarrow=factPctVisual>0 && factPctVisual<12;
  const forecastNarrow=forecastDeltaPctVisual>0 && forecastDeltaPctVisual<12;
  const factTt=factPct>0?tooltipFact(fact_label,factPct,plan_label,is_revenue):null;
  const forecastTt=forecastDeltaPct>0?tooltipForecast(forecast_label,forecastPctTotal,plan_label,forecastDeltaPct):null;
  // Подпись внутри блока: для revenue — реальный % (даже 259%), для остальных — cap 100%.
  const factLbl=is_revenue?factPct:factPctVisual;
  const fcDeltaLbl=is_revenue?forecastDeltaPct:forecastDeltaPctVisual;
  const factDiv=factPctVisual>0?`<div data-tooltip="${esc(factTt)}" class="fp-bar-fact${factNarrow?' narrow':''}" style="width:${factPctVisual}%">${factLbl}%</div>`:'';
  const forecastDiv=forecastDeltaPctVisual>0?`<div data-tooltip="${esc(forecastTt)}" class="fp-bar-forecast${forecastNarrow?' narrow':''}" style="width:${forecastDeltaPctVisual}%">+${fcDeltaLbl}%</div>`:'';
  const containerTt=factTt||forecastTt||'нет данных';
  const bar=`<div class="fp-bar${smClass}" data-tooltip="${esc(containerTt)}">${factDiv}${forecastDiv}</div>`;
  // «N% от плана» под полосой убрано — % выполнения теперь в шапке (факт/план/%).
  // Внешне оставляем только прогноз (revenue) для узкого блока.
  if(forecastNarrow){
    return `<div class="fp-bar-wrap">${bar}<div class="fp-bar-outside"><span class="o-forecast">+${forecastDeltaPct}%</span><span class="o-lbl">прогноз</span></div></div>`;
  }
  return bar;
}
function renderStage(stage){
  const {label,hint,fact_label,forecast,forecast_label,plan_label,fact,plan,is_revenue}=stage;
  const status=calcStatus(fact,forecast,plan,is_revenue);
  const hintHtml=hint?`<span class="funnel-hint">${esc(hint)}</span>`:'';
  // hideFact — для fcHero (прогноз на будущие месяцы: факта не бывает, «факт 0 ₽» убираем)
  const factPart = stage.hideFact ? '' : `<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span>`;
  let numbers;
  // TZ-A26 уточнение: прогноз = ПРИРАЩЕНИЕ (forecast - fact, «+X к»), не итог.
  // Если приращения нет (forecast == fact или null) — показываем только факт и план.
  const showForecast = forecast!=null && forecast > fact;
  if(showForecast){
    const fmtDelta=(d)=>{ const a=Math.abs(d); if(a>=1000000) return (d/1000000).toFixed(1).replace('.',',')+' млн'; if(a>=10000) return Math.round(d/1000)+'к'; if(a>=1000) return (d/1000).toFixed(1).replace('.',',')+' тыс'; return String(Math.round(d)); };
    const deltaLabel='+'+fmtDelta(forecast - fact);
    const totalLabel=fmtDelta(forecast);
    const u = is_revenue ? ' ₽' : '';
    numbers=`${factPart}<span><span class="fp-num-lbl">прогноз</span><span class="fp-num-forecast">${esc(deltaLabel)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">итого</span><span style="color:#374151;font-weight:var(--fw-b)">${esc(totalLabel + u)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  } else {
    const _pR=Math.round(Number(plan)||0);
    let _pctT='', _pctColor='var(--ink)';
    if(_pR>0){ const _pv=(Number(fact)||0)/_pR*100; let _p=Math.round(_pv); if(!is_revenue)_p=Math.min(100,_p); _pctT=_p+'%'; _pctColor=_pv>=70?'var(--ok)':_pv>=40?'var(--warn)':'var(--bad)'; }
    const _pctSpan=_pctT?`<span class="fp-num-sep">/</span><span style="color:${_pctColor};font-weight:var(--fw-b)">${_pctT}</span>`:'';
    numbers=`${factPart}<span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>${_pctSpan}`;
  }
  let gapHtml='';
  if(stage.showGap && !is_revenue){
    const pRaw=Number(plan)||0, fRaw=Number(fact)||0, planRound=Math.round(pRaw);
    if(planRound>0){
      const pct=(fRaw/planRound)*100;
      if(pct<100){
        const gap=Math.max(0, planRound-Math.round(fRaw));
        if(gap>0){ const cls=pct>=70?'gap-ok':pct>=40?'gap-warn':'gap-bad'; gapHtml=`<div class="funnel-gap"><span class="gap-pill ${cls}">не хватает ${gap}</span></div>`; }
      }
    }
  }
  return `<div class="funnel-stage ${status}"><div class="funnel-head"><div class="funnel-label">${esc(label)} ${hintHtml}</div><div class="fp-numbers">${numbers}</div></div>${gapHtml}${renderFpBar(stage)}</div>`;
}

/* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
function _irDelta(d){ d=Math.round(d); if(d>=1)return {text:'▲+'+d,cls:'up'}; if(d<=-1)return {text:'▼'+d,cls:'down'}; return {text:'≈',cls:'flat'}; }
function _irSpark(values,color){
  const arr=(values||[]).filter(v=>v!=null);
  if(arr.length<2) return null;
  const N=arr.length;
  // X-координаты: равномерно по 4 или 6
  const baseX={4:[3,22,41,67], 6:[3,16,29,42,55,67]};
  const xs = baseX[N] || Array.from({length:N},(_,i)=>3+i*(64/(N-1)));
  const points = arr.map((v,i)=>{ const y=18-(v/100)*16; return `${xs[i]},${y.toFixed(1)}`; }).join(' ');
  const dots = arr.slice(0,-1).map((v,i)=>[xs[i], 18-(v/100)*16]);
  const last = [xs[xs.length-1], 18-(arr[arr.length-1]/100)*16];
  return { points, color, dots, last };
}
function _renderSparkSvg(spark){
  if(!spark) return '';
  const dots = spark.dots.map(([x,y])=>`<circle cx="${x}" cy="${y.toFixed(1)}" r="1.3" fill="${spark.color}" opacity=".4"/>`).join('');
  return `<polyline points="${spark.points}" fill="none" stroke="${spark.color}" stroke-width="1.5"/>${dots}<circle cx="${spark.last[0]}" cy="${spark.last[1].toFixed(1)}" r="2" fill="${spark.color}"/>`;
}
function _monthLabel(){ const d=new Date(); const m=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']; return m[d.getMonth()]+' '+d.getFullYear(); }
function _monthsAgoLabel(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr); if(isNaN(d)) return null;
  const today=new Date(); const ms=today-d;
  const months = Math.max(1, Math.round(ms/(30*24*3600*1000)));
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}, ${months} мес назад`;
}
const IR_TIP_MAIN_AGG = 'Индекс развития группы — насколько команда выполняет план. 100% = все четыре направления работы (поток, горячие, задатки, валовая выручка) на плане. Среднее по партнёрам.';
const IR_TIP_SIDE_AGG = 'недельный ИР стороны: avg((C1.side + C2.side + C3 + C4)/4) по партнёрам.';
const IR_TIP_TABLE = 'недельный ИР v2 партнёра: (C1+C2+C3+C4)/4, cap 100%.';
function renderIrCard(opts){
  // opts: { ir_history, isPartner, periodLabel }
  const h=opts.ir_history;
  if(!h || !h.now) return ''; // нет данных
  const periodLabel=opts.periodLabel||_monthLabel();
  const dataAttr = encodeURIComponent(JSON.stringify({h, isPartner:!!opts.isPartner, periodLabel}));
  return `<div class="card ir-card" data-ir="${dataAttr}">
    <div class="ir-card-head">
      <div class="ir-card-title">Индекс развития · ${esc(periodLabel)}<span class="ir-info" data-tip="${esc(IR_TIP_MAIN_AGG)}">?</span></div>
      <div class="ir-tabs">
        <button class="ir-tab active" data-mode="week">Неделя</button>
        <button class="ir-tab" data-mode="month">Месяц</button>
      </div>
    </div>
    <div class="ir-body">
      <div>
        <div class="ir-total" style="color:${barColor(h.now.total)}">${h.now.total}%</div>
        <span class="ir-total-delta hidden">·</span>
      </div>
      <div class="ir-channels">
        <div class="ir-channel-row">
          <div class="ir-channel-name">🛒 Покупатель</div>
          <div class="ir-channel-bar"><div class="ir-channel-fill buyer" style="width:${Math.min(h.now.buyer,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.buyer}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="buyer"></svg>
        </div>
        <div class="ir-channel-row">
          <div class="ir-channel-name">🏠 Продавец</div>
          <div class="ir-channel-bar"><div class="ir-channel-fill seller" style="width:${Math.min(h.now.seller,100)}%"></div></div>
          <div class="ir-channel-pct">${h.now.seller}%</div>
          <div class="ir-channel-delta hidden">·</div>
          <svg class="ir-channel-spark hidden" viewBox="0 0 70 18" preserveAspectRatio="none" data-channel="seller"></svg>
        </div>
      </div>
    </div>
    <div class="ir-card-foot">Индекс развития · ${esc(periodLabel)} · насколько ты на пути к цели</div>
  </div>`;
}
window.applyIrMode=function(card, mode){
  const raw=card.getAttribute('data-ir'); if(!raw) return;
  const {h, isPartner, periodLabel} = JSON.parse(decodeURIComponent(raw));
  const elTotal = card.querySelector('.ir-total');
  const elTotalDelta = card.querySelector('.ir-total-delta');
  const rows = card.querySelectorAll('.ir-channel-row');
  const src = mode==='month' && h.month ? h.month : (mode==='week' && h.week ? h.week : h.now);
  const setChan = (row, sideKey, color) => {
    const pct = src[sideKey];
    row.querySelector('.ir-channel-fill').style.width = Math.min(pct,100)+'%';
    row.querySelector('.ir-channel-pct').textContent = pct+'%';
    const dEl = row.querySelector('.ir-channel-delta');
    const sEl = row.querySelector('.ir-channel-spark');
    if (mode==='now'){
      dEl.classList.add('hidden'); sEl.classList.add('hidden');
    } else {
      const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
      const d = pct - (prev[sideKey]||0);
      const dObj = _irDelta(d);
      dEl.className = 'ir-channel-delta '+dObj.cls;
      dEl.textContent = dObj.text;
      const hist = (mode==='week' ? h.week_history : h.month_history)[sideKey] || [];
      const spark = _irSpark(hist, color);
      if (spark){ sEl.classList.remove('hidden'); sEl.innerHTML = _renderSparkSvg(spark); }
      else { sEl.classList.add('hidden'); }
    }
  };
  setChan(rows[0], 'buyer', '#3b82f6');
  setChan(rows[1], 'seller', '#10b981');
  // Общий ИР + дельта
  elTotal.textContent = src.total+'%';
  elTotal.style.color = barColor(src.total);
  if (mode==='now'){
    elTotalDelta.classList.add('hidden');
  } else {
    const prev = (mode==='week' ? h.week_prev : h.month_prev) || {};
    const d = src.total - (prev.total||0);
    const dObj = _irDelta(d);
    elTotalDelta.className = 'ir-total-delta '+dObj.cls;
    elTotalDelta.textContent = dObj.text;
    elTotalDelta.classList.remove('hidden');
  }
  // Подпись
  const foot = card.querySelector('.ir-card-foot');
  if (mode==='now') foot.textContent = `Индекс развития · ${periodLabel} · насколько ты на пути к цели`;
  else if (mode==='week') foot.textContent = `Динамика по неделям · последние 4 точки (сегодня — справа)`;
  else {
    if (isPartner && h.salary_review_at){
      const lbl = _monthsAgoLabel(h.salary_review_at);
      foot.textContent = lbl ? `Динамика помесячно · с момента утверждения целей (${lbl})` : `Динамика помесячно · последние 6 месяцев`;
    } else {
      foot.textContent = `Динамика помесячно · последние 6 месяцев`;
    }
  }
};
window.initIrCards=function(root){
  (root||document).querySelectorAll('.ir-card').forEach(card=>{
    if(card._irInited) return; card._irInited=true;
    const tabs=card.querySelectorAll('.ir-tab');
    tabs.forEach(t=>{
      t.addEventListener('click',()=>{ tabs.forEach(x=>x.classList.toggle('active', x===t)); window.applyIrMode(card, t.dataset.mode); });
    });
    window.applyIrMode(card, 'week');
  });
};

</script>
