<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз — Кабинет партнёра</title>
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }

<style>
 :root{
 /* Поверхности */
 --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef0f4;
 /* Линии и тени */
 --line:#e6e8ee; --line-strong:#d1d5db;
 --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
 --shadow-hover:0 2px 6px rgba(20,30,55,.08),0 10px 32px rgba(20,30,55,.08);
 /* Текст */
 --ink:#1a1f2e; --ink-soft:#3b4358; --muted:#7a8194; --muted-2:#a8aebd; --on-dark:#ffffff;
 /* Бренд */
 --brand:#2b6cb0; --brand-hover:#1f5288; --brand-soft:#eaf2fb;
 /* Семантика воронки */
 --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
 /* Статусы */
 --ok:#16a34a; --ok-bg:#e9f6ec;
 --warn:#d97706; --warn-bg:#fdf3e3;
 --bad:#dc2626; --bad-bg:#fdeaea;
 --nd:#7a8194; --nd-bg:#eef0f4;
 /* ИИ-фиолетовый */
 --ai-purple-bg-1:#f5f3ff; --ai-purple-bg-2:#ede9fe; --ai-purple-line:#ddd6fe;
 --ai-purple-ink:#5b21b6; --ai-purple-ink-strong:#4c1d95;
 /* Скругления */
 --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;
 /* Отступы */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
 /* Типографика */
 --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
 --fs-20:20px; --fs-22:22px; --fs-28:28px;
 --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700; --fw-eb:800;
 /* Прочее */
 --transition:0.15s ease; --max-width:1180px; --app-header-h:56px;
 /* Совместимость со старым кодом (этапы 2-8 уберут) */
 
 }

  /* TZ-A22 §3.3 — единый каркас .hero (алиасы существующих .card + .stat-grid + .stat) */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}
  .hero-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:var(--fs-16);flex-shrink:0}
  .hero-info{flex:1;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
  @media(min-width:620px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
  .hero-stat{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
  .hero-stat-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px}
  .hero-stat-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.2;display:block;margin-top:var(--sp-1)}
  .hero-stat-sub{font-size:var(--fs-11);color:var(--muted);margin-top:2px}

 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:1.5;padding-bottom:24px}
 .app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
 .logo{font-size:var(--fs-16);font-weight:var(--fw-eb);color:var(--brand)} .logo span{color:var(--muted);font-weight:var(--fw-m)}
 .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
 .date-badge{font-size:var(--fs-12);color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:20px}
 .btn{font-size:var(--fs-12);color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
 .btn:hover{border-color:var(--brand);color:var(--brand)}
 .container{max-width:1080px;margin:0 auto;padding:16px}
 @media(min-width:860px){.container{padding:24px 28px}}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
 /* адаптивная сетка: 1 колонка на телефоне, 2 на широком экране */
 .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
 @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
 .muted{color:var(--muted);font-size:var(--fs-12)}
 .section-title{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
 .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--r-xl);padding:14px 16px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .soon{background:var(--surface-2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:var(--fs-13)}
 .soon .soon-ic{font-size:var(--fs-28);display:block;margin-bottom:8px}
 /* анонс «Coming Soon» (Клиенты/CRM) */
 .acs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px 18px;box-shadow:var(--shadow);text-align:center}
 .acs-badge{display:inline-block;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:var(--fs-12);font-weight:var(--fw-b);padding:6px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(124,58,237,.4);margin-bottom:14px}
 .acs-title{font-size:var(--fs-20);font-weight:var(--fw-eb);margin-bottom:8px}
 .acs-desc{font-size:var(--fs-13);color:var(--muted);line-height:1.6;margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto}
 .acs-desc b{color:#7c3aed}
 .acs-features{display:grid;grid-template-columns:1fr;gap:10px;text-align:left;margin-bottom:16px}
 @media(min-width:700px){.acs-features{grid-template-columns:repeat(3,1fr)}}
 .acs-f{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:var(--fs-12);line-height:1.5;color:var(--ink)}
 .acs-f b{display:block;margin-bottom:4px;font-size:var(--fs-13)}
 .acs-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
 .acs-tag{font-size:var(--fs-11);font-weight:var(--fw-sb);padding:5px 11px;border-radius:20px;background:rgba(124,58,237,.1);color:#5b21b6;border:1px solid rgba(124,58,237,.2)}

 /* авто-цель баннер */
 .goal-banner{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r-xl);padding:12px 14px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .goal-banner .gb-x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:var(--fs-16);flex-shrink:0;line-height:1}
 .goal-banner .gb-edit{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;white-space:nowrap}

 /* hero */
 .hero{position:relative}
 .hero-iconbar{position:absolute;top:0;right:0;display:flex;gap:8px}
 .hib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);cursor:pointer;position:relative}
 .hib:hover{border-color:var(--brand)}
 .hib-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:var(--fs-11);font-weight:var(--fw-b);display:flex;align-items:center;justify-content:center;padding:0 4px}
 .profile{display:flex;align-items:flex-start;gap:14px}
 .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);font-weight:var(--fw-eb);color:#fff;flex-shrink:0}
 .role-tag{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-b);padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
 .hero-name{font-size:var(--fs-20);font-weight:var(--fw-eb);line-height:1.15}
 .hero-sub{font-size:var(--fs-12);color:var(--muted);margin-top:3px}
 .sf-mini{margin-top:10px;display:inline-flex;align-items:baseline;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 14px;cursor:pointer}
 .sf-mini b{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--ink)} .sf-mini .sf-z{font-size:var(--fs-11)}

 /* достижения */
 .achievements{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;padding-bottom:2px}
 .ach-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--ok-bg);color:#14532d;border:1px solid #bbf7d0;border-radius:20px;padding:6px 12px;font-size:var(--fs-12);font-weight:var(--fw-sb);white-space:nowrap}

 /* income-track */
 .income-track{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
 .it-row{display:flex;gap:14px;margin-bottom:10px}
 .it-half{flex:1}
 .it-cap{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:var(--fw-sb);margin-bottom:4px}
 .it-val{font-size:var(--fs-22);font-weight:var(--fw-eb)}
 .it-val.target{color:var(--brand)}
 .it-bar{height:12px;background:var(--nd-bg);border-radius:7px;overflow:hidden;margin-bottom:10px}
 .it-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
 .it-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--fs-12);color:var(--muted)}
 .it-link{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
 .it-link:hover{text-decoration:underline}
 /* вал у шапки */
 .val-bar{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
 .val-cell{flex:1;background:var(--brand-soft);border-radius:10px;padding:10px 12px}
 .vb-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.03em}
 .vb-num{font-size:var(--fs-20);font-weight:var(--fw-eb);color:var(--brand);margin:2px 0}
 .vb-sub{font-size:var(--fs-11);color:var(--muted)}
 /* легенда факт/план */
 .fs-legend{font-size:var(--fs-11);color:var(--muted);margin:-4px 2px 10px;display:flex;gap:14px}
 .fs-legend b{color:var(--ink);font-weight:var(--fw-b)}

 /* верхние табы */
 .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
 .rtab{font-size:var(--fs-14);padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:var(--fw-sb);white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
 .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
 .rtab.on{background:#fff;color:var(--brand);font-weight:var(--fw-b);box-shadow:0 2px 6px rgba(0,0,0,.08)}
 .screen{display:none} .screen.on{display:block}

 /* ИР */
 .ir-top{display:flex;align-items:center;gap:18px}
 .ir-big{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1}
 .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
 .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:var(--fs-12);font-weight:var(--fw-sb)}
 .bar-bg{height:8px;background:var(--nd-bg);border-radius:5px;overflow:hidden}
 .bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
 .status-badge{font-size:var(--fs-11);padding:3px 10px;border-radius:20px;font-weight:var(--fw-b)}
 .sb-green{background:var(--ok-bg);color:var(--ok)} .sb-yellow{background:var(--warn-bg);color:var(--warn)}
 .sb-red{background:var(--bad-bg);color:var(--bad)} .sb-no_data{background:var(--nd-bg);color:var(--muted)}

 /* воронки */
 .funnel-side{margin-bottom:14px}
 .fs-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
 .fs-title{display:flex;align-items:center;gap:8px}
 .fs-dot{width:10px;height:10px;border-radius:3px}
 .stage-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--buyer));border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
 .stage-card:hover{box-shadow:var(--shadow)}
 .stage-head{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
 .chev{color:var(--muted);font-size:var(--fs-12);transition:transform .2s} .chev.open{transform:rotate(90deg)}
 .stage-label{font-size:var(--fs-14);font-weight:var(--fw-b)}
 .stage-numbers{font-size:var(--fs-12);color:var(--muted);white-space:nowrap} .stage-numbers b{font-weight:var(--fw-eb);margin-left:6px}
 .stage-bar{height:10px;background:var(--nd-bg);border-radius:6px;overflow:hidden}
 .stage-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
 .stage-seg{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
 .stage-seg.hidden{display:none}
 .seg-row{display:grid;grid-template-columns:1fr auto 38px;gap:8px;font-size:var(--fs-11);align-items:center;color:var(--muted)} .seg-row .sv{color:var(--ink);font-weight:var(--fw-sb)}
 .tip{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:var(--fs-13);color:#1a4061;margin-top:6px}

 /* воронка 12 мес (Тренер) */
 .f12-side{margin-bottom:12px}
 .f12-steps{display:flex;align-items:stretch;gap:0;margin:8px 0}
 .f12-step{flex:1;text-align:center;padding:8px 4px;background:var(--surface-2);border-radius:8px;margin:0 2px}
 .f12-step .v{font-size:var(--fs-16);font-weight:var(--fw-eb)} .f12-step .c{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
 .f12-conv{display:flex;justify-content:space-around;font-size:var(--fs-11);color:var(--brand);font-weight:var(--fw-b);margin-top:2px}
 .f12-seg{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:var(--fs-11);padding:5px 2px;border-top:1px dashed var(--line);align-items:center}
 .f12-seg .sv{color:var(--ink);font-weight:var(--fw-sb)} .f12-seg .sm{color:var(--muted)}
 /* диагностика */
 .coach-side{padding:4px 0 10px 12px;margin-bottom:8px;border-left:3px solid var(--buyer)}
 .weak-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
 .weak{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-12);color:var(--bad)}

 /* ИИ */
 .ai-card{background:linear-gradient(135deg,#1e293b 0%,#2b3a52 100%);border-radius:var(--r-xl);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow)}
 .ai-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
 .ai-orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd66b,#f59e0b);box-shadow:0 0 24px rgba(245,158,11,.5);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-22)}
 .ai-h{font-size:var(--fs-14);font-weight:var(--fw-eb)} .ai-h span{color:#ffd66b}
 .ai-text{font-size:var(--fs-14);line-height:1.6;color:#cbd5e1} .ai-text b{color:#ffd66b;font-weight:var(--fw-b)}
 .ai-note{font-size:var(--fs-12);color:#7d8fa8;margin-top:10px}

 /* прогноз */
 .fc-grid{display:grid;grid-template-columns:1fr;gap:12px}
 @media(min-width:700px){.fc-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
 .fc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
 .fc.accent{background:var(--brand-soft);border-color:#cfe1f5}
 .fc-cap{font-size:var(--fs-12);color:var(--muted);font-weight:var(--fw-sb)}
 .fc-val{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--brand);margin:2px 0}
 .fc-sub{font-size:var(--fs-12);color:var(--muted)}
 .fc-big{font-size:var(--fs-28);font-weight:var(--fw-eb);color:var(--brand);margin:4px 0}
 /* стретч-рычаги */
 .stretch-card{border:1px solid #cfe1f5;background:var(--brand-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px}
 .stretch-lever{font-size:var(--fs-13);font-weight:var(--fw-eb);color:var(--brand);margin-bottom:8px}
 .stretch-row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:var(--fs-13);padding:5px 0;align-items:center}
 .stretch-row.main{font-weight:var(--fw-b)}
 .stretch-arrow{color:var(--ok);font-weight:var(--fw-b)}
 .stretch-flow{font-size:var(--fs-13);margin-top:6px;padding-top:6px;border-top:1px solid #cfe1f5}
 .risk-alert{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:#92400e;font-size:var(--fs-13);font-weight:var(--fw-sb)}
 .risk-alert.surge{background:#fff7ed;color:#9a3412}
 .risk-alert.deep{background:var(--bad-bg);color:#991b1b}

 /* уведомления/задачи */
 .notif{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .notif:last-child{border-bottom:none} .notif.unread .ni-title{font-weight:var(--fw-b)}
 .ni-icon{font-size:var(--fs-16)} .ni-title{font-size:var(--fs-13)}
 .tg-title{font-size:var(--fs-12);font-weight:var(--fw-b);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .tg-red{color:var(--bad)} .tg-amber{color:var(--warn)} .tg-gray{color:var(--muted)} .tg-green{color:var(--ok)}
 .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .task:last-child{border-bottom:none} .task-main{flex:1;min-width:0} .task-title{font-size:var(--fs-13);font-weight:var(--fw-sb)}
 .task-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--ok);background:transparent;color:var(--ok);cursor:pointer;font-size:var(--fs-14);flex-shrink:0}
 .task-btn:hover{background:var(--ok-bg)} .task-done{color:var(--ok)}
 /* превью задач + помощь */
 .tp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
 .tp-head .tp-link{font-size:var(--fs-12);color:var(--brand);font-weight:var(--fw-b);cursor:pointer}
 .help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:14px}
 .help-btn:hover{background:#fee2e2}
 .mgr-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border-radius:12px;margin-bottom:14px}
 .mgr-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#b45309);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);font-weight:var(--fw-eb);flex-shrink:0}
 .mgr-topic{padding:11px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-13);display:flex;justify-content:space-between;gap:8px}
 .mgr-topic:last-child{border-bottom:none}

 /* светофор */
 .svet-now{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:var(--r-xl);padding:20px;text-align:center;margin-bottom:14px;color:#cbd5e1}
 .svet-pos-huge{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1;background:linear-gradient(135deg,#ffd66b,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .svet-now-lbl{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

 .mv-pos{font-weight:var(--fw-b);white-space:nowrap}

 /* модалки */

 .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

 .f-label{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .f-input,.f-area,.f-select{width:100%;font-size:var(--fs-14);padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:var(--surface)}
 .f-area{min-height:70px;resize:vertical}
 .add-task-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px dashed #c9cedb;background:var(--surface-2);color:var(--brand);border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:14px}

 .modal-save:disabled{opacity:.6}

 .hof-item:last-child{border-bottom:none}

 #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1100;color:var(--muted)}
 #overlay.hidden{display:none}

/* TZ-A22 §3.6/§3.8 — единые кнопки и бейджи (готовы для этапа 5) */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-dark);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}

.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;cursor:pointer;font-size:var(--fs-14);background:transparent;transition:var(--transition);font-family:inherit}
.btn-icon.ok{color:var(--ok);border-color:var(--ok)} .btn-icon.ok:hover{background:var(--ok-bg)}
.btn-icon.muted{color:var(--muted)} .btn-icon.muted:hover{color:var(--bad)}

.badge{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);line-height:1.2}

.badge-nd{background:var(--nd-bg);color:var(--nd)}

/* ── TZ-A26: трёхчастная полоса факт/прогноз/план ─────────────────── */
.funnel-stage{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--sp-3);margin-bottom:var(--sp-2)}

.funnel-hint{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--muted)}
.fp-numbers{display:flex;align-items:baseline;gap:var(--sp-2);font-size:var(--fs-13);flex-wrap:wrap}
.fp-num-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-num-forecast{color:var(--gold);font-weight:var(--fw-sb)}
.fp-num-plan{color:var(--muted);font-weight:var(--fw-sb)}
.fp-num-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:lowercase;margin-right:2px}
.fp-num-sep{color:var(--muted-2)}
.fp-bar{position:relative;height:20px;background:var(--surface-3);border-radius:var(--r-xs);overflow:visible;display:flex}
.fp-bar.sm{height:16px;background:var(--line);border:1px solid var(--line-strong)}
.fp-bar-fact{height:100%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default}
.fp-bar-forecast{height:100%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default}
.fp-bar-fact:hover, .fp-bar-forecast:hover{filter:brightness(.92)}
.fp-bar-fact.narrow, .fp-bar-forecast.narrow{color:transparent}
.fp-bar.zero-fact::after{content:'0% от плана';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--muted);letter-spacing:.2px;pointer-events:none;white-space:nowrap}
.fp-bar-fact[data-tooltip]:hover::after, .fp-bar-forecast[data-tooltip]:hover::after, .fp-bar[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1f2e;color:#fff;font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:50;pointer-events:none;letter-spacing:.2px}
.fp-bar-wrap{display:grid;grid-template-columns:1fr auto;gap:var(--sp-3);align-items:center}
.fp-bar-outside{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-12);white-space:nowrap}
.fp-bar-outside .o-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-bar-outside .o-forecast{color:var(--gold);font-weight:var(--fw-b)}
.fp-bar-outside .o-lbl{color:var(--muted);font-weight:var(--fw-r);margin-left:2px}
.fp-bar-outside .o-sep{color:var(--muted-2)}
.fp-bar-outside .o-nd{color:var(--muted);font-weight:var(--fw-sb)}
.hero-stat-fpf-fact-wrap{display:flex;align-items:baseline;gap:var(--sp-1)}
.hero-stat-fpf-fact-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb)}
.hero-stat-fpf-fact{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--ok);line-height:1.2;display:block}
.hero-stat-fpf-fact.large{font-size:var(--fs-28)}
.hero-stat-fpf-meta{font-size:var(--fs-11);color:var(--muted);margin-top:2px;display:flex;gap:var(--sp-1);flex-wrap:wrap}
.hero-stat-fpf-meta b{font-weight:var(--fw-sb)}
.hero-stat-fpf-meta .forecast{color:var(--gold)}
.hero-stat-fpf-meta .plan{color:var(--ink-soft)}

<body>
<div id="overlay">Загрузка кабинета…</div>

<div class="app-header">
 <div class="logo">Прогноз<span> · кабинет</span></div>
 <div class="app-header-right">

 <span class="date-badge" id="dateBadge"></span>
 <button class="btn" id="logoutBtn">Выход</button>
 </div>
</div>

<div class="container">
 <div id="goalBanner"></div>
 <div id="hero"></div>
 <div class="rtab-bar" id="tabbar">
 <div class="rtab on" data-tab="main" onclick="showTab('main',this)">🏠 Главная</div>
 <div class="rtab" data-tab="prognoz" onclick="showTab('prognoz',this)">📈 Прогноз</div>
 <div class="rtab" data-tab="coach" onclick="showTab('coach',this)">🎓 Тренер</div>
 <div class="rtab" data-tab="clients" onclick="showTab('clients',this)">👥 Клиенты</div>
 <div class="rtab" data-tab="tasks" onclick="showTab('tasks',this)">📋 Задачи<span id="taskDot"></span></div>
 <div class="rtab" data-tab="svetofor" onclick="showTab('svetofor',this)">🚦 Светофор</div>
 </div>
 <div class="screen on" id="screen-main"></div>
 <div class="screen" id="screen-prognoz"></div>
 <div class="screen" id="screen-coach"></div>
 <div class="screen" id="screen-clients"></div>
 <div class="screen" id="screen-tasks"></div>
 <div class="screen" id="screen-svetofor"></div>
</div>

<div class="modal-overlay" id="modalGoal"><div class="modal" id="modalGoalBody"></div></div>
<div class="modal-overlay" id="modalHof"><div class="modal" id="modalHofBody"></div></div>
<div class="modal-overlay" id="modalMgr"><div class="modal" id="modalMgrBody"></div></div>
<div class="modal-overlay" id="modalTask"><div class="modal" id="modalTaskBody"></div></div>
<div class="modal-overlay" id="modalNotif"><div class="modal" id="modalNotifBody"></div></div>

<script type="module">
import { requireAuth, logout } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const INCOME_SHARE=0.48;
const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const SIDE_COLOR={buyer:'#3b82f6',seller:'#10b981'};
const CTX={data:null,target:null};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtShort=(n)=>{ n=Number(n)||0; const a=Math.abs(n); if(a<1000)return String(Math.round(n)); if(a<1e6)return Math.round(n/1000)+'к'; return (Math.round(n/1e5)/10).toString().replace('.',',')+' млн'; };
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }

window.showTab=(id,btn)=>{
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
 document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('on'));
 document.getElementById('screen-'+id).classList.add('on'); btn.classList.add('on');
 window.scrollTo(0,0);
 // A12: при открытии «Задачи» через 2с помечаем уведомления прочитанными
 if(window.__markT){clearTimeout(window.__markT);window.__markT=null;}
 if(id==='tasks'){ window.__markT=setTimeout(()=>{ const u=CTX.data&&CTX.data.notifications&&CTX.data.notifications.unread_count; if(u>0) window.markAllRead(true); },2000); }
};
window.markAllRead=async(silent)=>{
 try{ const r=await window.__call('markNotificationsRead',{mark_all:true});
 document.querySelectorAll('.notif.unread').forEach(n=>n.classList.remove('unread'));
 const hb=document.querySelector('.hib-badge'); if(hb) hb.remove();
 const nm=document.getElementById('notifMeta'); if(nm) nm.textContent='';
 const ma=document.getElementById('notifMarkAll'); if(ma) ma.style.display='none';
 if(CTX.data&&CTX.data.notifications) CTX.data.notifications.unread_count=r.remaining_unread;
 }catch(e){ if(!silent) alert('Не удалось: '+(e.message||e)); }
};
window.goTab=(id)=>{ const b=document.querySelector(`.rtab[data-tab="${id}"]`); if(b) window.showTab(id,b); };
window.toggleStage=(head)=>{ const c=head.closest('.stage-card, .funnel-stage'); if(!c)return; const s=c.querySelector('.stage-seg'),ch=c.querySelector('.chev'); if(!s)return; s.classList.toggle('hidden'); if(ch) ch.classList.toggle('open'); };
window.completeTask=async(id,ev)=>{ if(ev)ev.stopPropagation(); const b=ev&&ev.target; if(b){b.disabled=true;b.textContent='…';}
 try{ await window.__call('updateTaskStatus',{task_id:id,status:'done'}); location.reload(); }catch(e){ alert('Не удалось: '+(e.message||e)); if(b){b.disabled=false;b.textContent='✓';} } };
window.skipTask=async(id,ev)=>{ if(ev)ev.stopPropagation(); if(!confirm('Отказаться от задачи?'))return;
 try{ await window.__call('updateTaskStatus',{task_id:id,status:'skipped'}); location.reload(); }catch(e){ alert('Не удалось: '+(e.message||e)); } };
window.closeModal=(id)=>document.getElementById(id).classList.remove('on');

/* A11: создание задачи */
window.openCreateTask=()=>{
 document.getElementById('modalTaskBody').innerHTML=`
 <div class="modal-head"><div class="modal-title">➕ Создать задачу</div><button class="modal-x" onclick="closeModal('modalTask')">✕</button></div>
 <div class="f-label">Заголовок *</div>
 <input class="f-input" id="tkTitle" maxlength="200" placeholder="Что нужно сделать" />
 <div class="f-label">Описание</div>
 <textarea class="f-area" id="tkDesc" maxlength="1000" placeholder="Детали (необязательно)"></textarea>
 <div class="f-label">Срок</div>
 <select class="f-select" id="tkDue">
 <option value="today">Сегодня</option><option value="tomorrow">Завтра</option>
 <option value="week" selected>На этой неделе</option><option value="none">Без срока</option></select>
 <div class="f-label">Приоритет</div>
 <select class="f-select" id="tkPrio"><option value="normal" selected>Обычно</option><option value="important">Важно</option><option value="critical">🔴 Срочно</option></select>
 <div class="f-label">Тип</div>
 <select class="f-select" id="tkType"><option value="free" selected>🎯 Свободная</option><option value="client">👤 Клиент</option><option value="base">📋 База</option></select>
 <button class="modal-save" id="tkSave" onclick="saveTask()" style="margin-top:14px">Создать задачу</button>`;
 document.getElementById('modalTask').classList.add('on');
};
window.saveTask=async()=>{
 const title=document.getElementById('tkTitle').value.trim();
 if(title.length<3){ alert('Заголовок — минимум 3 символа'); return; }
 const desc=document.getElementById('tkDesc').value.trim();
 const prio=document.getElementById('tkPrio').value;
 const type=document.getElementById('tkType').value;
 const dueSel=document.getElementById('tkDue').value;
 const D=new Date(); let due_at=null;
 if(dueSel==='today'){ D.setHours(23,59,0,0); due_at=D.getTime(); }
 else if(dueSel==='tomorrow'){ D.setDate(D.getDate()+1); D.setHours(18,0,0,0); due_at=D.getTime(); }
 else if(dueSel==='week'){ const wd=D.getDay(); const add=(7-wd)%7||7; D.setDate(D.getDate()+add); D.setHours(23,59,0,0); due_at=D.getTime(); }
 const b=document.getElementById('tkSave'); b.disabled=true; b.textContent='Создаю…';
 try{ await window.__call('createTask',{assignee_code:CTX.target,title,description:desc||null,priority:prio,type,due_at}); location.reload(); }
 catch(e){ const m=(e.message||'')+''; alert(m.includes('уже создана')||m.includes('exists')?'Такая задача уже есть за последние 24 часа':('Не удалось: '+m)); b.disabled=false; b.textContent='Создать задачу'; }
};

const LEAGUES=[
 {tag:'🐆 ТОП 1–5',name:'Элита компании',inc:'от 700к',color:'#16a34a',from:1,to:5},
 {tag:'🐆 ТОП 6–100',name:'Лучшие',inc:'300–700к',color:'#16a34a',from:6,to:100},
 {tag:'🟢 101–300',name:'Сильные',inc:'230–300к',color:'#86efac',from:101,to:300},
 {tag:'🟡 301–400',name:'Хорошие',inc:'160–230к',color:'#fde68a',from:301,to:400},
 {tag:'🟡 401–500',name:'Средние',inc:'140–160к',color:'#fbbf24',from:401,to:500},
 {tag:'🟡 501–800',name:'Слабые',inc:'90–140к',color:'#fb923c',from:501,to:800},
 {tag:'🔴 801–1300',name:'Низкоэффективные',inc:'до 90к',color:'#f87171',from:801,to:1300},
];

function daysPath(plan){ if(!plan||!plan.started_month) return null;
 const [y,m]=plan.started_month.split('-').map(Number); const start=new Date(y,m-1,1);
 const total=(plan.horizon_months||6)*30; const passed=Math.max(0,Math.round((Date.now()-start.getTime())/86400000));
 return {passed:Math.min(passed,total),total}; }

/* ─── HERO (профиль + достижения + income-track) ─── */
function renderHero(d){
 const u=d.user,g=d.goal,nb=d.notifications;
 const unread=nb?.unread_count||0;
 const meta=[]; if(u.mop_name)meta.push('Старший партнёр: '+esc(u.mop_name)); if(u.stazh_label)meta.push('стаж '+esc(u.stazh_label));
 const sfMini=u.position_in_company!=null?`<div class="sf-mini" onclick="goTab('svetofor')"><b>#${u.position_in_company}</b><span class="sf-z muted">${esc(u.svetofor_zone_label||'')} · светофор ›</span></div>`:'';

/* ─── воронки (TZ-A26 трёхчастные) ─── */
function stageCard(side,st){
 // Адаптируем поле hint_label → hint для renderStage
 const stage={...st, hint: st.hint_label};
 // Базовый рендер этапа (полоса + tooltip + статус-скобка)
 let html=renderStage(stage);
 // Сохраняем раскрытие сегментов (для income — список сделок по сегментам)
 if(st.segments && st.segments.length){
  const segs=st.segments.map(sg=>{
   if(st.is_revenue){
    return `<div class="seg-row"><span class="sv">${esc(sg.label)}</span><span>${esc(sg.fact_label)}</span><b style="color:${sg.progress_status==='green'?'var(--ok)':'var(--gold)'}">${esc(sg.plan_label)}</b></div>`;
   }
   const subStage={fact:sg.fact,plan:sg.plan,fact_label:sg.fact_label,plan_label:sg.plan_label,forecast:null};
   return `<div style="margin-bottom:8px"><div class="seg-row" style="margin-bottom:4px"><span class="sv">${esc(sg.label)}</span><span style="color:var(--muted);font-size:var(--fs-11)">${esc(sg.fact_label)} / ${esc(sg.plan_label)}</span></div>${renderFpBar(subStage,{compact:true})}</div>`;
  }).join('');
  // Втыкаем block раскрытия внутрь funnel-stage — делает его кликабельным
  html=html.replace(/<\/div>\s*$/, `<div class="stage-seg hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${segs}</div></div>`);
  // Добавим cursor и onclick на head
  html=html.replace('class="funnel-head"',`class="funnel-head" style="cursor:pointer" onclick="toggleStage(this)"`);
  html=html.replace('<div class="funnel-label">','<div class="funnel-label"><span class="chev" style="display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-weight:var(--fw-b)">›</span> ');
 }
 return html;
}

/* ─── ЗАДАЧИ ─── */
function taskItem(t){
 const meta=[t.priority!=='normal'?t.priority_label:'',t.due_label||t.due_date||'',t.progress_label].filter(Boolean).join(' · ');
 const actions=t.can_complete
 ? `<button class="task-skip" onclick="skipTask('${esc(t.id)}',event)" title="Отказаться">🚫</button><button class="task-btn" onclick="completeTask('${esc(t.id)}',event)">✓</button>`
 : (t.status==='done'?'<span class="task-done">✓</span>':'');
 const author=t.author_display?`<div class="muted" style="font-size:var(--fs-11)">${esc(t.author_display)}${t.author_reason?` · ${esc(t.author_reason)}`:''}</div>`:'';
 return `<div class="task"><div class="task-main"><div class="task-title">${esc(t.title)}</div>${meta?`<div class="muted">${esc(meta)}</div>`:''}${author}</div>
 <div style="display:flex;align-items:center;gap:4px">${actions}</div></div>`;
}
function renderTasks(d){
 const out=[]; const tb=d.tasks, nb=d.notifications;
 if(nb&&nb.recent&&nb.recent.length){
 const items=nb.recent.slice(0,5).map(n=>`<div class="notif ${n.is_read?'':'unread'}"><span class="ni-icon">${esc(n.icon||'🔔')}</span>
 <div><div class="ni-title">${esc(n.title)}</div><div class="muted">${esc(n.created_at_label||'')}</div></div></div>`).join('');
 const ma=nb.unread_count?`<span class="nt-markall" id="notifMarkAll" onclick="markAllRead(false)">✓ отметить все</span>`:'';
 out.push(`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
 <div class="section-title" style="margin:0">🔔 Уведомления<span id="notifMeta">${nb.unread_count?` · ${nb.unread_count} новых`:''}</span></div>${ma}</div>${items}</div>`);
 }
 if(tb){
 const grp=(arr,title,cls)=>(arr&&arr.length)?`<div class="tg-title ${cls}">${title} · ${arr.length}</div>${arr.map(taskItem).join('')}`:'';
 const g=tb.groups;
 const body=grp(g.expired,'⚠ Просрочено','tg-red')+grp(g.today,'Срочно сегодня','tg-red')+grp(g.week,'На этой неделе','tg-amber')+grp(g.later,'Позже','tg-gray')+grp(g.done_recent,'Сделано за 14 дней','tg-green');
 out.push(`<div class="card"><div class="section-title">📋 Мои задачи</div>
 <button class="add-task-btn" onclick="openCreateTask()">➕ Создать задачу</button>
 ${body||'<div class="muted">Нет активных задач.</div>'}</div>`);
 } else out.push(`<div class="card"><div class="section-title">📋 Мои задачи</div><button class="add-task-btn" onclick="openCreateTask()">➕ Создать задачу</button><div class="muted">Нет активных задач.</div></div>`);
 out.push(helpCard(d));
 document.getElementById('screen-tasks').innerHTML=out.join('');
 const cnt=(d.tasks?.counts?.today||0)+(d.tasks?.counts?.expired||0)+(d.notifications?.unread_count||0);
 document.getElementById('taskDot').textContent = cnt?' '+cnt:'';
}

/* ─── СВЕТОФОР ─── */
const POOL_TOTAL={newbie:386,experienced:934};
function poolTotals(d){ const t=(d.meta&&d.meta.system_totals)||{}; return {newbie:t.svetofor_newbie||POOL_TOTAL.newbie, experienced:t.svetofor_experienced||POOL_TOTAL.experienced}; }
const POOL_CLR={newbie:'#16a34a',experienced:'#2b6cb0'};
function movementCard(d){
 const h=(d.position_history||[]).filter(p=>p.position!=null);
 if(h.length<2) return `<div class="card"><div class="section-title">📈 Как я двигался за 6 месяцев</div>
 <div class="soon"><span class="soon-ic">📈</span>История движения накапливается — график появится в ближайшие месяцы.</div></div>`;
 const PT=poolTotals(d);
 // линейный график (SVG). Y = высота в своём пуле (выше = ближе к топу), нормировано по пулу → пулы сопоставимы.
 const W=320,H=150,padX=14,padT=24,padB=30; const plotW=W-padX*2, plotH=H-padT-padB;
 const n=h.length; const X=i=>padX+(n>1?i*(plotW/(n-1)):plotW/2);
 const yFrac=p=>{ const tot=PT[p.pool]||PT.experienced; return Math.max(0,Math.min(1,1-(p.position/tot))); }; // 1=топ
 const Y=p=>padT+(1-yFrac(p))*plotH;
 let segs='',dots='',labels='',marks='';
 for(let i=0;i<n;i++){ const p=h[i],x=X(i),y=Y(p),clr=POOL_CLR[p.pool]||POOL_CLR.experienced;
 if(i>0){ const pp=h[i-1],x0=X(i-1),y0=Y(pp); const diff=pp.pool!==p.pool;
 segs+=`<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${clr}" stroke-width="2.5" ${diff?'stroke-dasharray="4 3"':''}/>`;
 if(diff){ const mx=(x0+x)/2; marks+=`<line x1="${mx}" y1="${padT-6}" x2="${mx}" y2="${padT+plotH}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>`; } }
 dots+=`<circle cx="${x}" cy="${y}" r="${i===n-1?5:3.5}" fill="${clr}"/>`;
 labels+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1f2e">#${p.position}</text>`;
 labels+=`<text x="${x}" y="${H-12}" text-anchor="middle" font-size="9" fill="#7a8194">${esc(p.label.split(' ')[0])}</text>`;
 }
 const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${marks}${segs}${dots}${labels}</svg>`;
 const legend=`<div style="display:flex;gap:14px;justify-content:center;font-size:var(--fs-11);color:var(--muted);margin-top:4px">
 <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${POOL_CLR.newbie};vertical-align:middle"></span> светофор новичков</span>
 <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${POOL_CLR.experienced};vertical-align:middle"></span> светофор опытных</span></div>`;
 const samePool=h.every(p=>p.pool===h[0].pool);
 let note;
 if(!samePool){ note='📈 Пунктир — переход из светофора новичков в светофор опытных (это новый, более сильный рейтинг, поэтому место «выше по номеру»).'; }
 else { const up=h[0].position-h[h.length-1].position;
 note=up>0?`📈 За 6 месяцев ты поднялся на <b>${up}</b> ${plural(up,'позицию','позиции','позиций')}. Так держать!`
 :(up<0?`За полгода позиция снизилась на ${Math.abs(up)} — есть куда расти, всё впереди.`:'Позиция держится стабильно.'); }
 return `<div class="card"><div class="section-title">📈 Как я двигался за 6 месяцев</div>${svg}${legend}
 <div class="muted" style="margin-top:10px">${note}</div></div>`;
}
function plural(n,a,b,c){ const m10=n%10,m100=n%100; if(m10===1&&m100!==11)return a; if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b; return c; }
function zoneColor(cat){ cat=String(cat||''); if(cat.includes('Самые'))return '#16a34a'; if(cat.includes('Лучшие'))return '#22c55e'; if(cat.includes('Хорошие'))return '#86efac'; if(cat.includes('Средние'))return '#fbbf24'; if(cat.includes('Слабые'))return '#fb923c'; return '#f87171'; }

 :`<div class="svet-zone"><div class="muted">Зона определяется по месту в светофоре опытных.</div></div>`;
 const zones=(d.meta&&d.meta.svetofor_zones_experienced)||[];
 const zlist=zones.length?`<div class="card"><div class="section-title">🚦 Зоны светофора опытных</div>
 ${zones.map(z=>`<div class="sv-league ${z.is_current?'you':''}"><span class="sv-l-tag" style="background:${zoneColor(z.category)};color:${zoneColor(z.category)==='#86efac'?'#0f172a':'#fff'}">${esc(z.range)}</span>
 <span class="sv-l-name">${esc(z.category||'')}${z.is_current?' · ты':''}</span><span class="sv-l-inc">${fmtShort(z.avg_income)} ₽</span></div>`).join('')}</div>`:'';
 document.getElementById('screen-svetofor').innerHTML=`<div class="grid-2">${head}${zb}</div>${zlist}${movementCard(d)}`;
}

/* TZ-A26: утилиты трёхчастной воронки */
function calcStatus(fact,forecast,plan){ if(!plan||plan===0) return 's-pending'; const f=(fact/plan)*100; if(f>=100) return 's-done'; if(forecast!=null){ const fc=(forecast/plan)*100; if(fc>=100) return 's-forecast'; } return 's-pending'; }
function calcBarPercents(fact,forecast,plan){ if(!plan||plan===0) return {factPct:0,forecastPctTotal:0,forecastDeltaPct:0}; const factPct=Math.round((fact/plan)*100); let forecastPctTotal=factPct, forecastDeltaPct=0; if(forecast!=null && forecast>fact){ forecastPctTotal=Math.round((forecast/plan)*100); forecastDeltaPct=forecastPctTotal-factPct; } return {factPct,forecastPctTotal,forecastDeltaPct}; }
function tooltipFact(factLabel,factPct,planLabel){ return `факт ${factLabel} — ${factPct}% от плана ${planLabel}`; }
function tooltipForecast(forecastLabel,forecastPctTotal,planLabel){ return `прогноз ${forecastLabel} — ${forecastPctTotal}% от плана ${planLabel}`; }
function renderFpBar(stage,opts){
  opts=opts||{};
  const {fact,fact_label,forecast,forecast_label,plan,plan_label}=stage;
  if(fact==null && plan==null){
    return `<div class="fp-bar-wrap"><div class="fp-bar" data-tooltip="нет данных по этому этапу"></div><div class="fp-bar-outside"><span class="o-nd">— нет данных</span></div></div>`;
  }
  const {factPct,forecastPctTotal,forecastDeltaPct}=calcBarPercents(fact,forecast,plan);
  const smClass=opts.compact?' sm':'';
  if(factPct===0 && forecastDeltaPct===0){
    const tt=tooltipFact(fact_label,0,plan_label);
    return `<div class="fp-bar${smClass} zero-fact" data-tooltip="${esc(tt)}"><div class="fp-bar-fact" style="width:0%"></div></div>`;
  }
  const factNarrow=factPct>0 && factPct<12;
  const forecastNarrow=forecastDeltaPct>0 && forecastDeltaPct<12;
  const factTt=factPct>0?tooltipFact(fact_label,factPct,plan_label):null;
  const forecastTt=forecastDeltaPct>0?tooltipForecast(forecast_label,forecastPctTotal,plan_label):null;
  const factDiv=factPct>0?`<div data-tooltip="${esc(factTt)}" class="fp-bar-fact${factNarrow?' narrow':''}" style="width:${factPct}%">${factPct}%</div>`:'';
  const forecastDiv=forecastDeltaPct>0?`<div data-tooltip="${esc(forecastTt)}" class="fp-bar-forecast${forecastNarrow?' narrow':''}" style="width:${forecastDeltaPct}%">${forecastPctTotal}%</div>`:'';
  const containerTt=factTt||forecastTt||'нет данных';
  const bar=`<div class="fp-bar${smClass}" data-tooltip="${esc(containerTt)}">${factDiv}${forecastDiv}</div>`;
  if(factNarrow||forecastNarrow){
    const parts=[];
    if(factNarrow) parts.push(`<span class="o-fact">${factPct}%</span><span class="o-lbl">от плана</span>`);
    if(forecastNarrow){ if(parts.length) parts.push('<span class="o-sep">·</span>'); parts.push(`<span class="o-forecast">${forecastPctTotal}%</span><span class="o-lbl">прогноз от плана</span>`); }
    return `<div class="fp-bar-wrap">${bar}<div class="fp-bar-outside">${parts.join('')}</div></div>`;
  }
  return bar;
}
function renderStage(stage){
  const {label,hint,fact_label,forecast,forecast_label,plan_label,fact,plan}=stage;
  const status=calcStatus(fact,forecast,plan);
  const hintHtml=hint?`<span class="funnel-hint">${esc(hint)}</span>`:'';
  let numbers;
  if(forecast!=null){
    numbers=`<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">прогноз</span><span class="fp-num-forecast">${esc(forecast_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  } else {
    numbers=`<span><span class="fp-num-lbl">факт</span><span class="fp-num-fact">${esc(fact_label)}</span></span><span class="fp-num-sep">/</span><span><span class="fp-num-lbl">план</span><span class="fp-num-plan">${esc(plan_label)}</span></span>`;
  }
  return `<div class="funnel-stage ${status}"><div class="funnel-head"><div class="funnel-label">${esc(label)} ${hintHtml}</div><div class="fp-numbers">${numbers}</div></div>${renderFpBar(stage)}</div>`;
}
