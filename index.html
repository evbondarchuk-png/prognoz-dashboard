<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз — Кабинет партнёра</title>
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }
</script>
<style>
 :root{
 /* Поверхности */
 --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef0f4;
 /* Линии и тени */
 --line:#e6e8ee; --line-strong:#d1d5db;
 --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
 --shadow-hover:0 2px 6px rgba(20,30,55,.08),0 10px 32px rgba(20,30,55,.08);
 /* Текст */
 --ink:#1a1f2e; --ink-soft:#3b4358; --muted:#7a8194; --muted-2:#a8aebd; --on-dark:#ffffff;
 /* Бренд */
 --brand:#2b6cb0; --brand-hover:#1f5288; --brand-soft:#eaf2fb;
 /* Семантика воронки */
 --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
 /* Статусы */
 --ok:#16a34a; --ok-bg:#e9f6ec;
 --warn:#d97706; --warn-bg:#fdf3e3;
 --bad:#dc2626; --bad-bg:#fdeaea;
 --nd:#7a8194; --nd-bg:#eef0f4;
 /* ИИ-фиолетовый */
 --ai-purple-bg-1:#f5f3ff; --ai-purple-bg-2:#ede9fe; --ai-purple-line:#ddd6fe;
 --ai-purple-ink:#5b21b6; --ai-purple-ink-strong:#4c1d95;
 /* Скругления */
 --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;
 /* Отступы */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
 /* Типографика */
 --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
 --fs-20:20px; --fs-22:22px; --fs-28:28px;
 --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700; --fw-eb:800;
 /* Прочее */
 --transition:0.15s ease; --max-width:1180px; --app-header-h:56px;
 /* Совместимость со старым кодом (этапы 2-8 уберут) */
 
 }

  /* TZ-A22 §3.3 — единый каркас .hero (алиасы существующих .card + .stat-grid + .stat) */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}
  .hero-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:var(--fs-16);flex-shrink:0}
  .hero-info{flex:1;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
  @media(min-width:620px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
  .hero-stat{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
  .hero-stat-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px}
  .hero-stat-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.2;display:block;margin-top:var(--sp-1)}
  .hero-stat-sub{font-size:var(--fs-11);color:var(--muted);margin-top:2px}

 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:1.5;padding-bottom:24px}
 .app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
 .logo{font-size:var(--fs-16);font-weight:var(--fw-eb);color:var(--brand)} .logo span{color:var(--muted);font-weight:var(--fw-m)}
 .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
 .date-badge{font-size:var(--fs-12);color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:20px}
 .btn{font-size:var(--fs-12);color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
 .btn:hover{border-color:var(--brand);color:var(--brand)}
 .container{max-width:1080px;margin:0 auto;padding:16px}
 @media(min-width:860px){.container{padding:24px 28px}}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
 /* адаптивная сетка: 1 колонка на телефоне, 2 на широком экране */
 .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
 @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
 .muted{color:var(--muted);font-size:var(--fs-12)}
 .section-title{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
 .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--r-xl);padding:14px 16px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .soon{background:var(--surface-2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:var(--fs-13)}
 .soon .soon-ic{font-size:var(--fs-28);display:block;margin-bottom:8px}
 /* Карточки клиентов (TZ-SEED) */
 .cli-section{margin-bottom:14px}
 .cli-grid{display:grid;gap:8px;grid-template-columns:1fr}
 @media(min-width:560px){.cli-grid{grid-template-columns:1fr 1fr}}
 @media(min-width:900px){.cli-grid{grid-template-columns:1fr 1fr 1fr}}
 .cli-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-3);cursor:pointer;transition:.15s}
 .cli-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
 .cli-card.hot{border-left-color:var(--bad)}
 .cli-card.open{cursor:default}
 .cli-name{font-weight:var(--fw-b);color:var(--ink);font-size:var(--fs-13);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
 .cli-chev{color:var(--muted);font-size:var(--fs-14);transition:transform .15s}
 .cli-card.open .cli-chev{transform:rotate(90deg)}
 .cli-meta{font-size:var(--fs-11);color:var(--muted);margin-bottom:6px}
 .cli-sigs{display:flex;flex-wrap:wrap;gap:4px}
 .cli-sig{background:var(--brand-soft);color:var(--brand);font-size:var(--fs-11);padding:2px 8px;border-radius:var(--r-pill);font-weight:var(--fw-sb)}
 .cli-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
 .cli-card.open .cli-detail{display:block}
 .cli-section-h{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 6px}
 .cli-section-h:first-child{margin-top:0}
 .cli-ai{background:linear-gradient(135deg,rgba(124,58,237,.06),rgba(59,130,246,.06));border:1px solid rgba(124,58,237,.15);border-radius:var(--r-md);padding:10px 12px}
 .cli-ai-sum{font-size:var(--fs-13);color:var(--ink);line-height:1.5;margin-bottom:8px}
 .cli-ai-block{margin-top:6px}
 .cli-ai-block-h{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);margin-bottom:2px}
 .cli-ai-list{margin:0;padding-left:18px;font-size:var(--fs-12);color:var(--ink)}
 .cli-ai-list li{margin-bottom:2px}
 .cli-timeline{display:flex;flex-direction:column;gap:6px}
 .cli-tl-row{display:grid;grid-template-columns:60px 24px 1fr;gap:8px;font-size:var(--fs-12);align-items:start}
 .cli-tl-date{color:var(--muted);font-size:var(--fs-11)}
 .cli-tl-ic{text-align:center;font-size:var(--fs-14)}
 .cli-tl-txt{color:var(--ink)}
 .cli-tl-row.trigger .cli-tl-txt{color:var(--warn);font-weight:var(--fw-sb)}
 .cli-history{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-12);color:var(--ink)}
 .cli-history-row{padding:6px 8px;background:var(--surface-2);border-radius:var(--r-sm)}
 .cli-history-row b{color:var(--brand)}
 .cli-scripts{display:flex;flex-direction:column;gap:6px}
 .cli-script{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;transition:.15s}
 .cli-script:hover{border-color:var(--brand);background:var(--brand-soft)}
 .cli-script-title{font-weight:var(--fw-sb);color:var(--ink);font-size:var(--fs-12)}
 .cli-script-short{font-size:var(--fs-11);color:var(--muted);margin-top:2px}
 .cli-script-full{display:none;margin-top:8px;padding:8px;background:var(--surface-2);border-radius:var(--r-sm);font-size:var(--fs-12);color:var(--ink);white-space:pre-line;line-height:1.5}
 .cli-script.open .cli-script-full{display:block}
 /* анонс «Coming Soon» (Клиенты/CRM) */
 .acs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px 18px;box-shadow:var(--shadow);text-align:center}
 .acs-badge{display:inline-block;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:var(--fs-12);font-weight:var(--fw-b);padding:6px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(124,58,237,.4);margin-bottom:14px}
 .acs-title{font-size:var(--fs-20);font-weight:var(--fw-eb);margin-bottom:8px}
 .acs-desc{font-size:var(--fs-13);color:var(--muted);line-height:1.6;margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto}
 .acs-desc b{color:#7c3aed}
 .acs-features{display:grid;grid-template-columns:1fr;gap:10px;text-align:left;margin-bottom:16px}
 @media(min-width:700px){.acs-features{grid-template-columns:repeat(3,1fr)}}
 .acs-f{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:var(--fs-12);line-height:1.5;color:var(--ink)}
 .acs-f b{display:block;margin-bottom:4px;font-size:var(--fs-13)}
 .acs-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
 .acs-tag{font-size:var(--fs-11);font-weight:var(--fw-sb);padding:5px 11px;border-radius:20px;background:rgba(124,58,237,.1);color:#5b21b6;border:1px solid rgba(124,58,237,.2)}

 /* авто-цель баннер */
 .goal-banner{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r-xl);padding:12px 14px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .goal-banner .gb-x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:var(--fs-16);flex-shrink:0;line-height:1}
 .goal-banner .gb-edit{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;white-space:nowrap}

 /* hero */
 .hero{position:relative}
 .hero-iconbar{position:absolute;top:0;right:0;display:flex;gap:8px}
 .hib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);cursor:pointer;position:relative}
 .hib:hover{border-color:var(--brand)}
 .hib-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:var(--fs-11);font-weight:var(--fw-b);display:flex;align-items:center;justify-content:center;padding:0 4px}
 .profile{display:flex;align-items:flex-start;gap:14px}
 .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);font-weight:var(--fw-eb);color:#fff;flex-shrink:0}
 .role-tag{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-b);padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
 /* TZ-A30 §3: бейджи Н1-Н4 и Группа 0 в шапке партнёра */
 .n-risk-badge{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-eb);padding:2px 8px;border-radius:6px;margin-left:6px;cursor:help;vertical-align:middle}
 .n-risk-1{background:#fef3c7;color:#92500e;border:1px solid #fcd34d}
 .n-risk-2{background:#fed7aa;color:#9a3412;border:1px solid #fb923c}
 .n-risk-3{background:#fecaca;color:#991b1b;border:1px solid #f87171}
 .n-risk-4{background:#fee2e2;color:#7f1d1d;border:1px solid #dc2626;animation:n4-pulse 1.8s infinite}
 @keyframes n4-pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 5px rgba(220,38,38,0)}}
 .g0-pill{display:inline-block;font-size:10px;font-weight:var(--fw-eb);background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:8px;padding:1px 7px;margin-left:6px;cursor:help;vertical-align:middle}
 /* Позитивный стрик «серия · не разорви цепочку» (2026-07-03) — inline-бейдж */
 .streak-badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);font-weight:var(--fw-eb);padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle;cursor:help;background:#dcfce7;color:#166534;border:1px solid #86efac}
 .streak-badge.hot{background:#fef3c7;color:#92500e;border-color:#fbbf24;animation:s-pulse 2s infinite}
 @keyframes s-pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}50%{box-shadow:0 0 0 4px rgba(251,191,36,0)}}
 .hero-name{font-size:var(--fs-20);font-weight:var(--fw-eb);line-height:1.15}
 .hero-sub{font-size:var(--fs-12);color:var(--muted);margin-top:3px}
 .sf-mini{margin-top:10px;display:inline-flex;align-items:baseline;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 14px;cursor:pointer}
 .sf-mini b{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--ink)} .sf-mini .sf-z{font-size:var(--fs-11)}

 /* достижения */
 .achievements{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;padding-bottom:2px}
 .ach-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--ok-bg);color:#14532d;border:1px solid #bbf7d0;border-radius:20px;padding:6px 12px;font-size:var(--fs-12);font-weight:var(--fw-sb);white-space:nowrap}

 /* income-track */
 .income-track{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
 .it-row{display:flex;gap:14px;margin-bottom:10px}
 .it-half{flex:1}
 .it-cap{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:var(--fw-sb);margin-bottom:4px}
 .it-val{font-size:var(--fs-22);font-weight:var(--fw-eb)}
 .it-val.target{color:var(--brand)}
 .it-bar{height:12px;background:var(--nd-bg);border-radius:7px;overflow:hidden;margin-bottom:10px}
 .it-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
 .it-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--fs-12);color:var(--muted)}
 .it-link{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
 .it-link:hover{text-decoration:underline}
 /* вал у шапки */
 .val-bar{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
 .val-cell{flex:1;background:var(--brand-soft);border-radius:10px;padding:10px 12px}
 .vb-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.03em}
 .vb-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0}
 .vb-num{font-size:var(--fs-20);font-weight:var(--fw-eb);color:var(--brand)}
 .vb-zp{font-size:var(--fs-13);color:var(--ok);font-weight:var(--fw-sb);white-space:nowrap}
 .vb-sub{font-size:var(--fs-11);color:var(--muted)}
 /* легенда факт/план */
 .fs-legend{font-size:var(--fs-11);color:var(--muted);margin:-4px 2px 10px;display:flex;gap:14px}
 .fs-legend b{color:var(--ink);font-weight:var(--fw-b)}

 /* верхние табы */
 .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
 .rtab{font-size:var(--fs-14);padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:var(--fw-sb);white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
 .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
 .rtab.on{background:#fff;color:var(--brand);font-weight:var(--fw-b);box-shadow:0 2px 6px rgba(0,0,0,.08)}
 .screen{display:none} .screen.on{display:block}

 /* ИР */
 .ir-top{display:flex;align-items:center;gap:18px}
 .ir-big{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1}
 .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
 .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:var(--fs-12);font-weight:var(--fw-sb)}
 /* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
 .ir-info{display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:10px;cursor:help;margin-left:4px;font-weight:var(--fw-r);vertical-align:middle;background:#fff}
 .ir-info:hover{background:var(--line);color:var(--ink)}
 [data-tip]{position:relative}
 [data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:var(--fw-r);line-height:1.45;white-space:normal;width:340px;max-width:90vw;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;text-align:left}
 [data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1f2937;z-index:9999;pointer-events:none}
 .ir-card-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
 .ir-card-title{font-size:var(--fs-13);color:var(--muted);font-weight:var(--fw-r)}
 .ir-tabs{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden}
 .ir-tab{padding:4px var(--sp-3);background:transparent;border:none;border-right:1px solid var(--line);font-size:var(--fs-12);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s ease}
 .ir-tab:last-child{border-right:none}
 .ir-tab:hover{color:var(--ink-soft,var(--ink))}
 .ir-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
 .ir-body{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:center}
 .ir-total{font-size:var(--fs-28);font-weight:var(--fw-eb);color:var(--ok);line-height:1;min-width:80px}
 .ir-total-delta{display:block;font-size:var(--fs-12);font-weight:var(--fw-sb);margin-top:2px;height:14px}
 .ir-total-delta.up{color:var(--ok)} .ir-total-delta.down{color:var(--bad)} .ir-total-delta.flat{color:var(--muted)}
 .ir-total-delta.hidden{visibility:hidden}
 .ir-channels{display:flex;flex-direction:column;gap:var(--sp-2)}
 .ir-channel-row{display:grid;grid-template-columns:90px 1fr 50px 30px 70px;gap:var(--sp-2);align-items:center;font-size:var(--fs-12)}
 .ir-channel-name{font-weight:var(--fw-sb);color:var(--ink)}
 .ir-channel-bar{position:relative;height:10px;background:var(--surface-3,var(--line));border-radius:var(--r-pill);overflow:hidden}
 .ir-channel-fill{height:100%;border-radius:var(--r-pill);transition:width .4s ease}
 .ir-channel-fill.buyer{background:var(--buyer,#3b82f6)} .ir-channel-fill.seller{background:var(--seller,#10b981)}
 .ir-channel-pct{text-align:right;font-weight:var(--fw-b);color:var(--ink)}

 .ir-card-foot{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--surface-3,var(--line));font-size:var(--fs-12);color:var(--muted)}
 .bar-bg{height:8px;background:var(--nd-bg);border-radius:5px;overflow:hidden}

 .status-badge{font-size:var(--fs-11);padding:3px 10px;border-radius:20px;font-weight:var(--fw-b)}

 .stage-head{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
 .chev{color:var(--muted);font-size:var(--fs-12);transition:transform .2s} .chev.open{transform:rotate(90deg)}
 .stage-label{font-size:var(--fs-14);font-weight:var(--fw-b)}
 .stage-numbers{font-size:var(--fs-12);color:var(--muted);white-space:nowrap} .stage-numbers b{font-weight:var(--fw-eb);margin-left:6px}

 .tip{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:var(--fs-13);color:#1a4061;margin-top:6px}

 /* воронка 12 мес (Тренер) */

 .f12-step .v{font-size:var(--fs-16);font-weight:var(--fw-eb)} .f12-step .c{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
 .f12-conv{display:flex;justify-content:space-around;font-size:var(--fs-11);color:var(--brand);font-weight:var(--fw-b);margin-top:2px}
 .f12-seg{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:var(--fs-11);padding:5px 2px;border-top:1px dashed var(--line);align-items:center}
 .f12-seg .sv{color:var(--ink);font-weight:var(--fw-sb)} .f12-seg .sm{color:var(--muted)}
 /* диагностика */
 .coach-side{padding:4px 0 10px 12px;margin-bottom:8px;border-left:3px solid var(--buyer)}
 .weak-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
 .weak{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-12);color:var(--bad)}

 /* ИИ */
 .ai-card{background:linear-gradient(135deg,#1e293b 0%,#2b3a52 100%);border-radius:var(--r-xl);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow)}

 .ai-h{font-size:var(--fs-14);font-weight:var(--fw-eb)} .ai-h span{color:#ffd66b}
 .ai-text{font-size:var(--fs-14);line-height:1.6;color:#cbd5e1} .ai-text b{color:#ffd66b;font-weight:var(--fw-b)}
 .ai-note{font-size:var(--fs-12);color:#7d8fa8;margin-top:10px}

 /* прогноз */
 .fc-grid{display:grid;grid-template-columns:1fr;gap:12px}
 @media(min-width:700px){.fc-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
 .fc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}

 /* стретч-рычаги */
 .stretch-card{border:1px solid #cfe1f5;background:var(--brand-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px}

 .stretch-row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:var(--fs-13);padding:5px 0;align-items:center}
 .stretch-row.main{font-weight:var(--fw-b)}
 .stretch-arrow{color:var(--ok);font-weight:var(--fw-b)}
 .stretch-flow{font-size:var(--fs-13);margin-top:6px;padding-top:6px;border-top:1px solid #cfe1f5}
 .risk-alert{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:#92400e;font-size:var(--fs-13);font-weight:var(--fw-sb)}
 .risk-alert.surge{background:#fff7ed;color:#9a3412}
 .risk-alert.deep{background:var(--bad-bg);color:#991b1b}

 /* уведомления/задачи */
 .notif{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .notif:last-child{border-bottom:none} .notif.unread .ni-title{font-weight:var(--fw-b)}
 .ni-icon{font-size:var(--fs-16)} .ni-title{font-size:var(--fs-13)}
 .tg-title{font-size:var(--fs-12);font-weight:var(--fw-b);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .tg-red{color:var(--bad)} .tg-amber{color:var(--warn)} .tg-gray{color:var(--muted)} .tg-green{color:var(--ok)}
 .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .task:last-child{border-bottom:none} .task-main{flex:1;min-width:0} .task-title{font-size:var(--fs-13);font-weight:var(--fw-sb)}

 .task-btn:hover{background:var(--ok-bg)} .task-done{color:var(--ok)}
 /* превью задач + помощь */
 .tp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

 .help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:14px}
 .help-btn:hover{background:#fee2e2}
 .mgr-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border-radius:12px;margin-bottom:14px}
 .mgr-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#b45309);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);font-weight:var(--fw-eb);flex-shrink:0}
 .mgr-topic{padding:11px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-13);display:flex;justify-content:space-between;gap:8px}

 /* светофор */
 .svet-now{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:var(--r-xl);padding:20px;text-align:center;margin-bottom:14px;color:#cbd5e1}
 .svet-pos-huge{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1;background:linear-gradient(135deg,#ffd66b,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .svet-now-lbl{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
 .svet-move{font-size:var(--fs-13);font-weight:var(--fw-sb);margin-top:6px}
 .svet-zone{background:#fefce8;border:1px solid #fde68a;border-radius:var(--r-xl);padding:16px;margin-bottom:14px}
 .svet-zone-name{font-size:var(--fs-28);font-weight:var(--fw-eb);color:#78350f;margin:4px 0}

 .sv-league{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;font-size:var(--fs-12)}

 .sv-l-name{font-weight:var(--fw-sb)} .sv-l-inc{color:var(--muted)}
 /* график движения */
 .mv-row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:var(--fs-12)}
 .mv-row.now .mv-bar-fill{background:linear-gradient(90deg,#ffd66b,#f59e0b)}
 .mv-bar{height:14px;background:var(--nd-bg);border-radius:7px;overflow:hidden}
 .mv-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
 .mv-pos{font-weight:var(--fw-b);white-space:nowrap}
 .mv-now-tag{font-size:var(--fs-11);color:var(--gold);font-weight:var(--fw-b);margin-left:4px}

 /* модалки */
 .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
 .modal-overlay.on{display:flex}
 .modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:20px 18px 28px;max-height:90vh;overflow-y:auto}
 @media(min-width:641px){.modal-overlay{align-items:center}.modal{border-radius:18px}}
 .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
 .modal-title{font-size:var(--fs-16);font-weight:var(--fw-eb)}

 .goal-input{width:100%;font-size:var(--fs-22);font-weight:var(--fw-eb);padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;text-align:center;margin-bottom:12px}
 .f-label{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
 .f-input,.f-area,.f-select{width:100%;font-size:var(--fs-14);padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:var(--surface)}
 .f-area{min-height:70px;resize:vertical}
 .add-task-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px dashed #c9cedb;background:var(--surface-2);color:var(--brand);border-radius:12px;font-weight:var(--fw-b);font-size:var(--fs-14);cursor:pointer;font-family:inherit;margin-bottom:14px}
 .add-task-btn:hover{border-color:var(--brand)}
 .task-skip{background:none;border:none;color:var(--muted);cursor:pointer;font-size:var(--fs-13);font-family:inherit;padding:2px 6px}

 .nt-markall{font-size:var(--fs-12);color:var(--brand);font-weight:var(--fw-b);cursor:pointer}

 .preset:hover{border-color:var(--brand)} .preset b{font-weight:var(--fw-eb);color:var(--brand)}
 .modal-save{width:100%;padding:14px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:var(--fs-14);font-weight:var(--fw-b);cursor:pointer;margin-top:6px}
 .modal-save:disabled{opacity:.6}

 #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1100;color:var(--muted)}
 #overlay.hidden{display:none}

/* TZ-A22 §3.6/§3.8 — единые кнопки и бейджи (готовы для этапа 5) */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-dark);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}

.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-secondary:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);font-family:inherit;font-size:var(--fs-13);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);border:1px solid var(--bad);background:transparent;color:var(--bad);cursor:pointer;transition:var(--transition);line-height:1;white-space:nowrap}
.btn-danger:hover:not(:disabled){background:var(--bad-bg)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;cursor:pointer;font-size:var(--fs-14);background:transparent;transition:var(--transition);font-family:inherit}
.btn-icon.ok{color:var(--ok);border-color:var(--ok)} .btn-icon.ok:hover{background:var(--ok-bg)}
.btn-icon.muted{color:var(--muted)} .btn-icon.muted:hover{color:var(--bad)}

.badge{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);line-height:1.2}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-bad{background:var(--bad-bg);color:var(--bad)}
.badge-nd{background:var(--nd-bg);color:var(--nd)}
.badge-info{background:var(--brand-soft);color:var(--brand)}


/* ── TZ-A26: трёхчастная полоса факт/прогноз/план ─────────────────── */
.funnel-stage{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--sp-3);margin-bottom:var(--sp-2)}
/* Парная сетка: каждая строка покупателя выровнена со строкой продавца */
.funnel-grid-paired{display:grid;grid-template-columns:1fr;gap:8px 14px;align-items:stretch;margin-top:8px}
@media(min-width:860px){.funnel-grid-paired{grid-template-columns:1fr 1fr}}
.funnel-grid-paired .row-stage{display:flex;flex-direction:column}
.funnel-grid-paired .row-stage>.funnel-stage{flex:1;margin-bottom:0}
.funnel-stage.s-done{border-left-color:var(--ok)}
.funnel-stage.s-forecast{border-left-color:var(--gold)}
.funnel-stage.s-pending{border-left-color:var(--line-strong)}
.funnel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:wrap}
.funnel-label{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);display:flex;align-items:baseline;gap:var(--sp-2);flex:0 1 auto;min-width:0}
.funnel-hint{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--muted)}
.fp-numbers{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-12);flex-wrap:wrap;justify-content:flex-end;white-space:nowrap;flex-shrink:1;max-width:100%}
.fp-num-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-num-forecast{color:var(--gold);font-weight:var(--fw-sb)}
.fp-num-plan{color:var(--muted);font-weight:var(--fw-sb)}
.fp-num-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:lowercase;margin-right:2px}
.fp-num-sep{color:var(--muted-2);margin:0 2px}
.fp-num-sep{color:var(--muted-2)}
.fp-bar{position:relative;height:20px;background:var(--surface-3);border-radius:var(--r-xs);overflow:visible;display:flex}
.fp-bar.sm{height:16px;background:var(--line);border:1px solid var(--line-strong)}
.fp-bar-fact{height:100%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-forecast{height:100%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-fact:not(:only-child){border-radius:var(--r-xs) 0 0 var(--r-xs)}
.fp-bar-forecast:not(:only-child){border-radius:0 var(--r-xs) var(--r-xs) 0}
.seg-numbers{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.seg-num{display:inline-flex;gap:var(--sp-1);align-items:baseline;font-size:var(--fs-12)}
.seg-num b{font-weight:var(--fw-b);font-size:var(--fs-13)}
.seg-fact{color:var(--ok)}
.seg-forecast{color:var(--gold)}
.seg-sep{color:var(--muted-2)}
.fp-bar-fact:hover, .fp-bar-forecast:hover{filter:brightness(.92)}
.fp-bar-fact.narrow, .fp-bar-forecast.narrow{color:transparent}
.fp-bar.zero-fact::after{content:'0% от плана';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--muted);letter-spacing:.2px;pointer-events:none;white-space:nowrap}
@media (hover: hover) and (pointer: fine){
  .fp-bar-fact[data-tooltip]:hover::after, .fp-bar-forecast[data-tooltip]:hover::after, .fp-bar[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1f2e;color:#fff;font-size:var(--fs-12);font-weight:var(--fw-sb);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:50;pointer-events:none;letter-spacing:.2px}
}
.fp-bar-wrap{display:grid;grid-template-columns:1fr auto;gap:var(--sp-3);align-items:center}
.fp-bar-outside{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-12);white-space:nowrap}
.fp-bar-outside .o-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-bar-outside .o-forecast{color:var(--gold);font-weight:var(--fw-b)}
.fp-bar-outside .o-lbl{color:var(--muted);font-weight:var(--fw-r);margin-left:2px}
.fp-bar-outside .o-sep{color:var(--muted-2)}

<script type="module">
import { requireAuth, logout } from './auth-guard.js';

const INCOME_SHARE=0.48;
const SB={green:'sb-green',yellow:'sb-yellow',red:'sb-red',no_data:'sb-no_data'};
const SIDE_COLOR={buyer:'#3b82f6',seller:'#10b981'};
const CTX={data:null,target:null};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtShort=(n)=>{ n=Number(n)||0; const a=Math.abs(n); if(a<1000)return String(Math.round(n)); if(a<1e6)return Math.round(n/1000)+'к'; return (Math.round(n/1e5)/10).toString().replace('.',',')+' млн'; };
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }

window.showTab=(id,btn)=>{
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
 document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('on'));
 document.getElementById('screen-'+id).classList.add('on'); btn.classList.add('on');
 window.scrollTo(0,0);
 // A12: при открытии «Задачи» через 2с помечаем уведомления прочитанными
 if(window.__markT){clearTimeout(window.__markT);window.__markT=null;}
 if(id==='tasks'){ window.__markT=setTimeout(()=>{ const u=CTX.data&&CTX.data.notifications&&CTX.data.notifications.unread_count; if(u>0) window.markAllRead(true); },2000); }
};
window.markAllRead=async(silent)=>{
 try{ const r=await window.__call('markNotificationsRead',{mark_all:true});
 document.querySelectorAll('.notif.unread').forEach(n=>n.classList.remove('unread'));
 const hb=document.querySelector('.hib-badge'); if(hb) hb.remove();
 const nm=document.getElementById('notifMeta'); if(nm) nm.textContent='';
 const ma=document.getElementById('notifMarkAll'); if(ma) ma.style.display='none';
 if(CTX.data&&CTX.data.notifications) CTX.data.notifications.unread_count=r.remaining_unread;
 }catch(e){ if(!silent) alert('Не удалось: '+(e.message||e)); }
};
window.goTab=(id)=>{ const b=document.querySelector(`.rtab[data-tab="${id}"]`); if(b) window.showTab(id,b); };
window.toggleStage=(head)=>{ const c=head.closest('.stage-card, .funnel-stage'); if(!c)return; const s=c.querySelector('.stage-seg'),ch=c.querySelector('.chev'); if(!s)return; s.classList.toggle('hidden'); if(ch) ch.classList.toggle('open'); };
window.completeTask=async(id,ev)=>{ if(ev)ev.stopPropagation(); const b=ev&&ev.target; if(b){b.disabled=true;b.textContent='…';}
 try{ await window.__call('updateTaskStatus',{task_id:id,status:'done'}); location.reload(); }catch(e){ alert('Не удалось: '+(e.message||e)); if(b){b.disabled=false;b.textContent='✓';} } };
window.skipTask=async(id,ev)=>{ if(ev)ev.stopPropagation(); if(!confirm('Отказаться от задачи?'))return;
 try{ await window.__call('updateTaskStatus',{task_id:id,status:'skipped'}); location.reload(); }catch(e){ alert('Не удалось: '+(e.message||e)); } };

/* A11: создание задачи */
window.openCreateTask=()=>{
 document.getElementById('modalTaskBody').innerHTML=`
 <div class="modal-head"><div class="modal-title">➕ Создать задачу</div><button class="modal-x" onclick="closeModal('modalTask')">✕</button></div>
 <div class="f-label">Заголовок *</div>
 <input class="f-input" id="tkTitle" maxlength="200" placeholder="Что нужно сделать" />
 <div class="f-label">Описание</div>
 <textarea class="f-area" id="tkDesc" maxlength="1000" placeholder="Детали (необязательно)"></textarea>
 <div class="f-label">Срок</div>
 <select class="f-select" id="tkDue">
 <option value="today">Сегодня</option><option value="tomorrow">Завтра</option>
 <option value="week" selected>На этой неделе</option><option value="none">Без срока</option></select>
 <div class="f-label">Приоритет</div>
 <select class="f-select" id="tkPrio"><option value="normal" selected>Обычно</option><option value="important">Важно</option><option value="critical">🔴 Срочно</option></select>
 <div class="f-label">Тип</div>
 <select class="f-select" id="tkType"><option value="free" selected>🎯 Свободная</option><option value="client">👤 Клиент</option><option value="base">📋 База</option></select>
 <button class="modal-save" id="tkSave" onclick="saveTask()" style="margin-top:14px">Создать задачу</button>`;
 document.getElementById('modalTask').classList.add('on');
};
window.saveTask=async()=>{
 const title=document.getElementById('tkTitle').value.trim();
 if(title.length<3){ alert('Заголовок — минимум 3 символа'); return; }
 const desc=document.getElementById('tkDesc').value.trim();
 const prio=document.getElementById('tkPrio').value;
 const type=document.getElementById('tkType').value;
 const dueSel=document.getElementById('tkDue').value;
 const D=new Date(); let due_at=null;
 if(dueSel==='today'){ D.setHours(23,59,0,0); due_at=D.getTime(); }
 else if(dueSel==='tomorrow'){ D.setDate(D.getDate()+1); D.setHours(18,0,0,0); due_at=D.getTime(); }
 else if(dueSel==='week'){ const wd=D.getDay(); const add=(7-wd)%7||7; D.setDate(D.getDate()+add); D.setHours(23,59,0,0); due_at=D.getTime(); }
 const b=document.getElementById('tkSave'); b.disabled=true; b.textContent='Создаю…';
 try{ await window.__call('createTask',{assignee_code:CTX.target,title,description:desc||null,priority:prio,type,due_at}); location.reload(); }
 catch(e){ const m=(e.message||'')+''; alert(m.includes('уже создана')||m.includes('exists')?'Такая задача уже есть за последние 24 часа':('Не удалось: '+m)); b.disabled=false; b.textContent='Создать задачу'; }
};

const LEAGUES=[
 {tag:'🐆 ТОП 1–5',name:'Элита компании',inc:'от 700к',color:'#16a34a',from:1,to:5},
 {tag:'🐆 ТОП 6–100',name:'Лучшие',inc:'300–700к',color:'#16a34a',from:6,to:100},
 {tag:'🟢 101–300',name:'Сильные',inc:'230–300к',color:'#86efac',from:101,to:300},
 {tag:'🟡 301–400',name:'Хорошие',inc:'160–230к',color:'#fde68a',from:301,to:400},
 {tag:'🟡 401–500',name:'Средние',inc:'140–160к',color:'#fbbf24',from:401,to:500},
 {tag:'🟡 501–800',name:'Слабые',inc:'90–140к',color:'#fb923c',from:501,to:800},
 {tag:'🔴 801–1300',name:'Низкоэффективные',inc:'до 90к',color:'#f87171',from:801,to:1300},
];

function daysPath(plan){ if(!plan||!plan.started_month) return null;
 const [y,m]=plan.started_month.split('-').map(Number); const start=new Date(y,m-1,1);
 const total=(plan.horizon_months||6)*30; const passed=Math.max(0,Math.round((Date.now()-start.getTime())/86400000));
 return {passed:Math.min(passed,total),total}; }

/* ─── Позитивный стрик «серия · не разорви цепочку» (inline-бейдж) ─── */
function streakBadge(d){
  const nr = d && d.n_risk;
  if (!nr) return '';
  const good = nr.good_streak || 0;
  if (good < 1) return '';
  const cls = good >= 3 ? 'streak-badge hot' : 'streak-badge';
  const wordN = good === 1 ? '1 неделя' : good < 5 ? `${good} недели` : `${good} недель`;
  const tip = good >= 3
    ? `Серия: ${wordN} подряд выполняешь план по доходу. Не разорви на ${good+1}-й!`
    : good === 2
    ? `Серия: 2 недели подряд в плане. Сделай третью и получишь серию.`
    : `Первая неделя в плане. Продолжай!`;
  return `<span class="${cls}" title="${esc(tip)}">🔥 ${wordN} в плане</span>`;
}

/* ─── HERO (профиль + достижения + income-track) ─── */
function renderHero(d){
 const u=d.user,nb=d.notifications;
 // TZ группа 0 (Егор 19.06): цель/трек убираем — у них нет плана.
 const g = (u && u.is_group_zero) ? null : d.goal;
 const unread=nb?.unread_count||0;
 const meta=[]; if(u.mop_name)meta.push('Старший партнёр: '+esc(u.mop_name)); if(u.stazh_label)meta.push('стаж '+esc(u.stazh_label));
 const sfPos=(u.position_in_pool!=null?u.position_in_pool:u.position_in_company);
 const sfMini=sfPos!=null?`<div class="sf-mini" onclick="goTab('svetofor')"><b>#${sfPos}</b><span class="sf-z muted">${esc(u.svetofor_zone_label||'')} · светофор ›</span></div>`:'';
 const ach=(d.achievements||[]).map(a=>`<div class="ach-chip">${esc(a.emoji)} ${esc(a.text)}</div>`).join('');

 // income-track
 const inc=u.income_month, tgt=g?g.target_revenue_month:null;
 const pct=(inc!=null&&tgt)?Math.min(100,Math.round(inc/tgt*100)):0;
 const dp=daysPath(d.plan);
 const toGoal=(inc!=null&&tgt&&tgt>inc)?`до цели ${fmtShort(tgt-inc)} ₽`:'цель достигнута 🏆';
 const autoTxt=g?(g.is_auto?'цель авто (доход + 50к)':'цель установлена тобой'):'';
 let track='';
 if(g){ track=`<div class="income-track">
 <div class="it-row">
 <div class="it-half"><div class="it-cap">мой средний доход</div><div class="it-val">${inc!=null?esc(u.income_month_short):'—'} ₽</div></div>
 <div class="it-half" style="text-align:right"><div class="it-cap">цель / мес</div><div class="it-val target">${esc(g.target_revenue_month_short)} ₽</div></div>
 </div>
 <div class="it-bar"><div class="it-bar-fill" style="width:${pct}%"></div></div>
 <div class="it-foot">
 <span class="it-link" onclick="openEditGoal()">изменить цель</span>
 <span class="it-link" onclick="openHof()">🏆 Зал славы</span>
 <span>${toGoal}${autoTxt?' · '+autoTxt:''}</span>
 ${dp?`<span>⏱ ${dp.passed} / ${dp.total} дней пути</span>`:''}
 </div></div>`; }

 // вал текущего месяца (факт+прогноз) + прогноз следующего (TZ: вал у шапки, показываем даже 0)
 const fc=d.forecast; let valBar='';
 if(fc){
 valBar=`<div class="val-bar">
 <div class="val-cell"><div class="vb-cap">вал за ${esc(fc.current_month.label||'месяц')}</div><div class="vb-row"><div class="vb-num">${esc(fc.current_month.fact_revenue_label)} ₽</div>${fc.current_month.fact_income>0?`<div class="vb-zp">≈ ЗП ${esc(fc.current_month.fact_income_label)} ₽</div>`:''}</div><div class="vb-sub">${fc.current_month.forecast_revenue>0?`+ прогноз ${esc(fc.current_month.forecast_revenue_label)} ₽ → итого ${esc(fc.current_month.revenue_label)} ₽`:'без прогноза'}</div></div>
 <div class="val-cell"><div class="vb-cap">прогноз на ${esc(fc.next_month.label||'след.')}</div><div class="vb-row"><div class="vb-num">${fc.next_month.revenue>0?esc(fc.next_month.revenue_label)+' ₽':'—'}</div>${fc.next_month.income>0?`<div class="vb-zp">≈ ЗП ${esc(fc.next_month.income_label)} ₽</div>`:''}</div><div class="vb-sub">${fc.next_month.target_revenue>0?`план ${esc(fc.next_month.target_revenue_label)} ₽ · ${fc.next_month.progress_pct}% выполнения`:(fc.next_month.revenue>0?'по прогнозу воронки n8n':'нет горячих/задатков на следующий месяц')}</div></div>
 </div>`;
 }

 document.getElementById('hero').innerHTML=`<div class="card hero">
 <div class="hero-iconbar">
 <div class="hib" onclick="openNotifications()">🔔${unread?`<span class="hib-badge">${unread>99?'99+':unread}</span>`:''}</div>
 <div class="hib" onclick="goTab('tasks')">📋️</div>
 </div>
 <div class="profile"><div class="ava">${esc(initials(u.name))}</div><div style="flex:1;min-width:0">
 <span class="role-tag">${esc(u.role_label||'Партнёр')}</span>
 ${streakBadge(d)}
 ${(()=>{
   // Приоритет: позитив > негатив. Если good_streak≥1, показан streakBadge —
   // тогда Н-бейдж не рисуем.
   const nr=d.n_risk; if(!nr) return '';
   if((nr.good_streak||0)>=1) return '';
   const s=nr.streak; if(!s||s<1) return '';
   const lvl='Н'+Math.min(s,4);
   const base=s>=4?'4 недели подряд ниже целевого темпа — эскалация РОПу':s===3?'3 недели подряд ниже целевого темпа — нужен план выхода':s===2?'2 недели подряд ниже целевого темпа — встреча с менеджером':'1 неделя ниже целевого темпа — флаг';
   const monRu=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
   const bad=(nr.examined||[]).filter(x=>x&&x.isRisk).map(x=>{
     const dt=x.date.split('-');
     return `нед ${x.weekN} (${parseInt(dt[2])} ${monRu[parseInt(dt[1])-1]}): ${x.irMonth}% / нужно ≥${x.threshold}%`;
   });
   const detail=bad.length?'  '+bad.join(' · '):'';
   const tip=base+detail+'. Учитываются только закрытые недели (границы 7/14/21/конец месяца).';
   return `<span class="n-risk-badge n-risk-${Math.min(s,4)}" title="${esc(tip)}">${lvl}</span>`;
 })()}
 ${u.is_group_zero?`<span class="g0-pill" title="Группа 0: твой ИР и план не учитываются в группе/отделе/компании. Факт-вал суммируется. Обычно — болезнь / декрет / длительный отпуск.">🛌 группа 0</span>`:''}
 <div class="hero-name">${esc(u.name)}</div>
 <div class="hero-sub">${meta.join(' · ')}</div>
 ${sfMini}</div></div>
 ${ach?`<div class="achievements">${ach}</div>`:''}
 ${track}
 ${valBar}
 </div>`;

 // авто-цель баннер
 const gb=document.getElementById('goalBanner');
 if(g&&g.is_auto&&localStorage.getItem('goal_banner_dismissed')!=='1'){
 gb.innerHTML=`<div class="goal-banner"><span>ℹ️</span>
 <span>Система поставила прогнозный доход на основе твоей работы. Можешь изменить цель в любой момент — <span class="gb-edit" onclick="openEditGoal()">изменить</span></span>
 <span class="gb-x" onclick="dismissGoalBanner()">✕</span></div>`;
 } else gb.innerHTML='';
}
window.dismissGoalBanner=()=>{ localStorage.setItem('goal_banner_dismissed','1'); document.getElementById('goalBanner').innerHTML=''; };

/* модалка уведомлений (как в макете) */
window.openNotifications=()=>{
 const nb=CTX.data&&CTX.data.notifications;
 const rec=(nb&&nb.recent)||[];
 const items=rec.length?rec.map(n=>`<div class="notif ${n.is_read?'':'unread'}"><span class="ni-icon">${esc(n.icon||'🔔')}</span>
 <div><div class="ni-title">${esc(n.title)}</div>${n.body?`<div class="muted">${esc(n.body)}</div>`:''}<div class="muted">${esc(n.created_at_label||'')}</div></div></div>`).join('')
 :'<div class="muted">Уведомлений пока нет.</div>';
 const ma=(nb&&nb.unread_count)?`<span class="nt-markall" onclick="markAllRead(false);closeModal('modalNotif')">✓ отметить все</span>`:'';
 document.getElementById('modalNotifBody').innerHTML=`
 <div class="modal-head"><div class="modal-title">🔔 Уведомления${(nb&&nb.unread_count)?` · ${nb.unread_count}`:''}</div><button class="modal-x" onclick="closeModal('modalNotif')">✕</button></div>
 ${ma?`<div style="text-align:right;margin-bottom:8px">${ma}</div>`:''}${items}
 <div class="muted" style="margin-top:12px">Все уведомления также во вкладке «Задачи».</div>`;

};

/* ─── воронки (TZ-A26 трёхчастные) ─── */
function stageCard(side,st){
 // Адаптируем поле hint_label → hint для renderStage
 const stage={...st, hint: st.hint_label};
 // Базовый рендер этапа (полоса + tooltip + статус-скобка)
 let html=renderStage(stage);
 // Сохраняем раскрытие сегментов (для income — список сделок по сегментам)
 if(st.segments && st.segments.length){
  const segs=st.segments.map(sg=>{
   if(st.is_revenue){
    const f=sg.has_fact?`<span class="seg-num seg-fact">${esc(sg.deals_fact_label||'')} <b>${esc(sg.revenue_fact_label||'')}</b></span>`:'';
    const fc=sg.has_forecast?`<span class="seg-num seg-forecast">${esc(sg.deals_forecast_label||'')} <b>${esc(sg.revenue_forecast_label||'')}</b></span>`:'';
    const sep=(sg.has_fact&&sg.has_forecast)?'<span class="seg-sep">/</span>':'';
    return `<div class="seg-row"><span class="sv">${esc(sg.label)}</span><span class="seg-numbers">${f}${sep}${fc}</span></div>`;
   }
   const subStage={fact:sg.fact,plan:sg.plan,fact_label:sg.fact_label,plan_label:sg.plan_label,forecast:null};
   return `<div style="margin-bottom:8px"><div class="seg-row" style="margin-bottom:4px"><span class="sv">${esc(sg.label)}</span><span style="color:var(--muted);font-size:var(--fs-11)">${esc(sg.fact_label)} / ${esc(sg.plan_label)}</span></div>${renderFpBar(subStage,{compact:true})}</div>`;
  }).join('');
  // Втыкаем block раскрытия внутрь funnel-stage — делает его кликабельным
  html=html.replace(/<\/div>\s*$/, `<div class="stage-seg hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${segs}</div></div>`);
  // Добавим cursor и onclick на head
  html=html.replace('class="funnel-head"',`class="funnel-head" style="cursor:pointer" onclick="toggleStage(this)"`);
  html=html.replace('<div class="funnel-label">','<div class="funnel-label"><span class="chev" style="display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-weight:var(--fw-b)">›</span> ');
 }
 return html;
}
function funnelSide(side,fs,icon){ if(!fs)return'';
 return `<div class="funnel-side"><div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span>
 <div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div>
 <span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}">ИР ${fs.ir}% · ${esc(fs.ir_status_label||'')}</span></div>
 <div class="fs-legend"><span><b>факт</b> за месяц</span><span>/ <b>план</b> месяца</span><span>· % выполнения</span></div>
 ${(fs.stages||[]).map(st=>stageCard(side,st)).join('')}</div>`;
}
/* Парная сетка: каждый i-й этап покупателя в одной строке grid с i-м этапом продавца → align-items:stretch выровняет высоту автоматически */
function renderFunnelsPaired(buyer,seller){
 const head=(fs,icon,side)=>`<div><div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span><div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div><span class="status-badge ${SB[fs.ir_status]||'sb-no_data'}">ИР ${fs.ir}% · ${esc(fs.ir_status_label||'')}</span></div><div class="fs-legend"><span><b>факт</b> за месяц</span><span>/ <b>план</b> месяца</span><span>· % выполнения</span></div></div>`;
 const bs=(buyer.stages||[]).map(st=>stageCard('buyer',st));
 const ss=(seller.stages||[]).map(st=>stageCard('seller',st));
 const rows=Math.max(bs.length,ss.length);
 const cells=[head(buyer,'🛒','buyer'),head(seller,'🏠','seller')];
 for(let i=0;i<rows;i++){
  cells.push(`<div class="row-stage">${bs[i]||''}</div>`);
  cells.push(`<div class="row-stage">${ss[i]||''}</div>`);
 }
 return `<div class="funnel-grid-paired">${cells.join('')}</div>`;
}

 if(!exp.length&&!today.length&&!week.length) return '';

/* ─── ГЛАВНАЯ ─── */
function renderMain(d){
 const f=d.funnel; const out=[];
 const isG0 = !!(d.user && d.user.is_group_zero);
 const isNewbie = !isG0 && d.user && typeof d.user.stazh_months==='number' && d.user.stazh_months < 1;
 if (isG0) {
   out.push(`<div class="banner" style="background:#fff7e6;border:1px solid #fcd34d;color:#92400e;padding:12px 14px;border-radius:var(--r-md,12px);margin-bottom:12px">
     🛌 <b>Ты в группе 0</b> — план не считается. Чтобы получить цели, нужно попасть в светофор опытных (наработать историю в архиве).
   </div>`);
 } else if (isNewbie) {
   out.push(`<div class="banner" style="background:#ecfdf5;border:1px solid #86efac;color:#065f46;padding:12px 14px;border-radius:var(--r-md,12px);margin-bottom:12px">
     🌱 <b>Ты в начале пути · стаж &lt; 1 мес.</b> Плановые показатели появятся с 1-го числа следующего месяца. Сейчас сосредоточься на горячих клиентах и первых задатках — система их уже видит.
   </div>`);
 }
 if(f&&f.buyer){
 // TZ-A29: общий ИР и полосы Покуп/Прод — все три числа из новой 4-составляющей модели,
 // чтобы шапка не расходилась со скобками. Fallback на старую модель если ir_v2 пуст.
 const v2 = d.ir_v2?.week;
 const v2m = d.ir_v2?.month;
 const irHist=d.ir_history||{now:{total:f.ir_total,buyer:f.ir_buyer,seller:f.ir_seller},week_history:{buyer:[],seller:[],total:[]},month_history:{buyer:[],seller:[],total:[]}};
 if (v2 && typeof v2.ir_total === 'number') {
   irHist.now = { ...irHist.now,
     total: v2.ir_total,
     buyer: typeof v2.buyer_pct === 'number' ? v2.buyer_pct : irHist.now.buyer,
     seller: typeof v2.seller_pct === 'number' ? v2.seller_pct : irHist.now.seller,
   };
   irHist.week = { total: v2.ir_total, buyer: irHist.now.buyer, seller: irHist.now.seller };
 }
 if (v2m && typeof v2m.ir_total === 'number') {
   irHist.month = {
     total: v2m.ir_total,
     buyer: typeof v2m.buyer_pct === 'number' ? v2m.buyer_pct : v2m.ir_total,
     seller: typeof v2m.seller_pct === 'number' ? v2m.seller_pct : v2m.ir_total,
   };
 }
 if (!isG0) out.push(renderIrCard({ir_history:irHist, isPartner:true, periodLabel:f.period_label}));
 // Скобки «ИР X% · …» у каждой стороны — из МЕСЯЧНОГО v2 (воронка показывает
 // месячные факт/план, поэтому ИР воронки тоже месячный — иначе рассинхрон со скобкой).
 const vSrc = v2m || v2;
 if (vSrc) {
   const sideSt = (p) => p >= 70 ? 'green' : (p >= 50 ? 'yellow' : 'red');
   const sideLbl = { green: 'в норме', yellow: 'в риске', red: 'провал' };
   if (typeof vSrc.buyer_pct === 'number') {
     f.buyer.ir = vSrc.buyer_pct;
     f.buyer.ir_status = sideSt(vSrc.buyer_pct);
     f.buyer.ir_status_label = sideLbl[f.buyer.ir_status];
   }
   if (typeof vSrc.seller_pct === 'number') {
     f.seller.ir = vSrc.seller_pct;
     f.seller.ir_status = sideSt(vSrc.seller_pct);
     f.seller.ir_status_label = sideLbl[f.seller.ir_status];
   }
 }
 out.push(`<div class="card">${renderFunnelsPaired(f.buyer,f.seller)}</div>`);
 if(!(d.ai_coach&&d.ai_coach.motivator_text)){
 const rec=d.coach?.buyer?.recommendation_for_realtor||d.coach?.seller?.recommendation_for_realtor;
 if(rec) out.push(`<div class="card"><div class="section-title">💡 Совет дня</div><div class="tip">${esc(rec)}</div></div>`);
 }
 } else out.push(`<div class="banner">Нет данных воронки — поставь цель, чтобы увидеть план и факт.</div>`);
 out.push(tasksPreview(d));
 out.push(aiCardMain(d));
 out.push(helpCard(d));
 document.getElementById('screen-main').innerHTML=out.join('');
}

/* ─── TZ-A34: Вкладка «Прогноз» (партнёр) ─── */
const PRG_MODE_KEY = 'prognoz_mode_p';
function _prgFmtK(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' млн'; if(n>=1e4) return Math.round(n/1e3)+'к'; if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+'к'; return String(Math.round(n)); }
function _prgFmtFull(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function _monthShortRu(ym){ const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; return m[parseInt(ym.slice(5,7),10)-1]||ym; }

function renderPrognoz(d){
  const pt = d.prognoz_tab;
  const f = d.forecast;
  const goal = d.goal;
  const u = d.user;
  const out = [];

  // Граничные случаи: новичок / Группа 0 — показываем нейтральную карточку
  if (u && (u.is_group_zero || (typeof u.stazh_months==='number' && u.stazh_months<1))) {
    const msg = u.is_group_zero
      ? '🛌 Ты в Группе 0 — план и прогноз не считаются.'
      : '🌱 Стаж меньше месяца — план и прогноз появятся с 1-го числа первого полного месяца.';
    document.getElementById('screen-prognoz').innerHTML =
      `<div class="card"><div class="section-title">📅 Прогноз</div><div class="banner" style="background:#fff7e6;border:1px solid #fcd34d;color:#92400e;padding:12px 14px;border-radius:10px">${msg}</div></div>`;
    return;
  }
  if (!pt || !pt.monthly || !pt.monthly.length) {
    document.getElementById('screen-prognoz').innerHTML =
      `<div class="card"><div class="section-title">📅 Прогноз</div><div class="soon"><span class="soon-ic">📈</span>Прогноз появится после первого месячного снапшота.</div></div>`;
    return;
  }

  // Mode toggle: dohod (по умолч.) / val
  let mode = localStorage.getItem(PRG_MODE_KEY) || 'dohod';
  if (!['dohod','val'].includes(mode)) mode='dohod';

  // ── 1. Hero: вал + доход за текущий месяц ──
  const cur = pt.monthly.find(m=>m.is_current) || pt.monthly[pt.monthly.length-1];
  const goalRevMonth = goal ? Number(goal.target_revenue_month)||0 : 0;
  const valFact = cur.fact_revenue||0;
  const valPlan = cur.plan_revenue||0;
  const valPct = valPlan>0 ? Math.round(valFact/valPlan*100) : 0;
  const incFact = cur.fact_income||0;
  const incGoal = goalRevMonth || cur.plan_income||0;
  const incPct = incGoal>0 ? Math.round(incFact/incGoal*100) : 0;
  out.push(`<div class="card">
    <div class="section-title">💰 ${esc(_monthShortRu(cur.ym))} · вал и доход</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:#eff6ff;border:1px solid #cfe3fb;border-radius:8px;padding:14px 16px">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Вал · оборот</div>
        <div style="font-size:24px;font-weight:800;color:#1e63d9;margin:5px 0 2px">${_prgFmtFull(valFact)} ₽</div>
        <div style="font-size:12px;color:var(--muted)">план ${_prgFmtFull(valPlan)} ₽</div>
        ${valPlan>0?`<div style="display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:7px;background:#dbeafe;color:#1e40af">${valPct}% плана</div>`:''}
      </div>
      <div style="background:#e7f7ef;border:1px solid #b9e6cd;border-radius:8px;padding:14px 16px">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Доход · моя ЗП</div>
        <div style="font-size:24px;font-weight:800;color:#0e7a4f;margin:5px 0 2px">${_prgFmtFull(incFact)} ₽</div>
        <div style="font-size:12px;color:var(--muted)">${goalRevMonth>0?'личная цель '+_prgFmtFull(incGoal):'≈ 48% от вала'} ₽</div>
        ${incGoal>0?`<div style="display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:7px;background:#d1f0df;color:#0b5236">${incPct}% цели</div>`:''}
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px">💡 <b>Вал</b> — оборот (комиссия агентства, по нему план и ИР). <b>Доход</b> — твоя ЗП (≈ 48% от вала).</div>
  </div>`);

  // ── 2. График по месяцам — переключатель Доход/Вал ──
  out.push(`<div class="card">
    <div class="section-title">📊 Цикл по месяцам</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Переключи: <b>доход</b> (твоя ЗП, к ней цель) или <b>вал</b> (оборот, план). Зелёное — факт, синее — прогноз, штриховка — план.</div>
    <div style="display:inline-flex;background:var(--surface-2,#f1f3f7);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px">
      <button onclick="prgSetMode('dohod')" id="prg-btn-dohod" style="border:none;background:${mode==='dohod'?'var(--surface,#fff)':'transparent'};font-family:inherit;font-size:12px;font-weight:700;color:${mode==='dohod'?'var(--brand)':'var(--muted)'};padding:6px 15px;border-radius:999px;cursor:pointer;${mode==='dohod'?'box-shadow:0 1px 2px rgba(0,0,0,.1)':''}">Доход (моя ЗП)</button>
      <button onclick="prgSetMode('val')" id="prg-btn-val" style="border:none;background:${mode==='val'?'var(--surface,#fff)':'transparent'};font-family:inherit;font-size:12px;font-weight:700;color:${mode==='val'?'var(--brand)':'var(--muted)'};padding:6px 15px;border-radius:999px;cursor:pointer;${mode==='val'?'box-shadow:0 1px 2px rgba(0,0,0,.1)':''}">Вал (оборот)</button>
    </div>
    <div id="prg-bars-wrap"></div>
  </div>`);

  // ── 3. Путь к цели по доходу ──
  out.push(`<div class="card">
    <div class="section-title">🎯 Как я иду к цели по доходу</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Накопительный доход за цикл vs плановый темп.</div>
    <div id="prg-goal-svg"></div>
  </div>`);

  // ── 4. Цель по доходу ──
  if (goal) {
    const goalLbl = goal.target_revenue_month_short || _prgFmtFull(goal.target_revenue_month);
    const changeTxt = goal.change_count>0 ? `менял ${goal.change_count} раз` : 'не менял';
    out.push(`<div class="card">
      <div class="section-title">💵 Цель по доходу (ставишь сам)</div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div><div style="font-size:18px;font-weight:800">${esc(goalLbl)} ₽</div><div style="font-size:11px;color:var(--muted)">текущая цель${goal.is_auto?' (авто)':''}</div></div>
        <div style="font-size:12px;color:var(--muted)">${changeTxt}</div>
        ${goal.can_change?'<button class="b-secondary" onclick="openEditGoal()" style="margin-left:auto;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2,#f1f3f7);cursor:pointer">Изменить</button>':''}
      </div>
    </div>`);
  }

  // ── 5. Сделки за цикл по сегментам (с разбивкой по месяцам) ──
  if (pt.segments && pt.segments.length) {
    const rows = pt.segments.map((s, idx)=>{
      const headParts=[];
      if (s.b_deals>0) headParts.push(`<span style="color:var(--muted)">🛒 покуп: <b style="color:var(--ink)">${s.b_deals}</b> · ${_prgFmtFull(s.b_revenue)} ₽</span>`);
      if (s.s_deals>0) headParts.push(`<span style="color:var(--muted)">🏠 прод: <b style="color:var(--ink)">${s.s_deals}</b> · ${_prgFmtFull(s.s_revenue)} ₽</span>`);
      // помесячные строки внутри сегмента
      const monthRows = (s.months||[]).map(m=>{
        const mParts=[];
        if (m.b_deals>0) mParts.push(`<span style="color:var(--muted)">🛒 <b style="color:var(--ink)">${m.b_deals}</b> · ${_prgFmtFull(m.b_revenue)} ₽</span>`);
        if (m.s_deals>0) mParts.push(`<span style="color:var(--muted)">🏠 <b style="color:var(--ink)">${m.s_deals}</b> · ${_prgFmtFull(m.s_revenue)} ₽</span>`);
        const mTotal = (m.b_revenue||0)+(m.s_revenue||0);
        return `<div style="display:flex;align-items:center;gap:11px;padding:7px 0;border-top:1px dashed var(--line)">
          <div style="width:46px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600">${_monthShortRu(m.ym)}</div>
          <div style="flex:1;font-size:11px;display:flex;gap:11px;flex-wrap:wrap">${mParts.join('')}</div>
          <div style="font-size:12px;font-weight:700;color:#0e7a4f;white-space:nowrap">${_prgFmtFull(mTotal)} ₽</div>
        </div>`;
      }).join('');
      return `<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">

      </div>`;
    }).join('');

      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Что закрыто за весь цикл (текущие 6 мес). Доход ≈ 48% от вала. Кликни на сегмент — раскроется по месяцам.</div>

        <div style="text-align:right"><div style="font-size:18px;font-weight:800;color:#0e7a4f">${_prgFmtFull(tot.revenue||0)} ₽ <span style="font-size:11px;color:var(--muted);font-weight:600">вал</span></div><div style="font-size:13px;font-weight:700;color:#0e7a4f">${_prgFmtFull(tot.income||0)} ₽ <span style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase">доход</span></div></div>
      </div>
    </div>`);
  }

  document.getElementById('screen-prognoz').innerHTML = out.join('');
  prgRenderBars(pt, mode);

}

function prgRenderBars(pt, mode){
  const wrap = document.getElementById('prg-bars-wrap'); if (!wrap) return;
  const months = pt.monthly||[];
  const isDohod = mode==='dohod';
  const vals = months.map(m=>{
    const fact = isDohod?(m.fact_income||0):(m.fact_revenue||0);
    const fcst = isDohod?(m.forecast_income||0):(m.forecast_revenue||0);
    const plan = isDohod?(m.plan_income||0):(m.plan_revenue||0);
    return {ym:m.ym, fact, fcst, plan, is_current:m.is_current, is_future:m.is_future, is_past:m.is_past};
  });
  const max = Math.max(...vals.map(v=>Math.max(v.fact,v.fcst,v.plan)), 1);
  const cols = vals.map(v=>{
    const planH = Math.round((v.plan||0)/max*100);
    const factH = Math.round((v.fact||0)/max*100);
    const fcstH = v.fcst>0 ? Math.round(v.fcst/max*100) : 0;
    const showVal = v.fact>0 ? v.fact : (v.fcst>0?v.fcst:0);
    const isForecast = v.is_future || (v.is_current && v.fcst>0 && v.fcst>v.fact);
    const barColor = v.is_past?'linear-gradient(180deg,#22c55e,#16a34a)' : v.is_current?'linear-gradient(180deg,#10b981,#0e7a4f)' : 'linear-gradient(180deg,#3b82f6,#1e63d9)';
    const barH = isForecast?fcstH:factH;
    const fillStyle = `position:absolute;bottom:0;left:0;right:0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;background:${barColor};height:${barH}%`;
    const planStyle = `position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 4px,#e2e8f0 4px,#e2e8f0 8px);border-radius:6px;opacity:.7;height:${planH}%`;
    const captionFor = v.is_current?'сейчас':(v.is_future?'прогноз':'факт');
    const valLabel = showVal>0 ? _prgFmtK(showVal) : '—';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px;height:100%">
      <div style="font-size:9px;color:${v.is_current?'var(--brand)':'transparent'};text-transform:uppercase;letter-spacing:.4px;font-weight:700">${captionFor}</div>
      <div style="position:relative;flex:1;width:100%;background:#f1f5f9;border-radius:6px;overflow:hidden;min-height:120px">
        <div style="${planStyle}"></div>
        ${barH>0?`<div style="${fillStyle}"><span style="color:#fff;font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.15)">${valLabel}</span></div>`:''}
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3">${valLabel} / ${_prgFmtK(v.plan)}</div>
      <div style="font-size:11px;color:${v.is_current?'var(--brand)':'var(--muted)'};font-weight:600;text-transform:uppercase">${_monthShortRu(v.ym)}</div>
    </div>`;
  }).join('');
  const planTotal = vals.reduce((s,v)=>s+(v.plan||0),0);
  const factTotal = vals.filter(v=>!v.is_future).reduce((s,v)=>s+(v.fact||0),0);
  const fcstNext = (vals.find(v=>v.is_future)||{}).fcst||0;
  wrap.innerHTML = `<div style="background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px">
    <div style="display:grid;grid-template-columns:repeat(${vals.length},1fr);gap:8px;align-items:end;height:200px;margin-bottom:10px">${cols}</div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap">
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 2px,#e2e8f0 2px,#e2e8f0 4px)"></i>план / цель</span>
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:linear-gradient(180deg,#22c55e,#16a34a)"></i>факт</span>
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:linear-gradient(180deg,#3b82f6,#1e63d9)"></i>прогноз</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding-top:8px;flex-wrap:wrap;gap:8px">
      <span style="color:var(--muted)">За цикл: <b style="color:var(--ink)">${_prgFmtK(factTotal)}</b> из ${_prgFmtK(planTotal)} ${isDohod?'ЗП':'вала'} · прогноз след: <b style="color:var(--ink)">${_prgFmtK(fcstNext)}</b></span>
      <span style="font-weight:700;color:${factTotal>=planTotal*0.9?'var(--ok)':'var(--warn)'}">${factTotal>=planTotal?'▲ опережаем план':factTotal>=planTotal*0.7?'≈ в плане':'▼ отстаём'}</span>
    </div>
  </div>`;
}

function prgRenderGoalSvg(pt){
  const wrap = document.getElementById('prg-goal-svg'); if (!wrap) return;
  const months = pt.monthly||[];
  // путь по ДОХОДУ накопительно (CLAUDE.md §6)
  const planAcc = []; const factAcc = []; let pS=0, fS=0;
  let lastFactIdx = -1;
  months.forEach((m,i)=>{
    pS += m.plan_income||0; planAcc.push(pS);
    if (m.is_future) { factAcc.push(null); return; }
    fS += m.fact_income||0; factAcc.push(fS);
    if ((m.fact_income||0) > 0 || m.is_current) lastFactIdx = i;
  });
  const total = planAcc[planAcc.length-1] || 1;
  // ratio для зверя — берём последнюю точку с фактом
  const idx = lastFactIdx>=0 ? lastFactIdx : 0;
  const factVal = factAcc[idx]||0;
  const planVal = planAcc[idx]||1;
  const ratio = planVal>0 ? factVal/planVal : 0;
  let animal, col, label;
  if (ratio>=1.05) { animal='cheetah'; col='#16a34a'; label='🐆 гепард — опережаешь!'; }
  else if (ratio>=0.85) { animal='hare'; col='#d97706'; label='🐇 заяц — идёшь ровно'; }
  else { animal='turtle'; col='#dc2626'; label='🐢 черепаха — поднажми'; }

  const W=920, H=280, pl=44, pr=20, pt2=34, pb=38, cw=W-pl-pr, ch=H-pt2-pb, n=months.length;
  const x = i => pl + cw * i / (n-1);
  const y = v => pt2 + ch * (1 - (v||0)/total);

  let s='';
  // grid + ось Y
  for (let g=0;g<=4;g++){
    const gy = pt2 + ch*g/4;
    s += `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#eef0f4"/>`;
    s += `<text x="${pl-7}" y="${gy+3}" text-anchor="end" font-size="9" fill="#b4b9c5">${100-g*25}%</text>`;
  }
  // подписи месяцев
  months.forEach((m,i)=>{
    s += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#7a8194">${_monthShortRu(m.ym)}</text>`;
  });
  // плановая линия (пунктир)
  s += `<polyline points="${planAcc.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  // факт-линия (синяя) — заполненные точки до последней
  const fpts = factAcc.map((v,i)=> v==null ? null : [x(i), y(v)]).filter(Boolean);
  if (fpts.length > 1) {
    const area = `${fpts[0][0]},${y(0)} ${fpts.map(p=>p.join(',')).join(' ')} ${fpts[fpts.length-1][0]},${y(0)}`;
    s += `<polygon points="${area}" fill="#16a34a" opacity="0.10"/>`;
    s += `<polyline points="${fpts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  fpts.forEach((p,i)=>{
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#16a34a" stroke-width="3"/>`;
  });
  // Зверь на последней точке
  if (fpts.length>0 && idx<n) {
    const last = [x(idx), y(factVal)];
    let beast='';
    if (animal==='cheetah') {
      beast = `<ellipse cx="0" cy="-12" rx="17" ry="9" fill="${col}"/>`
        + `<circle cx="15" cy="-18" r="7" fill="${col}"/><circle cx="17" cy="-19" r="1.6" fill="#fff"/>`
        + `<path d="M 10 -23 l 3 -4 M 18 -24 l 1 -4" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`
        + `<path d="M -16 -12 q -10 -2 -14 4" stroke="${col}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
        + `<circle cx="-6" cy="-14" r="2" fill="#fff"/><circle cx="9" cy="-15" r="2" fill="#fff"/>`;
    } else if (animal==='hare') {
      beast = `<ellipse cx="0" cy="-10" rx="11" ry="13" fill="${col}"/>`
        + `<circle cx="0" cy="-24" r="8" fill="${col}"/>`
        + `<ellipse cx="-4" cy="-36" rx="3.5" ry="10" fill="${col}"/>`
        + `<ellipse cx="4" cy="-36" rx="3.5" ry="10" fill="${col}"/>`
        + `<circle cx="-3" cy="-25" r="1.7" fill="#fff"/><circle cx="3" cy="-25" r="1.7" fill="#fff"/>`;
    } else {
      beast = `<ellipse cx="0" cy="-10" rx="14" ry="10" fill="${col}"/>`
        + `<path d="M -14 -10 a 14 9 0 0 1 28 0" fill="none" stroke="#fff" stroke-width="1.5"/>`
        + `<circle cx="15" cy="-13" r="6" fill="${col}"/><circle cx="17" cy="-14" r="1.5" fill="#fff"/>`;
    }
    s += `<g transform="translate(${last[0]},${last[1]})">`
      + `<circle cx="0" cy="0" r="9" fill="none" stroke="${col}" stroke-width="2" opacity="0.4"/>`
      + `<g transform="translate(0,-30)">${beast}</g>`
      + `<text x="0" y="-50" text-anchor="middle" font-size="11" font-weight="800" fill="${col}">это я!</text>`
      + `<text x="0" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="${col}">${label}</text>`
      + `</g>`;
  }
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${s}</svg>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)">
      <span><i style="display:inline-block;width:11px;height:11px;background:#cbd5e1;border-radius:2px;margin-right:5px;vertical-align:-1px"></i>плановый темп</span>
      <span><i style="display:inline-block;width:11px;height:11px;background:#16a34a;border-radius:2px;margin-right:5px;vertical-align:-1px"></i>мой путь</span>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--muted);background:#f7f9fc;border-radius:8px;padding:9px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">Твой темп — это зверь на графике:
      <span><b style="color:#16a34a">🐆 гепард</b> — опережаешь</span>
      <span><b style="color:#d97706">🐇 заяц</b> — идёшь ровно</span>
      <span><b style="color:#dc2626">🐢 черепаха</b> — отстаёшь</span>
    </div>`;
}

// этап воронки 12 мес в стиле главной (stage-card): значение + бар-конверсия + раскрытие сегментов
function f12Stage(side,label,sub,value,convPct,isFirst,segRows){
 const has=segRows&&segRows.length;
 const barW=isFirst?100:Math.min(100,convPct);
 const conv=isFirst?'':`<span class="stage-numbers">конв. <b style="color:var(--brand)">${convPct}%</b></span>`;
 return `<div class="stage-card" style="--sc:${SIDE_COLOR[side]}">
 <div class="stage-head" onclick="toggleStage(this)"><span class="chev">${has?'›':''}</span>
 <span class="stage-label">${esc(label)} <span style="font-weight:var(--fw-r);color:var(--muted);font-size:var(--fs-11)">${esc(sub)}</span></span>
 <span class="stage-numbers"><b>${value}</b>${conv?' · ':''}${conv}</span></div>
 <div class="stage-bar"><div class="stage-bar-fill" style="width:${barW}%;background:${SIDE_COLOR[side]}"></div></div>
 ${has?`<div class="stage-seg hidden">${segRows.join('')}</div>`:''}</div>`;
}
function f12SegRow(label,left,right){ return `<div class="seg-row"><span class="sv">${esc(label)}</span><span>${esc(left)}</span><b>${esc(right)}</b></div>`; }
function f12Buyer(a,segs){ if(!a)return'';
 const sr=(segs||[]).filter(s=>s.flow>0||s.deals>0).map(s=>f12SegRow(s.label,'доля '+s.flow_pct+'%',s.deals+' сд/мес'));
 return f12Stage('buyer','Поток','вход/мес',a.flow,100,true,null)
 +f12Stage('buyer','Горячие','/мес',a.hot,a.conv_hot,false,null)
 +f12Stage('buyer','Задатки','/мес',a.deposits,a.conv_dep,false,null)
 +f12Stage('buyer','Сделки','/мес',a.deals,a.conv_deal,false,sr);
}
function f12Seller(a,segs){ if(!a)return'';
 const sr=(segs||[]).filter(s=>s.objects>0||s.deals>0).map(s=>f12SegRow(s.label,s.objects+' ОН',s.deals+' сд/мес'));
 return f12Stage('seller','Объекты в базе','шт',a.objects,100,true,null)
 +f12Stage('seller','Горячие ОН','/мес',a.hot,a.conv_hot,false,null)
 +f12Stage('seller','Задатки','/мес',a.deposits,a.conv_dep,false,null)
 +f12Stage('seller','Сделки','/мес',a.deals,a.conv_deal,false,sr);
}
