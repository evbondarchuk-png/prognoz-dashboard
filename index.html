<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз — Кабинет партнёра</title>
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }
</script>
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --surface2:#f1f3f7;
    --ink:#1a1f2e; --muted:#7a8194; --line:#e6e8ee;
    --brand:#2b6cb0; --brand-soft:#eaf2fb;
    --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
    --st-green:#16a34a; --st-yellow:#d97706; --st-red:#dc2626;
    --green-bg:#e9f6ec; --yellow-bg:#fdf3e3; --red-bg:#fdeaea; --nd-bg:#eef0f4;
    --radius:14px;
    --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-bottom:24px}
  .header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
  .logo{font-size:16px;font-weight:800;color:var(--brand)} .logo span{color:var(--muted);font-weight:500}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .date-badge{font-size:12px;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:20px}
  .btn{font-size:12px;color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .container{max-width:1080px;margin:0 auto;padding:16px}
  @media(min-width:860px){.container{padding:24px 28px}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  /* адаптивная сетка: 1 колонка на телефоне, 2 на широком экране */
  .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
  .muted{color:var(--muted);font-size:12px}
  .section-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
  .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;font-size:13px;color:#1a4061}
  .soon{background:var(--surface2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:13px}
  .soon .soon-ic{font-size:34px;display:block;margin-bottom:8px}
  /* анонс «Coming Soon» (Клиенты/CRM) */
  .acs{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;box-shadow:var(--shadow);text-align:center}
  .acs-badge{display:inline-block;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(124,58,237,.4);margin-bottom:14px}
  .acs-title{font-size:20px;font-weight:800;margin-bottom:8px}
  .acs-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto}
  .acs-desc b{color:#7c3aed}
  .acs-features{display:grid;grid-template-columns:1fr;gap:10px;text-align:left;margin-bottom:16px}
  @media(min-width:700px){.acs-features{grid-template-columns:repeat(3,1fr)}}
  .acs-f{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;color:var(--ink)}
  .acs-f b{display:block;margin-bottom:4px;font-size:13px}
  .acs-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .acs-tag{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:rgba(124,58,237,.1);color:#5b21b6;border:1px solid rgba(124,58,237,.2)}

  /* авто-цель баннер */
  .goal-banner{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#1a4061}
  .goal-banner .gb-x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:16px;flex-shrink:0;line-height:1}
  .goal-banner .gb-edit{color:var(--brand);font-weight:700;cursor:pointer;white-space:nowrap}

  /* hero */
  .hero{position:relative}
  .hero-iconbar{position:absolute;top:0;right:0;display:flex;gap:8px}
  .hib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative}
  .hib:hover{border-color:var(--brand)}
  .hib-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--st-red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .profile{display:flex;align-items:flex-start;gap:14px}
  .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff;flex-shrink:0}
  .role-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
  .hero-name{font-size:20px;font-weight:800;line-height:1.15}
  .hero-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .sf-mini{margin-top:10px;display:inline-flex;align-items:baseline;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 14px;cursor:pointer}
  .sf-mini b{font-size:24px;font-weight:800;color:var(--ink)} .sf-mini .sf-z{font-size:11px}

  /* достижения */
  .achievements{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;padding-bottom:2px}
  .ach-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--green-bg);color:#14532d;border:1px solid #bbf7d0;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}

  /* income-track */
  .income-track{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .it-row{display:flex;gap:14px;margin-bottom:10px}
  .it-half{flex:1}
  .it-cap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:4px}
  .it-val{font-size:22px;font-weight:800}
  .it-val.target{color:var(--brand)}
  .it-bar{height:12px;background:var(--nd-bg);border-radius:7px;overflow:hidden;margin-bottom:10px}
  .it-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
  .it-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted)}
  .it-link{color:var(--brand);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .it-link:hover{text-decoration:underline}

  /* верхние табы */
  .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
  .rtab{font-size:14px;padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
  .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
  .rtab.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .screen{display:none} .screen.on{display:block}

  /* ИР */
  .ir-top{display:flex;align-items:center;gap:18px}
  .ir-big{font-size:46px;font-weight:800;line-height:1}
  .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
  .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:12px;font-weight:600}
  .bar-bg{height:8px;background:var(--nd-bg);border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
  .status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
  .sb-green{background:var(--green-bg);color:var(--st-green)} .sb-yellow{background:var(--yellow-bg);color:var(--st-yellow)}
  .sb-red{background:var(--red-bg);color:var(--st-red)} .sb-no_data{background:var(--nd-bg);color:var(--muted)}

  /* воронки */
  .funnel-side{margin-bottom:14px}
  .fs-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
  .fs-title{display:flex;align-items:center;gap:8px}
  .fs-dot{width:10px;height:10px;border-radius:3px}
  .stage-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--buyer));border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
  .stage-card:hover{box-shadow:var(--shadow)}
  .stage-head{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .chev{color:var(--muted);font-size:12px;transition:transform .2s} .chev.open{transform:rotate(90deg)}
  .stage-label{font-size:14px;font-weight:700}
  .stage-numbers{font-size:12px;color:var(--muted);white-space:nowrap} .stage-numbers b{font-weight:800;margin-left:6px}
  .stage-bar{height:10px;background:var(--nd-bg);border-radius:6px;overflow:hidden}
  .stage-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .stage-seg{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
  .stage-seg.hidden{display:none}
  .seg-row{display:grid;grid-template-columns:1fr auto 38px;gap:8px;font-size:11px;align-items:center;color:var(--muted)} .seg-row .sv{color:var(--ink);font-weight:600}
  .tip{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:13px;color:#1a4061;margin-top:6px}

  /* диагностика */
  .coach-side{padding:4px 0 10px 12px;margin-bottom:8px;border-left:3px solid var(--buyer)}
  .weak-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .weak{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--st-red)}

  /* ИИ */
  .ai-card{background:linear-gradient(135deg,#1e293b 0%,#2b3a52 100%);border-radius:var(--radius);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow)}
  .ai-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .ai-orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd66b,#f59e0b);box-shadow:0 0 24px rgba(245,158,11,.5);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
  .ai-h{font-size:14px;font-weight:800} .ai-h span{color:#ffd66b}
  .ai-text{font-size:14px;line-height:1.6;color:#cbd5e1} .ai-text b{color:#ffd66b;font-weight:700}
  .ai-note{font-size:12px;color:#7d8fa8;margin-top:10px}

  /* прогноз */
  .fc-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:700px){.fc-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
  .fc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .fc.accent{background:var(--brand-soft);border-color:#cfe1f5}
  .fc-cap{font-size:12px;color:var(--muted);font-weight:600}
  .fc-val{font-size:24px;font-weight:800;color:var(--brand);margin:2px 0}
  .fc-sub{font-size:12px;color:var(--muted)}
  .fc-big{font-size:30px;font-weight:800;color:var(--brand);margin:4px 0}
  .risk-alert{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--yellow-bg);color:#92400e;font-size:13px;font-weight:600}
  .risk-alert.surge{background:#fff7ed;color:#9a3412}
  .risk-alert.deep{background:var(--red-bg);color:#991b1b}

  /* уведомления/задачи */
  .notif{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .notif:last-child{border-bottom:none} .notif.unread .ni-title{font-weight:700}
  .ni-icon{font-size:18px} .ni-title{font-size:13px}
  .tg-title{font-size:12px;font-weight:700;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
  .tg-red{color:var(--st-red)} .tg-amber{color:var(--st-yellow)} .tg-gray{color:var(--muted)} .tg-green{color:var(--st-green)}
  .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none} .task-main{flex:1;min-width:0} .task-title{font-size:13px;font-weight:600}
  .task-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--st-green);background:transparent;color:var(--st-green);cursor:pointer;font-size:15px;flex-shrink:0}
  .task-btn:hover{background:var(--green-bg)} .task-done{color:var(--st-green)}
  /* превью задач + помощь */
  .tp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .tp-head .tp-link{font-size:12px;color:var(--brand);font-weight:700;cursor:pointer}
  .help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:14px}
  .help-btn:hover{background:#fee2e2}
  .mgr-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface2);border-radius:12px;margin-bottom:14px}
  .mgr-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#b45309);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
  .mgr-topic{padding:11px 2px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .mgr-topic:last-child{border-bottom:none}

  /* светофор */
  .svet-now{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:14px;color:#cbd5e1}
  .svet-pos-huge{font-size:60px;font-weight:800;line-height:1;background:linear-gradient(135deg,#ffd66b,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .svet-now-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
  .svet-move{font-size:13px;font-weight:600;margin-top:6px}
  .svet-zone{background:#fefce8;border:1px solid #fde68a;border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .svet-zone-name{font-size:26px;font-weight:800;color:#78350f;margin:4px 0}
  .svet-zone-sub{font-size:13px;color:#92400e}
  .sv-league{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;font-size:12px}
  .sv-league.you{background:#fef3c7;border:1px solid #fcd34d}
  .sv-l-tag{color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;text-align:center}
  .sv-l-name{font-weight:600} .sv-l-inc{color:var(--muted)}
  /* график движения */
  .mv-row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:12px}
  .mv-row.now .mv-bar-fill{background:linear-gradient(90deg,#ffd66b,#f59e0b)}
  .mv-bar{height:14px;background:var(--nd-bg);border-radius:7px;overflow:hidden}
  .mv-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
  .mv-pos{font-weight:700;white-space:nowrap}
  .mv-now-tag{font-size:10px;color:var(--gold);font-weight:700;margin-left:4px}

  /* модалки */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
  .modal-overlay.on{display:flex}
  .modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:20px 18px 28px;max-height:90vh;overflow-y:auto}
  @media(min-width:641px){.modal-overlay{align-items:center}.modal{border-radius:18px}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-title{font-size:17px;font-weight:800}
  .modal-x{font-size:22px;color:var(--muted);cursor:pointer;line-height:1;background:none;border:none}
  .goal-input{width:100%;font-size:22px;font-weight:800;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;text-align:center;margin-bottom:12px}
  .f-label{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
  .f-input,.f-area,.f-select{width:100%;font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:var(--surface)}
  .f-area{min-height:70px;resize:vertical}
  .add-task-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px dashed #c9cedb;background:var(--surface2);color:var(--brand);border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:14px}
  .add-task-btn:hover{border-color:var(--brand)}
  .task-skip{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit;padding:2px 6px}
  .task-skip:hover{color:var(--st-red)}
  .nt-markall{font-size:12px;color:var(--brand);font-weight:700;cursor:pointer}
  .preset{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-family:inherit;font-size:14px;text-align:left;margin-bottom:8px}
  .preset:hover{border-color:var(--brand)} .preset b{font-weight:800;color:var(--brand)}
  .modal-save{width:100%;padding:14px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .modal-save:disabled{opacity:.6}
  .modal-warn{font-size:12px;color:var(--st-yellow);background:var(--yellow-bg);border-radius:8px;padding:10px 12px;margin-top:10px}
  .hof-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .hof-item:last-child{border-bottom:none}

  #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1100;color:var(--muted)}
  #overlay.hidden{display:none}
</style>
</head>
<body>
<div id="overlay">Загрузка кабинета…</div>

<div class="header">
  <div class="logo">Прогноз<span> · кабинет</span></div>
  <div class="header-right">
    <a id="backBtn" class="btn" href="#" style="display:none" onclick="history.back();return false">← Назад</a>
    <span class="date-badge" id="dateBadge"></span>
    <button class="btn" id="logoutBtn">Выход</button>
  </div>
</div>

<div class="container">
  <div id="goalBanner"></div>
  <div id="hero"></div>
  <div class="rtab-bar" id="tabbar">
    <div class="rtab on" data-tab="main" onclick="showTab('main',this)">🏠 Главная</div>
    <div class="rtab" data-tab="prognoz" onclick="showTab('prognoz',this)">📈 Прогноз</div>
    <div class="rtab" data-tab="coach" onclick="showTab('coach',this)">🎓 Тренер</div>
    <div class="rtab" data-tab="clients" onclick="showTab('clients',this)">👥 Клиенты</div>
    <div class="rtab" data-tab="tasks" onclick="showTab('tasks',this)">📋 Задачи<span id="taskDot"></span></div>
    <div class="rtab" data-tab="svetofor" onclick="showTab('svetofor',this)">🚦 Светофор</div>
  </div>
  <div class="screen on" id="screen-main"></div>
  <div class="screen" id="screen-prognoz"></div>
  <div class="screen" id="screen-coach"></div>
  <div class="screen" id="screen-clients"></div>
  <div class="screen" id="screen-tasks"></div>
  <div class="screen" id="screen-svetofor"></div>
</div>

window.saveTask=async()=>{
  const title=document.getElementById('tkTitle').value.trim();

function daysPath(plan){ if(!plan||!plan.started_month) return null;
  const [y,m]=plan.started_month.split('-').map(Number); const start=new Date(y,m-1,1);
  const total=(plan.horizon_months||6)*30; const passed=Math.max(0,Math.round((Date.now()-start.getTime())/86400000));
  return {passed:Math.min(passed,total),total}; }

    <div class="ai-note">на YandexGPT — после слёта</div></div>`);
  document.getElementById('screen-coach').innerHTML=out.join('');
}

/* ─── ЗАДАЧИ ─── */
function taskItem(t){
  const meta=[t.priority!=='normal'?t.priority_label:'',t.due_label||t.due_date||'',t.progress_label].filter(Boolean).join(' · ');
  const actions=t.can_complete
    ? `<button class="task-skip" onclick="skipTask('${esc(t.id)}',event)" title="Отказаться">🚫</button><button class="task-btn" onclick="completeTask('${esc(t.id)}',event)">✓</button>`
    : (t.status==='done'?'<span class="task-done">✓</span>':'');
  return `<div class="task"><div class="task-main"><div class="task-title">${esc(t.title)}</div>${meta?`<div class="muted">${esc(meta)}</div>`:''}</div>
    <div style="display:flex;align-items:center;gap:4px">${actions}</div></div>`;
}
function renderTasks(d){
  const out=[]; const tb=d.tasks, nb=d.notifications;
  if(nb&&nb.recent&&nb.recent.length){
    const items=nb.recent.slice(0,5).map(n=>`<div class="notif ${n.is_read?'':'unread'}"><span class="ni-icon">${esc(n.icon||'🔔')}</span>
      <div><div class="ni-title">${esc(n.title)}</div><div class="muted">${esc(n.created_at_label||'')}</div></div></div>`).join('');
    const ma=nb.unread_count?`<span class="nt-markall" id="notifMarkAll" onclick="markAllRead(false)">✓ отметить все</span>`:'';
    out.push(`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="section-title" style="margin:0">🔔 Уведомления<span id="notifMeta">${nb.unread_count?` · ${nb.unread_count} новых`:''}</span></div>${ma}</div>${items}</div>`);
  }
  if(tb){
    const grp=(arr,title,cls)=>(arr&&arr.length)?`<div class="tg-title ${cls}">${title} · ${arr.length}</div>${arr.map(taskItem).join('')}`:'';
    const g=tb.groups;
    const body=grp(g.expired,'⚠ Просрочено','tg-red')+grp(g.today,'Срочно сегодня','tg-red')+grp(g.week,'На этой неделе','tg-amber')+grp(g.later,'Позже','tg-gray')+grp(g.done_recent,'Сделано за 14 дней','tg-green');
    out.push(`<div class="card"><div class="section-title">📋 Мои задачи</div>
      <button class="add-task-btn" onclick="openCreateTask()">➕ Создать задачу</button>
      ${body||'<div class="muted">Нет активных задач.</div>'}</div>`);
  } else out.push(`<div class="card"><div class="section-title">📋 Мои задачи</div><button class="add-task-btn" onclick="openCreateTask()">➕ Создать задачу</button><div class="muted">Нет активных задач.</div></div>`);
  out.push(helpCard(d));
  document.getElementById('screen-tasks').innerHTML=out.join('');
  const cnt=(d.tasks?.counts?.today||0)+(d.tasks?.counts?.expired||0)+(d.notifications?.unread_count||0);
  document.getElementById('taskDot').textContent = cnt?' '+cnt:'';
}

/* ─── СВЕТОФОР ─── */
const POOL_TOTAL={newbie:386,experienced:934};
function poolTotals(d){ const t=(d.meta&&d.meta.system_totals)||{}; return {newbie:t.svetofor_newbie||POOL_TOTAL.newbie, experienced:t.svetofor_experienced||POOL_TOTAL.experienced}; }
const POOL_CLR={newbie:'#16a34a',experienced:'#2b6cb0'};
function movementCard(d){
  const h=(d.position_history||[]).filter(p=>p.position!=null);
  if(h.length<2) return `<div class="card"><div class="section-title">📈 Как я двигался за 6 месяцев</div>
    <div class="soon"><span class="soon-ic">📈</span>История движения накапливается — график появится в ближайшие месяцы.</div></div>`;
  const PT=poolTotals(d);
  // линейный график (SVG). Y = высота в своём пуле (выше = ближе к топу), нормировано по пулу → пулы сопоставимы.
  const W=320,H=150,padX=14,padT=24,padB=30; const plotW=W-padX*2, plotH=H-padT-padB;
  const n=h.length; const X=i=>padX+(n>1?i*(plotW/(n-1)):plotW/2);
  const yFrac=p=>{ const tot=PT[p.pool]||PT.experienced; return Math.max(0,Math.min(1,1-(p.position/tot))); }; // 1=топ
  const Y=p=>padT+(1-yFrac(p))*plotH;
  let segs='',dots='',labels='',marks='';
  for(let i=0;i<n;i++){ const p=h[i],x=X(i),y=Y(p),clr=POOL_CLR[p.pool]||POOL_CLR.experienced;
    if(i>0){ const pp=h[i-1],x0=X(i-1),y0=Y(pp); const diff=pp.pool!==p.pool;
      segs+=`<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${clr}" stroke-width="2.5" ${diff?'stroke-dasharray="4 3"':''}/>`;
      if(diff){ const mx=(x0+x)/2; marks+=`<line x1="${mx}" y1="${padT-6}" x2="${mx}" y2="${padT+plotH}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>`; } }
    dots+=`<circle cx="${x}" cy="${y}" r="${i===n-1?5:3.5}" fill="${clr}"/>`;
    labels+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1f2e">#${p.position}</text>`;
    labels+=`<text x="${x}" y="${H-12}" text-anchor="middle" font-size="9" fill="#7a8194">${esc(p.label.split(' ')[0])}</text>`;
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${marks}${segs}${dots}${labels}</svg>`;
  const legend=`<div style="display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:4px">
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${POOL_CLR.newbie};vertical-align:middle"></span> светофор новичков</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${POOL_CLR.experienced};vertical-align:middle"></span> светофор опытных</span></div>`;
  const samePool=h.every(p=>p.pool===h[0].pool);
  let note;
  if(!samePool){ note='📈 Пунктир — переход из светофора новичков в светофор опытных (это новый, более сильный рейтинг, поэтому место «выше по номеру»).'; }
  else { const up=h[0].position-h[h.length-1].position;
    note=up>0?`📈 За 6 месяцев ты поднялся на <b>${up}</b> ${plural(up,'позицию','позиции','позиций')}. Так держать!`
      :(up<0?`За полгода позиция снизилась на ${Math.abs(up)} — есть куда расти, всё впереди.`:'Позиция держится стабильно.'); }
  return `<div class="card"><div class="section-title">📈 Как я двигался за 6 месяцев</div>${svg}${legend}
    <div class="muted" style="margin-top:10px">${note}</div></div>`;
}
function plural(n,a,b,c){ const m10=n%10,m100=n%100; if(m10===1&&m100!==11)return a; if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b; return c; }
function zoneColor(cat){ cat=String(cat||''); if(cat.includes('Самые'))return '#16a34a'; if(cat.includes('Лучшие'))return '#22c55e'; if(cat.includes('Хорошие'))return '#86efac'; if(cat.includes('Средние'))return '#fbbf24'; if(cat.includes('Слабые'))return '#fb923c'; return '#f87171'; }
function renderSvetofor(d){
  const u=d.user; const pool=u.svetofor_pool;
  if(!pool){
    document.getElementById('screen-svetofor').innerHTML=`<div class="card"><div class="section-title">🚦 Светофор</div>
      <div class="soon"><span class="soon-ic">🚦</span>У тебя пока нет позиции в светофоре. Появится после первой сделки и попадания в рейтинг.</div></div>${movementCard(d)}`;
    return;
  }
  const dc=u.position_delta_direction==='up'?'#4ade80':(u.position_delta_direction==='down'?'#f87171':'#cbd5e1');
  const head=`<div class="svet-now">
    <div style="font-size:12px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">🚦 ${esc(u.svetofor_pool_label||'')}</div>
    <div class="svet-pos-huge">${u.position_in_pool!=null?'#'+u.position_in_pool:'—'}</div>
    <div class="svet-now-lbl">${esc(u.position_label||'')}</div>
    ${u.position_delta_label?`<div class="svet-move" style="color:${dc}">${esc(u.position_delta_label)}</div>`:''}</div>`;
  if(pool==='newbie'){
    document.getElementById('screen-svetofor').innerHTML=`${head}
      <div class="card"><div class="section-title">📘 Светофор новичков</div>
        <div style="font-size:13px;line-height:1.65">Ты в рейтинге партнёров первых <b>6 месяцев</b> работы. Здесь ты учишься, получаешь первые сделки и нарабатываешь опыт.<br><br>
        После 6 месяцев стажа автоматически перейдёшь в <b>светофор опытных</b> — там появятся зоны и доходные ориентиры (от 9к до 768к ₽/мес).<br><br>
        Сейчас задача — стабильно работать и двигаться вверх в этом светофоре.</div></div>
      ${movementCard(d)}`;
    return;
  }
  // опытный
  const zb=u.svetofor_zone_label?`<div class="svet-zone"><div class="muted" style="text-transform:uppercase;letter-spacing:.05em;font-weight:700">Твоя зона</div>
    <div class="svet-zone-name">${esc(u.svetofor_zone_category||'')} ${esc(u.svetofor_zone_label)}</div>
    ${u.svetofor_zone_avg_income_short?`<div class="svet-zone-sub">средний доход ${esc(u.svetofor_zone_avg_income_short)} ₽/мес</div>`:''}</div>`
    :`<div class="svet-zone"><div class="muted">Зона определяется по месту в светофоре опытных.</div></div>`;
  const zones=(d.meta&&d.meta.svetofor_zones_experienced)||[];
  const zlist=zones.length?`<div class="card"><div class="section-title">🚦 Зоны светофора опытных</div>
    ${zones.map(z=>`<div class="sv-league ${z.is_current?'you':''}"><span class="sv-l-tag" style="background:${zoneColor(z.category)};color:${zoneColor(z.category)==='#86efac'?'#0f172a':'#fff'}">${esc(z.range)}</span>
      <span class="sv-l-name">${esc(z.category||'')}${z.is_current?' · ты':''}</span><span class="sv-l-inc">${fmtShort(z.avg_income)} ₽</span></div>`).join('')}</div>`:'';
  document.getElementById('screen-svetofor').innerHTML=`<div class="grid-2">${head}${zb}</div>${zlist}${movementCard(d)}`;
}

/* ─── МОДАЛКА «Изменить цель» ─── */
window.openEditGoal=()=>{
  const d=CTX.data; const g=d.goal; const inc=d.user.income_month;
  const cur=g?g.target_revenue_month:143415;
  const presets=[
    {v:143415,t:'Минимум — норма зоны 401–500',s:'143к ₽/мес'},
  ];
  if(inc!=null){ presets.push({v:inc+50000,t:'Текущий доход + 50к (рекомендуемая)',s:fmtShort(inc+50000)+' ₽/мес'});
    presets.push({v:inc+100000,t:'Текущий доход + 100к (амбициозная)',s:fmtShort(inc+100000)+' ₽/мес'}); }
  const locked=g&&!g.can_change;
  document.getElementById('modalGoalBody').innerHTML=`
    <div class="modal-head"><div class="modal-title">🎯 Изменить цель по доходу</div><button class="modal-x" onclick="closeModal('modalGoal')">✕</button></div>
    <input class="goal-input" id="goalInput" type="number" inputmode="numeric" value="${cur}" />
    ${presets.map(p=>`<button class="preset" onclick="document.getElementById('goalInput').value=${p.v}"><span>${esc(p.t)}</span><b>${esc(p.s)}</b></button>`).join('')}
    <button class="modal-save" id="goalSaveBtn" ${locked?'disabled':''} onclick="saveGoal()">${locked?'🔒 Менять пока нельзя':'Сохранить и пересчитать план'}</button>
    ${locked?`<div class="modal-warn">${esc(g.next_change_block_reason||'Цель можно менять не чаще раза в месяц.')}</div>`:`<div class="modal-warn">⏱ Менять цель можно не чаще раза в месяц. План пересчитается под новую цель.</div>`}`;
  document.getElementById('modalGoal').classList.add('on');
};
window.saveGoal=async()=>{
  const v=Math.round(Number(document.getElementById('goalInput').value)||0);
  if(v<30000||v>5000000){ alert('Цель должна быть от 30 000 до 5 000 000 ₽'); return; }
  const b=document.getElementById('goalSaveBtn'); b.disabled=true; b.textContent='Сохраняю…';
  try{ await window.__call('setGoal',{user_code:CTX.target,new_target_revenue:v}); location.reload(); }
  catch(e){ alert('Не удалось: '+(e.message||e)); b.disabled=false; b.textContent='Сохранить и пересчитать план'; }
};

/* ─── МОДАЛКА «Зал славы» (заглушка) ─── */

  document.getElementById('modalHofBody').innerHTML=`

    <div class="muted" style="margin-top:12px">Полная система достижений появится после слёта.</div>`;
  document.getElementById('modalHof').classList.add('on');
};

(async ()=>{
  const me=await requireAuth();
  document.getElementById('logoutBtn').onclick=logout;
  const params=new URLSearchParams(location.search);
  const targetCode=params.get('agent')||me.code;
  CTX.target=targetCode;
  if(params.get('agent')) document.getElementById('backBtn').style.display='inline-flex';
  const fns=getFunctions(getApp(),'europe-west1');
  window.__call=(name,data)=>httpsCallable(fns,name)(data).then(r=>r.data);
  try{
    const res=await httpsCallable(fns,'getDashboard')({ user_code:targetCode, view:'partner' });
    const d=res.data; CTX.data=d;
    document.getElementById('dateBadge').textContent=new Date(d.meta?.generated_at||Date.now()).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    render(d);
  }catch(e){ document.getElementById('hero').innerHTML=`<div class="banner">Не удалось загрузить кабинет: ${esc(e.message||e)}</div>`; console.error(e); }
  document.getElementById('overlay').classList.add('hidden');
})();
