<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/metrika.js"></script>
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }

<style>
 :root{
 /* Поверхности */
 --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef0f4;
 /* Линии и тени */
 --line:#e6e8ee; --line-strong:#d1d5db;
 --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
 --shadow-hover:0 2px 6px rgba(20,30,55,.08),0 10px 32px rgba(20,30,55,.08);
 /* Текст */
 --ink:#1a1f2e; --ink-soft:#3b4358; --muted:#7a8194; --muted-2:#a8aebd; --on-dark:#ffffff;
 /* Бренд */
 --brand:#2b6cb0; --brand-hover:#1f5288; --brand-soft:#eaf2fb;
 /* Семантика воронки */
 --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
 /* Статусы */
 --ok:#16a34a; --ok-bg:#e9f6ec;
 --warn:#d97706; --warn-bg:#fdf3e3;
 --bad:#dc2626; --bad-bg:#fdeaea;
 --nd:#7a8194; --nd-bg:#eef0f4;
 /* ИИ-фиолетовый */
 --ai-purple-bg-1:#f5f3ff; --ai-purple-bg-2:#ede9fe; --ai-purple-line:#ddd6fe;
 --ai-purple-ink:#5b21b6; --ai-purple-ink-strong:#4c1d95;
 /* Скругления */
 --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;
 /* Отступы */
 --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
 /* Типографика */
 --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
 --fs-20:20px; --fs-22:22px; --fs-28:28px;
 --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700; --fw-eb:800;
 /* Прочее */
 --transition:0.15s ease; --max-width:1180px; --app-header-h:56px;
 /* Совместимость со старым кодом (этапы 2-8 уберут) */
 
 }

  /* TZ-A22 §3.3 — единый каркас .hero (алиасы существующих .card + .stat-grid + .stat) */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}
  .hero-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-b);font-size:var(--fs-16);flex-shrink:0}
  .hero-info{flex:1;min-width:0}
  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-3)}
  @media(min-width:620px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
  .hero-stat{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
  .hero-stat-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px}
  .hero-stat-val{font-size:var(--fs-22);font-weight:var(--fw-eb);line-height:1.2;display:block;margin-top:var(--sp-1)}
  .hero-stat-sub{font-size:var(--fs-11);color:var(--muted);margin-top:2px}

 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:1.5;padding-bottom:24px}
 .app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
 .logo{font-size:var(--fs-16);font-weight:var(--fw-eb);color:var(--brand)} .logo span{color:var(--muted);font-weight:var(--fw-m)}
 .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
 .date-badge{font-size:var(--fs-12);color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:20px}
 .btn{font-size:var(--fs-12);color:var(--muted);background:transparent;padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
 .btn:hover{border-color:var(--brand);color:var(--brand)}
 /* === Мобильная адаптация === */
 @media(max-width:560px){.container{padding:12px}.rtab{padding:8px 12px;font-size:var(--fs-13)}}
 @media(max-width:480px){.hero-stats{grid-template-columns:1fr}}
 .container{max-width:1080px;margin:0 auto;padding:16px}
 @media(min-width:860px){.container{padding:24px 28px}}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
 /* адаптивная сетка: 1 колонка на телефоне, 2 на широком экране */
 .grid-2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
 @media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
 .muted{color:var(--muted);font-size:var(--fs-12)}
 .section-title{font-size:var(--fs-12);font-weight:var(--fw-b);color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
 .banner{background:var(--brand-soft);border:1px solid #cfe1f5;border-radius:var(--r-xl);padding:14px 16px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .soon{background:var(--surface-2);border:1px dashed #c9cedb;border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);font-size:var(--fs-13)}
 .soon .soon-ic{font-size:var(--fs-28);display:block;margin-bottom:8px}
 /* Карточки клиентов (TZ-SEED) */
 .cli-section{margin-bottom:14px}
 .cli-grid{display:grid;gap:8px;grid-template-columns:1fr}
 @media(min-width:560px){.cli-grid{grid-template-columns:1fr 1fr}}
 @media(min-width:900px){.cli-grid{grid-template-columns:1fr 1fr 1fr}}
 .cli-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-3);cursor:pointer;transition:.15s}
 .cli-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
 .cli-card.hot{border-left-color:var(--bad)}
 .cli-card.open{cursor:default}
 .cli-name{font-weight:var(--fw-b);color:var(--ink);font-size:var(--fs-13);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
 .cli-chev{color:var(--muted);font-size:var(--fs-14);transition:transform .15s}
 .cli-card.open .cli-chev{transform:rotate(90deg)}
 .cli-meta{font-size:var(--fs-11);color:var(--muted);margin-bottom:6px}
 .cli-sigs{display:flex;flex-wrap:wrap;gap:4px}
 .cli-sig{background:var(--brand-soft);color:var(--brand);font-size:var(--fs-11);padding:2px 8px;border-radius:var(--r-pill);font-weight:var(--fw-sb)}
 .cli-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
 .cli-card.open .cli-detail{display:block}
 .cli-section-h{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 6px}
 .cli-section-h:first-child{margin-top:0}
 .cli-ai{background:linear-gradient(135deg,rgba(124,58,237,.06),rgba(59,130,246,.06));border:1px solid rgba(124,58,237,.15);border-radius:var(--r-md);padding:10px 12px}
 .cli-ai-sum{font-size:var(--fs-13);color:var(--ink);line-height:1.5;margin-bottom:8px}
 .cli-ai-block{margin-top:6px}
 .cli-ai-block-h{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);margin-bottom:2px}
 .cli-ai-list{margin:0;padding-left:18px;font-size:var(--fs-12);color:var(--ink)}
 .cli-ai-list li{margin-bottom:2px}
 .cli-timeline{display:flex;flex-direction:column;gap:6px}
 .cli-tl-row{display:grid;grid-template-columns:60px 24px 1fr;gap:8px;font-size:var(--fs-12);align-items:start}
 .cli-tl-date{color:var(--muted);font-size:var(--fs-11)}
 .cli-tl-ic{text-align:center;font-size:var(--fs-14)}
 .cli-tl-txt{color:var(--ink)}
 .cli-tl-row.trigger .cli-tl-txt{color:var(--warn);font-weight:var(--fw-sb)}
 .cli-history{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-12);color:var(--ink)}
 .cli-history-row{padding:6px 8px;background:var(--surface-2);border-radius:var(--r-sm)}
 .cli-history-row b{color:var(--brand)}
 .cli-scripts{display:flex;flex-direction:column;gap:6px}
 .cli-script{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;transition:.15s}
 .cli-script:hover{border-color:var(--brand);background:var(--brand-soft)}
 .cli-script-title{font-weight:var(--fw-sb);color:var(--ink);font-size:var(--fs-12)}
 .cli-script-short{font-size:var(--fs-11);color:var(--muted);margin-top:2px}
 .cli-script-full{display:none;margin-top:8px;padding:8px;background:var(--surface-2);border-radius:var(--r-sm);font-size:var(--fs-12);color:var(--ink);white-space:pre-line;line-height:1.5}
 .cli-script.open .cli-script-full{display:block}
 /* анонс «Coming Soon» (Клиенты/CRM) */
 .acs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px 18px;box-shadow:var(--shadow);text-align:center}
 .acs-badge{display:inline-block;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:var(--fs-12);font-weight:var(--fw-b);padding:6px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(124,58,237,.4);margin-bottom:14px}
 .acs-title{font-size:var(--fs-20);font-weight:var(--fw-eb);margin-bottom:8px}
 .acs-desc{font-size:var(--fs-13);color:var(--muted);line-height:1.6;margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto}
 .acs-desc b{color:#7c3aed}
 .acs-features{display:grid;grid-template-columns:1fr;gap:10px;text-align:left;margin-bottom:16px}
 @media(min-width:700px){.acs-features{grid-template-columns:repeat(3,1fr)}}
 .acs-f{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:var(--fs-12);line-height:1.5;color:var(--ink)}
 .acs-f b{display:block;margin-bottom:4px;font-size:var(--fs-13)}
 .acs-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
 .acs-tag{font-size:var(--fs-11);font-weight:var(--fw-sb);padding:5px 11px;border-radius:20px;background:rgba(124,58,237,.1);color:#5b21b6;border:1px solid rgba(124,58,237,.2)}

 /* авто-цель баннер */
 .goal-banner{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r-xl);padding:12px 14px;margin-bottom:14px;font-size:var(--fs-13);color:#1a4061}
 .goal-banner .gb-x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:var(--fs-16);flex-shrink:0;line-height:1}
 .goal-banner .gb-edit{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;white-space:nowrap}

 /* hero */
 .hero{position:relative}
 .hero-iconbar{position:absolute;top:0;right:0;display:flex;gap:8px}
 .hib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);cursor:pointer;position:relative}
 .hib:hover{border-color:var(--brand)}
 .hib-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:var(--fs-11);font-weight:var(--fw-b);display:flex;align-items:center;justify-content:center;padding:0 4px}
 .profile{display:flex;align-items:flex-start;gap:14px}
 .ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);font-weight:var(--fw-eb);color:#fff;flex-shrink:0}
 .role-tag{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-b);padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
 /* TZ-A30 §3: бейджи Н1-Н4 и Группа 0 в шапке партнёра */
 .n-risk-badge{display:inline-block;font-size:var(--fs-11);font-weight:var(--fw-eb);padding:2px 8px;border-radius:6px;margin-left:6px;cursor:help;vertical-align:middle}
 .n-risk-1{background:#fef3c7;color:#92500e;border:1px solid #fcd34d}
 .n-risk-2{background:#fed7aa;color:#9a3412;border:1px solid #fb923c}
 .n-risk-3{background:#fecaca;color:#991b1b;border:1px solid #f87171}
 .n-risk-4{background:#fee2e2;color:#7f1d1d;border:1px solid #dc2626;animation:n4-pulse 1.8s infinite}
 @keyframes n4-pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 5px rgba(220,38,38,0)}}
 .g0-pill{display:inline-block;font-size:10px;font-weight:var(--fw-eb);background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:8px;padding:1px 7px;margin-left:6px;cursor:help;vertical-align:middle}
 /* Позитивный стрик «серия · не разорви цепочку» (2026-07-03) — inline-бейдж */
 .streak-badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);font-weight:var(--fw-eb);padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle;cursor:help;background:#dcfce7;color:#166534;border:1px solid #86efac}
 .streak-badge.hot{background:#fef3c7;color:#92500e;border-color:#fbbf24;animation:s-pulse 2s infinite}
 @keyframes s-pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}50%{box-shadow:0 0 0 4px rgba(251,191,36,0)}}
 .hero-name{font-size:var(--fs-20);font-weight:var(--fw-eb);line-height:1.15}
 .hero-sub{font-size:var(--fs-12);color:var(--muted);margin-top:3px}
 .sf-mini{margin-top:10px;display:inline-flex;align-items:baseline;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 14px;cursor:pointer}
 .sf-mini b{font-size:var(--fs-22);font-weight:var(--fw-eb);color:var(--ink)} .sf-mini .sf-z{font-size:var(--fs-11)}

 /* достижения */
 .achievements{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;padding-bottom:2px}
 .ach-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--ok-bg);color:#14532d;border:1px solid #bbf7d0;border-radius:20px;padding:6px 12px;font-size:var(--fs-12);font-weight:var(--fw-sb);white-space:nowrap}

 /* income-track */
 .income-track{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
 .it-row{display:flex;gap:14px;margin-bottom:10px}
 .it-half{flex:1}
 .it-cap{font-size:var(--fs-11);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:var(--fw-sb);margin-bottom:4px}
 .it-val{font-size:var(--fs-22);font-weight:var(--fw-eb)}
 .it-val.target{color:var(--brand)}
 .it-bar{height:12px;background:var(--nd-bg);border-radius:7px;overflow:hidden;margin-bottom:10px}
 .it-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#2b6cb0);transition:width .5s ease}
 .it-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--fs-12);color:var(--muted)}
 .it-link{color:var(--brand);font-weight:var(--fw-b);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
 .it-link:hover{text-decoration:underline}
 /* вал у шапки */
 .val-bar{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
 .val-cell{flex:1;background:var(--brand-soft);border-radius:10px;padding:10px 12px}
 .vb-cap{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:uppercase;letter-spacing:.03em}
 .vb-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0}
 .vb-num{font-size:var(--fs-20);font-weight:var(--fw-eb);color:var(--brand)}
 .vb-zp{font-size:var(--fs-13);color:var(--ok);font-weight:var(--fw-sb);white-space:nowrap}
 .vb-sub{font-size:var(--fs-11);color:var(--muted)}
 /* легенда факт/план */
 .fs-legend{font-size:var(--fs-11);color:var(--muted);margin:-4px 2px 10px;display:flex;gap:14px}
 .fs-legend b{color:var(--ink);font-weight:var(--fw-b)}

 /* верхние табы */
 .rtab-bar{display:flex;gap:8px;margin-bottom:18px;padding:7px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:56px;z-index:90}
 .rtab{font-size:var(--fs-14);padding:11px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:var(--fw-sb);white-space:nowrap;transition:all .15s;flex-shrink:0;display:flex;align-items:center;gap:6px}
 .rtab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
 .rtab.on{background:#fff;color:var(--brand);font-weight:var(--fw-b);box-shadow:0 2px 6px rgba(0,0,0,.08)}
 .screen{display:none} .screen.on{display:block}

 /* ИР */
 .ir-top{display:flex;align-items:center;gap:18px}
 .ir-big{font-size:var(--fs-28);font-weight:var(--fw-eb);line-height:1}
 .ir-sides{flex:1;display:flex;flex-direction:column;gap:9px}
 .ir-side{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:var(--fs-12);font-weight:var(--fw-sb)}
 /* TZ-A27: блок ИР с табами Сейчас/Неделя/Месяц */
 .ir-info{display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:10px;cursor:help;margin-left:4px;font-weight:var(--fw-r);vertical-align:middle;background:#fff}
 .ir-info:hover{background:var(--line);color:var(--ink)}
 [data-tip]{position:relative}
 [data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:var(--fw-r);line-height:1.45;white-space:normal;width:340px;max-width:90vw;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;text-align:left}
 [data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1f2937;z-index:9999;pointer-events:none}
 .ir-card-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
 .ir-card-title{font-size:var(--fs-13);color:var(--muted);font-weight:var(--fw-r)}
 .ir-tabs{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden}
 .ir-tab{padding:4px var(--sp-3);background:transparent;border:none;border-right:1px solid var(--line);font-size:var(--fs-12);font-weight:var(--fw-sb);color:var(--muted);cursor:pointer;transition:.15s ease}
 .ir-tab:last-child{border-right:none}
 .ir-tab:hover{color:var(--ink-soft,var(--ink))}
 .ir-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,55,.08)}
 .ir-body{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:center}
 .ir-total{font-size:var(--fs-28);font-weight:var(--fw-eb);color:var(--ok);line-height:1;min-width:80px}
 .ir-total-delta{display:block;font-size:var(--fs-12);font-weight:var(--fw-sb);margin-top:2px;height:14px}
 .ir-total-delta.up{color:var(--ok)} .ir-total-delta.down{color:var(--bad)} .ir-total-delta.flat{color:var(--muted)}
 .ir-total-delta.hidden{visibility:hidden}
 .ir-channels{display:flex;flex-direction:column;gap:var(--sp-2)}
 .ir-channel-row{display:grid;grid-template-columns:90px 1fr 50px 30px 70px;gap:var(--sp-2);align-items:center;font-size:var(--fs-12)}
 .ir-channel-name{font-weight:var(--fw-sb);color:var(--ink)}
 .ir-channel-bar{position:relative;height:10px;background:var(--surface-3,var(--line));border-radius:var(--r-pill);overflow:hidden}
 .ir-channel-fill{height:100%;border-radius:var(--r-pill);transition:width .4s ease}

 .tip{background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:var(--fs-13);color:#1a4061;margin-top:6px}

 /* ИИ */

.cr-quote{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted);font-size:var(--fs-13)}

.cr-task-d{font-size:var(--fs-12);color:var(--muted);margin-top:2px}

/* Прогресс сборки разбора: реального процента нет, поэтому шкала идёт по этапам */

}
.cr-print-only{display:none}

 /* прогноз */

/* ── TZ-A26: трёхчастная полоса факт/прогноз/план ─────────────────── */
.funnel-stage{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--sp-3);margin-bottom:var(--sp-2)}

.funnel-grid-paired{display:grid;grid-template-columns:1fr;gap:8px 14px;align-items:stretch;margin-top:8px}

.funnel-grid-paired .row-stage{display:flex;flex-direction:column}
.funnel-grid-paired .row-stage>.funnel-stage{flex:1;margin-bottom:0}
.funnel-stage.s-done{border-left-color:var(--ok)}
.funnel-stage.s-forecast{border-left-color:var(--gold)}
.funnel-stage.s-pending{border-left-color:var(--line-strong)}
.funnel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:wrap}
.funnel-label{font-size:var(--fs-14);font-weight:var(--fw-b);color:var(--ink);display:flex;align-items:baseline;gap:var(--sp-2);flex:0 1 auto;min-width:0}
.funnel-hint{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--muted)}
.fp-numbers{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-12);flex-wrap:wrap;justify-content:flex-end;white-space:nowrap;flex-shrink:1;max-width:100%}
.fp-num-fact{color:var(--ok);font-weight:var(--fw-b)}
.fp-num-forecast{color:var(--gold);font-weight:var(--fw-sb)}
.fp-num-plan{color:var(--muted);font-weight:var(--fw-sb)}
.fp-num-lbl{font-size:var(--fs-11);color:var(--muted);font-weight:var(--fw-sb);text-transform:lowercase;margin-right:2px}
.fp-num-sep{color:var(--muted-2);margin:0 2px}
.fp-num-sep{color:var(--muted-2)}
.fp-bar{position:relative;height:20px;background:var(--surface-3);border-radius:var(--r-xs);overflow:visible;display:flex}
.fp-bar.sm{height:16px;background:var(--line);border:1px solid var(--line-strong)}
.fp-bar-fact{height:100%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-forecast{height:100%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:.2px;transition:width .4s ease, filter .15s ease;white-space:nowrap;overflow:hidden;cursor:default;border-radius:var(--r-xs)}
.fp-bar-fact:not(:only-child){border-radius:var(--r-xs) 0 0 var(--r-xs)}
.fp-bar-forecast:not(:only-child){border-radius:0 var(--r-xs) var(--r-xs) 0}
.seg-numbers{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.seg-num{display:inline-flex;gap:var(--sp-1);align-items:baseline;font-size:var(--fs-12)}

.seg-forecast{color:var(--gold)}

.fp-bar.zero-fact::after{content:'0% от плана';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--muted);letter-spacing:.2px;pointer-events:none;white-space:nowrap}
@media (hover: hover) and (pointer: fine){

}
.fp-bar-wrap{display:grid;grid-template-columns:1fr auto;gap:var(--sp-3);align-items:center}

.fp-bar-outside .o-forecast{color:var(--gold);font-weight:var(--fw-b)}

.sv-cur-pill,.sv-you-pill{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;margin-right:4px;color:#1a1f2e}

.sv-curr-line,.sv-prog-line{font-size:var(--fs-13);margin-top:10px;padding:9px 11px;border-radius:var(--r-md);color:var(--ink);line-height:1.45}
.sv-curr-line{background:var(--surface-2);border-left:3px solid #475569}

.sv-curr-line b,.sv-prog-line b{font-weight:800}
.sv-stat{flex:1 1 140px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;min-width:140px}

.sv-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sv-tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:4px 6px;border-bottom:1px solid var(--line)}

.sv-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:30px}

<style>

const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtShort=(n)=>{ n=Number(n)||0; const a=Math.abs(n); if(a<1000)return String(Math.round(n)); if(a<1e6)return Math.round(n/1000)+'к'; return (Math.round(n/1e5)/10).toString().replace('.',',')+' млн'; };
function barColor(pct,isRev){ if(isRev) return 'var(--gold)'; if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--warn)'; return 'var(--bad)'; }
// ИР МЕСЯЦА — цвет по темпу недельных циклов (нед1=25%..нед4=100%, допуск 0.9).
// Ожидаемый ИР на СЕГОДНЯ — пропорционально дню внутри недельного цикла (д7=25%..конец=100%).
function _expectedIrNow(){ const n=new Date(), d=n.getDate(), last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(); const B=[0,7,14,21,last], T=[0,25,50,75,100]; for(let i=1;i<B.length;i++){ if(d<=B[i]) return T[i-1]+(T[i]-T[i-1])*(d-B[i-1])/(B[i]-B[i-1]); } return 100; }
function _irMonthColor(p){ const e=_expectedIrNow(); return p>=e?'var(--ok)':p>=e*0.7?'var(--warn)':'var(--bad)'; }
function _irMonthStatus(p){ const e=_expectedIrNow(); return p>=e?'ok':p>=e*0.7?'warn':'bad'; }
function _irSideBadge(fs){
  var ps=(fs.ir==null||fs.ir_status==='no_data')?'no_data':(_irMonthStatus(fs.ir)==='ok'?'green':_irMonthStatus(fs.ir)==='warn'?'yellow':'red');
  var pl=ps==='no_data'?(fs.ir_status_label||'нет данных'):({green:'в норме',yellow:'в риске',red:'провал'}[ps]);
  return '<span class="status-badge '+(SB[ps]||'sb-no_data')+'">ИР '+fs.ir+'% · '+esc(pl)+'</span>';
}
function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'??'; }

function daysPath(plan){ if(!plan||!plan.started_month) return null;
 const [y,m]=plan.started_month.split('-').map(Number); const start=new Date(y,m-1,1);
 const total=(plan.horizon_months||6)*30; const passed=Math.max(0,Math.round((Date.now()-start.getTime())/86400000));
 return {passed:Math.min(passed,total),total}; }

/* ─── Позитивный стрик «серия · не разорви цепочку» (inline-бейдж) ─── */
function streakBadge(d){
  const nr = d && d.n_risk;
  if (!nr) return '';
  const good = nr.good_streak || 0;
  if (good < 1) return '';
  const cls = good >= 3 ? 'streak-badge hot' : 'streak-badge';
  const wordN = good === 1 ? '1 неделя' : good < 5 ? `${good} недели` : `${good} недель`;
  const tip = good >= 3
    ? `Серия: ${wordN} подряд выполняешь план по доходу. Не разорви на ${good+1}-й!`
    : good === 2
    ? `Серия: 2 недели подряд в плане. Сделай третью и получишь серию.`
    : `Первая неделя в плане. Продолжай!`;
  return `<span class="${cls}" title="${esc(tip)}">🔥 ${wordN} в плане</span>`;
}

/* ─── воронки (TZ-A26 трёхчастные) ─── */
function stageCard(side,st){
 // Адаптируем поле hint_label → hint для renderStage
 const stage={...st, hint: st.hint_label};
 // Базовый рендер этапа (полоса + tooltip + статус-скобка)
 let html=renderStage(stage);
 // Сохраняем раскрытие сегментов (для income — список сделок по сегментам)
 if(st.segments && st.segments.length){
  const segs=st.segments.map(sg=>{
   if(st.is_revenue){
    const f=sg.has_fact?`<span class="seg-num seg-fact">${esc(sg.deals_fact_label||'')} <b>${esc(sg.revenue_fact_label||'')}</b></span>`:'';
    const fc=sg.has_forecast?`<span class="seg-num seg-forecast">${esc(sg.deals_forecast_label||'')} <b>${esc(sg.revenue_forecast_label||'')}</b></span>`:'';
    const sep=(sg.has_fact&&sg.has_forecast)?'<span class="seg-sep">/</span>':'';
    return `<div class="seg-row"><span class="sv">${esc(sg.label)}</span><span class="seg-numbers">${f}${sep}${fc}</span></div>`;
   }
   // v1.1: показываем +Y новых для seller objects
   const segNewLabel = (sg.factNew != null && sg.factNew > 0) ? ` <span style="color:var(--gold);font-size:var(--fs-11)">+${sg.factNew} новых</span>` : '';
   const subStage={fact:sg.fact,plan:sg.plan,fact_label:sg.fact_label,plan_label:sg.plan_label,forecast:null};
   return `<div style="margin-bottom:8px"><div class="seg-row" style="margin-bottom:4px"><span class="sv">${esc(sg.label)}</span><span style="color:var(--muted);font-size:var(--fs-11)">${esc(sg.fact_label)}${segNewLabel} / ${esc(sg.plan_label)}</span></div>${renderFpBar(subStage,{compact:true})}</div>`;
  }).join('');
  // Втыкаем block раскрытия внутрь funnel-stage — делает его кликабельным
  html=html.replace(/<\/div>\s*$/, `<div class="stage-seg hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${segs}</div></div>`);
  // Добавим cursor и onclick на head
  html=html.replace('class="funnel-head"',`class="funnel-head" style="cursor:pointer" onclick="toggleStage(this)"`);
  html=html.replace('<div class="funnel-label">','<div class="funnel-label"><span class="chev" style="display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-weight:var(--fw-b)">›</span> ');
 }
 return html;
}

 ${(fs.stages||[]).map(st=>stageCard(side,st)).join('')}</div>`;

/* Парная сетка: каждый i-й этап покупателя в одной строке grid с i-м этапом продавца → align-items:stretch выровняет высоту автоматически */
function renderFunnelsPaired(buyer,seller){
 const head=(fs,icon,side)=>`<div><div class="fs-head"><div class="fs-title"><span class="fs-dot" style="background:${SIDE_COLOR[side]}"></span><div style="font-weight:var(--fw-b)">${icon} ${esc(fs.label)}</div></div>${_irSideBadge(fs)}</div><div class="fs-legend"><span><b>факт</b> за месяц</span><span>/ <b>план</b> месяца</span><span>· % выполнения</span></div></div>`;
 const bs=(buyer.stages||[]).map(st=>stageCard('buyer',st));
 const ss=(seller.stages||[]).map(st=>stageCard('seller',st));
 const rows=Math.max(bs.length,ss.length);
 const cells=[head(buyer,'🛒','buyer'),head(seller,'🏠','seller')];
 for(let i=0;i<rows;i++){
  cells.push(`<div class="row-stage">${bs[i]||''}</div>`);
  cells.push(`<div class="row-stage">${ss[i]||''}</div>`);
 }
 return `<div class="funnel-grid-paired">${cells.join('')}</div>`;
}

/* превью задач (сегодня + на неделе) для Главной.
   Не дублирует весь таб «Задачи и календарь» — там разбираются полностью.
   Здесь только: просрочки не старше 2 дней (иначе список Главной раздувается
   старым хвостом), сегодняшние задачи целиком, и небольшой кусочек недельных
   с ссылкой «+ещё» на полный таб. */
function tasksPreview(d){
 const g=d.tasks&&d.tasks.groups; if(!g) return '';
 const todayStr=new Date().toISOString().slice(0,10);
 const daysOverdue=(due)=>due?Math.round((Date.parse(todayStr+'T00:00:00Z')-Date.parse(due+'T00:00:00Z'))/86400000):0;
 const expAll=(g.expired||[]);
 const exp=expAll.filter(t=>daysOverdue(t.due_date)<=2);
 const expHiddenOld=expAll.length-exp.length;
 const today=(g.today||[]);
 const weekAll=(g.week||[]);
 const WEEK_LIMIT=3;
 const week=weekAll.slice(0,WEEK_LIMIT);
 const weekMore=weekAll.length-week.length;
 if(!exp.length&&!today.length&&!weekAll.length) return '';
 const grp=(arr,title,cls)=>arr.length?`<div class="tg-title ${cls}">${title} · ${arr.length}</div>${arr.map(taskItem).join('')}`:'';
 const moreBits=[];
 if(weekMore>0) moreBits.push(`+${weekMore} на неделе`);
 if(expHiddenOld>0) moreBits.push(`+${expHiddenOld} старых просрочек`);
 const moreLine=moreBits.length?`<div class="tp-link" style="margin-top:8px" onclick="goTab('tasks')">${moreBits.join(', ')} — все в «Задачи и календарь» ↗</div>`:'';
 return `<div class="card"><div class="tp-head"><div class="section-title" style="margin:0">📋 Задачи на сегодня</div>
 <span class="tp-link" onclick="goTab('tasks')">все задачи ↗</span></div>
 <div class="cal-root" style="font-family:inherit;color:inherit">
 ${grp(exp,'⚠ Просрочено','tg-red')}${grp(today,'Сегодня','tg-red')}${grp(week,'На этой неделе','tg-amber')}${moreLine}
 </div></div>`;
}

function renderMain(d){

 const isG0 = !!(d.user && d.user.is_group_zero);

 if (isG0) {

   </div>`);
 } else if (isNewbie) {
   out.push(`<div class="banner" style="background:#ecfdf5;border:1px solid #86efac;color:#065f46;padding:12px 14px;border-radius:var(--r-md,12px);margin-bottom:12px">

   </div>`);
 }
 if(f&&f.buyer){
 // TZ-A29: общий ИР и полосы Покуп/Прод — все три числа из новой 4-составляющей модели,
 // чтобы шапка не расходилась со скобками. Fallback на старую модель если ir_v2 пуст.
 const v2 = d.ir_v2?.week;
 const v2m = d.ir_v2?.month;
 const irHist=d.ir_history||{now:{total:f.ir_total,buyer:f.ir_buyer,seller:f.ir_seller},week_history:{buyer:[],seller:[],total:[]},month_history:{buyer:[],seller:[],total:[]}};
 if (v2 && typeof v2.ir_total === 'number') {
   irHist.now = { ...irHist.now,
     total: v2.ir_total,
     buyer: typeof v2.buyer_pct === 'number' ? v2.buyer_pct : irHist.now.buyer,
     seller: typeof v2.seller_pct === 'number' ? v2.seller_pct : irHist.now.seller,
   };
   irHist.week = { total: v2.ir_total, buyer: irHist.now.buyer, seller: irHist.now.seller };
 }
 if (v2m && typeof v2m.ir_total === 'number') {
   irHist.month = {
     total: v2m.ir_total,
     buyer: typeof v2m.buyer_pct === 'number' ? v2m.buyer_pct : v2m.ir_total,
     seller: typeof v2m.seller_pct === 'number' ? v2m.seller_pct : v2m.ir_total,
   };
 }
 if (!isG0) out.push(renderIrCard({ir_history:irHist, isPartner:true, periodLabel:f.period_label}));
 // Скобки «ИР X% · …» у каждой стороны — из МЕСЯЧНОГО v2 (воронка показывает
 // месячные факт/план, поэтому ИР воронки тоже месячный — иначе рассинхрон со скобкой).
 const vSrc = v2m || v2;
 if (vSrc) {
   const sideSt = (p) => p >= 70 ? 'green' : (p >= 50 ? 'yellow' : 'red');
   const sideLbl = { green: 'в норме', yellow: 'в риске', red: 'провал' };
   if (typeof vSrc.buyer_pct === 'number') {
     f.buyer.ir = vSrc.buyer_pct;

     f.buyer.ir_status_label = sideLbl[f.buyer.ir_status];
   }
   if (typeof vSrc.seller_pct === 'number') {
     f.seller.ir = vSrc.seller_pct;

     f.seller.ir_status_label = sideLbl[f.seller.ir_status];

 // Сводка от ИИ — над воронкой: «как дела на сегодня».

 if(!(d.ai_coach&&d.ai_coach.motivator_text)){

 out.push(tasksPreview(d));
 out.push(helpCard(d));
 document.getElementById('screen-main').innerHTML=out.join('');
}

const PRG_MODE_KEY = 'prognoz_mode_p';
function _prgFmtK(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' млн'; if(n>=1e4) return Math.round(n/1e3)+'к'; if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+'к'; return String(Math.round(n)); }
function _prgFmtFull(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function _monthShortRu(ym){ const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; return m[parseInt(ym.slice(5,7),10)-1]||ym; }

    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap">
      <span><i style="display:inline-block;width:11px;height:3px;background:#16a34a;vertical-align:middle;margin-right:5px"></i>факт</span>
      <span><i style="display:inline-block;width:11px;height:3px;background:#3b82f6;vertical-align:middle;margin-right:5px"></i>прогноз (тек. мес + след.)</span>
      <span><i style="display:inline-block;width:11px;height:3px;background:#cbd5e1;vertical-align:middle;margin-right:5px"></i>план цикла</span>
    </div>
    <div id="prg-goal-svg"></div>
  </div>`);

  // ── 4. Цель по доходу ──
  if (goal) {
    const goalLbl = goal.target_revenue_month_short || _prgFmtFull(goal.target_revenue_month);
    const changeTxt = goal.change_count>0 ? `менял ${goal.change_count} раз` : 'не менял';
    out.push(`<div class="card">
      <div class="section-title">💵 Цель по доходу${goal.can_edit===false?'':' (ставишь сам)'}</div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div><div style="font-size:18px;font-weight:800">${esc(goalLbl)} ₽</div><div style="font-size:11px;color:var(--muted)">текущая цель${goal.is_auto?' (авто)':''}</div></div>
        <div style="font-size:12px;color:var(--muted)">${changeTxt}</div>
        ${goal.can_change&&goal.can_edit!==false?'<button class="b-secondary" onclick="openEditGoal()" style="margin-left:auto;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2,#f1f3f7);cursor:pointer">Изменить</button>':''}
        ${goal.can_edit===false?'<span style="margin-left:auto;font-size:11px;color:var(--muted)" title="'+esc(goal.edit_block_reason||'')+'">🔒 меняет руководитель</span>':''}
      </div>
    </div>`);
  }

  document.getElementById('screen-prognoz').innerHTML = out.join('');
  prgRenderBars(pt, mode);
  prgRenderGoalSvg(pt);
}

window.prgSetMode = function(m){

  // CTX объявлен const в модуле → window.CTX = undefined. Работаем с модульным CTX.
  if (CTX && CTX.data) renderPrognoz(CTX.data);
};

function prgRenderBars(pt, mode){
  const wrap = document.getElementById('prg-bars-wrap'); if (!wrap) return;
  const months = pt.monthly||[];
  const isDohod = mode==='dohod';
  const vals = months.map(m=>{
    const fact = isDohod?(m.fact_income||0):(m.fact_revenue||0);
    const fcst = isDohod?(m.forecast_income||0):(m.forecast_revenue||0);
    const plan = isDohod?(m.plan_income||0):(m.plan_revenue||0);
    return {ym:m.ym, fact, fcst, plan, is_current:m.is_current, is_future:m.is_future, is_past:m.is_past};
  });
  const max = Math.max(...vals.map(v=>Math.max(v.fact,v.fcst,v.plan)), 1);
  const cols = vals.map(v=>{
    const planH = Math.round((v.plan||0)/max*100);
    const factH = Math.round((v.fact||0)/max*100);
    const fcstH = v.fcst>0 ? Math.round(v.fcst/max*100) : 0;
    const planStyle = `position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 4px,#e2e8f0 4px,#e2e8f0 8px);border-radius:6px;opacity:.7;height:${planH}%`;
    // ─── три сценария окраски столбика ───
    // past: только зелёный (факт) до факта
    // current: снизу зелёный (факт) + сверху синий (прогноз-остаток fcst-fact)
    // future: только синий (прогноз)
    const GREEN = 'linear-gradient(180deg,#22c55e,#16a34a)';
    const BLUE = 'linear-gradient(180deg,#3b82f6,#1e63d9)';
    let bars = '';
    let mainLabel = '—';
    if (v.is_past) {
      if (factH>0) bars = `<div style="position:absolute;bottom:0;left:0;right:0;border-radius:6px;background:${GREEN};height:${factH}%;display:flex;align-items:flex-start;justify-content:center;padding-top:6px"><span style="color:#fff;font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.15)">${_prgFmtK(v.fact)}</span></div>`;
      mainLabel = v.fact>0 ? _prgFmtK(v.fact) : '—';
    } else if (v.is_current) {
      // фактическая часть — зелёная снизу
      if (factH>0) bars += `<div style="position:absolute;bottom:0;left:0;right:0;background:${GREEN};height:${factH}%;border-radius:${fcstH>factH?'0':'6px'} ${fcstH>factH?'0':'6px'} 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px"><span style="color:#fff;font-size:10px;font-weight:800;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.15)">${_prgFmtK(v.fact)}</span></div>`;
      // прогнозная надстройка (fcst - fact) — синяя сверху, число на ВЕРХНЕЙ границе всего столбика
      if (fcstH>factH) {
        const fcstDelta = fcstH - factH;
        bars += `<div style="position:absolute;bottom:${factH}%;left:0;right:0;background:${BLUE};height:${fcstDelta}%;border-radius:6px 6px ${factH>0?'0':'6px'} ${factH>0?'0':'6px'};"></div>`;
        bars += `<div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:center;padding-top:2px"><span style="color:#1e63d9;font-size:11px;font-weight:800;line-height:1">+${_prgFmtK(v.fcst-v.fact)}</span></div>`;
      }
      mainLabel = v.fcst>0 ? _prgFmtK(v.fcst) : (v.fact>0 ? _prgFmtK(v.fact) : '—');
    } else if (v.is_future) {
      if (fcstH>0) bars = `<div style="position:absolute;bottom:0;left:0;right:0;border-radius:6px;background:${BLUE};height:${fcstH}%;display:flex;align-items:flex-start;justify-content:center;padding-top:6px"><span style="color:#fff;font-size:12px;font-weight:800;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.15)">${_prgFmtK(v.fcst)}</span></div>`;
      mainLabel = v.fcst>0 ? _prgFmtK(v.fcst) : '—';
    }
    const captionFor = v.is_current?'сейчас':(v.is_future?'прогноз':'факт');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px;height:100%">
      <div style="font-size:9px;color:${v.is_current?'var(--brand)':'transparent'};text-transform:uppercase;letter-spacing:.4px;font-weight:700">${captionFor}</div>
      <div style="position:relative;flex:1;width:100%;background:#f1f5f9;border-radius:6px;overflow:hidden;min-height:120px">
        <div style="${planStyle}"></div>
        ${bars}
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3">${mainLabel} / ${_prgFmtK(v.plan)}</div>
      <div style="font-size:11px;color:${v.is_current?'var(--brand)':'var(--muted)'};font-weight:600;text-transform:uppercase">${_monthShortRu(v.ym)}</div>
    </div>`;
  }).join('');
  const planTotal = vals.reduce((s,v)=>s+(v.plan||0),0);
  const factTotal = vals.filter(v=>!v.is_future).reduce((s,v)=>s+(v.fact||0),0);
  const fcstNext = (vals.find(v=>v.is_future)||{}).fcst||0;
  wrap.innerHTML = `<div style="background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px">
    <div style="display:grid;grid-template-columns:repeat(${vals.length},1fr);gap:8px;align-items:end;height:200px;margin-bottom:10px">${cols}</div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap">
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 2px,#e2e8f0 2px,#e2e8f0 4px)"></i>план / цель</span>
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:linear-gradient(180deg,#22c55e,#16a34a)"></i>факт</span>
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:linear-gradient(180deg,#3b82f6,#1e63d9)"></i>прогноз</span>
    </div>
    <div style="font-size:12px;padding-top:8px;color:var(--muted)">
      За цикл: <b style="color:var(--ink)">${_prgFmtK(factTotal)}</b> из ${_prgFmtK(planTotal)} ${isDohod?'дохода':'вала'} · прогноз след: <b style="color:var(--ink)">${_prgFmtK(fcstNext)}</b>
    </div>
  </div>`;
}

function prgRenderGoalSvg(pt){
  const wrap = document.getElementById('prg-goal-svg'); if (!wrap) return;
  const months = pt.monthly||[];
  // путь по ДОХОДУ накопительно (CLAUDE.md §6)
  const planAcc = []; const factAcc = []; let pS=0, fS=0;
  let lastCompletedIdx = -1;  // последний ЗАВЕРШЁННЫЙ месяц
  months.forEach((m,i)=>{
    pS += m.plan_income||0; planAcc.push(pS);
    if (m.is_future) { factAcc.push(null); return; }
    fS += m.fact_income||0; factAcc.push(fS);
    if (m.is_past) lastCompletedIdx = i;
  });
  const total = planAcc[planAcc.length-1] || 1;
  // Ratio для зверя — по ЗАВЕРШЁННЫМ месяцам. Иначе текущий (незаконченный)
  // месяц перекашивает: план учитывается целиком, факт — только за прошедшие дни,
  // и партнёр всегда «черепаха» до конца месяца.
  let ratio, idx, factVal;
  if (lastCompletedIdx >= 0) {
    idx = lastCompletedIdx;
    factVal = factAcc[idx]||0;
    const planVal = planAcc[idx]||1;
    ratio = planVal>0 ? factVal/planVal : 0;
  } else {
    // Самое начало цикла — берём текущий месяц пропорционально дню.
    const today = new Date();
    const daysInMon = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    const dayPass = today.getDate();
    const curIdx = months.findIndex(m => m.is_current);
    idx = curIdx >= 0 ? curIdx : 0;
    factVal = factAcc[idx]||0;
    const curPlan = (months[idx] && months[idx].plan_income||0) * dayPass / daysInMon;
    ratio = curPlan>0 ? factVal/curPlan : 0;
  }
  let animal, col, label;
  if (ratio>=1.05) { animal='cheetah'; col='#16a34a'; label='🐆 гепард — опережаешь!'; }
  else if (ratio>=0.85) { animal='hare'; col='#d97706'; label='🐇 заяц — идёшь ровно'; }
  else { animal='turtle'; col='#dc2626'; label='🐢 черепаха — поднажми'; }

  const W=920, H=280, pl=44, pr=20, pt2=34, pb=38, cw=W-pl-pr, ch=H-pt2-pb, n=months.length;
  const x = i => pl + cw * i / (n-1);
  const y = v => pt2 + ch * (1 - (v||0)/total);

  let s='';
  // grid + ось Y
  for (let g=0;g<=4;g++){
    const gy = pt2 + ch*g/4;
    s += `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#eef0f4"/>`;
    s += `<text x="${pl-7}" y="${gy+3}" text-anchor="end" font-size="9" fill="#b4b9c5">${100-g*25}%</text>`;
  }
  // подписи месяцев
  months.forEach((m,i)=>{
    s += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#7a8194">${_monthShortRu(m.ym)}</text>`;
  });
  // плановая линия (пунктир)
  s += `<polyline points="${planAcc.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  // факт-линия (зелёная) — только по завершённым месяцам
  const fpts = factAcc.map((v,i)=> {
    if (v == null) return null;
    // На линии факта — только past и current, причём current факт (не прогноз)
    if (months[i] && (months[i].is_past || months[i].is_current)) return [x(i), y(v)];
    return null;
  }).filter(Boolean);
  if (fpts.length > 1) {
    const area = `${fpts[0][0]},${y(0)} ${fpts.map(p=>p.join(',')).join(' ')} ${fpts[fpts.length-1][0]},${y(0)}`;
    s += `<polygon points="${area}" fill="#16a34a" opacity="0.10"/>`;
    s += `<polyline points="${fpts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  fpts.forEach((p)=>{
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#16a34a" stroke-width="3"/>`;
  });

  // ── Прогнозная линия (синяя) ──
  // От последней past точки → current (fact + прогноз-остаток к концу мес) → next_month (прогноз дохода).
  // Показываем «куда партнёр придёт если сохранит темп».
  const fpts_forecast = [];
  let baseAcc = 0;
  let baseIdx = -1;
  months.forEach((m, i) => {
    if (m.is_past) { baseAcc += m.fact_income||0; baseIdx = i; }
  });
  // Стартуем от последней завершённой точки факта (или от 0,0 если ничего не завершено)
  if (baseIdx >= 0) fpts_forecast.push([x(baseIdx), y(baseAcc)]);
  else fpts_forecast.push([x(0), y(0)]);
  let accF = baseAcc;
  const curIdxLocal = months.findIndex(m => m.is_current);
  if (curIdxLocal >= 0) {
    // forecast_income текущего = ИТОГО к концу месяца (bэк уже включил факт + прогноз-остаток)
    const curFc = Math.max(months[curIdxLocal].forecast_income||0, months[curIdxLocal].fact_income||0);
    accF += curFc;
    fpts_forecast.push([x(curIdxLocal), y(accF)]);
  }
  const nextFutureIdx = months.findIndex(m => m.is_future);
  if (nextFutureIdx >= 0 && (months[nextFutureIdx].forecast_income||0) > 0) {
    accF += months[nextFutureIdx].forecast_income||0;
    fpts_forecast.push([x(nextFutureIdx), y(accF)]);
  }
  if (fpts_forecast.length > 1) {
    s += `<polyline points="${fpts_forecast.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="0" stroke-linecap="round" opacity="0.85"/>`;
    // точки прогноза (только новые, без стартовой которая уже нарисована зелёной)
    for (let i = 1; i < fpts_forecast.length; i++) {
      const p = fpts_forecast[i];
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#3b82f6" stroke-width="3"/>`;
    }
  }

  // Прогнозная позиция в светофоре — метка над каждой синей точкой (current + next_month).
  // Индексы fpts_forecast: [0] = стартовая (последняя past), [1] = current, [2] = next_month.
  const badge = (px, py, txt) => `<g transform="translate(${px},${py-12})">`
    + `<rect x="-32" y="-14" width="64" height="18" rx="9" fill="#3b82f6"/>`
    + `<text x="0" y="-1" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${txt}</text>`
    + `</g>`;
  if (curIdxLocal >= 0 && fpts_forecast.length >= 2) {
    const pp = months[curIdxLocal] && months[curIdxLocal].predicted_position;
    if (pp && pp.pos) s += badge(fpts_forecast[1][0], fpts_forecast[1][1], `#${pp.pos}`);
  }
  if (nextFutureIdx >= 0 && fpts_forecast.length >= 3) {
    const pp = months[nextFutureIdx] && months[nextFutureIdx].predicted_position;
    if (pp && pp.pos) s += badge(fpts_forecast[2][0], fpts_forecast[2][1], `#${pp.pos}`);
  }
  // Зверь на последней точке
  if (fpts.length>0 && idx<n) {
    const last = [x(idx), y(factVal)];
    let beast='';
    if (animal==='cheetah') {
      beast = `<ellipse cx="0" cy="-12" rx="17" ry="9" fill="${col}"/>`
        + `<circle cx="15" cy="-18" r="7" fill="${col}"/><circle cx="17" cy="-19" r="1.6" fill="#fff"/>`
        + `<path d="M 10 -23 l 3 -4 M 18 -24 l 1 -4" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`
        + `<path d="M -16 -12 q -10 -2 -14 4" stroke="${col}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
        + `<circle cx="-6" cy="-14" r="2" fill="#fff"/><circle cx="9" cy="-15" r="2" fill="#fff"/>`;
    } else if (animal==='hare') {
      beast = `<ellipse cx="0" cy="-10" rx="11" ry="13" fill="${col}"/>`
        + `<circle cx="0" cy="-24" r="8" fill="${col}"/>`
        + `<ellipse cx="-4" cy="-36" rx="3.5" ry="10" fill="${col}"/>`
        + `<ellipse cx="4" cy="-36" rx="3.5" ry="10" fill="${col}"/>`
        + `<circle cx="-3" cy="-25" r="1.7" fill="#fff"/><circle cx="3" cy="-25" r="1.7" fill="#fff"/>`;
    } else {
      beast = `<ellipse cx="0" cy="-10" rx="14" ry="10" fill="${col}"/>`
        + `<path d="M -14 -10 a 14 9 0 0 1 28 0" fill="none" stroke="#fff" stroke-width="1.5"/>`
        + `<circle cx="15" cy="-13" r="6" fill="${col}"/><circle cx="17" cy="-14" r="1.5" fill="#fff"/>`;
    }
    s += `<g transform="translate(${last[0]},${last[1]})">`
      + `<circle cx="0" cy="0" r="9" fill="none" stroke="${col}" stroke-width="2" opacity="0.4"/>`
      + `<g transform="translate(0,-30)">${beast}</g>`
      + `<text x="0" y="-50" text-anchor="middle" font-size="11" font-weight="800" fill="${col}">это я!</text>`
      + `<text x="0" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="${col}">${label}</text>`
      + `</g>`;
  }
  // Прогноз позиции текстом под графиком
  const curM = months.find(m => m.is_current);
  const nxtM = months.find(m => m.is_future);
  const curPP = curM && curM.predicted_position;
  const nxtPP = nxtM && nxtM.predicted_position;
  let posLine = '';
  if (curPP || nxtPP) {
    const parts = [];
    if (curPP) parts.push(`<b>${_monthShortRu(curM.ym)}</b>: место <b style="color:#3b82f6">#${curPP.pos}</b> <span style="color:var(--muted)">(${esc(curPP.category||'')})</span>`);
    if (nxtPP) parts.push(`<b>${_monthShortRu(nxtM.ym)}</b>: место <b style="color:#3b82f6">#${nxtPP.pos}</b> <span style="color:var(--muted)">(${esc(nxtPP.category||'')})</span>`);
    posLine = `<div style="margin-top:10px;font-size:12px;color:var(--ink);background:#eff6ff;border:1px solid #cfe3fb;border-radius:8px;padding:9px 12px">📍 <b>По прогнозу дохода твоя позиция в светофоре</b>: ${parts.join(' · ')}</div>`;
  }
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${s}</svg>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)">
      <span><i style="display:inline-block;width:11px;height:11px;background:#cbd5e1;border-radius:2px;margin-right:5px;vertical-align:-1px"></i>плановый темп</span>
      <span><i style="display:inline-block;width:11px;height:11px;background:#16a34a;border-radius:2px;margin-right:5px;vertical-align:-1px"></i>мой путь</span>
      <span><i style="display:inline-block;width:11px;height:11px;background:#3b82f6;border-radius:2px;margin-right:5px;vertical-align:-1px"></i>прогноз</span>
    </div>${posLine}
    <div style="margin-top:10px;font-size:12px;color:var(--muted);background:#f7f9fc;border-radius:8px;padding:9px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">Твой темп — это зверь на графике:
      <span><b style="color:#16a34a">🐆 гепард</b> — опережаешь</span>
      <span><b style="color:#d97706">🐇 заяц</b> — идёшь ровно</span>
      <span><b style="color:#dc2626">🐢 черепаха</b> — отстаёшь</span>
    </div>`;
}

/* ─── ТРЕНЕР (диагностика + ИИ) ─── */
function coachSide(side,c,title){ if(!c)return'';
 const rec=c.recommendation_for_realtor||c.recommendation_rop||'';
 const weak=(c.weak_points||[]).map(w=>{
  const lab=esc(w.bit_label), key=w.bit_key||'';
  const isConv=/conversion/.test(key), isDist=/distribution/.test(key);
  // распределение (перекос по сегментам) — без %
  if(isDist) return `<div class="weak"><span>⚠ ${lab}</span><span class="muted">перекос по сегментам</span></div>`;
  const a=(typeof w.actual_num==='number')?w.actual_num:null, n=(typeof w.norm==='number')?w.norm:null;
  // нет нормы — показываем факт как есть (fallback до пересчёта)
  if(a===null||!n||n<=0) return `<div class="weak"><span>⚠ ${lab}</span><span class="muted">${esc(w.actual)}${isConv?'%':''}</span></div>`;
  const below=Math.max(0,Math.round((n-a)/n*100));

function radarZoneObj(){const R=CTX.data&&CTX.data.funnel_radar;if(!R||!R.zones)return null;return R.zones.find(z=>z.id===__radarZone)||R.zones.find(z=>z.is_default)||R.zones[0];}
const RADAR={cx:180,cy:165,R:112,N:6};
function radarPt(i,v,scale){const a=-Math.PI/2+i*2*Math.PI/RADAR.N,r=RADAR.R*Math.min(scale,Math.max(0,v))/scale;return [RADAR.cx+r*Math.cos(a),RADAR.cy+r*Math.sin(a)];}
function radarAvg(a){return Math.round(a.reduce((x,y)=>x+y,0)/a.length);}
function radarPoly(vals,scale){return vals.map((v,i)=>radarPt(i,v,scale).join(',')).join(' ');}
function radarDraw(elId,mine,color,fill,labels,scale,thPct){
 const el=document.getElementById(elId); if(!el) return;
 const p=[];
 // сетка колец 33/66/100 и оси
 [scale/3,scale*2/3,scale].forEach(g=>{p.push('<polygon points="'+labels.map((_,i)=>radarPt(i,g,scale).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>');});
 labels.forEach((lab,i)=>{
  const e=radarPt(i,scale,scale);p.push('<line x1="'+RADAR.cx+'" y1="'+RADAR.cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)"/>');
  const lp=radarPt(i,scale*1.12,scale),anchor=Math.abs(lp[0]-RADAR.cx)<8?'middle':(lp[0]<RADAR.cx?'end':'start');
  const words=lab.split(' ');let tx='';words.forEach((w,wi)=>{tx+='<tspan x="'+lp[0]+'" dy="'+(wi===0?0:10)+'">'+esc(w)+'</tspan>';});
  p.push('<text x="'+lp[0]+'" y="'+(lp[1]-(words.length-1)*4.5)+'" text-anchor="'+anchor+'" font-size="9" fill="var(--muted)">'+tx+'</text>');
 });
 // маркер порога зелёной зоны (70%) — тонкий зелёный пунктир внутри
 if(thPct){ p.push('<polygon points="'+labels.map((_,i)=>radarPt(i,thPct,scale).join(',')).join(' ')+'" fill="none" stroke="var(--ok)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>'); }
 // внешнее зелёное кольцо (100%) = уровень грейда
 p.push('<polygon points="'+labels.map((_,i)=>radarPt(i,scale,scale).join(',')).join(' ')+'" fill="rgba(22,163,74,.06)" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 3"/>');
 // моя паутинка (цветная заливка)
 if(mine){
  p.push('<polygon points="'+radarPoly(mine,scale)+'" fill="'+fill+'" stroke="'+color+'" stroke-width="2.5"/>');
  mine.forEach((v,i)=>{const dt=radarPt(i,v,scale);p.push('<circle cx="'+dt[0]+'" cy="'+dt[1]+'" r="3.2" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>');});
 }else{ p.push('<text x="'+RADAR.cx+'" y="'+RADAR.cy+'" text-anchor="middle" font-size="12" fill="var(--muted)">нет данных</text>'); }
 el.innerHTML=p.join('');
}
function radarFmt(v){v=Math.round(v*10)/10;return (Math.abs(v-Math.round(v))<0.05)?String(Math.round(v)):String(v);}
// mine[] для радара из факта и нормы (в % от нормы грейда, кап 100)
function radarMine(fact,norm){if(!fact||!norm)return null;return norm.map((n,i)=>n>0?Math.min(100,Math.round(fact[i]/n*100)):0);}
// список: абсолютная разница «норма − факт» по каждой оси, ✓ если факт≥нормы
function radarRenderGaps(elId,fact,norm,labels,units){
 const box=document.getElementById(elId); if(!box) return;
 if(!fact||!norm){box.innerHTML='<div class="radar-nodata">В этом сегменте нет данных.</div>';return;}
 // сортируем: сначала невыполненные (по величине разницы), потом выполненные
 const rows=labels.map((lab,i)=>{
  const unit=units[i]==='%'?'%':'';
  const rawDiff=norm[i]-fact[i];
  // счётчики (штуки) — целые, стандартное округление; конверсии — в % как есть
  const diff=unit?rawDiff:Math.round(rawDiff);
  const done=unit?(fact[i]>=norm[i]-0.05):(diff<=0);
  return {lab,diff,done,unit,fact:fact[i],norm:norm[i]};
 }).sort((a,b)=>(a.done-b.done)||(b.diff-a.diff));
 box.innerHTML=rows.map(r=>{
  const fmt=(v)=>r.unit==='%'?radarFmt(v):String(Math.round(v));
  if(r.done) return '<div class="radar-gap done"><span class="k">✓ '+esc(r.lab)+'</span><span class="dd ok">есть</span></div>';
  return '<div class="radar-gap"><span class="k">'+esc(r.lab)+' <small>'+fmt(r.fact)+'→'+fmt(r.norm)+r.unit+'</small></span><span class="dd">+'+fmt(r.diff)+r.unit+'</span></div>';
 }).join('');
}
function radarBadge(valId,mine){const vb=document.getElementById(valId);if(vb)vb.textContent=mine?radarAvg(mine)+'%':'—';}

 radarDraw('rsvg-buyer',mB,SIDE_COLOR.buyer,'rgba(59,130,246,.14)',R.axis_labels,sc,R.threshold_pct);

 radarBadge('rv-buyer',mB);
 radarBadge('rv-seller',mS);

  const gb=top(fB,nB), gs=top(fS,nS);

  else if(gb||gs) note.innerHTML='💡 «'+esc(segName)+'» относительно «'+esc(gradeLbl)+'»: главный рост'+(gb?' у покупателя — <b>'+esc(gb.k.toLowerCase())+'</b>':'')+(gb&&gs?', ':'')+(gs?'у продавца — <b>'+esc(gs.k.toLowerCase())+'</b>':'')+'.';
  else note.innerHTML='💡 «'+esc(segName)+'»: по этому сегменту ты уже на уровне «'+esc(gradeLbl)+'» 👍';
 }
}

 const target=DAYS[String(dayName||'').toLowerCase().trim()];

 d.setDate(d.getDate()+weekIdx*7);

  <div class="cr-prog-step" id="crProgStep">${CR_STEPS[0][1]}…</div>
  <div class="cr-prog-bar"><div class="cr-prog-fill" id="crProgFill"></div></div>
  <div class="cr-prog-hint">Обычно занимает 30–60 секунд</div>
 </div>`;
 const t0=Date.now();
 const fill=document.getElementById('crProgFill');
 const step=document.getElementById('crProgStep');
 __crTimer=setInterval(()=>{
  const s=(Date.now()-t0)/1000;
  // 92% за ~70 секунд, дальше стоим и ждём ответ
  const pct=Math.min(92,Math.round(92*(1-Math.exp(-s/26))));
  if(fill) fill.style.width=pct+'%';
  let label=CR_STEPS[0][1];
  for(const [at,txt] of CR_STEPS) if(s>=at) label=txt;
  if(step) step.textContent=label+'…';
 },400);
}
function crProgStop(done){
 if(__crTimer){ clearInterval(__crTimer); __crTimer=null; }
 if(done){ const f=document.getElementById('crProgFill'); if(f) f.style.width='100%'; }
}

async function crBuild(force){
 const box=document.getElementById('crBox'); if(!box) return;
 const btn=document.getElementById('crGo');
 if(btn){ btn.disabled=true; btn.textContent='Собираю разбор…'; }
 crProgStart(box);
 try{
  // __call уже разворачивает .data — здесь лежит сам ответ функции
  const r=await window.__call('generateCoachReport',{code:CTX.target,force:!!force});
  const rep=r&&r.report;
  if(!rep) throw new Error(r&&r.error?String(r.error):'сервер не вернул разбор');
  crProgStop(true);
  __crRep=rep;
  box.innerHTML=crHtml(rep);
  const act=document.getElementById('crExtra'); if(act) act.style.display='flex';
 }catch(e){
  crProgStop(false);
  box.innerHTML=`<div class="cr-sec"><p>Не получилось собрать разбор: ${crEsc((e&&e.message)||'ошибка')}</p><p class="muted" style="margin-top:6px">Попробуй нажать ещё раз. Если повторится — скажи мне, посмотрю логи.</p></div>`;
 }finally{
  if(btn){ btn.disabled=false; btn.textContent='Пересобрать разбор'; }
 }
}

const POOL_TOTAL={newbie:386,experienced:934};
function poolTotals(d){ const t=(d.meta&&d.meta.system_totals)||{}; return {newbie:t.svetofor_newbie||POOL_TOTAL.newbie, experienced:t.svetofor_experienced||POOL_TOTAL.experienced}; }
const POOL_CLR={newbie:'#16a34a',experienced:'#2b6cb0'};
// ── TZ: таб «Светофор» — график движения (карточка 1) + калькулятор с пирамидой (карточка 2)
function svetoforGraphCard(d){
 const u=d.user;
 const h=(d.position_history||[]).filter(p=>p.position!=null);
 if(h.length<1){
  return `<div class="card"><div class="section-title">📈 Как я двигался в светофоре</div>
  <div class="soon" style="margin-top:8px">История движения накапливается — график появится в ближайшие месяцы.</div></div>`;
 }
 const PT=poolTotals(d);
 const W=720,H=260,padX=40,padT=32,padB=36;
 const plotW=W-padX*2, plotH=H-padT-padB;
 const n=h.length;
 const X=i=>padX+(n>1?i*(plotW/(n-1)):plotW/2);
 const yFrac=p=>{ const tot=PT[p.pool]||PT.experienced; return Math.max(0,Math.min(1,1-(p.position/tot))); };
 const Y=p=>padT+(1-yFrac(p))*plotH;
 const last=h[h.length-1];
 const pts=h.map((p,i)=>({i,p,x:X(i),y:Y(p),pool:p.pool,position:p.position,ym:p.ym,label:p.label}));
 // Фоны регионов по фактической последовательности пулов
 let bgRects='';
 let curX=padX;
 for(let i=0;i<n;i++){
  const p=pts[i].pool;
  const segStart=i;
  while(i+1<n && pts[i+1].pool===p) i++;
  const segEnd=i;
  const x1=X(segStart), x2=X(segEnd);
  const w=x2-x1;
  const bg=POOL_CLR[p]||'#94a3b8';
  bgRects+=`<rect x="${x1}" y="${padT}" width="${w}" height="${plotH}" fill="${bg}" opacity="0.07"/>`;
 }
 // подписи регионов сверху (если разные пулы есть)
 let regionLabels='';
 if(n>0){
  let i=0;
  while(i<n){
   const p=pts[i].pool;
   let j=i; while(j+1<n && pts[j+1].pool===p) j++;
   const x1=X(i), x2=X(j), cx=(x1+x2)/2;
   const lab=p==='newbie'?'светофор новичков':'светофор опытных';
   const col=p==='newbie'?'#16a34a':'#3b82f6';
   regionLabels+=`<text x="${cx}" y="${padT-14}" text-anchor="middle" font-size="10" font-weight="700" fill="${col}">${lab}</text>`;
   i=j+1;
  }
 }
 let segs='',dots='',marks='';
 for(let i=0;i<n;i++){
  const cur=pts[i];
  if(i>0){
   const prev=pts[i-1];
   const diff=prev.pool!==cur.pool;
   const clr=POOL_CLR[cur.pool]||'#94a3b8';
   segs+=`<polyline points="${prev.x},${prev.y} ${cur.x},${cur.y}" fill="none" stroke="${diff?'#94a3b8':clr}" stroke-width="${i===n-1?3:2.5}" stroke-dasharray="${diff?'5 4':''}" stroke-linecap="round"/>`;
   if(diff){ marks+=`<line x1="${cur.x}" y1="${padT}" x2="${cur.x}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>`; }
  }
  const isLast=i===n-1;
  const clr=POOL_CLR[cur.pool]||'#94a3f8';
  dots+=`<circle cx="${cur.x}" cy="${cur.y}" r="${isLast?5.5:3.5}" fill="#fff" stroke="${clr}" stroke-width="${isLast?3.5:2.5}"/>`;
  dots+=`<text x="${cur.x}" y="${cur.y-9}" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1f2e">#${cur.position}</text>`;
 }
 for(let g=0;g<=3;g++){ const gy=padT+plotH*g/3; segs+=`<line x1="${padX}" y1="${gy}" x2="${padX+plotW}" y2="${gy}" stroke="#eef0f4"/>`; }
 segs+=`<text x="${padX-6}" y="${padT+4}" text-anchor="end" font-size="9" fill="#b4b9c5">топ</text>`;
 segs+=`<text x="${padX-6}" y="${padT+plotH+2}" text-anchor="end" font-size="9" fill="#b4b9c5">низ</text>`;
 const monthLabels=pts.map((p,i)=>`<text x="${p.x}" y="${H-10}" text-anchor="middle" font-size="10" fill="#7a8194">${esc(p.label.split(' ')[0])}</text>`).join('');
 const svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${regionLabels}${bgRects}${marks}${segs}${dots}${monthLabels}</svg>`;
 // обоснование движения
 const samePool=pts.every(p=>p.pool===pts[0].pool);
 let reason='';
 if(samePool){
  const first=pts[0].position, lastP=pts[n-1].position, delta=first-lastP;
  const poolLab=pts[0].pool==='newbie'?'светофоре новичков':'светофоре опытных';
  if(delta>0) reason=`За ${n} мес ты поднялся на <b>${delta} ${delta===1?'позицию':'позиции'}</b> в ${poolLab}.`;
  else if(delta<0) reason=`За ${n} мес место снизилось на <b>${Math.abs(delta)}</b> в ${poolLab}.`;
  else reason=`Позиция в ${poolLab} держится стабильно ${n} мес.`;
 } else {
  // смена пула — покажем момент
  for(let i=1;i<n;i++) if(pts[i].pool!==pts[i-1].pool){
   reason=`На <b>${pts[i].label}</b> — переход из светофора новичков в опытные (старший рейтинг, поэтому место «выше по номеру»).`;
   break;
  }
 }
 // легенда
 const legend=`<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px">
  <span><span style="display:inline-block;width:11px;height:3px;background:#94a3b8;vertical-align:middle;margin-right:5px"></span> факт</span>
  <span><span style="display:inline-block;width:11px;height:3px;background:#16a34a;vertical-align:middle;margin-right:5px"></span> новички</span>
  <span><span style="display:inline-block;width:11px;height:3px;background:#3b82f6;vertical-align:middle;margin-right:5px"></span> опытные</span>
  <span><span style="display:inline-block;width:11px;height:3px;border-top:2px dashed #94a3b8;vertical-align:middle;margin-right:5px"></span> смена пула</span>
 </div>`;
 return `<div class="card">
  <div class="section-title">📈 Как я двигался в светофоре</div>
  <div class="sv-svg-wrap">${svg}</div>
  ${legend}
  <div class="muted" style="font-size:12px;margin-top:10px;line-height:1.55">${reason}</div>
 </div>`;
}

function svetoforValIncomeCard(d){
 const u=d.user||{};
 const inc=u.income_month||0, stz=u.stazh_months||0;
 const fc=d.forecast||{};
 const cm=fc.current_month||{}, nm=fc.next_month||{};
 const factRev=Number(cm.fact_revenue)||0;
 const fcstRev=Number(cm.forecast_revenue)||0;
 const totRev=Number(cm.revenue_total)||0;
 const nmTot=Number(nm.revenue_total)||0;
 const fmt=n=>{n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' млн'; if(n>=1e3) return Math.round(n/1e3)+'к'; return String(Math.round(n));};
 // Средние за стаж (archive.income — средний доход, вал = доход/0.48)
 const avgInc=inc, avgVal=inc>0?Math.round(inc/0.48):0;
 const rows=[];
 if(factRev>0 || totRev>0){
  rows.push({mo:'июл · факт', val:factRev, doch:Math.round(factRev*0.48), cls:'fact'});
 }
 if(totRev>factRev && totRev>0){
  rows.push({mo:'июл · прогноз', val:totRev, doch:Math.round(totRev*0.48), cls:'fc'});
 }
 if(nmTot>0){
  rows.push({mo:'авг · прогноз', val:nmTot, doch:Math.round(nmTot*0.48), cls:'fc'});
 }
 const rowsHtml=rows.map(r=>{
  const pct=r.val>0?Math.min(100,Math.round(r.val/Math.max(avgVal*1.5, r.val)*100)):0;
  const fillW=Math.min(100, pct);
  const bar=r.cls==='fact'?'background:var(--ok)':'background:var(--buyer)';
  return `<tr class="${r.cls}"><td>${r.mo}</td><td>${fmt(r.val)}</td><td>${fmt(r.doch)}</td><td><div class="sv-bar"><div class="sv-bar-fill" style="width:${fillW}%;${bar}"></div></div></td></tr>`;
 }).join('');
 if(!rows.length){
  return `<div class="card"><div class="section-title">📊 На чём основан прогноз — вал и доход</div>
  <div class="soon">Прогноз вала появится, как только будут данные.</div></div>`;
 }
 return `<div class="card">
  <div class="section-title">📊 На чём основан прогноз — вал и доход</div>
  <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
   <div class="sv-stat"><div class="sv-stat-cap">средний вал</div><div class="sv-stat-val">${fmt(avgVal)} ₽</div><div class="sv-stat-sub">за ${stz||'?'} мес стажа</div></div>
   <div class="sv-stat"><div class="sv-stat-cap">средний доход</div><div class="sv-stat-val">${fmt(avgInc)} ₽</div><div class="sv-stat-sub">вал × 0,48</div></div>
  </div>
  <table class="sv-tbl"><thead><tr><th>месяц</th><th>вал</th><th>доход</th><th style="width:35%"></th></tr></thead><tbody>${rowsHtml}</tbody></table>
  <div class="muted" style="font-size:11px;margin-top:8px;line-height:1.5">
   Место в светофоре = <b>средний доход за окно min(стаж, 12) мес</b>. Прогноз считает new_avg = (income × период + вал×0,48) / (период+1).
  </div>
 </div>`;
}

// Инициализация калькулятора (ЧИСТАЯ ПЕРЕЗАПИСЬ — все переменные в одной области)
window.initSvetoforCalc=function(){
  var v=document.getElementById('svV');
  var pyr=document.getElementById('svPyr');
  var typedV=document.getElementById('svTypedVal');
  var curP=document.getElementById('svCurrPos');
  var curC=document.getElementById('svCurrCat');
  var progBlock=document.getElementById('svProgBlock');
  var progP=document.getElementById('svProgPos');
  var progC=document.getElementById('svProgCat');
  var progA=document.getElementById('svProgAvg');
  var note=document.getElementById('svNote');
  if(!v||!pyr){console.warn('[svCalc] DOM not ready');return;}
  var Z=[[1,5,727040,'Самые лучшие'],[6,10,593131,'Самые лучшие'],[11,15,523601,'Самые лучшие'],[16,20,369000,'Лучшие'],[21,30,445266,'Лучшие'],[31,40,377702,'Лучшие'],[41,50,325684,'Лучшие'],[51,60,300542,'Лучшие'],[61,70,261284,'Лучшие'],[71,80,274555,'Лучшие'],[81,100,257527,'Лучшие'],[101,120,249300,'Хорошие'],[121,140,231125,'Хорошие'],[141,160,233293,'Хорошие'],[161,200,216493,'Хорошие'],[201,300,179969,'Средние'],[301,400,158710,'Средние'],[401,500,144083,'Средние'],[501,600,119252,'Средние'],[601,700,94768,'Слабые'],[701,800,78809,'Слабые'],[801,1000,13646,'Низкоэффективные']];
  var CC={'Самые лучшие':'#16a34a','Лучшие':'#22c55e','Хорошие':'#84cc16','Средние':'#f59e0b','Слабые':'#f97316','Низкоэффективные':'#dc2626'};
  function fmt(n){n=Number(n)||0;if(n>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' млн';if(n>=1e3)return Math.round(n/1e3)+'к';return String(Math.round(n));}
  function findIdx(p){if(!p||p<1)return -1;for(var k=0;k<Z.length;k++)if(p>=Z[k][0]&&p<=Z[k][1])return k;return -1;}
  function renderPyr(curIdx,youIdx){
    var html='';
    for(var k=0;k<Z.length;k++){
      var z=Z[k], cl='';
      if(youIdx!==null&&k===youIdx)cl=' you';
      if(curIdx>=0&&k===curIdx)cl+=' cur';
      var w=(18+(k/(Z.length-1))*82).toFixed(0)+'%';
      var bg=CC[z[3]]||'#94a3b8';
      html+='<div class="sv-pyr-row'+cl+'" data-idx="'+k+'" style="width:'+w+';background:'+bg+';color:#fff"><span class="sv-pyr-l">#'+z[0]+'–'+z[1]+' <span class="sv-pyr-r">≈ '+fmt(z[2])+'₽</span></span><span class="sv-pyr-you">ты будешь здесь</span><span class="sv-pyr-cur">сейчас</span></div>';
    }
    pyr.innerHTML=html;
  }
  function paint(){
    console.log('[svCalc] paint called, v.value=', v.value, 'currentPos=', v.dataset.currentPos);
    var raw=(v.value||'').replace(/\D/g,'');
    var val=raw?parseInt(raw,10):0;
    var ap=parseInt(v.dataset.currentPos,10)||0;
    var inc=Number(v.dataset.income)||0;
    var stz=Number(v.dataset.stazh)||0;
    var ci=findIdx(ap), cZ=null;
    if(ci>=0)cZ=Z[ci];
    // "СЕЙЧАС" — всегда видна
    if(curP)curP.textContent=(ap>0&&cZ)?('#'+ap):'#'+ap;
    if(curC)curC.textContent=cZ?cZ[3]:'—';
    var youIdx=null, resPos=null, rZ=null;
    var newAvg=0, doch=0;
    if(val>0&&cZ){
      var P=Math.min(stz||12,12), N=Math.min((stz||12)+1,12);
      doch=Math.round(val*0.48);
      var base=cZ[2]||inc;
      newAvg=(base*P+doch)/N;
      for(var j=0;j<Z.length;j++)if(Z[j][2]&&newAvg>=Z[j][2]){resIdx=j;break;}
      var resIdx=resIdx||0;
      if(resIdx<=0){resPos=rZ?rZ[0]:Z[0][0];}
      else{
        var hi=Z[resIdx-1][2];
        if(!hi||newAvg>=hi)resPos=Z[resIdx][0];
        else{var t=(newAvg-Z[resIdx][2])/(hi-Z[resIdx][2]);resPos=Math.max(Z[resIdx][0],Math.round(Z[resIdx][1]-t*(Z[resIdx][1]-Z[resIdx][0])));}
      }
      rZ=Z[resIdx];
      youIdx=resIdx;
    }
    renderPyr(ci>=0?ci:null, youIdx);
    // "Введено + ты будешь здесь" — одна строка сверху, обоснование — внутри
    if(val>0){
      if(progBlock)progBlock.style.display='block';
      if(typedV)typedV.textContent=val.toLocaleString('ru-RU')+' ₽';
      if(progP)progP.textContent='~#'+resPos;
      if(progC)progC.textContent=rZ?rZ[3]:'—';
      if(progA)progA.textContent='· новый средний '+fmt(newAvg)+' ₽';
      if(note){
        var up=(ap||0)-resPos;
        var fromZ=cZ?cZ[3]:'?';
        var toZ=rZ?rZ[3]:'?';
        if(fromZ===toZ&&up===0) note.innerHTML='Вал '+fmt(val)+' ₽ → доход '+fmt(doch)+' ₽. Без изменений.';
        else if(up>0) note.innerHTML='Вал '+fmt(val)+' → доход '+fmt(doch)+' ₽. Новый средний: '+fmt(newAvg)+' ₽ → место ↑ на '+up+'.';
        else note.innerHTML='Новый средний: '+fmt(newAvg)+' ₽.';
      }
    }else{
      if(progBlock)progBlock.style.display='none';
      if(note)note.innerHTML='Введи вал — покажу, куда попадёшь.';
    }
  }
  v.addEventListener('input',function(){ console.log('[svCalc] input event'); paint(); });
  paint();
};

function initSvetoforCalcWithData(d){
  var u=(d&&d.user)||{};
  var inp=document.getElementById('svV');

    inp.dataset.stazh=String(u.stazh_months||0);
    inp.dataset.currentPos=String(u.position_in_pool||'');
  }
  if(window.initSvetoforCalc)window.initSvetoforCalc();
}
