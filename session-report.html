<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отчёт к наставнической сессии · Прогноз</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{ "imports": { "https://www.gstatic.com/firebasejs/10.7.0/": "/libs/firebase/10.7.0/" } }
</script>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f1f3f7; --line:#e6e8ee;
  --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 24px rgba(20,30,55,.05);
  --ink:#1a1f2e; --muted:#7a8194; --muted-2:#a8aebd;
  --brand:#2b6cb0; --brand-soft:#eaf2fb; --buyer:#3b82f6; --seller:#10b981; --gold:#f59e0b;
  --ok:#16a34a; --ok-bg:#e9f6ec; --warn:#d97706; --warn-bg:#fdf3e3; --bad:#dc2626; --bad-bg:#fdeaea;
  --plan:#7c3aed; --plan-bg:#f3effe; --mine:#0f766e; --manager:#4f46e5;
  --r:12px; --r-sm:8px; --pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-bottom:40px}
.app-header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:12px;height:54px;position:sticky;top:0;z-index:50}
.app-header .logo{font-weight:800;color:var(--brand)}.app-header .logo span{color:var(--muted);font-weight:500}
.app-header .actions{margin-left:auto;display:flex;gap:8px}
.app-header button{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:none;border-radius:var(--pill);padding:8px 14px;cursor:pointer;font-family:inherit}
.wrap{max-width:860px;margin:18px auto;padding:0 16px}

.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.loading .sp{display:inline-block;width:32px;height:32px;border:3px solid var(--surface-2);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-bg);border:1px solid var(--bad);color:#7f1d1d;padding:14px 18px;border-radius:var(--r);margin:20px 0}

.rep-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.rep-head .eyebrow{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brand)}
.rep-head h1{font-size:24px;font-weight:800;margin:3px 0 2px}
.rep-head .sub{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:var(--pill);background:var(--surface-2);color:var(--ink)}
.chip.ir{background:var(--warn-bg);color:var(--warn)}
.chip.ir.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ir.bad{background:var(--bad-bg);color:var(--bad)}
.chip.risk{background:var(--bad-bg);color:var(--bad)}
.chip.up{background:var(--ok-bg);color:var(--ok)}
.chip.down{background:var(--bad-bg);color:var(--bad)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin-bottom:4px}
.sec-h .n{width:24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.lede{font-size:15px;line-height:1.55}.lede b{font-weight:700}
.muted{color:var(--muted)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.two{grid-template-columns:1fr}}
.block-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}

.spark{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--line);position:relative;padding:20px 8px 0;background:#fafbfc;border-radius:8px 8px 0 0}
.spark .norm{position:absolute;left:8px;right:8px;border-top:1px dashed var(--bad);top:16px;z-index:1}
.spark .norm span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--bad);font-weight:700;background:#fff;padding:0 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;position:relative;height:100%;padding-bottom:24px}
.bar .b{width:70%;max-width:42px;min-height:4px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bar.cur .b{background:linear-gradient(180deg,#10b981,#0e7a4f);box-shadow:0 0 0 2px #b9e6cd}
.bar.future .b{background:repeating-linear-gradient(45deg,#e5e7eb 0,#e5e7eb 4px,#f3f4f6 4px,#f3f4f6 8px);border:1px dashed var(--muted-2)}
.bar .v{font-size:13px;font-weight:800;color:var(--ink);line-height:1.1;margin-bottom:4px;white-space:nowrap}
.bar .l{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bar .ptick{position:absolute;left:50%;transform:translateX(-50%);width:70%;max-width:42px;border-top:3px dashed var(--plan);z-index:2}
.plegend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap;padding:0 4px}
.plegend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.plegend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-top:8px}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.plegend i{width:12px;height:8px;border-radius:2px;display:inline-block}

.nstep{display:flex;gap:6px;margin-top:6px}
.nbox{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 6px;text-align:center;font-weight:800;font-size:13px;color:var(--muted-2)}
.nbox span{display:block;font-size:9px;font-weight:600;margin-top:2px;line-height:1.2}
.nbox.passed{background:var(--bad-bg);color:var(--bad);border-color:#f3b4b4}
.nbox.cur{background:var(--bad);color:#fff;border-color:var(--bad)}
.note{font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 11px;margin-top:10px}

.comp{margin-bottom:11px}
.comp-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.comp-top b{font-weight:700}
.track{height:9px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.fill{height:100%;border-radius:5px}
.track .normmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.f-ok{background:var(--ok)}.f-warn{background:var(--warn)}.f-bad{background:var(--bad)}

.tagline{font-size:12px;border-radius:var(--r-sm);padding:9px 11px;margin-top:10px}
.tag-ok{background:var(--ok-bg);color:#14532d}.tag-bad{background:var(--bad-bg);color:#7f1d1d}.tag-warn{background:var(--warn-bg);color:#7c4a03}

.diag{border-left:3px solid var(--bad);background:var(--bad-bg);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
.diag .di{font-size:16px;flex-shrink:0}
.diag .dt{flex:1}.diag .dt b{font-weight:700}
.diag .dt .code{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.diag .dt .arrow{font-size:12px;margin-top:4px}
.diag .dt .arrow b{color:var(--brand)}
.norm-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.nchip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--pill);background:var(--ok-bg);color:#14532d}

.funnel{display:flex;flex-direction:column;gap:7px}
.fstep{display:flex;align-items:center;gap:10px}
.fstep .fname{width:88px;font-size:12px;color:var(--muted);flex-shrink:0}
.fstep .fbar{flex:1;height:30px;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:800;font-size:13px;min-width:42px}
.fstep .fconv{font-size:11px;color:var(--muted);width:74px;text-align:right;flex-shrink:0}
.side-h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin:4px 0 9px}

.goal-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.goal-row:first-of-type{border-top:none}
.goal-row .gi{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.goal-row .gt{flex:1}.goal-row .gt b{font-weight:700}.goal-row .gt small{display:block;color:var(--muted);font-size:11px}
.goal-row .gv{font-weight:800;font-size:15px;white-space:nowrap}

.ach{display:flex;gap:9px;flex-wrap:wrap}
.ach-card{flex:1;min-width:180px;border-radius:var(--r-sm);padding:11px 13px;border:1px solid var(--line)}
.ach-card.earned{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d}
.ach-card .at{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ach-card.earned .at{color:var(--gold)}
.ach-card .ab{font-size:13px;font-weight:700;margin-top:4px}
.ach-card .ap{font-size:11px;color:var(--muted);margin-top:3px}
.prog{height:6px;background:var(--surface-2);border-radius:4px;margin-top:7px;overflow:hidden}
.prog div{height:100%;background:var(--ok);border-radius:4px}

.trow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r-sm);margin-top:7px;flex-wrap:wrap}
.trow.done{border-left-color:var(--ok)}.trow.prog{border-left-color:var(--warn)}
.trow.over{border-left-color:var(--bad)}.trow.event{border-left-color:var(--brand)}
.trow .tco{font-size:15px;flex-shrink:0}
.trow .trc{flex:1 1 200px;min-width:0;overflow:hidden}
.trow .trn{font-size:13px;font-weight:600;overflow-wrap:break-word;word-break:break-word}
.trow .trn.struck{text-decoration:line-through;opacity:.6}
.trow .trm{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:break-word}
.trow .trm .cm{color:var(--ink)}
.trow .trm .code{font-family:ui-monospace,monospace;font-size:10px}
.trst{font-size:11px;font-weight:800;padding:3px 9px;border-radius:var(--pill);white-space:nowrap;flex-shrink:0}
.st-done{background:var(--ok-bg);color:#14532d}.st-prog{background:var(--warn-bg);color:#7c4a03}.st-over{background:var(--bad-bg);color:#7f1d1d}

.notes-line{border-bottom:1px dashed var(--muted-2);height:30px}
.addtask{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:none;border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-family:inherit;margin-bottom:10px}
.salary{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.sal-now{font-size:18px;font-weight:800;line-height:1.2}.sal-now span{font-size:11px;color:var(--muted);font-weight:600;display:block}

/* ── 🦊 наставник (ИИ) ── */
.coach-card{background:linear-gradient(135deg,#f0f7ff,#eef2fb);border:1px solid #d5e6fb;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;gap:13px;align-items:flex-start}
.coach-card .fox{font-size:26px;flex-shrink:0;line-height:1.1}
.coach-card .ct{font-size:14px;line-height:1.55}
.coach-card .cl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);margin-bottom:5px}
/* ── тренд ИР (последние дни) ── */
.trend-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px}
.trend-spark{display:flex;align-items:flex-end;gap:5px;height:44px}
.trend-spark .tb{width:12px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#60a5fa,#2b6cb0);min-height:3px}
.trend-spark .tb.last{background:linear-gradient(180deg,#10b981,#0e7a4f)}
.trend-meta{font-size:13px}.trend-meta b{font-weight:800}
.trend-dn{color:var(--bad);font-weight:800}.trend-up{color:var(--ok);font-weight:800}.trend-fl{color:var(--muted);font-weight:800}
/* ── активность / застой ── */
.yday{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r-sm);padding:12px 14px}
.yday.moved{background:var(--ok-bg)}.yday.stall{background:var(--warn-bg)}
.yday .yi{font-size:20px;flex-shrink:0}.yday .yt b{font-weight:800}
.ydelta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.ydelta span{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:3px 10px}
/* ── воронка: полоски прогресса ── */
.fstage{margin-bottom:11px}
.fstage-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px}
.fstage-top .fn{color:var(--ink);font-weight:600}
.fstage-top .fv{font-weight:800}.fstage-top .fv small{color:var(--muted);font-weight:600}
.ptrack{height:16px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.pfill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:10px;font-weight:800;min-width:24px}
.pfill.done{background:var(--ok)}.pfill.mid{background:var(--warn)}.pfill.low{background:var(--bad)}.pfill.over{background:var(--seller)}
/* ── как ты на фоне ── */
.fon{display:flex;gap:12px;flex-wrap:wrap}
.fon-card{flex:1;min-width:190px;background:var(--surface-2);border-radius:var(--r-sm);padding:13px 15px}
.fon-card .fk{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.fon-card .fbig{font-size:22px;font-weight:800;margin-top:3px}
.fon-card .fnote{font-size:12px;color:var(--muted);margin-top:2px}
.fon-card.good{background:var(--ok-bg)}.fon-card.good .fbig{color:var(--ok)}
/* ── награды-чипы + доход ── */
.award-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.award-chip{font-size:12px;font-weight:800;padding:6px 12px;border-radius:var(--pill);background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;color:#92600a}
.income-strip{margin-top:12px;background:linear-gradient(135deg,#ecfdf5,#e9f6ec);border:1px solid #bbf0cf;border-radius:var(--r-sm);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.income-strip b{color:var(--ok);font-size:18px;font-weight:800}
/* ── вал по партнёрам ── */
.valrow{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.valrow .vn{width:120px;font-size:13px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.valrow .vt{flex:1;height:18px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.valrow .vf{height:100%;border-radius:5px;background:linear-gradient(90deg,#3b82f6,#2b6cb0)}
.valrow .vv{width:64px;text-align:right;font-weight:800;font-size:13px;flex-shrink:0}
.valzero{font-size:12px;color:var(--muted);margin-top:8px}
/* ── активность недели ── */
.wk{display:flex;flex-direction:column;gap:9px}
.wk-line{display:flex;gap:9px;align-items:flex-start}
.wk-line .wi{font-size:15px;flex-shrink:0}
.wk-line .wt{font-size:13px}.wk-line .wt b{font-weight:800}
.wk-names span{display:inline-block;font-size:12px;font-weight:700;background:var(--surface-2);border-radius:var(--pill);padding:2px 9px;margin:2px 4px 0 0}
/* ── застой по дням ── */
.stall-row{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-left-width:3px;border-left-color:var(--warn);border-radius:var(--r-sm);margin-top:7px}
.stall-row.hot{border-left-color:var(--bad)}
.stall-row .sn{flex:1;font-size:13px;font-weight:600}
.stall-row .sd{font-size:12px;font-weight:800;padding:3px 10px;border-radius:var(--pill);background:var(--warn-bg);color:var(--warn);flex-shrink:0}
.stall-row.hot .sd{background:var(--bad-bg);color:var(--bad)}
.stall-row .sn small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
/* ── плитки ИР (мес/нед) ── */
.ir-tiles{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ir-tile{flex:1;min-width:150px;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 15px}
.ir-tile .tk{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ir-tile .tv{font-size:28px;font-weight:800;line-height:1.1;margin-top:2px}
.ir-tile .tn{font-size:11px;color:var(--muted);margin-top:2px}
/* ── сравнение групп в отделе ── */
.gc-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gc-row .gn{width:110px;font-size:12px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-row .gt{flex:1;height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.gc-row .gf{height:100%;border-radius:5px;background:linear-gradient(90deg,#93c5fd,#3b82f6)}
.gc-row.self .gn{font-weight:800;color:var(--brand)}
.gc-row.self .gf{background:linear-gradient(90deg,#22c55e,#16a34a)}
.gc-row .gv{width:42px;text-align:right;font-weight:800;font-size:12px;flex-shrink:0}
/* ── вал факт+прогноз по партнёрам ── */
.vfp{margin-bottom:10px}
.vfp-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.vfp-top .vn{font-weight:600}.vfp-top .vv b{font-weight:800}.vfp-top .vv small{color:var(--muted)}
.vfp-track{height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex;position:relative}
.vfp-fact{height:100%;background:var(--ok)}
.vfp-fc{height:100%;background:var(--gold)}
.vfp-plan{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
/* ── таблица наград ── */
table.aw{width:100%;border-collapse:collapse;font-size:13px}
table.aw td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.aw td.aw-badge{white-space:nowrap;font-weight:800;width:1%}
table.aw td.aw-name{font-weight:600;white-space:nowrap}
table.aw td.aw-reason{color:var(--muted)}
/* ── воронка группы: план+факт полоски ── */
.afstage{margin-bottom:10px}
.afstage-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.afstage-top .an{font-weight:600}.afstage-top .av{font-weight:800}.afstage-top .av small{color:var(--muted);font-weight:600}
.aftrack{height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative}
.affill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:10px;font-weight:800;min-width:24px}
/* ── прогноз/стек на графике вала ── */
.bstk{width:70%;max-width:42px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg-fact{background:linear-gradient(180deg,#22c55e,#16a34a)}
.seg-fc{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
/* ── табы внутри секции ── */
.ptab-bar{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.ptab-btn{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer}
.ptab-btn.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.1)}

@media print{.app-header .actions,.addtask{display:none}body{background:#fff}.sec,.rep-head{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="app-header">
  <div class="logo">Прогноз <span>· отчёт к сессии</span></div>
  <div class="actions">
    <button onclick="window.location.reload()" title="Обновить из кэша">↻</button>
    <button onclick="refreshForce()" title="Пересчитать заново (игнорировать кэш)">🔄 Пересчитать</button>
    <button onclick="window.print()">🖨 Печать / PDF</button>
    <button onclick="window.close()">✕ Закрыть</button>
  </div>
</div>

<div class="wrap" id="root">
  <div class="loading"><div class="sp"></div><div>Собираю отчёт…</div></div>
</div>

<script type="module">
import { requireAuth } from './auth-guard.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

const params = new URLSearchParams(location.search);
const level = params.get('level') || 'partner';
const userCode = params.get('code');

// Fallback-словарь если бэк прислал bit_key вместо label (например, старый кэш)
const BIT_LABELS = {
  k_distribution_flow: 'Перекос входящего потока по сегментам',
  k_sufficiency_flow: 'Мало входящих клиентов',
  k_sufficiency_hot: 'Мало горячих клиентов в работе',
  k_sufficiency_deals: 'Мало сделок в работе',
  p_conversion_to_hot: 'Низкая конверсия в горячие',
  p_conversion_to_deals: 'Низкая конверсия в сделки',
  k_distribution_objects: 'Перекос объектов по сегментам',
  k_sufficiency_objects: 'Мало объектов в работе',
  k_sufficiency_hot_objects: 'Мало горячих объектов',
  k_sufficiency_deals_objects: 'Мало сделок по объектам',
  p_conversion_to_hot_objects: 'Объекты не доходят до горячих',
};
const niceBitLabel = (w) => {
  const isCode = w && w.label && /^[a-z_]+$/.test(w.label);
  if (isCode || !w.label) return BIT_LABELS[w.bit_key] || w.label || w.bit_key || 'отклонение';
  return w.label;
};
// Подменяет в тексте «p_conversion_to_hot, k_sufficiency_hot_objects» → человеческие фразы
function humanizeLede(s) {
  if (!s) return s;
  return s.replace(/\b([kp]_[a-z_]+)\b/g, (m) => (BIT_LABELS[m] || m).toLowerCase());
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fmtK = (n) => { n = Number(n) || 0; if (n >= 1e6) return (n/1e6).toFixed(1).replace('.', ',')+' млн'; if (n >= 1e4) return Math.round(n/1e3)+'к'; if (n >= 1e3) return (n/1e3).toFixed(1).replace('.', ',')+'к'; return String(Math.round(n)); };
const monthShort = (ym) => { const m = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; const idx = parseInt(ym.slice(5, 7), 10) - 1; return m[idx] || ym; };

async function load(force = false) {
  const me = await requireAuth();
  if (!userCode) {
    document.getElementById('root').innerHTML = '<div class="err">Не указан параметр <code>code</code> в URL.</div>';
    return;
  }
  document.getElementById('root').innerHTML = '<div class="loading"><div class="sp"></div><div>Собираю отчёт…</div></div>';
  try {
    const fns = getFunctions(getApp(), 'europe-west1');
    const fn = httpsCallable(fns, 'getSessionReport', { timeout: 60000 });
    const res = await fn({ level, user_code: userCode, force });
    if (!res.data || !res.data.report) throw new Error('Пустой ответ');
    render(res.data.report, res.data.from_cache);
  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML = `<div class="err"><b>Не удалось собрать отчёт.</b><br>${esc(e.message || e)}</div>`;
  }
}

window.refreshForce = () => load(true);

function chipsHTML(c) {
  const h = [];
  if (c.ir_pct != null) {
    const cls = c.ir_status === 'green' ? 'ok' : c.ir_status === 'red' ? 'bad' : '';
    h.push(`<div class="chip ir ${cls}">ИР ${c.ir_pct}% · норма ${c.ir_norm}%</div>`);
  }
  if (c.risk_streak >= 1) {
    const lvl = Math.min(4, c.risk_streak);
    h.push(`<div class="chip risk">🔴 в риске · Н${lvl} (${c.risk_streak}-я неделя)</div>`);
  }
  if (c.ir_delta != null && Math.abs(c.ir_delta) >= 1) {
    const cls = c.ir_delta > 0 ? 'up' : 'down';
    const sign = c.ir_delta > 0 ? '▲ +' : '▼ ';
    h.push(`<div class="chip ${cls}">${sign}${c.ir_delta} п.п. ИР vs прошлый мес</div>`);
  }
  if (c.rev_delta != null && Math.abs(c.rev_delta) >= 10000) {
    const cls = c.rev_delta > 0 ? 'up' : 'down';
    const sign = c.rev_delta > 0 ? '▲ +' : '▼ ';
    h.push(`<div class="chip ${cls}">${sign}${fmtK(Math.abs(c.rev_delta))} ₽ вал</div>`);
  }
  return h.join('');
}

function sparkPlanVsFact(history, asIncome) {
  // history.cycle_months, plan_trajectory[i].plan_revenue, revenue_by_month[i].revenue
  // history.forecast (опц.): {current:{ym,fact,forecast,plan}, next:{ym,forecast,plan}} — оранжевый прогноз
  // asIncome=true → показываем доход (вал × 0.48)
  const k = asIncome ? 0.48 : 1;
  const months = history.cycle_months || [];
  const plan = history.plan_trajectory || [];
  const fact = history.revenue_by_month || [];
  // прогноз только для вала (не для дохода)
  const fcCur = (!asIncome && history.forecast && history.forecast.current) ? history.forecast.current : null;
  const fcNext = (!asIncome && history.forecast && history.forecast.next) ? history.forecast.next : null;
  const hasFc = !!(fcCur || fcNext);
  const totals = [];
  months.forEach((ym, i) => {
    const pv = (plan[i] ? plan[i].plan_revenue : 0) * k;
    const fv = fact[i] && fact[i].revenue != null ? fact[i].revenue * k : 0;
    let fcv = 0;
    if (fcCur && ym === fcCur.ym) fcv = fcCur.forecast;
    if (fcNext && ym === fcNext.ym) { fcv = fcNext.forecast; totals.push(fcNext.plan); }
    totals.push(fv + fcv, pv);
  });
  const max = Math.max(...totals, 1);
  const today = new Date();
  const todayYm = today.toISOString().slice(0, 7);
  const bars = months.map((ym, i) => {
    let planVal = (plan[i] ? plan[i].plan_revenue : 0) * k;
    let factVal = fact[i] && fact[i].revenue != null ? fact[i].revenue * k : null;
    let fcVal = 0, isNextFc = false;
    if (fcCur && ym === fcCur.ym) fcVal = fcCur.forecast;
    if (fcNext && ym === fcNext.ym) { fcVal = fcNext.forecast; planVal = fcNext.plan; factVal = 0; isNextFc = true; }
    const isFuture = ym > todayYm;
    const isCurrent = ym === todayYm;
    const factH = factVal != null && factVal > 0 ? Math.round(factVal / max * 100) : 0;
    const fcH = fcVal > 0 ? Math.round(fcVal / max * 100) : 0;
    const totH = factH + fcH;
    const planH = planVal > 0 ? Math.max(3, Math.round(planVal / max * 100)) : 0;
    const striped = totH === 0 && isFuture && !isNextFc;
    const cls = ['bar']; if (isCurrent) cls.push('cur'); if (striped) cls.push('future');
    const label = isNextFc ? (fcVal > 0 ? '~' + fmtK(fcVal) : '—') : (factVal != null && factVal > 0 ? fmtK(factVal + fcVal) : '—');
    const inner = striped
      ? `<div class="b" style="height:60%"></div>`
      : `<div class="bstk" style="height:${Math.max(3, totH)}%"><div class="seg-fc" style="flex:0 0 ${totH > 0 ? Math.round(fcH / totH * 100) : 0}%"></div><div class="seg-fact" style="flex:1 1 auto"></div></div>`;
    return `<div class="${cls.join(' ')}">
      <div class="v">${label}</div>
      ${planVal > 0 ? `<div class="ptick" style="bottom:calc(${planH}% + 24px)"></div>` : ''}
      ${inner}
      <div class="l">${monthShort(ym)}</div>
    </div>`;
  });
  return `<div class="spark">${bars.join('')}</div>
    <div class="plegend">
      <span><i style="background:linear-gradient(180deg,#22c55e,#16a34a)"></i>факт ${asIncome ? 'дохода' : 'вала'}</span>
      ${hasFc ? '<span><i style="background:linear-gradient(180deg,#fbbf24,#f59e0b)"></i>прогноз</span>' : ''}
      <span><i style="border-top:3px dashed var(--plan);height:0;background:none;width:18px"></i>план месяца${asIncome ? ' (доход)' : ''}</span>
      <span><i style="background:repeating-linear-gradient(45deg,#e5e7eb 0,#e5e7eb 4px,#f3f4f6 4px,#f3f4f6 8px);border:1px dashed var(--muted-2)"></i>будущее</span>
    </div>`;
}

// TZ-A34: единый блок с табами Вал/Доход/ИР для секции «Как шёл — динамика цикла»
function historyTabs(history, opts) {
  opts = opts || {};
  const dohodBtn = opts.hideIncome ? '' : `<button class="hist-tab" data-tab="dohod" onclick="histSwitchTab(this,'dohod')" style="border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer">Доход</button>`;
  return `<div data-history-tabs>
    <div style="display:inline-flex;background:var(--surface-2,#f1f3f7);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px">
      <button class="hist-tab on" data-tab="val" onclick="histSwitchTab(this,'val')" style="border:none;background:var(--surface,#fff);font-family:inherit;font-size:12px;font-weight:700;color:var(--brand);padding:6px 15px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.1)">Вал</button>
      ${dohodBtn}
      <button class="hist-tab" data-tab="ir" onclick="histSwitchTab(this,'ir')" style="border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer">ИР</button>
    </div>
    <div class="hist-content" data-h='${encodeURIComponent(JSON.stringify(history))}'>${sparkPlanVsFact(history)}</div>
  </div>`;
}
window.histSwitchTab = function(btn, mode) {
  const wrap = btn.closest('[data-history-tabs]'); if (!wrap) return;
  wrap.querySelectorAll('.hist-tab').forEach(b => {
    const on = b === btn;
    b.style.background = on ? 'var(--surface,#fff)' : 'transparent';
    b.style.color = on ? 'var(--brand)' : 'var(--muted)';
    b.style.boxShadow = on ? '0 1px 2px rgba(0,0,0,.1)' : '';
  });
  const cont = wrap.querySelector('.hist-content');
  const h = JSON.parse(decodeURIComponent(cont.dataset.h));
  if (mode === 'ir') cont.innerHTML = sparkIr(h);
  else if (mode === 'dohod') cont.innerHTML = sparkPlanVsFact(h, true);
  else cont.innerHTML = sparkPlanVsFact(h, false);
};

function sparkIr(history) {
  const months = history.cycle_months || [];
  const ir = history.ir_by_month || [];
  const dept = history.ir_dept_by_month || null; // [{ym,ir}] — средний ИР отдела
  const hasDept = dept && dept.some(x => x && x.ir != null);
  const today = new Date();
  const todayYm = today.toISOString().slice(0, 7);
  const bars = months.map((ym, i) => {
    const v = ir[i] ? ir[i].ir : null;
    const h = v != null ? Math.max(3, v) : 0;
    const isFuture = ym > todayYm;
    const isCurrent = ym === todayYm;
    const cls = ['bar'];
    if (isCurrent) cls.push('cur');
    if (isFuture) cls.push('future');
    const color = v == null ? '#cbd5e1' : v >= 70 ? '#16a34a' : v >= 50 ? '#d97706' : '#dc2626';
    const dv = dept && dept[i] ? dept[i].ir : null;
    const deptTick = dv != null ? `<div class="ptick" style="bottom:calc(${Math.max(3, dv)}% + 24px);border-top-color:#2b6cb0;border-top-style:solid"></div>` : '';
    return `<div class="${cls.join(' ')}">
      <div class="v">${v != null ? v + '%' : '—'}</div>
      ${deptTick}
      <div class="b" style="height:${h}%;background:linear-gradient(180deg,${color}cc,${color})"></div>
      <div class="l">${monthShort(ym)}</div>
    </div>`;
  });
  return `<div class="spark"><div class="norm" style="top:calc(20px + (100% - 44px) * 0.3)"><span>норма 70%</span></div>${bars.join('')}</div>
    <div class="plegend">
      <span><i style="background:linear-gradient(180deg,#16a34a,#16a34a)"></i>≥70% — норма</span>
      <span><i style="background:linear-gradient(180deg,#d97706,#d97706)"></i>50-70% — риск</span>
      <span><i style="background:linear-gradient(180deg,#dc2626,#dc2626)"></i>&lt;50% — провал</span>
      ${hasDept ? '<span><i style="border-top:3px solid #2b6cb0;height:0;background:none;width:18px"></i>средний ИР отдела</span>' : ''}
    </div>`;
}

function nstepHTML(risk) {
  // risk.streak: 0..4+; показываем Н1-Н4
  const lvl = Math.min(4, risk.streak || 0);
  const boxes = [1, 2, 3, 4].map((n) => {
    const labels = { 1: 'флаг', 2: 'разбор + встреча', 3: 'разбор · сейчас', 4: '+ уведомить управляющего партнёра' };
    if (n < lvl) return `<div class="nbox passed">Н${n}<span>${labels[n]}</span></div>`;
    if (n === lvl) return `<div class="nbox cur">Н${n}<span>${labels[n]}</span></div>`;
    return `<div class="nbox">Н${n}<span>${labels[n]}</span></div>`;
  });
  return `<div class="nstep">${boxes.join('')}</div>`;
}

function compsHTML(ir_breakdown, head) {
  if (!ir_breakdown) {
    if (head && head.is_newbie) return '<div class="tagline tag-ok">🌱 У новичка (стаж &lt; 1 мес) ИР пока не считается — план включится с 1-го числа первого полного месяца работы.</div>';
    if (head && head.is_group_zero) return '<div class="tagline tag-warn">🛌 В Группе 0 (без зоны светофора) — ИР не считается.</div>';
    return '<div class="muted">Нет данных ИР v2 за сегодня.</div>';
  }
  const comp = (label, val) => {
    const cls = val >= 70 ? 'f-ok' : val >= 40 ? 'f-warn' : 'f-bad';
    const lbl = val >= 70 ? 'норма' : val >= 40 ? 'ниже нормы' : 'просело';
    const clr = val >= 70 ? 'var(--ok)' : val >= 40 ? 'var(--warn)' : 'var(--bad)';
    return `<div class="comp"><div class="comp-top"><span>${label}</span><b style="color:${clr}">${val}% · ${lbl}</b></div><div class="track"><div class="fill ${cls}" style="width:${Math.min(100, val)}%"></div><div class="normmark" style="left:${ir_breakdown.norm}%"></div></div></div>`;
  };
  return comp('🚰 Поток входящих (C1)', ir_breakdown.c1.value) +
         comp('🔥 Горячие (C2)', ir_breakdown.c2.value) +
         comp('🤝 Задатки (C3)', ir_breakdown.c3.value) +
         comp('💰 Вал (C4)', ir_breakdown.c4.value);
}

function diagnosticHTML(d) {
  const renderItem = (w, side) => {
    const ico = side === 'buyer' ? '🛒' : '🏠';
    const sideLbl = side === 'buyer' ? 'покупатель' : 'продавец';
    const a = w.actual != null ? `факт ${w.actual}` : '';
    const t = w.threshold != null ? ` · норма ${w.threshold}` : '';
    const numbers = (a || t) ? `<div class="muted" style="font-size:11px;margin-top:4px">${esc(a + t)}</div>` : '';
    const descr = w.description ? `<div style="font-size:13px;margin-top:6px;color:var(--ink)">${esc(w.description)}</div>` : '';
    const task = w.task_title ? `<div class="arrow" style="margin-top:8px;color:var(--ink)">→ <b>что делать:</b> ${esc(w.task_title)}${w.tool ? ` <span class="muted" style="font-size:11px">· инструмент: ${esc(w.tool)}</span>` : ''}</div>` : '';
    return `<div class="diag"><div class="di">${ico}</div><div class="dt">
      <b>${esc(niceBitLabel(w))}</b> <span class="muted" style="font-size:11px">(${sideLbl})</span>
      ${numbers}
      ${descr}
      ${task}
    </div></div>`;
  };
  const items = [];
  for (const w of (d.buyer_weak || [])) items.push(renderItem(w, 'buyer'));
  for (const w of (d.seller_weak || [])) items.push(renderItem(w, 'seller'));
  const norms = (d.norm_chips || []).map((c) => `<span class="nchip">✓ ${esc(niceBitLabel(c))}</span>`).join('');
  if (!items.length) {
    return `<div class="tagline tag-ok">✅ Отклонений по справочнику нет — повод похвалить.</div>${norms ? `<div class="norm-chips" style="margin-top:14px">${norms}</div>` : ''}`;
  }
  return items.join('') + (norms ? `<div class="block-title" style="margin-top:14px">В норме</div><div class="norm-chips">${norms}</div>` : '');
}

function funnelHTML(funnel) {
  if (!funnel.buyer && !funnel.seller) return '<div class="muted">Нет данных воронки.</div>';
  const planB = (funnel.plan && funnel.plan.buyer) || {};
  const planS = (funnel.plan && funnel.plan.seller) || {};
  const renderSide = (side, data, plan, icon, color, isBuyer) => {
    if (!data) return '';
    const steps = isBuyer
      ? [['Поток', data.flow, plan.flow], ['Горячие', data.hot, plan.hot], ['Задатки', data.deposits, plan.deposits], ['Сделки', data.deals, plan.deals]]
      : [['Объекты', data.objects, plan.objects], ['Горячие', data.hot, plan.hot], ['Задатки', data.deposits, plan.deposits], ['Сделки', data.deals, plan.deals]];
    const max = Math.max(...steps.map(s => s[1] || 0), 1);
    const rows = steps.map(([label, fact, planV], i) => {
      const w = Math.max(15, Math.round((fact || 0) / max * 100));
      const conv = i > 0 && steps[i-1][1] > 0 ? Math.round(fact / steps[i-1][1] * 100) : null;
      const planL = planV != null ? `план ${Math.round(planV * 10) / 10}` : '';
      return `<div class="fstep"><div class="fname">${label}</div><div class="fbar" style="background:${color};width:${w}%;min-width:42px">${fact || 0}</div><div class="fconv">${conv != null ? `${conv}% · ` : ''}${planL}</div></div>`;
    });
    return `<div><div class="side-h">${icon} ${side}</div><div class="funnel">${rows.join('')}</div></div>`;
  };
  return `<div class="two">${renderSide('Покупатели', funnel.buyer, planB, '🛒', 'var(--buyer)', true)}${renderSide('Продавцы', funnel.seller, planS, '🏠', 'var(--seller)', false)}</div>`;
}

function goalsHTML(g) {
  const rows = [];
  if (g.plan_revenue_month > 0) {
    const pct = g.plan_pct != null ? g.plan_pct : 0;
    const clr = pct >= 100 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">💰</div><div class="gt"><b>План вала на месяц</b><small>факт ${fmtK(g.fact_revenue_month)} ₽ · прогноз ${fmtK(g.forecast_revenue_month)} ₽ · план ${fmtK(g.plan_revenue_month)} ₽</small></div><div class="gv" style="color:${clr}">${pct}%${g.gap_to_plan > 0 ? ` · +${fmtK(g.gap_to_plan)}` : ''}</div></div>`);
  }
  if (g.ir_current != null) {
    const cur = g.ir_current; const tgt = g.ir_target_pct;
    const clr = cur >= tgt ? 'var(--ok)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">🎯</div><div class="gt"><b>Цель ИР</b><small>сейчас ${cur}%, цель ${tgt}%</small></div><div class="gv" style="color:${clr}">${cur >= tgt ? 'в норме' : `+${tgt - cur} п.п.`}</div></div>`);
  }
  return rows.join('') || '<div class="muted">Цели не настроены.</div>';
}

function salaryGoalHTML(sg) {
  if (!sg) return '';
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
    <div class="block-title">Цель по ЗП (ставит сам) · цикл 6 мес</div>
    <div class="salary">
      <div class="sal-now">${fmtK(sg.current)} ₽<span>текущая цель${sg.is_auto ? ' (авто)' : ''}</span></div>
      ${sg.change_count > 0 ? `<div class="muted">менял ${sg.change_count} раз</div>` : '<div class="muted">не менял</div>'}
    </div>
    ${!sg.history_available ? '<div class="note">Подробная история изменений (когда и в какую сторону) появится в фазе 2.</div>' : ''}
  </div>`;
}

function achievementsHTML(a) {
  const e = (a.earned || []).map((x) => `<div class="ach-card earned"><div class="at">🏆 Заработал</div><div class="ab">${esc(x.title)}</div><div class="ap">${esc(x.desc)}</div></div>`).join('');
  const p = (a.inProgress || []).map((x) => `<div class="ach-card"><div class="at">🎯 В шаге от</div><div class="ab">${esc(x.title)}</div><div class="ap">${esc(x.desc)}</div>${x.progress != null ? `<div class="prog"><div style="width:${x.progress}%"></div></div>` : ''}</div>`).join('');
  if (!e && !p) return '<div class="muted">Пока без достижений. Закрой план месяца — появится «🏆 Перевыполнил план вала».</div>';
  return `<div class="ach">${e}${p}</div>`;
}

function tasksHTML(t) {
  const c = t.counts || {};
  const chips = `<div class="chips" style="margin-top:0;margin-bottom:12px">
    <div class="chip">${c.week_total || 0} задач за неделю</div>
    <div class="chip up">✅ выполнено ${c.week_done || 0}</div>
    <div class="chip ir">⏳ в работе ${c.week_progress || 0}</div>
    ${c.week_overdue ? `<div class="chip risk">⚠️ просрочено ${c.week_overdue}</div>` : ''}
  </div>`;
  const items = (t.week || []).filter((it) => it && (it.title || '').trim());
  if (!items.length) return chips + '<div class="muted">За период задачи не ставились.</div>';
  const rows = items.slice(0, 12).map((it) => {
    const over = it.status === 'expired' || (it.due_at && it.due_at < Date.now() - 86400000);
    const cls = it.status === 'done' ? 'done' : over ? 'over' : 'prog';
    const ico = it.author_kind === 'scenario' ? '🤖' : it.author_kind === 'manager' ? '👔' : '👤';
    const st = it.status === 'done' ? '✅ Выполнено' : over ? '⚠️ Просрочено' : '⏳ В работе';
    const stCls = it.status === 'done' ? 'st-done' : over ? 'st-over' : 'st-prog';
    const src = it.author_kind === 'scenario' ? 'сценарий' : it.author_kind === 'manager' ? 'от руководителя' : 'своя задача';
    const cm = it.done_comment ? ` · «${esc(it.done_comment)}»` : '';
    return `<div class="trow ${cls}">
      <span class="tco">${ico}</span>
      <div class="trc"><div class="trn${it.status === 'done' ? ' struck' : ''}">${esc(it.title)}</div><div class="trm">${esc(src)}${esc(cm)}</div></div>
      <span class="trst ${stCls}">${st}</span>
    </div>`;
  }).join('');
  return chips + rows;
}

function chipsMopHTML(c) {
  const h = [];
  if (c.ir_pct != null) {
    const cls = c.ir_status === 'green' ? 'ok' : c.ir_status === 'red' ? 'bad' : '';
    h.push(`<div class="chip ir ${cls}">ИР группы ${c.ir_pct}% · норма ${c.ir_norm}%</div>`);
  }
  if (c.in_risk != null && c.total != null) {
    const cls = c.in_risk === 0 ? 'up' : c.in_risk <= 2 ? 'ir' : 'down';
    h.push(`<div class="chip ${cls}">⚠️ в риске ${c.in_risk} из ${c.total}</div>`);
  }
  if (c.performers != null && c.total != null) {
    h.push(`<div class="chip up">✅ выполняют ≥70% — ${c.performers}</div>`);
  }
  if (c.ir_delta != null && Math.abs(c.ir_delta) >= 1) {
    const cls = c.ir_delta > 0 ? 'up' : 'down';
    const sign = c.ir_delta > 0 ? '▲ +' : '▼ ';
    h.push(`<div class="chip ${cls}">${sign}${c.ir_delta} п.п. за неделю</div>`);
  }
  if (c.rank_dept != null && c.total_dept != null) {
    h.push(`<div class="chip">🏢 место в отделе ${c.rank_dept}/${c.total_dept}</div>`);
  }
  return h.join('');
}

function membersTableHTML(state) {
  const members = state.members || [];
  if (!members.length) return '<div class="muted">В группе нет партнёров.</div>';
  const row = (m) => {
    const irM = m.ir_v2_month != null ? m.ir_v2_month : '—';
    const irClr = m.ir_v2_month == null ? 'var(--muted)' : m.ir_v2_month >= 70 ? 'var(--ok)' : m.ir_v2_month >= 40 ? 'var(--warn)' : 'var(--bad)';
    const status = m.is_group_zero ? '🛌 группа 0' : m.is_newbie ? '🌱 новичок' : m.risk_level >= 1 ? `🔴 Н${Math.min(4, m.risk_level)}` : '✅';
    const plan = m.plan_month > 0 ? fmtK(m.plan_month) : '—';
    const fact = fmtK(m.fact_month);
    const fc = fmtK(m.forecast_month);
    const planPct = m.plan_month > 0 ? Math.round(m.fact_month / m.plan_month * 100) : null;
    const planPctClr = planPct == null ? 'var(--muted)' : planPct >= 100 ? 'var(--ok)' : planPct >= 70 ? 'var(--warn)' : 'var(--bad)';
    return `<tr>
      <td style="padding:8px;border-bottom:1px solid var(--line)">${esc(m.name)}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;color:${irClr};font-weight:700">${irM}${m.ir_v2_month != null ? '%' : ''}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right">${plan}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right">${fact}${planPct != null ? ` <span style="color:${planPctClr};font-size:11px">(${planPct}%)</span>` : ''}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right">${fc}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:center;font-size:11px">${status}</td>
      <td style="padding:8px;border-bottom:1px solid var(--line);text-align:center"><a href="session-report.html?level=partner&code=${esc(m.code)}" target="_blank" style="color:var(--brand);font-size:11px;font-weight:700;background:var(--brand-soft);padding:3px 7px;border-radius:4px;text-decoration:none">📄</a></td>
    </tr>`;
  };
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr style="background:var(--surface-2)">
      <th style="padding:8px;text-align:left">Партнёр</th>
      <th style="padding:8px;text-align:right">ИР мес</th>
      <th style="padding:8px;text-align:right">План</th>
      <th style="padding:8px;text-align:right">Факт</th>
      <th style="padding:8px;text-align:right">Прогноз</th>
      <th style="padding:8px;text-align:center">Статус</th>
      <th style="padding:8px;text-align:center">Отчёт</th>
    </tr></thead>
    <tbody>${members.map(row).join('')}</tbody>
  </table></div>`;
}

function riskListHTML(risk) {
  if (!risk.list || !risk.list.length) {
    return '<div class="tagline tag-ok">✅ Никто из команды не в риске.</div>';
  }
  const items = risk.list.map((r) => `<div class="trow over">
    <span class="tco">🔴</span>
    <div class="trc">
      <div class="trn">${esc(r.name)}</div>
      <div class="trm">Н${r.level} · ${r.streak}-я неделя в риске · ИР мес ${r.ir_month != null ? r.ir_month + '%' : '—'}</div>
    </div>
    <a href="session-report.html?level=partner&code=${esc(r.code)}" target="_blank" class="trst" style="background:var(--brand-soft);color:var(--brand);text-decoration:none">📄 Отчёт</a>
  </div>`).join('');
  return `<div class="block-title">${risk.in_risk_count} ${risk.in_risk_count === 1 ? 'партнёр' : 'партнёров'} в риске из ${risk.total_qualified}</div>${items}`;
}

function aggFunnelHTML(funnel) {
  const stages = (sideStages, isBuyer) => {
    if (!sideStages || !sideStages.length) return '<div class="muted">Нет данных</div>';
    const max = Math.max(...sideStages.map(s => s.fact || 0), 1);
    return sideStages.map((st) => {
      const w = Math.max(15, Math.round((st.fact || 0) / max * 100));
      const color = isBuyer ? 'var(--buyer)' : 'var(--seller)';
      const pct = st.progress_pct != null ? `${st.progress_pct}%` : '';
      const fact = st.is_revenue ? fmtK(st.fact) : (st.fact != null ? st.fact : '—');
      return `<div class="fstep"><div class="fname">${esc(st.label)}</div><div class="fbar" style="background:${color};width:${w}%;min-width:42px">${fact}</div><div class="fconv">${pct}</div></div>`;
    }).join('');
  };
  return `<div class="two">
    <div><div class="side-h">🛒 Покупатели</div><div class="funnel">${stages(funnel.buyer_stages, true)}</div></div>
    <div><div class="side-h">🏠 Продавцы</div><div class="funnel">${stages(funnel.seller_stages, false)}</div></div>
  </div>`;
}

function goalsMopHTML(g) {
  const rows = [];
  if (g.plan_revenue_month > 0) {
    const pct = g.plan_pct != null ? g.plan_pct : 0;
    const clr = pct >= 100 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">💰</div><div class="gt"><b>План вала группы на месяц</b><small>факт ${fmtK(g.fact_revenue_month)} ₽ · прогноз ${fmtK(g.forecast_revenue_month)} ₽ · план ${fmtK(g.plan_revenue_month)} ₽</small></div><div class="gv" style="color:${clr}">${pct}%${g.gap_to_plan > 0 ? ` · +${fmtK(g.gap_to_plan)}` : ''}</div></div>`);
  }
  if (g.next_month_plan > 0) {
    const pct = Math.round(g.next_month_forecast / g.next_month_plan * 100);
    const clr = pct >= 100 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">📅</div><div class="gt"><b>Прогноз на следующий месяц</b><small>прогноз ${fmtK(g.next_month_forecast)} ₽ · план ${fmtK(g.next_month_plan)} ₽</small></div><div class="gv" style="color:${clr}">${pct}%</div></div>`);
  }
  if (g.ir_current != null) {
    const clr = g.ir_current >= g.ir_target_pct ? 'var(--ok)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">🎯</div><div class="gt"><b>Цель ИР группы</b><small>сейчас ${g.ir_current}%, цель ${g.ir_target_pct}%</small></div><div class="gv" style="color:${clr}">${g.ir_current >= g.ir_target_pct ? 'в норме' : `+${g.ir_target_pct - g.ir_current} п.п.`}</div></div>`);
  }
  return rows.join('') || '<div class="muted">Цели не настроены.</div>';
}

// плитки ИР месяца / недели
function statTilesHTML(h) {
  const irM = h.ir_month, irW = h.ir_week, d = h.ir_week_delta;
  const clr = (v) => v == null ? 'var(--muted)' : v >= 70 ? 'var(--ok)' : v >= 40 ? 'var(--warn)' : 'var(--bad)';
  const deltaTxt = (d != null && Math.abs(d) >= 1) ? ` <span style="color:${d > 0 ? 'var(--ok)' : 'var(--bad)'};font-size:13px;font-weight:700">${d > 0 ? '▲+' : '▼'}${d}</span>` : '';
  return `<div class="ir-tiles">
    <div class="ir-tile"><div class="tk">ИР месяца</div><div class="tv" style="color:${clr(irM)}">${irM != null ? irM + '%' : '—'}</div><div class="tn">норма 70%</div></div>
    <div class="ir-tile"><div class="tk">ИР недели</div><div class="tv" style="color:${clr(irW)}">${irW != null ? irW + '%' : '—'}${deltaTxt}</div><div class="tn">за неделю</div></div>
  </div>`;
}
// сравнение групп внутри отдела (ИР месяца)
function groupCompareHTML(gc) {
  if (!gc || !gc.groups || !gc.groups.length) return '';
  let list = gc.groups;
  if (list.length > 12) {
    const top = list.slice(0, 12);
    if (!top.some((g) => g.self)) { const me = list.find((g) => g.self); if (me) top.push(me); }
    list = top;
  }
  const max = Math.max(...gc.groups.map((g) => g.ir), 1);
  const rows = list.map((g) => {
    const w = Math.max(2, Math.round(g.ir / max * 100));
    return `<div class="gc-row${g.self ? ' self' : ''}"><span class="gn">${esc(g.name)}${g.self ? ' (вы)' : ''}</span><span class="gt"><span class="gf" style="width:${w}%"></span></span><span class="gv">${g.ir}%</span></div>`;
  }).join('');
  return `<div class="block-title" style="margin-top:2px">Сравнение групп отдела · вы <b style="color:var(--ink)">${gc.rank} из ${gc.total}</b> · средний ИР отдела ${gc.avg}%</div>${rows}`;
}
// 💵 вал по партнёрам: факт (зел.) + прогноз (оранж.) + план-метка
function valByPartnerHTML(v) {
  if (!v || !v.rows || !v.rows.length) return '<div class="muted">Пока никто не дал вала за месяц.</div>';
  const max = Math.max(...v.rows.map((r) => r.fact + r.forecast), ...v.rows.map((r) => r.plan || 0), 1);
  const rows = v.rows.map((m) => {
    const factW = Math.round(m.fact / max * 100), fcW = Math.round(m.forecast / max * 100);
    const planLeft = m.plan > 0 ? Math.min(100, Math.round(m.plan / max * 100)) : null;
    return `<div class="vfp"><div class="vfp-top"><span class="vn">${esc(m.name)}</span><span class="vv"><b>${fmtK(m.fact + m.forecast)}</b> ${m.plan > 0 ? `<small>/ план ${fmtK(m.plan)}</small>` : ''}</span></div>
    <div class="vfp-track"><div class="vfp-fact" style="width:${factW}%"></div><div class="vfp-fc" style="width:${fcW}%"></div>${planLeft != null ? `<div class="vfp-plan" style="left:${planLeft}%"></div>` : ''}</div></div>`;
  }).join('');
  const legend = `<div class="plegend" style="margin-top:6px"><span><i style="background:var(--ok)"></i>факт закрыт</span><span><i style="background:var(--gold)"></i>прогноз</span><span><i style="background:var(--ink);width:2px;height:12px"></i>план</span></div>`;
  const zero = v.zero && v.zero.length ? `<div class="valzero">Пока без вала: ${v.zero.slice(0, 12).map(esc).join(', ')}${v.zero.length > 12 ? '…' : ''}</div>` : '';
  return rows + legend + zero;
}
// 📆 за неделю — кто что сделал (по типам активности)
function weekActivityHTML(w) {
  if (!w) return '';
  const names = (arr, fmt) => arr && arr.length ? `<span class="wk-names">${arr.map((x) => `<span>${esc(fmt(x))}</span>`).join('')}</span>` : '<span class="muted">—</span>';
  const L = [];
  L.push(`<div class="wk-line"><div class="wi">📥</div><div class="wt"><b>Новые заявки:</b> ${names(w.leads, (x) => x.name + ' +' + Math.round(x.n))}</div></div>`);
  L.push(`<div class="wk-line"><div class="wi">🏢</div><div class="wt"><b>Новые объекты:</b> ${names(w.objects, (x) => x.name + ' +' + Math.round(x.n))}</div></div>`);
  L.push(`<div class="wk-line"><div class="wi">🔥</div><div class="wt"><b>Горячие:</b> ${names(w.hot, (x) => x.name + ' +' + Math.round(x.n))}</div></div>`);
  L.push(`<div class="wk-line"><div class="wi">🤝</div><div class="wt"><b>Задатки:</b> ${names(w.deposits, (x) => x.name + ' +' + Math.round(x.n))}</div></div>`);
  L.push(`<div class="wk-line"><div class="wi">✅</div><div class="wt"><b>Сделки:</b> ${names(w.closed, (x) => x.name + ' ' + fmtK(x.rev))}</div></div>`);
  return `<div class="wk">${L.join('')}</div>`;
}
// ⏸️ застряли по дням + причина/риск
function stalledDaysHTML(list) {
  if (!list || !list.length) return '<div class="tagline tag-ok">✅ Никто не застрял — все шевелятся.</div>';
  return list.slice(0, 12).map((m) => {
    const word = m.days === 1 ? 'день' : (m.days >= 2 && m.days <= 4 ? 'дня' : 'дней');
    const ir = m.ir_month != null ? ` · ИР мес ${m.ir_month}%` : '';
    return `<div class="stall-row${m.days >= 4 ? ' hot' : ''}"><div class="sn">${esc(m.name)}${m.newbie ? ' <span class="muted" style="font-size:11px">(нов)</span>' : ''}<small>${esc(m.reason || '')}${ir}</small></div><div class="sd">${m.days} ${word}</div></div>`;
  }).join('');
}
// 🏅 таблица наград по риэлторам
function awardsTableHTML(rows) {
  if (!rows || !rows.length) return '<div class="muted">За неделю пока без ярких достижений — появятся по мере закрытий.</div>';
  const tr = rows.map((a) => `<tr><td class="aw-badge">${esc(a.award)}</td><td class="aw-name">${esc(a.name)}</td><td class="aw-reason">${esc(a.reason)}</td></tr>`).join('');
  return `<div style="overflow-x:auto"><table class="aw"><tbody>${tr}</tbody></table></div>`;
}
// воронка группы: план (дорожка) + факт (заливка), полоски как на главной
function aggFunnelBarsHTML(funnel) {
  if (!funnel || (!funnel.buyer_stages && !funnel.seller_stages)) return '<div class="muted">Нет данных воронки.</div>';
  const side = (stages) => {
    if (!stages || !stages.length) return '<div class="muted">Нет данных</div>';
    return stages.map((st) => {
      const plan = st.plan != null ? st.plan : 0;
      const pct = plan > 0 ? Math.round((st.fact || 0) / plan * 100) : null;
      let color = 'var(--bad)', w = 6, txt = '';
      if (pct == null) { color = 'var(--warn)'; w = 100; }
      else if (pct >= 100) { color = 'var(--ok)'; w = 100; txt = pct + '%'; }
      else if (pct >= 60) { color = 'var(--warn)'; w = pct; txt = pct + '%'; }
      else { color = 'var(--bad)'; w = Math.max(6, pct); txt = pct + '%'; }
      const factTxt = st.is_revenue ? fmtK(st.fact) : (st.fact != null ? Math.round(st.fact * 10) / 10 : '—');
      const planTxt = plan > 0 ? (st.is_revenue ? fmtK(plan) : Math.round(plan * 10) / 10) : '';
      return `<div class="afstage"><div class="afstage-top"><span class="an">${esc(st.label)}</span><span class="av">${factTxt}${plan > 0 ? ` <small>/ ${planTxt}</small>` : ''}</span></div><div class="aftrack"><div class="affill" style="width:${w}%;background:${color}">${txt}</div></div></div>`;
    }).join('');
  };
  return `<div class="two"><div><div class="side-h" style="color:var(--buyer)">🛒 Покупатели</div>${side(funnel.buyer_stages)}</div><div><div class="side-h" style="color:var(--seller)">🏠 Продавцы</div>${side(funnel.seller_stages)}</div></div>`;
}
// табы внутри секции (Вал / Состояние / Награды)
function ptabsHTML(tabs) {
  const btns = tabs.map((t, i) => `<button class="ptab-btn${i === 0 ? ' on' : ''}" onclick="ptab(this,${i})">${t.label}</button>`).join('');
  const panels = tabs.map((t, i) => `<div class="ptab-panel"${i > 0 ? ' style="display:none"' : ''}>${t.html}</div>`).join('');
  return `<div class="ptabs"><div class="ptab-bar">${btns}</div>${panels}</div>`;
}
window.ptab = function (btn, i) {
  const wrap = btn.closest('.ptabs');
  wrap.querySelectorAll('.ptab-btn').forEach((b, j) => b.classList.toggle('on', j === i));
  wrap.querySelectorAll('.ptab-panel').forEach((p, j) => { p.style.display = j === i ? '' : 'none'; });
};

function chipsRopHTML(c) {
  const h = [];
  if (c.ir_pct != null) {
    const cls = c.ir_status === 'green' ? 'ok' : c.ir_status === 'red' ? 'bad' : '';
    h.push(`<div class="chip ir ${cls}">ИР отдела ${c.ir_pct}% · норма ${c.ir_norm}%</div>`);
  }
  if (c.in_risk_groups != null && c.total_groups != null) {
    const cls = c.in_risk_groups === 0 ? 'up' : c.in_risk_groups <= 1 ? 'ir' : 'down';
    h.push(`<div class="chip ${cls}">⚠️ групп в риске ${c.in_risk_groups} из ${c.total_groups}</div>`);
  }
  if (c.in_risk_partners != null && c.total_partners != null) {
    h.push(`<div class="chip">👥 партнёров в риске ${c.in_risk_partners} из ${c.total_partners}</div>`);
  }
  if (c.ir_delta != null && Math.abs(c.ir_delta) >= 1) {
    const cls = c.ir_delta > 0 ? 'up' : 'down';
    const sign = c.ir_delta > 0 ? '▲ +' : '▼ ';
    h.push(`<div class="chip ${cls}">${sign}${c.ir_delta} п.п. за неделю</div>`);
  }
  return h.join('');
}

    const irClr = g.ir_v2_week == null ? 'var(--muted)' : g.ir_v2_week >= 70 ? 'var(--ok)' : g.ir_v2_week >= 40 ? 'var(--warn)' : 'var(--bad)';
    const plan = g.plan_month > 0 ? fmtK(g.plan_month) : '—';
    const fact = fmtK(g.fact_month);
    const fc = fmtK(g.forecast_month);

function goalsRopHTML(g) {
  const rows = [];

  }
  if (g.next_month_plan > 0) {

    const clr = pct >= 100 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    rows.push(`<div class="goal-row"><div class="gi">📅</div><div class="gt"><b>Прогноз на следующий месяц</b><small>прогноз ${fmtK(g.next_month_forecast)} ₽ · план ${fmtK(g.next_month_plan)} ₽</small></div><div class="gv" style="color:${clr}">${pct}%</div></div>`);

function coachCardHTML(text) {
  if (!text) return '';

// 📈 тренд ИР недели (спарклайн последних дней)
function irTrendHTML(t) {
  if (!t || !t.points || t.points.length < 3) return '';
  const vals = t.points;
  const max = Math.max(...vals.filter(x => x != null), 1);
  const bars = vals.map((v, i) => {
    const last = i === vals.length - 1;
    const h = v != null ? Math.max(6, Math.round(v / max * 100)) : 3;
    return `<div class="tb${last ? ' last' : ''}" style="height:${h}%"${v != null ? ` title="${v}%"` : ''}></div>`;
  }).join('');
  const dirTxt = t.dir === 'up' ? '<span class="trend-up">↗ растёт</span>' : t.dir === 'down' ? '<span class="trend-dn">↘ просел</span>' : '<span class="trend-fl">→ ровно</span>';
  return `<div class="trend-row" style="margin-bottom:16px">
    <div class="trend-spark">${bars}</div>
    <div class="trend-meta"><div>📈 <b>Тренд ИР недели</b></div><div class="muted">последние ${vals.length} дней · сейчас <b>${t.now != null ? t.now + '%' : '—'}</b> · ${dirTxt}</div></div>
  </div>`;
}
// 📥 активность / застой
function activityHTML(a) {
  if (!a) return '';
  if (a.moved_yesterday) {
    const d = a.deltas || {};
    const parts = [];
    if (d.flow > 0.01) parts.push(`📥 заявки +${Math.round(d.flow)}`);
    if (d.obj > 0.01) parts.push(`🏢 объекты +${Math.round(d.obj)}`);
    if (d.hot > 0.01) parts.push(`🔥 горячие +${Math.round(d.hot)}`);
    if (d.dep > 0.01) parts.push(`🤝 задатки +${Math.round(d.dep)}`);
    if (d.closed > 0.01) parts.push(`✅ сделки +${Math.round(d.closed)}`);
    const chips = parts.length ? `<div class="ydelta">${parts.map(p => `<span>${p}</span>`).join('')}</div>` : '';
    return `<div class="yday moved"><div class="yi">📥</div><div class="yt"><div><b>Вчера была работа</b> — воронка сдвинулась:</div>${chips}</div></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Последняя активность — <b>вчера</b>. Простоев по воронке нет.</div>`;
  }
  const nDays = a.stall_days || 0;
  const word = nDays === 1 ? 'день' : (nDays >= 2 && nDays <= 4 ? 'дня' : 'дней');
  return `<div class="yday stall"><div class="yi">⏸️</div><div class="yt"><div><b>Вчера без движения по воронке</b></div><div class="muted" style="font-size:13px;margin-top:4px">Последняя активность — <b>${nDays} ${word} назад</b>. Стоит разобрать, что тормозит.</div></div></div>`;
}
// воронка месяца с полосками прогресса (факт / план)
function funnelProgressHTML(funnel) {
  if (!funnel || (!funnel.buyer && !funnel.seller)) return '<div class="muted">Нет данных воронки.</div>';
  const planB = (funnel.plan && funnel.plan.buyer) || {};
  const planS = (funnel.plan && funnel.plan.seller) || {};
  const stage = (label, fact, plan) => {
    fact = Number(fact) || 0; plan = Number(plan) || 0;
    const pct = plan > 0 ? Math.round(fact / plan * 100) : null;
    let cls = 'low', w = 6, txt = '';
    if (pct == null) { cls = 'mid'; w = 100; txt = ''; }
    else if (pct >= 100) { cls = pct > 110 ? 'over' : 'done'; w = 100; txt = pct + '%'; }
    else if (pct >= 60) { cls = 'mid'; w = pct; txt = pct + '%'; }
    else { cls = 'low'; w = Math.max(6, pct); txt = pct + '%'; }
    const planTxt = plan > 0 ? ` <small>/ ${Math.round(plan * 10) / 10}</small>` : '';
    return `<div class="fstage"><div class="fstage-top"><span class="fn">${label}</span><span class="fv">${Math.round(fact * 10) / 10}${planTxt}</span></div><div class="ptrack"><div class="pfill ${cls}" style="width:${w}%">${txt}</div></div></div>`;
  };
  const buyer = funnel.buyer ? `<div><div class="side-h" style="color:var(--buyer)">🛒 Покупатель</div>
    ${stage('Поток', funnel.buyer.flow, planB.flow)}${stage('Горячие', funnel.buyer.hot, planB.hot)}${stage('Задатки', funnel.buyer.deposits, planB.deposits)}${stage('Сделки', funnel.buyer.deals, planB.deals)}</div>` : '';
  const seller = funnel.seller ? `<div><div class="side-h" style="color:var(--seller)">🏠 Продавец</div>
    ${stage('Объекты', funnel.seller.objects, planS.objects)}${stage('Горячие', funnel.seller.hot, planS.hot)}${stage('Задатки', funnel.seller.deposits, planS.deposits)}${stage('Сделки', funnel.seller.deals, planS.deals)}</div>` : '';
  return `<div class="two">${buyer}${seller}</div>`;
}
// 📊 как ты на фоне
function peersHTML(p) {
  if (!p) return '';
  const cards = [];
  if (p.rank_group && p.group_size > 1) {
    const medal = p.rank_group === 1 ? ' 🥇' : p.rank_group <= 3 ? ' 👍' : '';
    const good = p.rank_group <= Math.ceil(p.group_size / 2);
    cards.push(`<div class="fon-card${good ? ' good' : ''}"><div class="fk">Место в группе по ИР</div><div class="fbig">${p.rank_group}-й из ${p.group_size}${medal}</div><div class="fnote">${good ? 'выше среднего по группе' : 'есть куда расти'}</div></div>`);
  }
  if (p.dept_ir_month != null && p.ir_month != null) {
    const good = p.ir_month >= p.dept_ir_month;
    const diff = p.ir_month - p.dept_ir_month;
    cards.push(`<div class="fon-card${good ? ' good' : ''}"><div class="fk">Твой ИР месяца vs отдел</div><div class="fbig">${p.ir_month}% vs ${p.dept_ir_month}%</div><div class="fnote">${good ? `выше отдела на ${diff} п.п. 👍` : `ниже отдела на ${-diff} п.п.`}</div></div>`);
  }
  if (!cards.length) return '<div class="muted">Недостаточно данных для сравнения.</div>';
  return `<div class="fon">${cards.join('')}</div>`;
}
function awardChipsHTML(chips) {

      ${irTrendHTML(r.ir_trend)}
      ${historyTabs(r.history)}
      ${r.risk && r.risk.streak >= 1 ? `<div class="block-title" style="margin-top:16px">Страйки риска «Н»</div>${nstepHTML(r.risk)}<div class="note">Одна хорошая неделя (выход из риска по правилу) — страйк снимается, счётчик обнуляется.</div>` : ''}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="n">3</span> Из чего собран ИР</div>
      <div class="sec-sub">ИР v2 — четыре составляющих по 25%. Чёрная метка — норматив 70%.</div>
      ${compsHTML(r.ir_breakdown, r.head)}
    </div>

    ${r.activity ? `<div class="sec">
      <div class="sec-h"><span class="n">4</span> Активность</div>
      <div class="sec-sub">Что двигалось вчера и сколько дней назад была последняя активность по воронке.</div>
      ${activityHTML(r.activity)}
    </div>` : ''}

    <div class="sec">
      <div class="sec-h"><span class="n">5</span> Воронка месяца — факт / план</div>
      <div class="sec-sub">По каждому этапу — сколько закрыто из плана. Покупатель и продавец раздельно.</div>
      ${funnelProgressHTML(r.funnel)}
    </div>

    ${r.peers ? `<div class="sec">
      <div class="sec-h"><span class="n">6</span> Как ты на фоне</div>
      <div class="sec-sub">Сравнение с риэлторами своей группы и средним по отделу.</div>
      ${peersHTML(r.peers)}
    </div>` : ''}

    <div class="sec">
      <div class="sec-h"><span class="n">7</span> Диагностика по справочнику отклонений</div>
      <div class="sec-sub">Что система видит как отклонение (бит = 0). Каждое порождает задачу с инструментом.</div>
      ${diagnosticHTML(r.diagnostic)}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="n">8</span> На какие цифры выйти</div>
      <div class="sec-sub">Ориентиры до конца месяца, цель ИР и твой доход.</div>
      ${goalsHTML(r.goals)}
      ${incomeStripHTML(r.income_forecast)}
      ${salaryGoalHTML(r.salary_goal)}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="n">9</span> Награды и зона роста</div>
      <div class="sec-sub">За что похвалить и что почти заработано.</div>
      ${awardChipsHTML(r.award_chips)}
      ${achievementsHTML(r.achievements)}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="n">10</span> Задачи периода — что ставили и как выполнил</div>
      <div class="sec-sub">Что система и менеджер поставили за прошлую неделю.</div>
      ${tasksHTML(r.tasks)}
    </div>
  `;
}

load();
</script>
</body>
</html>
